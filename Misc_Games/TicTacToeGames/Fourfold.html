<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf1f5">
  <title>Fourfold</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #64717e;
      --paper: #ffffff;
      --page: #edf1f5;
      --line: #c7d0d9;
      --strong-line: #56616d;
      --accent: #246b73;
      --accent-dark: #174b51;
      --accent-soft: #dceff0;
      --x: #245d9b;
      --o: #a64f45;
      --danger: #c6403b;
      --warning: #fff0c7;
      --shadow: 0 18px 50px rgba(28, 40, 52, 0.14);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(36, 107, 115, 0.11), transparent 26rem),
        radial-gradient(circle at 92% 88%, rgba(36, 93, 155, 0.09), transparent 30rem),
        var(--page);
      -webkit-tap-highlight-color: transparent;
    }

    button, select { font: inherit; }
    button { touch-action: manipulation; }

    .app {
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .menu-screen {
      min-height: calc(100svh - 36px);
      display: none;
      place-items: center;
    }
    .menu-screen.active { display: grid; }

    .menu-card {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(86, 97, 109, 0.18);
      border-radius: 30px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .menu-hero {
      padding: clamp(28px, 6vw, 58px) clamp(24px, 7vw, 68px) 30px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(36, 107, 115, 0.14), rgba(36, 93, 155, 0.06)),
        #fff;
      border-bottom: 1px solid rgba(86, 97, 109, 0.12);
    }

    .mark-logo {
      width: 92px;
      aspect-ratio: 1;
      margin: 0 auto 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 3px solid var(--strong-line);
      border-radius: 19px;
      overflow: hidden;
      transform: rotate(2deg);
      background: #fff;
      box-shadow: 0 9px 24px rgba(23, 33, 43, 0.12);
    }

    .mark-logo span {
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 25px;
      border: 1px solid var(--line);
    }
    .mark-logo .x { color: var(--x); }
    .mark-logo .o { color: var(--o); }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 78px);
      line-height: 0.95;
      letter-spacing: -0.06em;
    }

    .tagline {
      margin: 17px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(16px, 2.8vw, 20px);
      line-height: 1.5;
    }

    .menu-options {
      padding: 28px clamp(22px, 6vw, 58px) 38px;
    }

    .field-group + .field-group { margin-top: 24px; }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      padding: 6px;
      background: #eef2f4;
      border-radius: 16px;
    }
    .segmented.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .segment {
      border: 0;
      border-radius: 12px;
      min-height: 48px;
      padding: 10px 12px;
      background: transparent;
      color: #52606d;
      font-weight: 800;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }
    .segment:hover { transform: translateY(-1px); }
    .segment.selected {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 4px 13px rgba(23, 33, 43, 0.12);
    }

    .cpu-only { display: none; }
    .cpu-only.visible { display: block; }

    .menu-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      border: 0;
      min-height: 50px;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 850;
      cursor: pointer;
      transition: transform 130ms ease, filter 130ms ease, background 130ms ease;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.02); }
    .btn:active { transform: translateY(1px) scale(0.99); }
    .btn:disabled { cursor: not-allowed; opacity: 0.45; transform: none; filter: none; }
    .btn.primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); box-shadow: 0 10px 24px rgba(36, 107, 115, 0.24); }
    .btn.secondary { color: var(--ink); background: #e7ecef; }
    .btn.ghost { color: var(--ink); background: transparent; border: 1px solid var(--line); }
    .btn.rules-accent { color: var(--accent-dark); background: var(--accent-soft); border: 1px solid rgba(36, 107, 115, 0.35); }
    .btn.rules-accent:hover { background: #d4ecee; }
    .btn.danger { color: #fff; background: var(--danger); }

    .game-wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(86, 97, 109, 0.18);
      border-radius: 14px;
      background: rgba(255,255,255,0.86);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(23,33,43,0.07);
      font-size: 21px;
      font-weight: 900;
    }

    .turn-card {
      justify-self: center;
      min-width: min(390px, 100%);
      padding: 8px 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(86, 97, 109, 0.16);
      text-align: center;
      box-shadow: 0 5px 18px rgba(23,33,43,0.06);
    }

    .turn-label { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .turn-main { margin-top: 2px; font-weight: 900; font-size: 19px; }
    .turn-main .symbol { font-size: 23px; }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 24px;
      align-items: start;
    }

    .board-panel {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(86, 97, 109, 0.15);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(12px, 2vw, 20px);
    }

    .board-frame {
      position: relative;
      width: min(100%, 700px);
      margin: 0 auto;
      aspect-ratio: 1;
      border: 4px solid var(--strong-line);
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
    }

    .play-area-highlight {
      position: absolute;
      z-index: 3;
      inset: 0 50% 50% 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 3px rgba(36, 107, 115, 0.38),
        inset 0 0 30px rgba(36, 107, 115, 0.07);
    }

    .board {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      padding: 0;
      min-width: 0;
      color: var(--ink);
      user-select: none;
      font-weight: 950;
      font-size: clamp(17px, 4.4vw, 42px);
      line-height: 1;
    }

    .cell:nth-child(10n) { border-right: 0; }
    .cell:nth-child(n+91) { border-bottom: 0; }
    .cell.mid-right { border-right: 4px solid var(--strong-line); }
    .cell.mid-bottom { border-bottom: 4px solid var(--strong-line); }

    .cell.playable {
      cursor: pointer;
      background: #eef8f8;
    }
    .cell.playable.empty:hover,
    .cell.playable.empty:focus-visible {
      background: var(--accent-soft);
      outline: none;
    }
    .cell.playable.empty::after {
      content: "";
      width: 16%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(36,107,115,0.18);
      opacity: 0;
      transform: scale(.4);
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .cell.playable.empty:hover::after,
    .cell.playable.empty:focus-visible::after { opacity: 1; transform: scale(1); }

    .cell .mark { transform: scale(1); }
    .cell.x .mark { color: var(--x); }
    .cell.o .mark { color: var(--o); }
    .cell.appear .mark { animation: mark-in 260ms cubic-bezier(.2,.9,.2,1.25); }
    .cell.losing { z-index: 2; background: #ffe2df !important; box-shadow: inset 0 0 0 3px var(--danger); }
    .cell.last-source { background: #e0f1f2; }

    @keyframes mark-in {
      from { transform: scale(.15) rotate(-13deg); opacity: 0; }
      70% { transform: scale(1.16) rotate(2deg); opacity: 1; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .side-panel {
      display: grid;
      gap: 14px;
    }

    .info-card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(86,97,109,0.15);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(23,33,43,0.08);
    }
    .info-card h2 {
      margin: 0 0 12px;
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, .85fr);
      gap: 9px;
    }
    .stat {
      background: #f0f3f5;
      border-radius: 13px;
      padding: 12px;
    }
    .stat-value { font-size: 20px; font-weight: 950; white-space: nowrap; }
    .stat-label { color: var(--muted); font-size: 11px; font-weight: 750; margin-top: 2px; }

    .control-grid { display: grid; gap: 9px; }
    .control-grid.two { grid-template-columns: 1fr 1fr; }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .thinking-dots span { animation: dot 1s infinite; opacity: .25; }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 50% { opacity: 1; } }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(10,17,23,0.58);
      backdrop-filter: blur(7px);
    }
    .modal-backdrop.open { display: grid; }

    .modal {
      position: relative;
      width: min(540px, 100%);
      max-height: min(84svh, 720px);
      overflow: auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(0,0,0,.3);
      padding: 27px;
      animation: modal-in 180ms ease-out;
    }
    @keyframes modal-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }

    .modal-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      margin-bottom: 17px;
      background: var(--accent-soft);
      font-size: 28px;
      font-weight: 950;
    }
    .modal-icon.danger { background: #ffe2df; color: var(--danger); }
    .modal h2 { margin: 0; padding-right: 42px; font-size: 28px; letter-spacing: -.03em; }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 12px;
      background: #eef2f4;
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
    }
    .modal-close:hover { background: #e2e8ec; }
    .modal p { color: var(--muted); line-height: 1.55; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .gameover-actions { grid-template-columns: 1fr 1fr; }
    .gameover-menu { width: 100%; margin-top: 10px; }

    .rules-list {
      display: grid;
      gap: 12px;
      margin: 18px 0 0;
    }
    .rule {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 11px;
      align-items: start;
    }
    .rule-num {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #e8eff1;
      color: var(--accent-dark);
      font-weight: 900;
    }
    .rule strong { display: block; margin-bottom: 2px; }
    .rule span { color: var(--muted); font-size: 14px; line-height: 1.45; }

    .rules-visuals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0 4px;
    }
    .rule-figure {
      margin: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #f7f9fa;
    }
    .rule-figure svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .rule-figure figcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 80;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      background: #17212b;
      color: #fff;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 750;
      font-size: 14px;
      transition: opacity 150ms ease, transform 150ms ease;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .game-layout { grid-template-columns: 1fr; }
      .side-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .side-panel .controls-card { grid-column: 1 / -1; }
    }

    @media (max-width: 600px) {
      .app { padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
      .menu-card { border-radius: 23px; }
      .menu-hero { padding: 26px 20px 23px; }
      .menu-options { padding: 21px 17px 25px; }
      .mark-logo { width: 72px; border-radius: 15px; }
      .mark-logo span { font-size: 20px; }
      .segmented { gap: 5px; padding: 5px; }
      .segment { min-height: 44px; padding: 8px 6px; font-size: 13px; }
      .topbar { gap: 7px; margin-bottom: 10px; }
      .icon-btn { width: 42px; height: 42px; border-radius: 12px; }
      .turn-card { min-width: 0; padding: 6px 8px; }
      .turn-main { font-size: 16px; }
      .board-panel { padding: 7px; border-radius: 16px; }
      .board-frame { border-width: 3px; border-radius: 11px; }
      .cell.mid-right { border-right-width: 3px; }
      .cell.mid-bottom { border-bottom-width: 3px; }
      .side-panel { grid-template-columns: 1fr; gap: 10px; }
      .side-panel .controls-card { grid-column: auto; }
      .info-card { padding: 14px; border-radius: 15px; }
      .modal { padding: 22px; border-radius: 20px; }
      .modal-actions { grid-template-columns: 1fr; }
      .gameover-actions { grid-template-columns: 1fr 1fr; }
      .rules-visuals { grid-template-columns: 1fr; }
    }

    @media (max-height: 650px) and (orientation: landscape) {
      .app { padding-top: 8px; padding-bottom: 8px; }
      .topbar { margin-bottom: 8px; }
      .game-layout { grid-template-columns: minmax(0, 1fr) 250px; gap: 12px; }
      .board-frame { width: min(calc(100svh - 82px), 100%); }
      .side-panel { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: calc(100svh - 72px); overflow: auto; }
      .info-card { padding: 12px; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="menuScreen" class="screen menu-screen active" aria-label="Fourfold main menu">
      <div class="menu-card">
        <div class="menu-hero">
          <div class="mark-logo" aria-hidden="true">
            <span class="x">X</span><span class="x">X</span><span class="o">O</span><span class="o">O</span>
          </div>
          <h1>Fourfold</h1>
          <p class="tagline">Every move appears four times. Think ahead, use the reflections, and whatever you do—don’t make four in a row.</p>
        </div>

        <div class="menu-options">
          <div class="field-group">
            <span class="field-label">Game mode</span>
            <div class="segmented" id="modeSelect" role="group" aria-label="Game mode">
              <button class="segment selected" data-mode="local" type="button">Player vs Player</button>
              <button class="segment" data-mode="cpu" type="button">Player vs CPU</button>
            </div>
          </div>

          <div id="difficultyGroup" class="field-group cpu-only">
            <span class="field-label">CPU difficulty</span>
            <div class="segmented three" id="difficultySelect" role="group" aria-label="CPU difficulty">
              <button class="segment" data-difficulty="easy" type="button">Easy</button>
              <button class="segment selected" data-difficulty="medium" type="button">Medium</button>
              <button class="segment" data-difficulty="hard" type="button">Hard</button>
            </div>
          </div>

          <div class="field-group">
            <span class="field-label">Who moves first?</span>
            <div class="segmented three" id="startSelect" role="group" aria-label="Starting symbol">
              <button class="segment selected" data-start="X" type="button">X starts</button>
              <button class="segment" data-start="O" type="button">O starts</button>
              <button class="segment" data-start="random" type="button">Random</button>
            </div>
          </div>

          <div class="menu-actions">
            <button id="startBtn" class="btn primary" type="button">Start New Game</button>
            <button id="menuRulesBtn" class="btn ghost" type="button">How to Play</button>
          </div>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen" aria-label="Fourfold game">
      <div class="game-wrap">
        <header class="topbar">
          <button id="menuBtn" class="icon-btn" type="button" aria-label="Return to menu">☰</button>
          <div class="turn-card" aria-live="polite">
            <div class="turn-label">Current turn</div>
            <div id="turnMain" class="turn-main">X to move</div>
          </div>
          <button id="muteBtn" class="icon-btn" type="button" aria-label="Mute sounds">♪</button>
        </header>

        <div class="game-layout">
          <section class="board-panel" aria-label="10 by 10 reflected game board">
            <div class="board-frame">
              <div id="board" class="board"></div>
              <div class="play-area-highlight" aria-hidden="true"></div>
            </div>
          </section>

          <aside class="side-panel">
            <section class="info-card">
              <h2>Match</h2>
              <div class="stats">
                <div class="stat"><div id="matchModeStat" class="stat-value">PvP</div><div class="stat-label">Mode</div></div>
                <div class="stat"><div id="matchDetailStat" class="stat-value">Two players</div><div id="matchDetailLabel" class="stat-label">Match type</div></div>
              </div>
            </section>

            <section class="info-card controls-card">
              <h2>Controls</h2>
              <div class="control-grid two">
                <button id="undoBtn" class="btn secondary" type="button">Undo</button>
                <button id="restartBtn" class="btn secondary" type="button">Restart</button>
              </div>
              <div class="control-grid" style="margin-top:9px">
                <button id="rulesBtn" class="btn rules-accent" type="button">Rules</button>
              </div>
              <p id="undoHint" class="hint">Undo is available in local two-player games.</p>
            </section>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop" role="presentation">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const SETTINGS_KEY = "fourfold-settings-v1";
      const REFLECTION_DELAY = 145;
      const CPU_DELAY = 520;

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => [...document.querySelectorAll(selector)];

      const menuScreen = $("#menuScreen");
      const gameScreen = $("#gameScreen");
      const boardEl = $("#board");
      const modalBackdrop = $("#modalBackdrop");
      const modalEl = $("#modal");
      const toastEl = $("#toast");

      let settings = loadSettings();
      let state = freshState();
      let cellEls = [];
      let audioContext = null;
      let toastTimer = null;
      let cpuTimer = null;

      function freshState() {
        return {
          mode: "local",
          difficulty: "medium",
          chosenStart: "X",
          actualStart: "X",
          current: "X",
          humanSymbol: "X",
          cpuSymbol: "O",
          source: Array(25).fill(null),
          board: Array(100).fill(null),
          history: [],
          gameOver: false,
          isAnimating: false,
          cpuThinking: false,
          losingCells: [],
          lastSource: null
        };
      }

      function loadSettings() {
        try {
          const parsed = JSON.parse(localStorage.getItem(SETTINGS_KEY));
          return {
            mode: parsed?.mode === "cpu" ? "cpu" : "local",
            difficulty: ["easy", "medium", "hard"].includes(parsed?.difficulty) ? parsed.difficulty : "medium",
            start: ["X", "O", "random"].includes(parsed?.start) ? parsed.start : "X",
            muted: Boolean(parsed?.muted)
          };
        } catch {
          return { mode: "local", difficulty: "medium", start: "X", muted: false };
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch {
          // The game still works when browser storage is unavailable.
        }
      }

      function buildBoard() {
        boardEl.innerHTML = "";
        cellEls = [];
        for (let r = 0; r < 10; r++) {
          for (let c = 0; c < 10; c++) {
            const index = r * 10 + c;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "cell empty";
            button.dataset.index = String(index);
            button.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}`);
            if (c === 4) button.classList.add("mid-right");
            if (r === 4) button.classList.add("mid-bottom");
            if (r < 5 && c < 5) {
              const sourceIndex = r * 5 + c;
              button.classList.add("playable");
              button.dataset.source = String(sourceIndex);
              button.setAttribute("aria-label", `Play row ${r + 1}, column ${c + 1} in the highlighted area`);
              button.addEventListener("click", () => handleHumanMove(sourceIndex));
            } else {
              button.tabIndex = -1;
              button.disabled = true;
            }
            boardEl.appendChild(button);
            cellEls.push(button);
          }
        }
      }

      function sourceToCoords(sourceIndex) {
        const r = Math.floor(sourceIndex / 5);
        const c = sourceIndex % 5;
        return [
          [r, c],
          [r, 9 - c],
          [9 - r, 9 - c],
          [9 - r, c]
        ];
      }

      function boardIndex(r, c) { return r * 10 + c; }

      function deriveBoard(source) {
        const board = Array(100).fill(null);
        source.forEach((symbol, sourceIndex) => {
          if (!symbol) return;
          sourceToCoords(sourceIndex).forEach(([r, c]) => { board[boardIndex(r, c)] = symbol; });
        });
        return board;
      }

      function renderBoard({ animateIndex = null } = {}) {
        cellEls.forEach((cell, index) => {
          const symbol = state.board[index];
          const sourceIndex = cell.dataset.source === undefined ? null : Number(cell.dataset.source);
          cell.classList.toggle("empty", !symbol);
          cell.classList.toggle("x", symbol === "X");
          cell.classList.toggle("o", symbol === "O");
          cell.classList.toggle("losing", state.losingCells.includes(index));
          cell.classList.toggle("last-source", sourceIndex !== null && sourceIndex === state.lastSource && Boolean(symbol));
          cell.disabled = !(sourceIndex !== null && !state.source[sourceIndex] && canHumanAct());
          cell.innerHTML = symbol ? `<span class="mark">${symbol}</span>` : "";
          if (animateIndex === index) {
            cell.classList.remove("appear");
            void cell.offsetWidth;
            cell.classList.add("appear");
            setTimeout(() => cell.classList.remove("appear"), 320);
          }
        });
      }

      function canHumanAct() {
        if (state.gameOver || state.isAnimating || state.cpuThinking) return false;
        return state.mode === "local" || state.current === state.humanSymbol;
      }

      function updateUI() {
        const isCPU = state.mode === "cpu";
        let owner = state.current;
        if (isCPU) owner = state.current === state.humanSymbol ? "You" : "CPU";

        const symbolClass = state.current === "X" ? "color:var(--x)" : "color:var(--o)";
        const thinking = state.cpuThinking ? ` <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>` : "";
        $("#turnMain").innerHTML = state.cpuThinking
          ? `CPU is thinking${thinking}`
          : `${owner} <span class="symbol" style="${symbolClass}">${state.current}</span> to move`;
        $("#matchModeStat").textContent = isCPU ? "Player vs CPU" : "PvP";
        $("#matchDetailStat").textContent = isCPU
          ? state.difficulty[0].toUpperCase() + state.difficulty.slice(1)
          : "Two players";
        $("#matchDetailLabel").textContent = isCPU ? "CPU difficulty" : "Match type";
        $("#undoBtn").disabled = state.mode !== "local" || state.history.length === 0 || state.isAnimating;
        $("#restartBtn").disabled = state.isAnimating;
        $("#muteBtn").textContent = settings.muted ? "×" : "♪";
        $("#muteBtn").setAttribute("aria-label", settings.muted ? "Unmute sounds" : "Mute sounds");
        renderBoard();
      }

      function showScreen(name) {
        menuScreen.classList.toggle("active", name === "menu");
        gameScreen.classList.toggle("active", name === "game");
      }

      function startNewGame() {
        clearTimeout(cpuTimer);
        closeModal();
        const actualStart = settings.start === "random" ? (Math.random() < 0.5 ? "X" : "O") : settings.start;
        state = freshState();
        state.mode = settings.mode;
        state.difficulty = settings.difficulty;
        state.chosenStart = settings.start;
        state.actualStart = actualStart;
        state.current = actualStart;
        showScreen("game");
        updateUI();
        if (state.mode === "cpu" && state.current === state.cpuSymbol) scheduleCPU();
      }

      function handleHumanMove(sourceIndex) {
        unlockAudio();
        if (!canHumanAct() || state.source[sourceIndex]) return;
        makeMove(sourceIndex, state.current);
      }

      async function makeMove(sourceIndex, symbol) {
        if (state.gameOver || state.isAnimating || state.source[sourceIndex]) return;
        state.isAnimating = true;
        state.cpuThinking = false;
        state.lastSource = sourceIndex;
        state.source[sourceIndex] = symbol;
        state.history.push({ sourceIndex, symbol });
        updateUI();

        const coords = sourceToCoords(sourceIndex);
        for (let i = 0; i < coords.length; i++) {
          const [r, c] = coords[i];
          const index = boardIndex(r, c);
          state.board[index] = symbol;
          renderBoard({ animateIndex: index });
          playTone(310 + i * 88, 0.055, 0.035);
          await wait(REFLECTION_DELAY);
        }

        const losingCells = findLosingCells(state.board, symbol);
        state.isAnimating = false;

        if (losingCells.length) {
          state.gameOver = true;
          state.losingCells = losingCells;
          updateUI();
          playLossSound();
          await wait(260);
          showGameOver(symbol, false);
          return;
        }

        if (state.history.length === 25) {
          state.gameOver = true;
          updateUI();
          playDrawSound();
          await wait(220);
          showGameOver(null, true);
          return;
        }

        state.current = symbol === "X" ? "O" : "X";
        updateUI();

        if (state.mode === "cpu" && state.current === state.cpuSymbol) scheduleCPU();
      }

      function findLosingCells(board, symbol) {
        const directions = [[0,1], [1,0], [1,1], [1,-1]];
        const losing = new Set();

        for (const [dr, dc] of directions) {
          for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 10; c++) {
              if (board[boardIndex(r,c)] !== symbol) continue;
              const prevR = r - dr;
              const prevC = c - dc;
              if (prevR >= 0 && prevR < 10 && prevC >= 0 && prevC < 10 && board[boardIndex(prevR,prevC)] === symbol) continue;

              const run = [];
              let rr = r;
              let cc = c;
              while (rr >= 0 && rr < 10 && cc >= 0 && cc < 10 && board[boardIndex(rr,cc)] === symbol) {
                run.push(boardIndex(rr,cc));
                rr += dr;
                cc += dc;
              }
              if (run.length >= 4) run.forEach(index => losing.add(index));
            }
          }
        }
        return [...losing];
      }

      function isLosingSource(source, symbol) {
        return findLosingCells(deriveBoard(source), symbol).length > 0;
      }

      function scheduleCPU() {
        clearTimeout(cpuTimer);
        state.cpuThinking = true;
        updateUI();
        cpuTimer = setTimeout(() => {
          if (state.gameOver || state.current !== state.cpuSymbol) return;
          const move = chooseCPUMove();
          if (move !== null) makeMove(move, state.cpuSymbol);
        }, CPU_DELAY);
      }

      function chooseCPUMove() {
        const available = availableMoves(state.source);
        if (!available.length) return null;

        if (state.difficulty === "easy") return randomChoice(available);

        const safe = available.filter(move => {
          const next = state.source.slice();
          next[move] = state.cpuSymbol;
          return !isLosingSource(next, state.cpuSymbol);
        });

        if (state.difficulty === "medium") {
          if (!safe.length) return randomChoice(available);
          const ranked = safe.map(move => {
            const next = state.source.slice();
            next[move] = state.cpuSymbol;
            return { move, score: onePlyPressure(next) + Math.random() * 1.8 };
          }).sort((a,b) => b.score - a.score);
          const pool = ranked.slice(0, Math.min(3, ranked.length));
          return randomChoice(pool).move;
        }

        return chooseHardMove(available);
      }

      function availableMoves(source) {
        const result = [];
        for (let i = 0; i < 25; i++) if (!source[i]) result.push(i);
        return result;
      }

      function onePlyPressure(source) {
        const moves = availableMoves(source);
        let cpuSafe = 0;
        let humanSafe = 0;
        for (const move of moves) {
          let next = source.slice();
          next[move] = state.cpuSymbol;
          if (!isLosingSource(next, state.cpuSymbol)) cpuSafe++;
          next = source.slice();
          next[move] = state.humanSymbol;
          if (!isLosingSource(next, state.humanSymbol)) humanSafe++;
        }
        return (cpuSafe - humanSafe) * 6 + shapeHeuristic(source);
      }

      function shapeHeuristic(source) {
        const board = deriveBoard(source);
        const cpuDanger = linePotential(board, state.cpuSymbol);
        const humanDanger = linePotential(board, state.humanSymbol);
        return humanDanger - cpuDanger;
      }

      function linePotential(board, symbol) {
        const directions = [[0,1], [1,0], [1,1], [1,-1]];
        let score = 0;
        for (const [dr,dc] of directions) {
          for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 10; c++) {
              const endR = r + dr * 3;
              const endC = c + dc * 3;
              if (endR < 0 || endR >= 10 || endC < 0 || endC >= 10) continue;
              let count = 0;
              let blocked = false;
              for (let k = 0; k < 4; k++) {
                const value = board[boardIndex(r + dr*k, c + dc*k)];
                if (value === symbol) count++;
                else if (value && value !== symbol) { blocked = true; break; }
              }
              if (!blocked) score += count === 3 ? 8 : count === 2 ? 2 : count === 1 ? 0.35 : 0;
            }
          }
        }
        return score;
      }

      function chooseHardMove(available) {
        const empties = available.length;
        const depth = empties >= 20 ? 3 : empties >= 14 ? 4 : empties >= 9 ? 5 : empties;
        const memo = new Map();
        let bestScore = -Infinity;
        let bestMoves = [];

        const ordered = orderMoves(state.source, available, state.cpuSymbol);
        for (const move of ordered) {
          const next = state.source.slice();
          next[move] = state.cpuSymbol;
          let score;
          if (isLosingSource(next, state.cpuSymbol)) {
            score = -100000;
          } else if (available.length === 1) {
            score = 0;
          } else {
            score = minimax(next, state.humanSymbol, depth - 1, -Infinity, Infinity, memo);
          }

          if (score > bestScore + 0.0001) {
            bestScore = score;
            bestMoves = [move];
          } else if (Math.abs(score - bestScore) < 0.0001) {
            bestMoves.push(move);
          }
        }
        return randomChoice(bestMoves.length ? bestMoves : available);
      }

      function minimax(source, player, depth, alpha, beta, memo) {
        const moves = availableMoves(source);
        if (!moves.length) return 0;
        if (depth <= 0) return onePlyPressure(source);

        const key = `${source.map(v => v || "-").join("")}|${player}|${depth}`;
        if (memo.has(key)) return memo.get(key);

        const maximizing = player === state.cpuSymbol;
        let best = maximizing ? -Infinity : Infinity;
        const ordered = orderMoves(source, moves, player);

        for (const move of ordered) {
          const next = source.slice();
          next[move] = player;
          let score;
          if (isLosingSource(next, player)) {
            score = player === state.cpuSymbol ? -100000 - depth : 100000 + depth;
          } else if (moves.length === 1) {
            score = 0;
          } else {
            score = minimax(next, player === "X" ? "O" : "X", depth - 1, alpha, beta, memo);
          }

          if (maximizing) {
            best = Math.max(best, score);
            alpha = Math.max(alpha, best);
          } else {
            best = Math.min(best, score);
            beta = Math.min(beta, best);
          }
          if (beta <= alpha) break;
        }

        memo.set(key, best);
        return best;
      }

      function orderMoves(source, moves, player) {
        return moves.map(move => {
          const next = source.slice();
          next[move] = player;
          const loses = isLosingSource(next, player);
          const r = Math.floor(move / 5);
          const c = move % 5;
          const centrality = 4 - (Math.abs(r - 2) + Math.abs(c - 2));
          return { move, rank: (loses ? -10000 : 0) + centrality + Math.random() * 0.01 };
        }).sort((a,b) => b.rank - a.rank).map(item => item.move);
      }

      function randomChoice(array) {
        return array[Math.floor(Math.random() * array.length)];
      }

      function undoMove() {
        if (state.mode !== "local" || state.isAnimating || !state.history.length) return;
        unlockAudio();
        closeModal();
        const move = state.history.pop();
        state.source[move.sourceIndex] = null;
        state.board = deriveBoard(state.source);
        state.current = move.symbol;
        state.lastSource = state.history.length ? state.history[state.history.length - 1].sourceIndex : null;
        state.gameOver = false;
        state.losingCells = [];
        playTone(230, 0.08, 0.035);
        updateUI();
        toast("Last move undone.");
      }

      function showGameOver(loser, draw) {
        let title;
        let body;
        let icon;
        let iconClass = "";

        if (draw) {
          title = "It’s a draw";
          body = "All 25 playable spaces were used without either player making four in a row.";
          icon = "=";
        } else if (state.mode === "cpu") {
          const humanLost = loser === state.humanSymbol;
          title = humanLost ? "CPU wins" : "You win!";
          body = `${loser} formed a line of four or more. In Fourfold, making the line means losing the match.`;
          icon = humanLost ? "×" : "✓";
          iconClass = humanLost ? "danger" : "";
          if (!humanLost) playWinSound();
        } else {
          const winner = loser === "X" ? "O" : "X";
          title = `${winner} wins!`;
          body = `${loser} formed a line of four or more, so ${winner} wins the match.`;
          icon = winner;
        }

        const undoButton = state.mode === "local"
          ? `<button class="btn secondary" data-action="undo-end" type="button">Undo Last Move</button>`
          : `<button class="btn secondary" type="button" disabled title="Undo is available in Player vs Player games">Undo Last Move</button>`;

        openModal(`
          <button class="modal-close" data-action="close" type="button" aria-label="Close results and view the board">×</button>
          <div class="modal-icon ${iconClass}">${icon}</div>
          <h2 id="modalTitle">${title}</h2>
          <p>${body}</p>
          <div class="modal-actions gameover-actions">
            <button class="btn primary" data-action="play-again" type="button">Play Again</button>
            ${undoButton}
          </div>
          <button class="btn ghost gameover-menu" data-action="menu" type="button">Main Menu</button>
        `);
      }

      function confirmRestart() {
        openModal(`
          <div class="modal-icon">↻</div>

          <p>The current board will be cleared and the selected starting rule will be used again.</p>
          <div class="modal-actions">
            <button class="btn secondary" data-action="close" type="button">Cancel</button>
            <button class="btn danger" data-action="confirm-restart" type="button">Restart</button>
          </div>
        `);
      }

      function confirmMenu() {
        if (state.gameOver || state.history.length === 0) {
          goToMenu();
          return;
        }
        openModal(`
          <div class="modal-icon">☰</div>
          <h2 id="modalTitle">Return to the menu?</h2>
          <p>Your current match will be cleared.</p>
          <div class="modal-actions">
            <button class="btn secondary" data-action="close" type="button">Keep Playing</button>
            <button class="btn primary" data-action="confirm-menu" type="button">Main Menu</button>
          </div>
        `);
      }

      function openModal(html) {
        modalEl.innerHTML = html;
        modalBackdrop.classList.add("open");
        const focusable = modalEl.querySelector("button");
        setTimeout(() => focusable?.focus(), 30);
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
        modalEl.innerHTML = "";
      }

      function goToMenu() {
        clearTimeout(cpuTimer);
        state.cpuThinking = false;
        closeModal();
        showScreen("menu");
      }

      function handleModalAction(action) {
        switch (action) {
          case "close": closeModal(); break;
          case "play-again": closeModal(); startNewGame(); break;
          case "undo-end": undoMove(); break;
          case "menu": goToMenu(); break;
          case "confirm-menu": goToMenu(); break;
          case "confirm-restart": closeModal(); startNewGame(); break;
        }
      }

      function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

      function toast(message) {
        clearTimeout(toastTimer);
        toastEl.textContent = message;
        toastEl.classList.add("show");
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
      }

      function unlockAudio() {
        if (settings.muted) return;
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioContext = new AudioCtx();
        }
        if (audioContext?.state === "suspended") audioContext.resume();
      }

      function playTone(frequency, duration = 0.07, volume = 0.04, delay = 0) {
        if (settings.muted) return;
        unlockAudio();
        if (!audioContext) return;
        const start = audioContext.currentTime + delay;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function playLossSound() {
        playTone(340, .14, .045, 0);
        playTone(255, .17, .045, .10);
        playTone(185, .22, .05, .22);
      }
      function playWinSound() {
        playTone(390, .12, .04, 0);
        playTone(520, .12, .04, .09);
        playTone(690, .2, .045, .18);
      }
      function playDrawSound() {
        playTone(280, .11, .035, 0);
        playTone(350, .11, .035, .11);
        playTone(280, .15, .035, .22);
      }

      function syncMenuControls() {
        $$("#modeSelect .segment").forEach(btn => btn.classList.toggle("selected", btn.dataset.mode === settings.mode));
        $$("#difficultySelect .segment").forEach(btn => btn.classList.toggle("selected", btn.dataset.difficulty === settings.difficulty));
        $$("#startSelect .segment").forEach(btn => btn.classList.toggle("selected", btn.dataset.start === settings.start));
        $("#difficultyGroup").classList.toggle("visible", settings.mode === "cpu");
      }

      $("#modeSelect").addEventListener("click", event => {
        const button = event.target.closest("[data-mode]");
        if (!button) return;
        settings.mode = button.dataset.mode;
        saveSettings();
        syncMenuControls();
      });

      $("#difficultySelect").addEventListener("click", event => {
        const button = event.target.closest("[data-difficulty]");
        if (!button) return;
        settings.difficulty = button.dataset.difficulty;
        saveSettings();
        syncMenuControls();
      });

      $("#startSelect").addEventListener("click", event => {
        const button = event.target.closest("[data-start]");
        if (!button) return;
        settings.start = button.dataset.start;
        saveSettings();
        syncMenuControls();
      });

      $("#startBtn").addEventListener("click", () => { unlockAudio(); startNewGame(); });
      $("#menuRulesBtn").addEventListener("click", showRules);
      $("#rulesBtn").addEventListener("click", showRules);
      $("#restartBtn").addEventListener("click", confirmRestart);
      $("#menuBtn").addEventListener("click", confirmMenu);
      $("#undoBtn").addEventListener("click", undoMove);
      $("#muteBtn").addEventListener("click", () => {
        settings.muted = !settings.muted;
        saveSettings();
        updateUI();
        if (!settings.muted) { unlockAudio(); playTone(440, .08, .035); }
      });

      modalEl.addEventListener("click", event => {
        const button = event.target.closest("[data-action]");
        if (button) handleModalAction(button.dataset.action);
      });

      modalBackdrop.addEventListener("click", event => {
        if (event.target === modalBackdrop) closeModal();
      });

      window.addEventListener("keydown", event => {
        if (event.key === "Escape" && modalBackdrop.classList.contains("open")) closeModal();
      });

      buildBoard();
      syncMenuControls();
      $("#muteBtn").textContent = settings.muted ? "×" : "♪";
    })();
  </script>
</body>
</html>
