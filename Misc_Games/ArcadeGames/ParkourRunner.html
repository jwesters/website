<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Parkour Runner</title>
<style>
  :root {
    --bg1:#8ed0ff;
    --bg2:#dff5ff;
    --ground:#5a3b24;
    --grass:#58b957;
    --heart:#ff4757;
    --text:#f9fafb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, #25334d 0%, #111827 55%, #020617 100%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  .wrap {
    width: min(100vw, 1040px);
    padding: 12px;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 38px);
    letter-spacing: 0.03em;
  }
  .stats {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    flex-wrap: wrap;
  }
  .pill {
    background: rgba(17, 24, 39, 0.85);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 8px 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.22);
  }
  .hearts {
    letter-spacing: 2px;
    color: var(--heart);
    text-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: calc(100vh - 112px);
    background: linear-gradient(var(--bg1), var(--bg2));
    border-radius: 18px;
    box-shadow: 0 20px 55px rgba(0,0,0,0.45);
    border: 4px solid rgba(255,255,255,0.18);
  }
  .help {
    margin-top: 8px;
    text-align: center;
    color: #cbd5e1;
    font-size: 14px;
  }
  .key {
    display: inline-block;
    min-width: 22px;
    padding: 1px 6px;
    margin: 0 1px;
    border-radius: 5px;
    background: #e5e7eb;
    color: #111827;
    font-weight: 800;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Parkour Runner Demo</h1>
      <div class="stats">
        <span class="pill">Score: <span id="score">0</span></span>
        <span class="pill">Coins: <span id="coins">0</span></span>
        <span class="pill hearts" id="hearts">♥ ♥ ♥</span>
      </div>
    </div>
    <canvas id="game" width="960" height="540" aria-label="Parkour runner game"></canvas>
    <div class="help">
      Move: <span class="key">←</span><span class="key">→</span> or <span class="key">A</span><span class="key">D</span>
      &nbsp; Jump: <span class="key">↑</span>/<span class="key">W</span>/<span class="key">Space</span>
      &nbsp; Hold Duck: <span class="key">S</span>/<span class="key">↓</span>
      &nbsp; Restart: <span class="key">R</span>
    </div>
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const coinsEl = document.getElementById("coins");
  const heartsEl = document.getElementById("hearts");

  const W = canvas.width;
  const H = canvas.height;
  const groundY = 420;

  const keys = Object.create(null);
  const particles = [];
  const obstacles = [];
  const coins = [];
  const clouds = [];
  const buildings = [];

  let score = 0;
  let coinCount = 0;
  let health = 3;
  let gameOver = false;
  let started = false;
  let time = 0;
  let speed = 4.0;
  let distance = 0;
  let obstacleGapLeft = 420;
  let coinGapLeft = 210;

  const player = {
    x: 170,
    y: groundY - 82,
    w: 42,
    h: 82,
    standingH: 82,
    duckH: 54,
    vx: 0,
    vy: 0,
    grounded: true,
    ducking: false,
    invincible: 0,
    runFrame: 0,
    lastFloorY: groundY
  };

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  function roundedRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function resetGame() {
    obstacles.length = 0;
    coins.length = 0;
    particles.length = 0;
    score = 0;
    coinCount = 0;
    health = 3;
    gameOver = false;
    started = true;
    time = 0;
    speed = 4.0;
    distance = 0;
    obstacleGapLeft = 460;
    coinGapLeft = 260;
    Object.assign(player, {
      x: 170,
      y: groundY - 82,
      w: 42,
      h: 82,
      vx: 0,
      vy: 0,
      grounded: true,
      ducking: false,
      invincible: 0,
      runFrame: 0,
      lastFloorY: groundY
    });
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    coinsEl.textContent = String(coinCount);
    heartsEl.textContent = health > 0 ? "♥ ".repeat(health).trim() : "♡ ♡ ♡";
  }

  function addCloud() {
    clouds.push({ x: rand(0, W), y: rand(30, 170), s: rand(0.6, 1.4), vx: rand(0.15, 0.45) });
  }

  function addBuilding() {
    buildings.push({ x: rand(0, W), y: rand(215, 305), w: rand(45, 90), h: rand(80, 170), shade: Math.floor(rand(180, 230)) });
  }

  for (let i = 0; i < 8; i++) addCloud();
  for (let i = 0; i < 12; i++) addBuilding();

  function playerHitbox() {
    if (player.ducking) {
      return { x: player.x + 5, y: player.y + 8, w: player.w - 10, h: player.h - 9 };
    }
    return { x: player.x + 8, y: player.y + 7, w: player.w - 16, h: player.h - 10 };
  }

  function obstacleHitbox(o) {
    if (o.type === "bench") return { x: o.x + 5, y: o.y + 2, w: o.w - 10, h: o.h - 2 };
    if (o.type === "chair") return { x: o.x + 8, y: o.y + 4, w: o.w - 16, h: o.h - 4 };
    if (o.type === "car") return { x: o.x + 6, y: o.y + 10, w: o.w - 12, h: o.h - 10 };
    if (o.type === "lowbar") return { x: o.x + 6, y: o.y + 2, w: o.w - 12, h: o.h - 4 };
    return { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 4 };
  }

  function platformSurface(o) {
    return { x: o.x + 8, y: o.y, w: o.w - 16 };
  }

  function lastObstacleRight() {
    let right = -999;
    for (const o of obstacles) right = Math.max(right, o.x + o.w);
    return right;
  }

  function setPlayerHeight(newH, floorY = player.y + player.h) {
    if (player.h === newH) return;
    player.h = newH;
    player.y = floorY - player.h;
  }

  function setDucking(on) {
    if (on === player.ducking) return;
    const foot = player.y + player.h;
    player.ducking = on;
    setPlayerHeight(on ? player.duckH : player.standingH, foot);
  }

  function scheduleNextObstacle() {
    const base = rand(470, 690);
    const speedTrim = Math.min(120, (speed - 4) * 11);
    obstacleGapLeft = Math.max(385, base - speedTrim);
  }

  function spawnObstacle() {
    if (obstacles.length >= 3) {
      obstacleGapLeft = 120;
      return;
    }

    const right = lastObstacleRight();
    if (right > W - 110) {
      obstacleGapLeft = 150;
      return;
    }

    const types = [
      { type: "wall",   w: 44,  h: 86, mode: "jump",     landable: false },
      { type: "car",    w: 104, h: 50, mode: "jump",     landable: false },
      { type: "bench",  w: 126, h: 42, mode: "platform", landable: true  },
      { type: "chair",  w: 82,  h: 58, mode: "platform", landable: true  },
      { type: "lowbar", w: 138, h: 42, mode: "duck",     landable: false }
    ];
    const template = types[Math.floor(rand(0, types.length))];
    const x = Math.max(W + 80, right + 400);
    const y = template.type === "lowbar" ? groundY - 108 : groundY - template.h;

    const obstacle = { ...template, x, y, hit: false };
    obstacles.push(obstacle);
    removeCoinsInsideObstacles();
    scheduleNextObstacle();
  }

  function expandedRect(r, padX, padY) {
    return { x: r.x - padX, y: r.y - padY, w: r.w + padX * 2, h: r.h + padY * 2 };
  }

  function coinBox(c) {
    return { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
  }

  function isCoinSafe(x, y, r = 12) {
    const box = { x: x - r - 2, y: y - r - 2, w: r * 2 + 4, h: r * 2 + 4 };
    if (y < groundY - 205 || y > groundY - 72) return false;
    for (const o of obstacles) {
      const danger = expandedRect(obstacleHitbox(o), 34, 28);
      if (rectsOverlap(box, danger)) return false;
    }
    for (const c of coins) {
      if (!c.taken && Math.abs(c.x - x) < 28 && Math.abs(c.y - y) < 28) return false;
    }
    return true;
  }

  function removeCoinsInsideObstacles() {
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      for (const o of obstacles) {
        if (rectsOverlap(coinBox(c), expandedRect(obstacleHitbox(o), 18, 18))) {
          coins.splice(i, 1);
          break;
        }
      }
    }
  }

  function scheduleNextCoin() {
    coinGapLeft = rand(245, 390);
  }

  function spawnCoinCluster() {
    const cluster = Math.floor(rand(2, 5));
    let madeAny = false;

    for (let attempt = 0; attempt < 12 && !madeAny; attempt++) {
      const baseX = W + rand(90, 230);
      const pattern = Math.random();
      const planned = [];

      for (let i = 0; i < cluster; i++) {
        const x = baseX + i * 38;
        let y;
        if (pattern < 0.38) {
          y = groundY - rand(82, 118);
        } else if (pattern < 0.74) {
          y = groundY - 138 + Math.sin(i * 0.9) * 28;
        } else {
          y = groundY - 172 + Math.sin(i * 0.8) * 20;
        }
        y = clamp(y, groundY - 195, groundY - 78);
        planned.push({ x, y, r: 12, taken: false, spin: rand(0, Math.PI * 2) });
      }

      if (planned.every(c => isCoinSafe(c.x, c.y, c.r))) {
        coins.push(...planned);
        madeAny = true;
      }
    }

    scheduleNextCoin();
  }

  function jump() {
    if (!started || gameOver || !player.grounded || player.ducking) return;
    player.vy = -15.2;
    player.grounded = false;
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k) || e.code === "Space") e.preventDefault();

    if (!started && (k === "enter" || e.code === "Space" || k === "r")) resetGame();
    if (gameOver && k === "r") resetGame();
    if ((k === "w" || k === "arrowup" || e.code === "Space") && started) jump();
  }, { passive: false });

  window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
    if (e.code === "Space") keys[" "] = false;
  });

  canvas.addEventListener("click", () => {
    if (!started || gameOver) resetGame();
  });

  function damage() {
    if (player.invincible > 0 || gameOver) return;
    health--;
    updateHud();
    player.invincible = 88;
    player.vx = -4.8;
    for (let i = 0; i < 18; i++) {
      particles.push({
        x: player.x + player.w / 2,
        y: player.y + player.h / 2,
        vx: rand(-4, 4),
        vy: rand(-6, 1),
        life: rand(22, 45),
        r: rand(2, 5),
        color: "#ef4444"
      });
    }
    if (health <= 0) {
      gameOver = true;
      player.vx = 0;
      player.vy = 0;
      setDucking(false);
    }
  }

  function collectCoin(c) {
    if (c.taken) return;
    c.taken = true;
    coinCount++;
    score += 10;
    updateHud();
    for (let i = 0; i < 8; i++) {
      particles.push({ x: c.x, y: c.y, vx: rand(-2, 2), vy: rand(-3, 0), life: rand(18, 30), r: rand(2, 4), color: "#fbbf24" });
    }
  }

  function updatePlayerDuck() {
    const wantsDuck = (keys["s"] || keys["arrowdown"]);
    if (wantsDuck && player.grounded) setDucking(true);
    if (!wantsDuck && player.ducking) setDucking(false);
  }

  function resolvePlatformLanding(prevBottom) {
    let landed = false;
    let floorY = groundY;

    for (const o of obstacles) {
      if (!o.landable) continue;
      const surf = platformSurface(o);
      const bottom = player.y + player.h;
      const horizontal = player.x + player.w - 8 > surf.x && player.x + 8 < surf.x + surf.w;
      const fallingOntoTop = player.vy >= 0 && prevBottom <= surf.y + 7 && bottom >= surf.y && horizontal;
      const alreadyOnTop = Math.abs(bottom - surf.y) <= 4 && horizontal && player.vy >= 0;
      if (fallingOntoTop || alreadyOnTop) {
        floorY = surf.y;
        landed = true;
        break;
      }
    }

    if (landed) {
      player.y = floorY - player.h;
      player.vy = 0;
      player.grounded = true;
      player.lastFloorY = floorY;
    } else if (player.y + player.h >= groundY) {
      player.y = groundY - player.h;
      player.vy = 0;
      player.grounded = true;
      player.lastFloorY = groundY;
    } else {
      player.grounded = false;
      player.lastFloorY = groundY;
    }
  }

  function update() {
    requestAnimationFrame(update);

    if (!started) {
      draw();
      drawStart();
      return;
    }

    if (!gameOver) {
      time++;
      distance += speed;
      speed = Math.min(13.5, 4 + time * 0.00265);
      score = Math.floor(distance / 12) + coinCount * 10;
      updateHud();

      updatePlayerDuck();

      const accel = player.ducking ? 0.34 : 0.55;
      const friction = player.grounded ? (player.ducking ? 0.91 : 0.86) : 0.94;
      const maxVx = player.ducking ? 6.8 : 8.0;
      if (keys["arrowleft"] || keys["a"]) player.vx -= accel;
      if (keys["arrowright"] || keys["d"]) player.vx += accel;
      player.vx *= friction;
      player.vx = clamp(player.vx, -maxVx, maxVx);
      player.x += player.vx;

      if (player.x < 35) { player.x = 35; player.vx *= -0.25; }
      if (player.x + player.w > W - 35) { player.x = W - 35 - player.w; player.vx *= -0.25; }

      for (const o of obstacles) o.x -= speed;
      for (const c of coins) c.x -= speed;

      const prevBottom = player.y + player.h;
      player.vy += 0.76;
      player.y += player.vy;
      resolvePlatformLanding(prevBottom);
      updatePlayerDuck();

      player.runFrame += 0.18 + speed * 0.018;
      if (player.invincible > 0) player.invincible--;

      obstacleGapLeft -= speed;
      coinGapLeft -= speed;
      if (obstacleGapLeft <= 0) spawnObstacle();
      if (coinGapLeft <= 0) spawnCoinCluster();
      removeCoinsInsideObstacles();

      const ph = playerHitbox();
      for (const o of obstacles) {
        if (o.hit) continue;
        if (!rectsOverlap(ph, obstacleHitbox(o))) continue;

        if (o.landable) {
          const surf = platformSurface(o);
          const feetNearTop = Math.abs((player.y + player.h) - surf.y) <= 8;
          const onTop = player.x + player.w - 8 > surf.x && player.x + 8 < surf.x + surf.w && feetNearTop;
          if (onTop) continue;
        }

        o.hit = true;
        damage();
      }

      while (obstacles.length && obstacles[0].x + obstacles[0].w < -90) obstacles.shift();

      for (const c of coins) {
        c.spin += 0.18;
        if (!c.taken && rectsOverlap(playerHitbox(), coinBox(c))) collectCoin(c);
      }
      while (coins.length && coins[0].x < -80) coins.shift();
    }

    if (!gameOver) {
      for (const cloud of clouds) {
        cloud.x -= cloud.vx + speed * 0.015;
        if (cloud.x < -120) {
          cloud.x = W + rand(30, 140);
          cloud.y = rand(30, 170);
          cloud.s = rand(0.6, 1.4);
        }
      }
      for (const b of buildings) {
        b.x -= speed * 0.25;
        if (b.x + b.w < -20) {
          b.x = W + rand(20, 160);
          b.y = rand(215, 305);
          b.w = rand(45, 90);
          b.h = rand(80, 170);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.18;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    draw();
    if (gameOver) drawGameOver();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255,255,255,0.82)";
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y - 8 * s, 24 * s, 0, Math.PI * 2);
    ctx.arc(x + 48 * s, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 26 * s, y + 8 * s, 18 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlayer() {
    const flicker = player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0;
    if (flicker) return;

    const x = player.x;
    const y = player.y;
    const w = player.w;
    const h = player.h;
    const run = Math.sin(player.runFrame);
    const legSwing = player.grounded && !player.ducking ? run * 10 : 0;

    // Shadow.
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.ellipse(x + w / 2, player.lastFloorY + 7, player.ducking ? 28 : 25, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    if (player.ducking) {
      // Crouched runner, not a flat slide/hot dog.
      ctx.save();
      ctx.translate(x, y);

      // Back leg / shoe.
      ctx.strokeStyle = "#1f2937";
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(15, 38);
      ctx.lineTo(5, 51);
      ctx.moveTo(24, 39);
      ctx.lineTo(43, 51);
      ctx.stroke();

      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 52);
      ctx.lineTo(18, 52);
      ctx.moveTo(35, 52);
      ctx.lineTo(54, 52);
      ctx.stroke();

      // Low torso.
      ctx.fillStyle = "#f97316";
      roundedRect(10, 24, 34, 22, 8);
      ctx.fill();

      // Arms.
      ctx.strokeStyle = "#f9c69a";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(14, 30);
      ctx.lineTo(1, 39);
      ctx.moveTo(38, 29);
      ctx.lineTo(52, 35);
      ctx.stroke();

      // Head.
      ctx.fillStyle = "#f9c69a";
      ctx.beginPath();
      ctx.arc(33, 14, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(29, 8, 14, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(39, 12, 4, 4);

      ctx.restore();
      return;
    }

    // Legs.
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1f2937";
    ctx.beginPath();
    ctx.moveTo(x + 17, y + h - 34);
    ctx.lineTo(x + 14 - legSwing, y + h - 7);
    ctx.moveTo(x + 27, y + h - 34);
    ctx.lineTo(x + 34 + legSwing, y + h - 7);
    ctx.stroke();

    // Shoes.
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x + 5 - legSwing, y + h - 5);
    ctx.lineTo(x + 22 - legSwing, y + h - 5);
    ctx.moveTo(x + 25 + legSwing, y + h - 5);
    ctx.lineTo(x + 43 + legSwing, y + h - 5);
    ctx.stroke();

    // Body.
    ctx.fillStyle = "#f97316";
    roundedRect(x + 6, y + 25, w - 8, 40, 9);
    ctx.fill();

    // Arms.
    ctx.strokeStyle = "#f9c69a";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 35);
    ctx.lineTo(x + 3 + legSwing * 0.4, y + 52);
    ctx.moveTo(x + 36, y + 35);
    ctx.lineTo(x + 45 - legSwing * 0.4, y + 50);
    ctx.stroke();

    // Head and hair.
    ctx.fillStyle = "#f9c69a";
    ctx.beginPath();
    ctx.arc(x + w / 2, y + 14, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#111827";
    ctx.beginPath();
    ctx.arc(x + w / 2 - 3, y + 8, 15, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x + w / 2 + 6, y + 10, 4, 4);
  }

  function drawObstacle(o) {
    ctx.save();
    if (o.hit) ctx.globalAlpha = 0.75;

    if (o.type === "wall") {
      ctx.fillStyle = "#9ca3af";
      roundedRect(o.x, o.y, o.w, o.h, 4);
      ctx.fill();
      ctx.strokeStyle = "#6b7280";
      ctx.lineWidth = 2;
      for (let yy = o.y + 18; yy < o.y + o.h; yy += 18) {
        ctx.beginPath(); ctx.moveTo(o.x, yy); ctx.lineTo(o.x + o.w, yy); ctx.stroke();
      }
      for (let xx = o.x + 12; xx < o.x + o.w; xx += 18) {
        ctx.beginPath(); ctx.moveTo(xx, o.y); ctx.lineTo(xx, o.y + o.h); ctx.stroke();
      }
    }

    if (o.type === "car") {
      ctx.fillStyle = "#1d4ed8";
      roundedRect(o.x, o.y + 10, o.w, o.h - 10, 12);
      ctx.fill();
      ctx.fillStyle = "#93c5fd";
      roundedRect(o.x + 22, o.y, 40, 23, 7);
      ctx.fill();
      ctx.fillStyle = "#111827";
      ctx.beginPath(); ctx.arc(o.x + 23, o.y + o.h, 11, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.x + o.w - 23, o.y + o.h, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#f8fafc";
      ctx.beginPath(); ctx.arc(o.x + 23, o.y + o.h, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.x + o.w - 23, o.y + o.h, 5, 0, Math.PI * 2); ctx.fill();
    }

    if (o.type === "bench") {
      ctx.fillStyle = "#92400e";
      roundedRect(o.x, o.y, o.w, 14, 5);
      ctx.fill();
      ctx.fillStyle = "#a16207";
      roundedRect(o.x + 8, o.y + 20, o.w - 16, 12, 5);
      ctx.fill();
      ctx.strokeStyle = "#451a03";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(o.x + 22, o.y + 32); ctx.lineTo(o.x + 22, groundY);
      ctx.moveTo(o.x + o.w - 22, o.y + 32); ctx.lineTo(o.x + o.w - 22, groundY);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fillRect(o.x + 8, o.y + 4, o.w - 16, 3);
    }

    if (o.type === "chair") {
      ctx.strokeStyle = "#7c2d12";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(o.x + 18, o.y + 24); ctx.lineTo(o.x + 18, groundY);
      ctx.moveTo(o.x + 60, o.y + 24); ctx.lineTo(o.x + 60, groundY);
      ctx.moveTo(o.x + 15, o.y + 31); ctx.lineTo(o.x + 65, o.y + 31);
      ctx.moveTo(o.x + 58, o.y + 2); ctx.lineTo(o.x + 58, o.y + 47);
      ctx.stroke();
      ctx.fillStyle = "#c2410c";
      roundedRect(o.x + 8, o.y + 24, 58, 16, 6);
      ctx.fill();
      roundedRect(o.x + 43, o.y + 2, 24, 35, 5);
      ctx.fill();
    }

    if (o.type === "lowbar") {
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(o.x + 8, o.y + 7);
      ctx.lineTo(o.x + o.w - 8, o.y + 7);
      ctx.stroke();
      ctx.fillStyle = "#15803d";
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.ellipse(o.x + 18 + i * 17, o.y + 22 + Math.sin(i) * 6, 17, 10, Math.sin(i) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalAlpha = 0.86;
    ctx.fillStyle = o.mode === "duck" ? "#14b8a6" : (o.landable ? "#22c55e" : "#f59e0b");
    ctx.beginPath();
    ctx.arc(o.x + o.w / 2, o.y - 20, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 15px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(o.mode === "duck" ? "S" : "↑", o.x + o.w / 2, o.y - 20);
    ctx.restore();
  }

  function drawCoin(c) {
    if (c.taken) return;
    const squash = Math.abs(Math.cos(c.spin));
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(0.45 + squash * 0.55, 1);
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(0, 0, c.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = "#fff7ad";
    ctx.fillRect(-2, -7, 4, 14);
    ctx.restore();
  }

  function drawGround() {
    ctx.fillStyle = "#58b957";
    ctx.fillRect(0, groundY - 16, W, 24);
    ctx.fillStyle = "#5a3b24";
    ctx.fillRect(0, groundY + 6, W, H - groundY - 6);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    const offset = -(distance % 70);
    for (let x = offset; x < W; x += 70) ctx.fillRect(x, groundY + 38, 38, 6);
    ctx.strokeStyle = "rgba(18,86,34,0.45)";
    ctx.lineWidth = 2;
    for (let x = -(distance % 28); x < W; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, groundY - 6);
      ctx.lineTo(x + 6, groundY - 18);
      ctx.stroke();
    }
  }

  function drawBackground() {
    ctx.fillStyle = "#fde68a";
    ctx.beginPath();
    ctx.arc(805, 78, 38, 0, Math.PI * 2);
    ctx.fill();

    for (const cloud of clouds) drawCloud(cloud.x, cloud.y, cloud.s);

    for (const b of buildings) {
      ctx.fillStyle = `rgba(${b.shade}, ${b.shade + 10}, ${b.shade + 25}, 0.42)`;
      ctx.fillRect(b.x, b.y - b.h, b.w, b.h);
      ctx.fillStyle = "rgba(255,255,255,0.22)";
      for (let wx = b.x + 10; wx < b.x + b.w - 8; wx += 20) {
        for (let wy = b.y - b.h + 14; wy < b.y - 10; wy += 26) ctx.fillRect(wx, wy, 8, 10);
      }
    }

    const treeOffset = -(distance * 0.45 % 180);
    for (let x = treeOffset; x < W + 180; x += 180) {
      ctx.fillStyle = "#7c4a22";
      ctx.fillRect(x + 28, 292, 18, 112);
      ctx.fillStyle = "#15803d";
      ctx.beginPath();
      ctx.arc(x + 36, 274, 43, 0, Math.PI * 2);
      ctx.arc(x + 7, 302, 32, 0, Math.PI * 2);
      ctx.arc(x + 67, 302, 34, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 45);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawGround();
    for (const c of coins) drawCoin(c);
    for (const o of obstacles) drawObstacle(o);
    drawPlayer();
    drawParticles();

    ctx.fillStyle = "rgba(15,23,42,0.72)";
    roundedRect(18, 18, 190, 44, 12);
    ctx.fill();
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "bold 14px system-ui";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("Speed", 34, 40);
    ctx.fillStyle = "#1f2937";
    roundedRect(88, 30, 100, 16, 8);
    ctx.fill();
    ctx.fillStyle = "#22c55e";
    roundedRect(88, 30, Math.min(100, (speed - 4) / 9.5 * 100), 16, 8);
    ctx.fill();

    ctx.restore();
  }

  function drawCenteredPanel(title, lines, buttonText) {
    ctx.save();
    ctx.fillStyle = "rgba(2,6,23,0.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(15,23,42,0.94)";
    roundedRect(210, 110, 540, 305, 24);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 3;
    roundedRect(210, 110, 540, 305, 24);
    ctx.stroke();
    ctx.fillStyle = "#f8fafc";
    ctx.font = "900 42px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(title, W / 2, 164);
    ctx.font = "700 20px system-ui";
    ctx.fillStyle = "#cbd5e1";
    lines.forEach((line, i) => ctx.fillText(line, W / 2, 222 + i * 32));
    ctx.fillStyle = "#ffd166";
    ctx.font = "900 22px system-ui";
    ctx.fillText(buttonText, W / 2, 360);
    ctx.restore();
  }

  function drawStart() {
    drawCenteredPanel(
      "Parkour Runner",
      [
        "Collect coins. Dodge obstacles. Speed keeps rising.",
        "Jump walls/cars. Jump onto benches and chairs.",
        "Hold S or Down to duck under low branches.",
        "You have 3 hearts."
      ],
      "Press Space/Enter or click to start"
    );
  }

  function drawGameOver() {
    drawCenteredPanel(
      "Game Over",
      [
        `Final Score: ${score}`,
        `Coins Collected: ${coinCount}`,
        `Top Speed: ${speed.toFixed(1)}`
      ],
      "Press R or click to restart"
    );
  }

  updateHud();
  update();
})();
</script>

    }

    .mobile-touch-controls .mtc-split{display:grid; grid-template-columns:1fr 1fr; gap:10px}
    .mobile-touch-controls .mtc-group{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0}
    .mobile-touch-controls .mtc-group-label{font:700 12px/1.2 system-ui,sans-serif; opacity:.85}
    .mobile-touch-controls button{
      appearance:none; -webkit-appearance:none; border:1px solid rgba(255,255,255,.24);

  }
  @media (max-width:390px){

    .mobile-touch-controls .mtc-dpad{grid-template-columns:42px 42px 42px; grid-template-rows:42px 42px 42px}

</style>

<div class="mobile-touch-controls" aria-label="Touch controls"><div class="mtc-title">Touch controls</div><div class="mtc-row"><button data-key="ArrowLeft" aria-label="Move left">◀</button><button data-key="ArrowRight" aria-label="Move right">▶</button><button class="mtc-wide" data-key="Space" aria-label="Jump or start">JUMP</button><button class="mtc-wide" data-key="ArrowDown" aria-label="Duck">DUCK</button></div></div>

<script id="mobile-touch-controls-script">
(() => {
  const root = document.querySelector('.mobile-touch-controls');
  if (!root) return;
  const keyInfo = {
    ArrowLeft:['ArrowLeft','ArrowLeft'], ArrowRight:['ArrowRight','ArrowRight'],
    ArrowUp:['ArrowUp','ArrowUp'], ArrowDown:['ArrowDown','ArrowDown'],
    Space:[' ','Space'], Enter:['Enter','Enter'],
    KeyW:['w','KeyW'], KeyA:['a','KeyA'], KeyS:['s','KeyS'], KeyD:['d','KeyD'],
    KeyX:['x','KeyX'], KeyZ:['z','KeyZ'], KeyP:['p','KeyP'], KeyR:['r','KeyR']
  };
  function fire(code, type, repeat=false){
    const info = keyInfo[code] || [code, code];
    const ev = new KeyboardEvent(type, {key:info[0], code:info[1], bubbles:true, cancelable:true, repeat});
    document.dispatchEvent(ev);
  }
  root.querySelectorAll('button[data-key]').forEach(btn => {
    let timer=null, repeater=null, held=false;
    const code=btn.dataset.key;
    const repeatable=btn.hasAttribute('data-repeat');
    const stop=() => {
      if (!held) return;
      held=false; btn.classList.remove('is-held');
      clearTimeout(timer); clearInterval(repeater); timer=repeater=null;
      fire(code,'keyup',false);
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (held) return;
      held=true; btn.classList.add('is-held');
      try{btn.setPointerCapture(e.pointerId)}catch{}
      fire(code,'keydown',false);
      if (repeatable){
        timer=setTimeout(() => {
          if (!held) return;
          repeater=setInterval(() => { if (held) fire(code,'keydown',true); }, 75);
        }, 260);
      }
    });
    btn.addEventListener('pointerup', e => {e.preventDefault(); stop();});
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('lostpointercapture', stop);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
})();
</script>
