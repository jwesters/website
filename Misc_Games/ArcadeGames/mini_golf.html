<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Golf</title>
<style>
  :root{--text:#f8fff1;--muted:#d8ead0;--accent:#f5d24a;--shadow:0 12px 32px rgba(0,0,0,.34)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at top,#315f28 0%,#173717 48%,#0a1d0a 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;justify-content:center;align-items:flex-start;padding:8px;touch-action:manipulation}
  .app{width:min(760px,100%);max-height:100dvh}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(1.25rem,3.3vw,2.1rem);line-height:1;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .badge{background:rgba(245,210,74,.15);border:1px solid rgba(245,210,74,.45);color:#fff0ac;border-radius:999px;padding:6px 10px;font-weight:900;white-space:nowrap;font-size:.9rem}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);border-radius:17px;padding:8px}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:7px}
  .stat{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:6px 4px;text-align:center}
  .label{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:850}
  .value{font-size:.95rem;font-weight:950;margin-top:1px}
  .canvasWrap{position:relative;border-radius:16px;overflow:hidden;border:3px solid rgba(255,255,255,.14);background:#183a14}
  canvas{display:block;width:100%;height:auto;max-height:calc(100dvh - 240px);aspect-ratio:720/900;cursor:crosshair;touch-action:none;outline:none;background:#183a14}
  .hint{position:absolute;left:8px;right:8px;bottom:8px;padding:6px 9px;border-radius:11px;background:rgba(8,18,8,.72);border:1px solid rgba(255,255,255,.14);color:#f3ffe8;font-weight:800;text-align:center;backdrop-filter:blur(6px);pointer-events:none;font-size:.88rem}
  .finishPopup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.88);min-width:min(340px,86%);padding:18px;border-radius:22px;background:rgba(12,25,12,.9);border:2px solid rgba(255,234,125,.85);box-shadow:0 18px 45px rgba(0,0,0,.45);text-align:center;opacity:0;pointer-events:none;transition:opacity .22s ease, transform .22s ease;backdrop-filter:blur(8px)}
  .finishPopup.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .finishTitle{font-size:clamp(1.5rem,5vw,2.25rem);font-weight:1000;color:#fff4a8;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  .finishStrokes{margin-top:8px;font-size:clamp(1rem,3.4vw,1.35rem);font-weight:900;color:#ffffff}
  .finishRound{margin-top:6px;color:#d8ead0;font-weight:850;line-height:1.25}
  .popupButtons{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
  .popupButtons button{width:auto;min-width:124px}
  .confettiPiece{position:absolute;top:-16px;width:9px;height:15px;border-radius:3px;animation:confettiFall 1.8s ease-in forwards;pointer-events:none}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(680px) rotate(740deg);opacity:0}}
  .controls{display:block;margin-top:7px}
  .powerPanel{max-width:min(540px,100%);margin:0 auto;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:8px 9px;display:none}
  .powerPanel.show{display:block}
  .meter{position:relative;height:25px;border-radius:999px;overflow:hidden;background:#101910;border:1px solid rgba(255,255,255,.16);margin:6px 0 8px}
  .meterFill{height:100%;width:0%;background:linear-gradient(90deg,#7bd56a,#f5d24a,#ff752f);border-radius:999px;transition:width .03s linear}
  .meterNeedle{position:absolute;top:-4px;bottom:-4px;width:4px;background:#fff;border-radius:999px;left:0%;box-shadow:0 0 10px rgba(255,255,255,.8)}
  button{appearance:none;border:0;border-radius:12px;padding:9px 12px;font-weight:950;font-size:.92rem;color:#172416;background:#d9ead1;box-shadow:0 4px 0 rgba(0,0,0,.28);cursor:pointer;width:100%}
  button.primary{color:#201603;background:var(--accent)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
  .menu{padding:8px}
  .menuIntro{text-align:center;color:#eef9e8;font-weight:850;line-height:1.25;margin:2px 0 10px}
  .roundBox{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px;margin-bottom:10px;text-align:center;font-weight:900;color:#fff4a8}
  .pageBar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .pageText{font-weight:900;color:#fff4a8;text-align:center;min-width:110px}
  .pageBtns{display:flex;gap:8px;flex:1}
  .pageBestBox{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:7px 9px;margin-bottom:10px;text-align:center;font-weight:950;color:#fffbe5}
  .holeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .holeButton{min-height:96px;background:linear-gradient(180deg,#be8334,#88481d);color:#fff7d5;border:2px solid rgba(255,224,142,.55);box-shadow:0 5px 0 rgba(0,0,0,.33);display:flex;flex-direction:column;justify-content:center;gap:4px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .holeButton.done{background:linear-gradient(180deg,#d59e3d,#996122)}
  .holeNum{font-size:1.28rem;font-weight:1000}
  .holeBest,.holeRound{font-size:.78rem;font-weight:900;color:#fffbe5}
  @media (max-width:720px){
    body{padding:6px} .badge{font-size:.82rem;padding:5px 8px} .card{padding:6px;border-radius:14px}
    .stats{gap:4px;margin-bottom:5px} .stat{padding:5px 2px;border-radius:9px} .label{font-size:.54rem} .value{font-size:.86rem}
    canvas{max-height:calc(100dvh - 260px)} .hint{font-size:.76rem;left:6px;right:6px;bottom:6px;padding:5px 7px}
    .holeGrid{gap:6px} .holeButton{min-height:82px;padding:7px 4px} .holeNum{font-size:1.02rem} .holeBest,.holeRound{font-size:.68rem}
  }
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <h1>Mini Golf</h1>
    <div class="badge" id="holeBadge">Menu</div>
  </div>
  <section class="card">
    <div id="menuScreen" class="menu">
      <div class="menuIntro">Choose any hole. Best score is saved underneath each hole.</div>
      <div class="roundBox" id="roundBox">Current round: 0 / 180 holes complete</div>
      <div class="pageBar">
        <div class="pageBtns">
          <button id="prevPageBtn">Prev Page</button>
          <button id="nextPageBtn">Next Page</button>
        </div>
        <div class="pageText" id="pageText">Page 1 / 20</div>
      </div>
      <div class="pageBestBox" id="pageBestBox">Best 9-hole total: —</div>
      <div class="holeGrid" id="holeGrid"></div>
    </div>
    <div id="gameScreen" style="display:none">
      <div class="stats">
        <div class="stat"><div class="label">Hole</div><div class="value" id="holeText">1</div></div>
        <div class="stat"><div class="label">Par</div><div class="value">3</div></div>
        <div class="stat"><div class="label">Strokes</div><div class="value" id="strokeText">0 / 9</div></div>
        <div class="stat"><div class="label">Best</div><div class="value" id="bestText">—</div></div>
      </div>
      <div class="canvasWrap">
        <canvas id="game" width="720" height="900" tabindex="0"></canvas>
        <div class="hint" id="hintText">Click or tap where you want the ball to go.</div>
        <div class="finishPopup" id="finishPopup">
          <div class="finishTitle" id="finishTitle">Ball in Hole!</div>
          <div class="finishStrokes" id="finishStrokes">1 stroke</div>
          <div class="finishRound" id="finishRound"></div>
          <div class="popupButtons">
            <button id="tryAgainBtn" style="display:none">Try Hole Again</button>
            <button class="primary" id="nextHoleBtn">Next Hole</button>
            <button id="menuBtn">Back to Menu</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="powerPanel" id="powerPanel">
          <div class="label">Power — click/tap anywhere to hit</div>
          <div class="meter">
            <div class="meterFill" id="meterFill"></div>
            <div class="meterNeedle" id="meterNeedle"></div>
          </div>
          <button id="cancelBtn">Cancel Aim</button>
        </div>
      </div>
    </div>
  </section>
</main>

      ctx.restore();

      rg.addColorStop(1, '#6e3f1e');

      ctx.fill();
      ctx.strokeStyle = '#3f2311';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(255,236,176,.55)';
      ctx.lineWidth = 4;
      for (let y = h.y + 10; y < h.y + h.h; y += 16) {

        ctx.lineTo(h.x + h.w - 7, y - 8);
        ctx.stroke();

      ctx.restore();

      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(19 + i * 20, 0);
        ctx.lineTo(-4 + i * 20, -11);
        ctx.lineTo(-4 + i * 20, 11);

        ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawCup(){ const cup = currentLayout.cup; ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 9; ctx.shadowOffsetY = 3; ctx.fillStyle = '#050708'; ctx.beginPath(); ctx.arc(cup.x, cup.y, cup.r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); ctx.strokeStyle = 'rgba(255,255,255,.88)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cup.x, cup.y, cup.r, 0, Math.PI * 2); ctx.stroke(); }
  function drawAim(){
    if ((state !== 'aim' && state !== 'power') || strokes >= MAX_STROKES) return;
    const dx = aimTarget.x - ball.x, dy = aimTarget.y - ball.y, mag = Math.max(1, length(dx,dy)), ux = dx / mag, uy = dy / mag, lineLen = clamp(mag, 55, 280), endX = ball.x + ux * lineLen, endY = ball.y + uy * lineLen;
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 7; const ag = ctx.createLinearGradient(ball.x, ball.y, endX, endY); ag.addColorStop(0, '#ff6e28'); ag.addColorStop(.55, '#ffb11c'); ag.addColorStop(1, '#ffe61f'); ctx.strokeStyle = ag; ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(endX, endY); ctx.stroke();
    ctx.translate(endX, endY); ctx.rotate(Math.atan2(uy, ux)); ctx.fillStyle = '#ffe61f'; ctx.beginPath(); ctx.moveTo(20,0); ctx.lineTo(-5,-11); ctx.lineTo(-5,11); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function drawBall(){
    const flying = ball.air > 0 && ball.airMax > 0, jumpProgress = flying ? 1 - (ball.air / ball.airMax) : 0, jumpHeight = flying ? Math.sin(jumpProgress * Math.PI) * 42 : 0, squash = flying ? 1 + Math.sin(jumpProgress * Math.PI) * 0.18 : 1, visualX = ball.x, visualY = ball.y - jumpHeight;
    ctx.save(); ctx.fillStyle = flying ? 'rgba(0,0,0,.28)' : 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(ball.x, ball.y + 9, ball.r * (flying ? 1.45 + jumpHeight / 75 : 1.05), ball.r * (flying ? 0.42 : 0.34), 0, 0, Math.PI * 2); ctx.fill();
    if (flying) { ctx.strokeStyle = 'rgba(255,255,255,.34)'; ctx.lineWidth = 2; ctx.setLineDash([6, 7]); ctx.beginPath(); ctx.moveTo(ball.x, ball.y - 3); ctx.lineTo(visualX, visualY + ball.r); ctx.stroke(); ctx.setLineDash([]); }
    const bg = ctx.createRadialGradient(visualX - 4, visualY - 5, 2, visualX, visualY, ball.r + 4); bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.72, '#e9edf7'); bg.addColorStop(1, '#aeb8cc');
    ctx.translate(visualX, visualY); ctx.scale(squash, squash); ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(30,40,60,.2)';
    for (let i = 0; i < 9; i++) { const angle = i * 0.7 + (ball.x + ball.y) * .005, rr = i < 3 ? 2.9 : i < 6 ? 4.8 : 6.4; ctx.beginPath(); ctx.arc(Math.cos(angle) * rr, Math.sin(angle * 1.1) * rr, 0.9, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  function drawMessage(){
    if (!message || state === 'done' || state === 'over') return;
    if (message.includes('farther') || message.includes('cancelled') || message.includes('Water')) {
      ctx.save(); ctx.font = '800 20px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRectPath(ctx, 150, 22, 420, 42, 15); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(message, W / 2, 49); ctx.restore();
    }
  }
  function render(){ if (state === 'menu') return; drawBackground(); drawBorder(); drawCourseFill(); drawHazards(); drawCup(); drawAim(); drawBall(); drawMessage(); }
  function tick(now){
    const dt = Math.min(40, now - lastTime); lastTime = now;
    if (state === 'power') {
      power += powerDir * dt * 0.00155; if (power >= 1) { power = 1; powerDir = -1; } if (power <= .12) { power = .12; powerDir = 1; }
      const pct = Math.round(power * 100); meterFill.style.width = `${pct}%`; meterNeedle.style.left = `calc(${pct}% - 2px)`;
    }
    updatePhysics(dt); render(); requestAnimationFrame(tick);
  }
  canvas.addEventListener('pointermove', (evt) => { if (state !== 'aim') return; setAimTarget(pointerToCanvas(evt)); });
  canvas.addEventListener('pointerdown', (evt) => { if (state !== 'aim') return; evt.preventDefault(); canvas.focus({preventScroll:true}); setAimTarget(pointerToCanvas(evt)); lockPower(); });
  document.addEventListener('pointerdown', (evt) => { if (state !== 'power' || !powerClickArmed) return; if (evt.target === cancelBtn || cancelBtn.contains(evt.target)) return; evt.preventDefault(); shoot(); }, {passive:false});
  canvas.addEventListener('keydown', (evt) => {
    const key = evt.key;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Escape'].includes(key)) evt.preventDefault();
    if (state === 'aim') {
      if (key === 'ArrowLeft') keyboardAngle -= evt.shiftKey ? 0.012 : 0.035;
      if (key === 'ArrowRight') keyboardAngle += evt.shiftKey ? 0.012 : 0.035;
      if (key === 'ArrowUp') keyboardLen = clamp(keyboardLen + 8, 45, 360);
      if (key === 'ArrowDown') keyboardLen = clamp(keyboardLen - 8, 45, 360);

      if (key === ' ' || key === 'Enter') lockPower();
    } else if (state === 'power') {
      if (key === ' ' || key === 'Enter') shoot();
      if (key === 'Escape') cancelPower(evt);
    }
  });
  cancelBtn.addEventListener('pointerdown', cancelPower);
  cancelBtn.addEventListener('click', cancelPower);
  menuBtn.addEventListener('click', showMenu);
  tryAgainBtn.addEventListener('click', () => startHole(currentHole));
  nextHoleBtn.addEventListener('click', () => { if (currentHole < holes.length - 1) startHole(currentHole + 1); });
  prevPageBtn.addEventListener('click', () => { if (menuPage > 0) { menuPage--; renderMenu(); } });
  nextPageBtn.addEventListener('click', () => { if (menuPage < PAGE_COUNT - 1) { menuPage++; renderMenu(); } });
  makeTexture(); loadScores(); showMenu(); requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(tick); });
})();
