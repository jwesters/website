<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root{
      --bg1:#eef7ff;
      --bg2:#d8ecff;
      --panel:rgba(255,255,255,.94);
      --ink:#17324d;
      --muted:#5f7891;
      --accent:#2b7cff;
      --accent2:#69a6ff;
      --shadow:0 14px 34px rgba(30,77,138,.16);
      --radius:16px;
      --cell:22px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;color:var(--ink)}
    body{
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.9), rgba(255,255,255,0) 34%),
        linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;padding:12px;
    }
    .app{width:min(820px,100%)}
    .card{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.82);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:10px;
      backdrop-filter:blur(6px);
    }
    .topbar{
      display:grid;
      grid-template-columns:1fr auto auto auto auto;
      gap:6px;
      align-items:center;
      margin-bottom:6px;
    }
    h1{margin:0;font-size:clamp(1.3rem,3.2vw,1.9rem);line-height:1.02}
    .subtitle{display:none}
    .pill{
      min-width:76px;
      text-align:center;
      padding:6px 8px;
      border-radius:10px;
      background:linear-gradient(180deg,#fff,#edf5ff);
      border:1px solid rgba(95,120,145,.18);
    }
    .pill .label{display:block;color:var(--muted);font-size:.75rem;margin-bottom:2px}
    .pill .value{font-size:1rem;font-weight:900}
    .main{display:grid;grid-template-columns:1fr;gap:8px}
    .boardWrap{
      background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(239,247,255,.92));
      border:1px solid rgba(95,120,145,.14);
      border-radius:14px;
      padding:6px;
      position:relative;
      overflow:hidden;
    }
    canvas{
      display:block;
      width:min(780px,100%);
      height:auto;
      margin:0 auto;
      image-rendering:high-quality;
      border-radius:10px;
      background:#f9fcff;
      border:1px solid rgba(95,120,145,.16);
      max-width:100%;
    }
    .controls{
      display:flex;
      gap:6px;
      justify-content:flex-end;
    }
    button{
      appearance:none;border:0;border-radius:10px;padding:8px 12px;
      color:#fff;font-weight:900;font-size:.95rem;cursor:pointer;
      background:linear-gradient(180deg,var(--accent2),var(--accent));
      box-shadow:0 10px 20px rgba(43,124,255,.22);
    }
    button.secondary{
      background:linear-gradient(180deg,#8ea6bf,#6f859e);
      box-shadow:0 10px 20px rgba(40,55,75,.14);
    }
    .overlay{
      position:absolute; inset:8px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(238,247,255,.72);
      border-radius:10px;
      text-align:center;
      padding:14px;
      z-index:5;
    }
    .overlay.hidden{display:none}
    .overlayBox{
      max-width:460px;
      background:rgba(255,255,255,.95);
      border:1px solid rgba(95,120,145,.15);
      border-radius:14px;
      box-shadow:0 14px 30px rgba(28,62,108,.10);
      padding:14px;
    }
    .overlayBox h2{margin:0 0 8px;font-size:clamp(1.5rem,3.8vw,2.1rem)}
    .overlayBox p{margin:7px auto;color:var(--muted);line-height:1.42}
    .buttonRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
    .big{font-size:clamp(2.8rem,10vw,5rem);font-weight:900;line-height:1}
    @media (max-width:760px){
      .topbar{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="topbar">
        <div>
          <h1>Number Snake</h1>
          <div class="subtitle">Collect 1 through 9 in order. Wrong number, wall, obstacle, or body costs a life.</div>
        </div>
        <div class="pill"><span class="label">Level</span><span class="value" id="levelDisplay">1</span></div>
        <div class="pill"><span class="label">Lives</span><span class="value" id="livesDisplay">3</span></div>
        <div class="pill"><span class="label">Next</span><span class="value" id="nextDisplay">1</span></div>
        <div class="pill"><span class="label">Best</span><span class="value" id="bestDisplay">1</span></div>
      </div>

      <div class="main">
        <div class="controls">
          <button class="secondary" id="restartBtn">Restart</button>
        </div>

        <div class="boardWrap">
          <canvas id="game" width="816" height="816" aria-label="Snake board"></canvas>
          <div class="overlay" id="overlay">
            <div class="overlayBox">
              <div id="overlayInner"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  const GRID = 24;
  const CELL = 34;
  const LEVELS = 15;
  const START_LIVES = 3;
  const BASE_SPEED = 160;
  const SPEED_MULT = 0.95;
  const GROW_PER_NUMBER = 2;
  const BEST_KEY = 'number_snake_best_level_v4';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const levelDisplay = document.getElementById('levelDisplay');
  const livesDisplay = document.getElementById('livesDisplay');
  const nextDisplay = document.getElementById('nextDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const overlay = document.getElementById('overlay');
  const overlayInner = document.getElementById('overlayInner');
  const restartBtn = document.getElementById('restartBtn');

  const state = {
    running: false,
    pausedByOverlay: true,
    level: 1,
    lives: START_LIVES,
    best: Number(localStorage.getItem(BEST_KEY) || 1),
    snake: [],
    dir: {x:1, y:0},
    nextDir: {x:1, y:0},
    obstacles: new Set(),
    numbers: new Map(),
    nextTarget: 1,
    lastTick: 0,
    tickMs: BASE_SPEED,
    growthPending: 0,
    renderSnake: [],
    prevSnake: [],
    lastMoveAt: 0,
    pendingTurn: null,
    numbersCollectedTotal: 0,
    oneUp: null,
    messageFlashUntil: 0
  };

  const spawnCells = [
    {x:12,y:12},{x:11,y:12},{x:10,y:12},{x:9,y:12},
    {x:8,y:12},{x:7,y:12}
  ];

  bestDisplay.textContent = state.best;

  function posKey(x,y){ return `${x},${y}`; }
  function fromKey(key){ const [x,y] = key.split(',').map(Number); return {x,y}; }
  function randInt(n){ return Math.floor(Math.random() * n); }

  function updateHud(){
    levelDisplay.textContent = state.level;
    livesDisplay.textContent = state.lives;
    nextDisplay.textContent = state.nextTarget;
    bestDisplay.textContent = state.best;
  }

  function saveBest(level){
    if(level > state.best){
      state.best = level;
      localStorage.setItem(BEST_KEY, String(level));
      bestDisplay.textContent = state.best;
    }
  }

  function showOverlay(html){
    overlayInner.innerHTML = html;
    overlay.classList.remove('hidden');
    state.pausedByOverlay = true;
    state.running = false;
  }

  function hideOverlay(){
    overlay.classList.add('hidden');
    state.pausedByOverlay = false;
  }

  function pauseGame(){
    if(!state.running || state.pausedByOverlay) return;
    showOverlay(`
      <h2>Paused</h2>
      <p>The game is paused.</p>
      <div class="buttonRow">
        <button id="resumeBtn">Resume</button>
        <button class="secondary" id="restartPauseBtn">Restart Game</button>
      </div>
    `);
    document.getElementById('resumeBtn').addEventListener('click', () => {
      hideOverlay();
      state.running = true;
      state.lastTick = performance.now();
      state.lastMoveAt = performance.now();
    });
    document.getElementById('restartPauseBtn').addEventListener('click', newGame);
  }

  function isSpawnZone(x, y){
    return Math.abs(x - 10) <= 4 && Math.abs(y - 12) <= 3;
  }

  function snakeContains(x, y){
    return state.snake.some(seg => seg.x === x && seg.y === y);
  }

  function occupiedByObstacleOrNumber(x, y){
    const key = posKey(x,y);
    return state.obstacles.has(key) || state.numbers.has(key);
  }

  function clearSpawnLane(){
    for(const c of spawnCells){
      state.obstacles.delete(posKey(c.x, c.y));
      state.numbers.delete(posKey(c.x, c.y));
    }
    for(let y = 9; y <= 15; y++){
      for(let x = 6; x <= 14; x++){
        state.obstacles.delete(posKey(x,y));
      }
    }
  }

  function syncRenderSnake(){
    state.prevSnake = state.snake.map(seg => ({...seg}));
    state.renderSnake = state.snake.map(seg => ({...seg}));
    state.lastMoveAt = performance.now();
  }

  function spawnSnake(){
    clearSpawnLane();
    state.snake = [
      {x:12,y:12},
      {x:11,y:12},
      {x:10,y:12},
      {x:9,y:12},
    ];
    state.dir = {x:1,y:0};
    state.nextDir = {x:1,y:0};
    state.pendingTurn = null;
    state.growthPending = 0;
    syncRenderSnake();
  }

  function freeCellList(avoidSpawnZone = false){
    const all = [];
    for(let y=0; y<GRID; y++){
      for(let x=0; x<GRID; x++){
        if(avoidSpawnZone && isSpawnZone(x,y)) continue;
        if(occupiedByObstacleOrNumber(x,y)) continue;
        if(snakeContains(x,y)) continue;
        if(state.oneUp && state.oneUp.x === x && state.oneUp.y === y) continue;
        all.push({x,y});
      }
    }
    return all;
  }

  function randomFreeCell(avoidSpawnZone = false){
    const all = freeCellList(avoidSpawnZone);
    if(!all.length) return null;
    return all[randInt(all.length)];
  }

  function maybeSpawnOneUp(){
    if(state.numbersCollectedTotal > 0 && state.numbersCollectedTotal % 5 === 0 && !state.oneUp){
      const cell = randomFreeCell(true);
      if(cell){
        state.oneUp = { x: cell.x, y: cell.y, expiresAt: performance.now() + 5000 };
      }
    }
  }

  function buildLevel(level){
    state.obstacles = new Set();
    state.numbers = new Map();
    state.nextTarget = 1;
    state.oneUp = null;

    spawnSnake();

    const obstacleCount = Math.min(3 + level, 18);
    let attempts = 0;

    while(state.obstacles.size < obstacleCount && attempts < 6000){
      attempts++;
      const x = randInt(GRID);
      const y = randInt(GRID);
      if(isSpawnZone(x,y)) continue;
      if(x < 1 || x > GRID - 2 || y < 1 || y > GRID - 2) continue;
      if(occupiedByObstacleOrNumber(x,y)) continue;
      if(snakeContains(x,y)) continue;
      state.obstacles.add(posKey(x,y));
    }

    placeNumbers();
    state.tickMs = BASE_SPEED * Math.pow(SPEED_MULT, level - 1);
    updateHud();
  }

  function placeNumbers(){
    state.numbers = new Map();
    const placed = [];
    const candidates = freeCellList(true);

    for(let i = candidates.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }

    const minGap = 4;

    for(let n=1; n<=9; n++){
      let chosen = null;

      for(const cell of candidates){
        if(state.numbers.has(posKey(cell.x, cell.y))) continue;
        let ok = true;
        for(const other of placed){
          const d = Math.abs(cell.x - other.x) + Math.abs(cell.y - other.y);
          if(d < minGap){
            ok = false;
            break;
          }
        }
        if(ok){
          chosen = cell;
          break;
        }
      }

      if(!chosen){
        let bestCell = null;
        let bestScore = -1;
        for(const cell of candidates){
          if(state.numbers.has(posKey(cell.x, cell.y))) continue;
          let nearest = Infinity;
          for(const other of placed){
            const d = Math.abs(cell.x - other.x) + Math.abs(cell.y - other.y);
            if(d < nearest) nearest = d;
          }
          const edgeDistance = Math.min(cell.x, GRID - 1 - cell.x, cell.y, GRID - 1 - cell.y);
          const score = (placed.length ? nearest * 10 : 0) + edgeDistance;
          if(score > bestScore){
            bestScore = score;
            bestCell = cell;
          }
        }
        chosen = bestCell;
      }

      if(!chosen) break;
      state.numbers.set(posKey(chosen.x, chosen.y), n);
      placed.push(chosen);
    }
  }

  function loseLife(reason){
    state.lives--;
    updateHud();

    if(state.lives <= 0){
      saveBest(Math.max(1, state.level));
      gameOver(reason);
      return;
    }

    spawnSnake();
    state.messageFlashUntil = performance.now() + 350;
  }

  function gameOver(reason){
    showOverlay(`
      <h2>Game Over</h2>
      <p>${reason}</p>
      <p>You reached <strong>Level ${state.level}</strong>.</p>
      <p>Best level: <strong>${state.best}</strong></p>
      <div class="buttonRow">
        <button id="playAgainBtn">Play Again</button>
      </div>
    `);
    document.getElementById('playAgainBtn').addEventListener('click', newGame);
  }

  function winGame(){
    saveBest(LEVELS);
    showOverlay(`
      <h2>You Win!</h2>
      <p>You cleared all <strong>${LEVELS}</strong> levels.</p>
      <p class="big">🐍</p>
      <div class="buttonRow">
        <button id="playAgainBtn">Play Again</button>
      </div>
    `);
    document.getElementById('playAgainBtn').addEventListener('click', newGame);
  }

  function nextLevel(){
    state.level++;
    if(state.level > LEVELS){
      winGame();
      return;
    }
    saveBest(state.level);
    buildLevel(state.level);
    draw(performance.now());
    showOverlay(`
      <h2>Level ${state.level}</h2>
      <p>More trees. Faster snake.</p>
      <div class="buttonRow">
        <button id="continueBtn">Start Level</button>
      </div>
    `);
    document.getElementById('continueBtn').addEventListener('click', () => {
      hideOverlay();
      state.running = true;
      state.lastTick = performance.now();
      state.lastMoveAt = performance.now();
    });
  }

  function newGame(){
    state.level = 1;
    state.lives = START_LIVES;
    state.numbersCollectedTotal = 0;
    state.oneUp = null;
    buildLevel(1);
    draw(performance.now());
    showOverlay(`
      <h2>Number Snake</h2>
      <p>Collect the numbers from <strong>1</strong> to <strong>9</strong> in order.</p>
      <p>Every 5 numbers collected, a <strong>1UP</strong> appears for 5 seconds.</p>
      <div class="buttonRow">
        <button id="goBtn">Start Game</button>
      </div>
    `);
    document.getElementById('goBtn').addEventListener('click', () => {
      hideOverlay();
      state.running = true;
      state.lastTick = performance.now();
      state.lastMoveAt = performance.now();
    });
  }

  function moveSnake(){
    state.prevSnake = state.snake.map(seg => ({...seg}));
    state.lastMoveAt = performance.now();

    if(state.pendingTurn){
      state.dir = state.pendingTurn;
      state.nextDir = state.pendingTurn;
      state.pendingTurn = null;
    } else {
      state.dir = state.nextDir;
    }

    const head = state.snake[0];
    const next = { x: head.x + state.dir.x, y: head.y + state.dir.y };

    if(next.x < 0 || next.x >= GRID || next.y < 0 || next.y >= GRID){
      loseLife('You hit the wall.');
      syncRenderSnake();
      return;
    }

    const nextKey = posKey(next.x, next.y);

    if(state.obstacles.has(nextKey)){
      loseLife('You crashed into a tree.');
      syncRenderSnake();
      return;
    }

    for(const seg of state.snake){
      if(seg.x === next.x && seg.y === next.y){
        loseLife('You ran into yourself.');
        syncRenderSnake();
        return;
      }
    }

    state.snake.unshift(next);

    if(state.oneUp && state.oneUp.x === next.x && state.oneUp.y === next.y){
      state.lives = Math.min(9, state.lives + 1);
      state.oneUp = null;
      updateHud();
    }

    let consumedNumber = false;
    if(state.numbers.has(nextKey)){
      const value = state.numbers.get(nextKey);
      if(value === state.nextTarget){
        state.numbers.delete(nextKey);
        state.nextTarget++;
        state.growthPending += GROW_PER_NUMBER;
        state.numbersCollectedTotal++;
        maybeSpawnOneUp();
        consumedNumber = true;

        if(value === 9){
          updateHud();
          state.running = false;
          setTimeout(nextLevel, 260);
          return;
        }
      } else {
        state.snake.shift();
        loseLife(`You picked up ${value} instead of ${state.nextTarget}.`);
        syncRenderSnake();
        return;
      }
    }

    if(state.growthPending > 0){
      state.growthPending--;
    } else {
      state.snake.pop();
    }

    if(consumedNumber){
      updateHud();
    }
    state.renderSnake = state.snake.map(seg => ({...seg}));
  }

  function drawRoundedRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawTree(x, y, t){
    const px = x * CELL;
    const py = y * CELL;
    const sway = Math.sin(t / 400 + x * 0.8 + y * 0.4) * 1.1;

    ctx.fillStyle = '#7b522e';
    ctx.fillRect(px + CELL * 0.42, py + CELL * 0.54, CELL * 0.16, CELL * 0.25);

    const canopies = [
      [0.50 + sway / 20, 0.30, 0.23],
      [0.34 + sway / 20, 0.44, 0.17],
      [0.66 + sway / 20, 0.44, 0.17],
      [0.50 + sway / 22, 0.54, 0.19]
    ];
    for(const [cx, cy, r] of canopies){
      const grad = ctx.createRadialGradient(
        px + CELL * cx - 2, py + CELL * cy - 2, 2,
        px + CELL * cx, py + CELL * cy, CELL * r
      );
      grad.addColorStop(0, '#8ad87f');
      grad.addColorStop(1, '#2f9a4d');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(px + CELL * cx, py + CELL * cy, CELL * r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawNumberTile(x, y, value, isNext){
    const px = x * CELL;
    const py = y * CELL;
    drawRoundedRect(px + 1, py + 1, CELL - 2, CELL - 2, 6);
    ctx.fillStyle = '#fff7d9';
    ctx.fill();
    ctx.strokeStyle = isNext ? '#d19b11' : '#d9d9d9';
    ctx.lineWidth = isNext ? 1.9 : 1.2;
    ctx.stroke();
    ctx.fillStyle = isNext ? '#c57900' : '#7c8ba0';
    ctx.font = 'bold 14px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(value), px + CELL / 2, py + CELL / 2 + 0.5);
  }

  function drawSnake(t){
    const wave = Math.sin(t / 120);
    const moveProgress = state.running && !state.pausedByOverlay
      ? Math.min(1, Math.max(0, (t - state.lastMoveAt) / state.tickMs))
      : 1;

    const renderSegments = state.renderSnake.length ? state.renderSnake : state.snake;

    for(let i = renderSegments.length - 1; i >= 0; i--){
      const seg = renderSegments[i];
      const prev = state.prevSnake[i] || seg;
      const ix = prev.x + (seg.x - prev.x) * moveProgress;
      const iy = prev.y + (seg.y - prev.y) * moveProgress;
      const isHead = i === 0;
      const px = ix * CELL;
      const py = iy * CELL;

      const pulse = Math.sin(t / 100 + i * 0.55) * 0.55;
      const inset = isHead ? 1.1 : 2.0 + (Math.sin(i * 0.5 + t / 170) * 0.28 + 0.28);
      const h = CELL - inset * 2;
      const w = CELL - inset * 2 + (isHead ? 0.8 : 0);

      ctx.fillStyle = isHead ? '#2b7cff' : '#5ca0ff';
      drawRoundedRect(px + inset, py + inset + pulse * 0.14, w, h, 9);
      ctx.fill();

      if(!isHead && i % 2 === 0){
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        drawRoundedRect(px + inset + 2.5, py + inset + 4.5, w - 5, 3.5, 3);
        ctx.fill();
      }
    }

    const head = renderSegments[0];
    const prevHead = state.prevSnake[0] || head;
    if(!head) return;
    const hx = (prevHead.x + (head.x - prevHead.x) * moveProgress) * CELL;
    const hy = (prevHead.y + (head.y - prevHead.y) * moveProgress) * CELL;

    ctx.fillStyle = '#ffffff';
    if(state.dir.x === 1 || state.dir.x === -1){
      const eyeX = state.dir.x === 1 ? hx + CELL * 0.70 : hx + CELL * 0.30;
      ctx.beginPath();
      ctx.arc(eyeX, hy + CELL * 0.34, 2.1, 0, Math.PI * 2);
      ctx.arc(eyeX, hy + CELL * 0.66, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#10315f';
      ctx.beginPath();
      ctx.arc(eyeX, hy + CELL * 0.34, 1.0, 0, Math.PI * 2);
      ctx.arc(eyeX, hy + CELL * 0.66, 1.0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      const eyeY = state.dir.y === 1 ? hy + CELL * 0.70 : hy + CELL * 0.30;
      ctx.beginPath();
      ctx.arc(hx + CELL * 0.34, eyeY, 2.1, 0, Math.PI * 2);
      ctx.arc(hx + CELL * 0.66, eyeY, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#10315f';
      ctx.beginPath();
      ctx.arc(hx + CELL * 0.34, eyeY, 1.0, 0, Math.PI * 2);
      ctx.arc(hx + CELL * 0.66, eyeY, 1.0, 0, Math.PI * 2);
      ctx.fill();
    }

    const tongueLen = 4.5 + Math.max(0, wave) * 2.6;
    ctx.strokeStyle = '#d94d65';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if(state.dir.x === 1){
      ctx.moveTo(hx + CELL - 3, hy + CELL / 2);
      ctx.lineTo(hx + CELL - 3 + tongueLen, hy + CELL / 2);
      ctx.lineTo(hx + CELL - 3 + tongueLen + 2.5, hy + CELL / 2 - 1.8);
      ctx.moveTo(hx + CELL - 3 + tongueLen, hy + CELL / 2);
      ctx.lineTo(hx + CELL - 3 + tongueLen + 2.5, hy + CELL / 2 + 1.8);
    } else if(state.dir.x === -1){
      ctx.moveTo(hx + 3, hy + CELL / 2);
      ctx.lineTo(hx + 3 - tongueLen, hy + CELL / 2);
      ctx.lineTo(hx + 3 - tongueLen - 2.5, hy + CELL / 2 - 1.8);
      ctx.moveTo(hx + 3 - tongueLen, hy + CELL / 2);
      ctx.lineTo(hx + 3 - tongueLen - 2.5, hy + CELL / 2 + 1.8);
    } else if(state.dir.y === 1){
      ctx.moveTo(hx + CELL / 2, hy + CELL - 3);
      ctx.lineTo(hx + CELL / 2, hy + CELL - 3 + tongueLen);
      ctx.lineTo(hx + CELL / 2 - 1.8, hy + CELL - 3 + tongueLen + 2.5);
      ctx.moveTo(hx + CELL / 2, hy + CELL - 3 + tongueLen);
      ctx.lineTo(hx + CELL / 2 + 1.8, hy + CELL - 3 + tongueLen + 2.5);
    } else {
      ctx.moveTo(hx + CELL / 2, hy + 3);
      ctx.lineTo(hx + CELL / 2, hy + 3 - tongueLen);
      ctx.lineTo(hx + CELL / 2 - 1.8, hy + 3 - tongueLen - 2.5);
      ctx.moveTo(hx + CELL / 2, hy + 3 - tongueLen);
      ctx.lineTo(hx + CELL / 2 + 1.8, hy + 3 - tongueLen - 2.5);
    }
    ctx.stroke();
  }

  function draw(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(performance.now() < state.messageFlashUntil){
      ctx.fillStyle = 'rgba(210,77,77,.10)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    for(let y=0; y<GRID; y++){
      for(let x=0; x<GRID; x++){
        ctx.fillStyle = (x + y) % 2 === 0 ? '#f9fcff' : '#f3f8fe';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    for(const key of state.obstacles){
      const {x,y} = fromKey(key);
      drawTree(x, y, t);
    }

    for(const [key, value] of state.numbers.entries()){
      const {x,y} = fromKey(key);
      drawNumberTile(x, y, value, value === state.nextTarget);
    }

    if(state.oneUp){
      const px = state.oneUp.x * CELL;
      const py = state.oneUp.y * CELL;
      const pulse = 0.9 + 0.12 * Math.sin(t / 120);
      ctx.save();
      ctx.translate(px + CELL / 2, py + CELL / 2);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#8adf61';
      drawRoundedRect(-CELL * 0.36, -CELL * 0.28, CELL * 0.72, CELL * 0.56, 7);
      ctx.fill();
      ctx.strokeStyle = '#4b9b2d';
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1UP', 0, 0.5);
      ctx.restore();
    }

    drawSnake(t);
  }

  function loop(ts){
    if(state.oneUp && ts >= state.oneUp.expiresAt){
      state.oneUp = null;
    }

    if(state.running && !state.pausedByOverlay){
      if(ts - state.lastTick >= state.tickMs){
        state.lastTick = ts;
        moveSnake();
      }
    }
    draw(ts);
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();

    if(k === 'p' || e.key === 'Escape'){
      e.preventDefault();
      if(state.pausedByOverlay){
        const resumeBtn = document.getElementById('resumeBtn');
        if(resumeBtn) resumeBtn.click();
      } else {
        pauseGame();
      }
      return;
    }

    let nd = null;
    if(k === 'arrowup' || k === 'w') nd = {x:0,y:-1};
    else if(k === 'arrowdown' || k === 's') nd = {x:0,y:1};
    else if(k === 'arrowleft' || k === 'a') nd = {x:-1,y:0};
    else if(k === 'arrowright' || k === 'd') nd = {x:1,y:0};

    if(nd){
      e.preventDefault();
      const current = state.pendingTurn || state.nextDir || state.dir;
      if(nd.x === -current.x && nd.y === -current.y) return;
      state.pendingTurn = nd;
      state.nextDir = nd;
    }
  }, {passive:false});

  restartBtn.addEventListener('click', newGame);

  buildLevel(1);
  draw(performance.now());
  showOverlay(`
    <h2>Number Snake</h2>
    <p>Collect the numbers from <strong>1</strong> to <strong>9</strong> in order.</p>
    <p>Press <strong>P</strong> or <strong>Esc</strong> to pause.</p>
    <div class="buttonRow">
      <button id="goBtn">Start Game</button>
    </div>
  `);
  document.getElementById('goBtn').addEventListener('click', () => {
    hideOverlay();
    state.running = true;
    state.lastTick = performance.now();
    state.lastMoveAt = performance.now();
  });

  requestAnimationFrame(loop);
})();
</script>

<button class="mtc-left mtc-small" data-key="ArrowLeft" aria-label="Left">◀</button>
<button class="mtc-right mtc-small" data-key="ArrowRight" aria-label="Right">▶</button>
<button class="mtc-down mtc-small" data-key="ArrowDown" aria-label="Down">▼</button>
</div></div></div>

<script id="mobile-touch-controls-script">
(() => {
  const root = document.querySelector('.mobile-touch-controls');
  if (!root) return;
  const keyInfo = {
    ArrowLeft:['ArrowLeft','ArrowLeft'], ArrowRight:['ArrowRight','ArrowRight'],
    ArrowUp:['ArrowUp','ArrowUp'], ArrowDown:['ArrowDown','ArrowDown'],
    Space:[' ','Space'], Enter:['Enter','Enter'],
    KeyW:['w','KeyW'], KeyA:['a','KeyA'], KeyS:['s','KeyS'], KeyD:['d','KeyD'],
    KeyX:['x','KeyX'], KeyZ:['z','KeyZ'], KeyP:['p','KeyP'], KeyR:['r','KeyR']
  };
  function fire(code, type, repeat=false){
    const info = keyInfo[code] || [code, code];
    const ev = new KeyboardEvent(type, {key:info[0], code:info[1], bubbles:true, cancelable:true, repeat});
    document.dispatchEvent(ev);
  }
  root.querySelectorAll('button[data-key]').forEach(btn => {
    let timer=null, repeater=null, held=false;
    const code=btn.dataset.key;
    const repeatable=btn.hasAttribute('data-repeat');
    const stop=() => {
      if (!held) return;
      held=false; btn.classList.remove('is-held');
      clearTimeout(timer); clearInterval(repeater); timer=repeater=null;
      fire(code,'keyup',false);
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (held) return;
      held=true; btn.classList.add('is-held');
      try{btn.setPointerCapture(e.pointerId)}catch{}
      fire(code,'keydown',false);
      if (repeatable){
        timer=setTimeout(() => {
          if (!held) return;
          repeater=setInterval(() => { if (held) fire(code,'keydown',true); }, 75);
        }, 260);
      }
    });
    btn.addEventListener('pointerup', e => {e.preventDefault(); stop();});
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('lostpointercapture', stop);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
})();
</script>
