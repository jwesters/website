function startMatch(){const n=Number(playerCountEl.value), players=[];for(let i=0;i<n;i++){const isCpu=document.getElementById('pcpu'+i).value==='yes';const name=(document.getElementById('pname'+i).value.trim()||(isCpu?CPU_NAMES[i]:PLAYER_NAMES[i]));players.push({name,isCpu,color:PLAYER_COLORS[i],scores:[],total:0})}match={players,holeIndexes:shuffle([...Array(HOLES.length).keys()]).slice(0,Number(holeCountEl.value)),holeNo:0,turnOrder:players.map((_,i)=>i)};screenEl.style.display='none';gameEl.style.display='grid';resize();loadHole(0);requestAnimationFrame(loop)}
startBtn.onclick=startMatch;
function resize(){const wrap=document.getElementById('stageWrap'),dpr=Math.max(1,Math.min(devicePixelRatio||1,2));canvas.width=Math.floor(wrap.clientWidth*dpr);canvas.height=Math.floor(wrap.clientHeight*dpr);canvas.style.width=wrap.clientWidth+'px';canvas.style.height=wrap.clientHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);fitCourse()} window.addEventListener('resize',resize);
function fitCourse(){const w=canvas.clientWidth,h=canvas.clientHeight;tile=Math.floor(Math.min((w-36)/GRID_W,(h-36)/GRID_H));tile=Math.max(11,Math.min(tile,28));offX=Math.round((w-GRID_W*tile)/2);offY=Math.round((h-GRID_H*tile)/2)}
function tx(x){return offX+x*tile} function ty(y){return offY+y*tile}
function prepHole(){if(currentHole.cellSet)return;currentHole.cellSet=new Set(currentHole.cells.map(c=>c[0]+','+c[1]))}
function loadHole(hno){match.holeNo=hno;currentHole=HOLES[match.holeIndexes[hno]];currentHole.cellSet=null;balls=match.players.map((p,i)=>({x:currentHole.tee.x+(i%2)*0.3-0.15,y:currentHole.tee.y+Math.floor(i/2)*0.3-0.15,vx:0,vy:0,r:.31,color:p.color,player:i,done:false,teed:false,air:0,airMax:0,rampCooldown:0,strokeCount:0,lastTouchedBy:null}));currentPlayerIndex=match.turnOrder[0];state='aim';aim=null;aimShot=null;power=.18;powerDir=1;powerFill.style.width='0%';waterPenaltyLedger.clear();updateHUD();if(match.players[currentPlayerIndex].isCpu)scheduleCpu()}
function updateHUD(){const p=match.players[currentPlayerIndex],b=balls[currentPlayerIndex];matchInfo.textContent=`Hole ${match.holeNo+1} of ${match.holeIndexes.length} • ${currentHole.name}`;turnInfo.innerHTML=`<span class="colorDot" style="background:${p.color}"></span>${p.name}'s turn ${p.isCpu?'(CPU)':''}`;scoreboard.innerHTML='';match.players.forEach((p,i)=>{const pill=document.createElement('div');pill.className='scorePill'+(i===currentPlayerIndex?' active':'');pill.innerHTML=`<span class="colorDot" style="background:${p.color};width:14px;height:14px"></span>${p.name}: ${p.total}${balls[i]?.done?' ✓':(!balls[i]?.teed?' · hidden':'')}`;scoreboard.appendChild(pill)});if(messageTimer<=0){if(p.isCpu)hint.textContent='CPU is lining up the shot...';else if(state==='power')hint.textContent='Power meter is moving — click/tap again or press Space/Enter to hit.';else hint.textContent=!b.teed?'Drag from the tee to aim. Release to set direction, then click/tap to choose power.':'Drag from your ball to aim. Release to set direction, then click/tap to choose power.'}}
function cellInCourse(gx,gy){return currentHole.cellSet.has(Math.floor(gx)+','+Math.floor(gy))}
function hazardAt(ball,type){return currentHole.hazards.find(h=>h.type===type&&ball.x>=h.x&&ball.x<=h.x+h.w&&ball.y>=h.y&&ball.y<=h.y+h.h)}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){prepHole();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.fillStyle='#153118';ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);for(const c of currentHole.cells){const x=tx(c[0]),y=ty(c[1]),g=ctx.createLinearGradient(x,y,x+tile,y+tile);g.addColorStop(0,'#baf075');g.addColorStop(1,'#66ad3e');ctx.fillStyle=g;ctx.fillRect(x,y,tile,tile)}ctx.strokeStyle='#7b4a1f';ctx.lineWidth=Math.max(3,tile*.18);ctx.lineCap='round';for(const [cx,cy] of currentHole.cells){const key=(x,y)=>currentHole.cellSet.has(x+','+y),x=tx(cx),y=ty(cy);ctx.beginPath();if(!key(cx,cy-1)){ctx.moveTo(x,y);ctx.lineTo(x+tile,y)}if(!key(cx+1,cy)){ctx.moveTo(x+tile,y);ctx.lineTo(x+tile,y+tile)}if(!key(cx,cy+1)){ctx.moveTo(x+tile,y+tile);ctx.lineTo(x,y+tile)}if(!key(cx-1,cy)){ctx.moveTo(x,y+tile);ctx.lineTo(x,y)}ctx.stroke()}for(const h of currentHole.hazards){const x=tx(h.x),y=ty(h.y),w=h.w*tile,hh=h.h*tile;if(h.type==='sand'){ctx.fillStyle='#f0d57a';rounded(x,y,w,hh,8);ctx.fill();ctx.strokeStyle='#7a541e';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(88,58,18,.35)';for(let i=0;i<18;i++){const sx=x+6+((i*17)%Math.max(8,w-12)),sy=y+6+((i*11)%Math.max(8,hh-12));ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill()}}else if(h.type==='water'){ctx.fillStyle='#2abaff';rounded(x,y,w,hh,8);ctx.fill();ctx.strokeStyle='#d7f8ff';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.35)';for(let yy=y+8;yy<y+hh-4;yy+=12){ctx.beginPath();ctx.moveTo(x+6,yy);ctx.quadraticCurveTo(x+w/2,yy+6,x+w-6,yy);ctx.stroke()}}else if(h.type==='ramp'){ctx.fillStyle='#8b4f24';rounded(x,y,w,hh,6);ctx.fill();ctx.strokeStyle='#2f190c';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(x+w/2,y+hh/2);ctx.rotate(h.dir||0);ctx.fillStyle='#fff1b8';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-8,-8);ctx.lineTo(-8,8);ctx.closePath();ctx.fill();ctx.restore()}}ctx.fillStyle='#050505';ctx.beginPath();ctx.arc(tx(currentHole.cup.x),ty(currentHole.cup.y),tile*.34,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();if(aim&&(state==='aim'||state==='power')&&!match.players[currentPlayerIndex].isCpu){const b=balls[currentPlayerIndex];ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=4;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(tx(b.x),ty(b.y));ctx.lineTo(aim.x,aim.y);ctx.stroke();ctx.setLineDash([])}for(const b of balls){if(b.done)continue;if(!b.teed&&!(b.player===currentPlayerIndex&&state==='aim'))continue;ctx.save();if(!b.teed){ctx.globalAlpha=.7}if(b.air>0){ctx.globalAlpha=.45;ctx.fillStyle='black';ctx.beginPath();ctx.ellipse(tx(b.x)+4,ty(b.y)+8,tile*b.r*1.05,tile*b.r*.55,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(tx(b.x),ty(b.y)-(b.air>0?Math.sin((b.air/b.airMax)*Math.PI)*18:0),tile*b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
function shootPlayer(i,vx,vy){const b=balls[i];if(b.done||(state!=='aim'&&state!=='power'))return;b.teed=true;b.vx=vx;b.vy=vy;b.strokeCount++;match.players[i].total++;b.lastTouchedBy=i;waterPenaltyLedger.clear();state='rolling';aim=null;aimShot=null;powerFill.style.width='0%';updateHUD()}
function resetBallToTee(b){b.x=currentHole.tee.x+(b.player%2)*0.3-0.15;b.y=currentHole.tee.y+Math.floor(b.player/2)*0.3-0.15;b.vx=0;b.vy=0;b.air=0;b.lastTouchedBy=null;b.teed=true}
function allStopped(){return balls.every(b=>b.done||Math.hypot(b.vx,b.vy)<.025)}
function step(){prepHole();for(const b of balls){if(b.done||!b.teed)continue;if(b.rampCooldown>0)b.rampCooldown--;b.x+=b.vx;b.y+=b.vy;if(b.air>0)b.air=Math.max(0,b.air-Math.hypot(b.vx,b.vy)*1.8-.6);const ramp=hazardAt(b,'ramp');if(ramp&&b.rampCooldown<=0&&Math.hypot(b.vx,b.vy)>.18){const dir=ramp.dir||0,dot=(b.vx*Math.cos(dir)+b.vy*Math.sin(dir))/(Math.hypot(b.vx,b.vy)||1);if(dot>.1){b.air=36;b.airMax=36;b.rampCooldown=30;b.vx+=Math.cos(dir)*.08;b.vy+=Math.sin(dir)*.08}}const water=hazardAt(b,'water')&&b.air<=0;if(water){const hitter=b.lastTouchedBy;if(hitter!==null&&hitter!==b.player){const key=hitter+'-'+b.player+'-'+match.holeNo+'-'+Date.now();match.players[hitter].total++;flash(`${match.players[hitter].name} knocked ${match.players[b.player].name} into water: +1 penalty`)}resetBallToTee(b);continue}const fr=hazardAt(b,'sand')&&b.air<=0?.955:.985;b.vx*=fr;b.vy*=fr;if(!cellInCourse(b.x,b.y)){b.x-=b.vx;b.y-=b.vy;b.vx*=-.55;b.vy*=-.55}const dist=Math.hypot(b.x-currentHole.cup.x,b.y-currentHole.cup.y);if(dist<.48&&Math.hypot(b.vx,b.vy)<.28){b.done=true;b.vx=b.vy=0;flash(`${match.players[b.player].name} is in!`)}if(Math.hypot(b.vx,b.vy)<.018){b.vx=0;b.vy=0}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],b=balls[j];if(a.done||b.done||!a.teed||!b.teed)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;if(d<min){const nx=dx/d,ny=dy/d,overlap=min-d;a.x-=nx*overlap/2;a.y-=ny*overlap/2;b.x+=nx*overlap/2;b.y+=ny*overlap/2;const av=a.vx*nx+a.vy*ny,bv=b.vx*nx+b.vy*ny,impulse=(av-bv)*.86;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;const active=currentPlayerIndex;if(i===active)b.lastTouchedBy=active;if(j===active)a.lastTouchedBy=active}}if(state==='rolling')powerFill.style.width='0%'}
function nextTurn(){if(balls.every(b=>b.done||b.strokeCount>=MAX_STROKES)){finishHole();return}const order=match.turnOrder;let idx=order.indexOf(currentPlayerIndex);for(let k=1;k<=order.length;k++){const next=order[(idx+k)%order.length];if(!balls[next].done&&balls[next].strokeCount<MAX_STROKES){currentPlayerIndex=next;break}}state='aim';updateHUD();if(match.players[currentPlayerIndex].isCpu)scheduleCpu()}
function finishHole(){match.players.forEach((p,i)=>{p.scores[match.holeNo]=(balls[i].strokeCount>=MAX_STROKES&&!balls[i].done)?MAX_STROKES:balls[i].strokeCount});match.turnOrder=match.players.map((p,i)=>i).sort((a,b)=>match.players[a].scores[match.holeNo]-match.players[b].scores[match.holeNo]||match.players[a].total-match.players[b].total||a-b);showHoleResults(match.holeNo>=match.holeIndexes.length-1)}
function showHoleResults(final){const rows=match.players.map((p,i)=>`<tr><td><span class="colorDot" style="background:${p.color};width:14px;height:14px"></span>${p.name}</td><td>${p.scores[match.holeNo]}</td><td>${p.total}</td></tr>`).join('');let title=final?'Match Complete':'Hole Complete';if(final){const best=Math.min(...match.players.map(p=>p.total));const winners=match.players.filter(p=>p.total===best).map(p=>p.name).join(', ');title=`${winners} win${winners.includes(',')?'':'s'}!`}modalCard.innerHTML=`<h2>${title}</h2><table><tr><th>Player</th><th>This Hole</th><th>Total</th></tr>${rows}</table><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">${final?'<button id="newMatchBtn">New Match</button>':'<button id="nextHoleBtn">Next Hole</button>'}<button class="secondary" id="scoreCloseBtn">Close</button></div>`;modal.classList.add('show');document.getElementById('scoreCloseBtn').onclick=()=>modal.classList.remove('show');if(final)document.getElementById('newMatchBtn').onclick=()=>location.reload();else document.getElementById('nextHoleBtn').onclick=()=>{modal.classList.remove('show');loadHole(match.holeNo+1)}}
function showScorecard(){const header='<tr><th>Player</th>'+match.holeIndexes.map((_,i)=>`<th>H${i+1}</th>`).join('')+'<th>Total</th></tr>';const rows=match.players.map((p,i)=>`<tr><td><span class="colorDot" style="background:${p.color};width:14px;height:14px"></span>${p.name}</td>${match.holeIndexes.map((_,h)=>`<td>${p.scores[h]??''}</td>`).join('')}<td>${p.total}</td></tr>`).join('');modalCard.innerHTML=`<h2>Scorecard</h2><table>${header}${rows}</table><div style="margin-top:14px"><button id="closeScore">Close</button></div>`;modal.classList.add('show');document.getElementById('closeScore').onclick=()=>modal.classList.remove('show')}
function flash(msg){hint.textContent=msg;messageTimer=110}
function beginPowerSelect(dx,dy){const len=Math.hypot(dx,dy);if(len<8){aim=null;aimShot=null;return}aimShot={dx,dy};state='power';power=.18;powerDir=1;powerFill.style.width=Math.round(power*100)+'%';updateHUD()}
function firePowerShot(){if(state!=='power'||!aimShot)return;const dx=aimShot.dx,dy=aimShot.dy;shootPlayer(currentPlayerIndex,(dx/tile)*0.122*power*2.15,(dy/tile)*0.122*power*2.15)}
canvas.addEventListener('pointerdown',e=>{if(state==='power'&&!match.players[currentPlayerIndex].isCpu){firePowerShot();return}if(state!=='aim'||match.players[currentPlayerIndex].isCpu)return;const b=balls[currentPlayerIndex];if(b.done)return;const rect=canvas.getBoundingClientRect();aim={x:e.clientX-rect.left,y:e.clientY-rect.top};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!aim||state!=='aim')return;const rect=canvas.getBoundingClientRect();aim={x:e.clientX-rect.left,y:e.clientY-rect.top}});
canvas.addEventListener('pointerup',e=>{if(!aim||state!=='aim')return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,b=balls[currentPlayerIndex],dx=tx(b.x)-x,dy=ty(b.y)-y;beginPowerSelect(dx,dy)});
window.addEventListener('keydown',e=>{if(state==='power'&&!match.players[currentPlayerIndex].isCpu&&(e.key===' '||e.key==='Enter')){e.preventDefault();firePowerShot()}else if(state==='power'&&e.key==='Escape'){state='aim';aim=null;aimShot=null;powerFill.style.width='0%';updateHUD()}});
function scheduleCpu(){cpuTimer=45}function cpuShoot(){const b=balls[currentPlayerIndex],cup=currentHole.cup,dx=cup.x-b.x,dy=cup.y-b.y,noise=(Math.random()-.5)*.35,ang=Math.atan2(dy,dx)+noise,dist=Math.hypot(dx,dy),power=Math.min(.62,.18+dist*.018);shootPlayer(currentPlayerIndex,Math.cos(ang)*power,Math.sin(ang)*power)}
function loop(t){const dt=Math.min(3,(t-last)/16.67||1);last=t;if(messageTimer>0){messageTimer-=dt;if(messageTimer<=0)updateHUD()}if(state==='power'){power+=powerDir*.018*dt;if(power>=1){power=1;powerDir=-1}else if(power<=.14){power=.14;powerDir=1}powerFill.style.width=Math.round(power*100)+'%'}if(cpuTimer>0&&state==='aim'){cpuTimer-=dt;if(cpuTimer<=0)cpuShoot()}if(state==='rolling'){for(let k=0;k<Math.ceil(dt);k++)step();if(allStopped())nextTurn()}draw();requestAnimationFrame(loop)}
</script>
</body>
