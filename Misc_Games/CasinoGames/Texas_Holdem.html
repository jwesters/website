'use strict';
const $=id=>document.getElementById(id), SAVE='royal-felt-v1';const ranks='23456789TJQKA',suits=['♠','♥','♦','♣'];let S=null,timer=null,session=0,options={sound:true,music:false,light:false},audio=null,musicTimer=null;
const names=['Maverick','Raven','Blaze','Willow','Ace','Duke','Nova','Sage','Clover','Jett','Echo','Roxy','River','Quinn','Scout','Vega','Milo','Skye'];const personas=['Aggressive','Cautious','Bluffer','Balanced','Calculated'];const money=n=>'$'+Math.round(n).toLocaleString();const rnd=n=>Math.floor(Math.random()*n);const sleep=ms=>new Promise(r=>setTimeout(r,ms));function randDeck(){let d=[];for(let r=2;r<=14;r++)for(let s=0;s<4;s++)d.push({r,s});for(let i=d.length-1;i>0;i--){let j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}function cardHTML(c,back=false){if(back||!c)return '<div class="card back"></div>';let s=suits[c.s],v=(c.r===10?'10':ranks[c.r-2]);return `<div class="card ${c.s===1||c.s===2?'red':''}"><span class="corner">${v}${s}</span><span class="pip">${s}</span></div>`}function handValue(cards){let a=cards.slice().sort((x,y)=>y.r-x.r),best=null;for(let i=0;i<a.length-4;i++)for(let j=i+1;j<a.length-3;j++)for(let k=j+1;k<a.length-2;k++)for(let l=k+1;l<a.length-1;l++)for(let m=l+1;m<a.length;m++){let v=five([a[i],a[j],a[k],a[l],a[m]]);if(!best||compare(v,best)>0)best=v}return best}function five(c){let cnt={};for(let x of c)cnt[x.r]=(cnt[x.r]||0)+1;let uniq=Object.keys(cnt).map(Number).sort((a,b)=>b-a);let rr=c.map(x=>x.r).sort((a,b)=>b-a),flush=c.every(x=>x.s===c[0].s);let seq=[...new Set(rr)];if(seq.includes(14))seq.push(1);let straight=0;for(let i=0;i<=seq.length-5;i++)if(seq[i]-seq[i+4]===4){straight=seq[i];break}let groups=uniq.map(r=>[cnt[r],r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);let cat,k;if(flush&&straight){cat=8;k=[straight]}else if(groups[0][0]===4){cat=7;k=[groups[0][1],groups[1][1]]}else if(groups[0][0]===3&&groups[1][0]===2){cat=6;k=[groups[0][1],groups[1][1]]}else if(flush){cat=5;k=rr}else if(straight){cat=4;k=[straight]}else if(groups[0][0]===3){cat=3;k=[groups[0][1],...groups.slice(1).map(x=>x[1])]}else if(groups[0][0]===2&&groups[1][0]===2){cat=2;k=[Math.max(groups[0][1],groups[1][1]),Math.min(groups[0][1],groups[1][1]),groups[2][1]]}else if(groups[0][0]===2){cat=1;k=[groups[0][1],...groups.slice(1).map(x=>x[1])]}else{cat=0;k=rr}return [cat,...k]}
function compare(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}const descriptions=['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];function bestName(v){return descriptions[v[0]]+(v[0]===8&&v[1]===14?' (Royal)':'')}
function freshCpu(idx,startingStack=5000){let chosen=new Set((S?.players||[]).map(x=>x.name)),name=names.find(n=>!chosen.has(n))||'Guest '+(idx+1);return {id:'cpu'+Date.now()+Math.random(),name,stack:startingStack,cards:[],streetBet:0,totalBet:0,folded:false,allIn:false,acted:false,personality:personas[rnd(personas.length)],human:false}}function initial(count){let players=[{id:'human',name:'You',stack:5000,cards:[],streetBet:0,totalBet:0,folded:false,allIn:false,acted:false,human:true}];S={players,desired:count,hand:0,dealer:-1,street:'',board:[],deck:[],current:-1,currentBet:0,minRaise:50,lastFullRaise:50,finished:true,showdown:false,logs:[],history:[],stats:{hands:0,wins:0,showdowns:0,profit:0},gameOver:false};for(let i=0;i<count;i++)S.players.push(freshCpu(i));save();startHand()}
function save(){if(S)localStorage.setItem(SAVE,JSON.stringify({state:S,options}))}function load(){try{let d=JSON.parse(localStorage.getItem(SAVE));if(d&&d.state&&d.state.players?.length){S=d.state;options={...options,...d.options};return true}}catch(e){}return false}
function log(message){S.logs.unshift(message);S.logs=S.logs.slice(0,100);$('notice').textContent=message;renderLog()};function renderLog(){$('log').innerHTML=S.logs.slice(0,35).map(x=>'<div>'+esc(x)+'</div>').join('')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pos(i,n){if(n===2)return i===0?[50,83]:[50,16];let theta=Math.PI/2+2*Math.PI*i/n;return [50+40*Math.cos(theta),50+36*Math.sin(theta)]}function render(){if(!S)return;document.body.classList.toggle('light',options.light);$('community').innerHTML=S.board.map(c=>cardHTML(c)).join('');$('pot').textContent='POT '+money(S.players.reduce((a,p)=>a+p.totalBet,0));$('street').textContent=S.finished?(S.showdown?'SHOWDOWN':'HAND COMPLETE'):S.street.toUpperCase();$('seats').innerHTML=S.players.map((p,i)=>{let [x,y]=pos(i,S.players.length),visible=p.human||S.showdown&&!p.folded;return `<div class="seat ${p.human?'human':''} ${p.folded?'folded':''} ${S.current===i&&!S.finished?'active-turn':''}" style="left:${x}%;top:${y}%"><div class="name">${p.human?'★ ':''}${esc(p.name)} ${S.dealer===i?'Ⓓ':''}</div><div class="stack">${money(p.stack)}</div><div class="tag">${p.human?'YOUR SEAT':esc(p.personality)} ${p.allIn?'• ALL IN':p.folded?'• FOLDED':''}</div><div class="mini">${p.cards.length?p.cards.map(c=>cardHTML(c,!visible)).join(''):''}</div><div class="wager">${p.streetBet?'Bet '+money(p.streetBet):''}</div></div>`}).join('');$('handNum').textContent=S.hand;$('myStack').textContent=money(S.players[0].stack);$('opponents').textContent=S.desired;$('dealer').textContent=S.players[S.dealer]?.name||'—';let turn=!S.finished&&S.current===0&&!S.players[0].folded&&!S.players[0].allIn,p=S.players[0],toCall=Math.max(0,S.currentBet-p.streetBet),max=p.streetBet+p.stack,min=Math.min(max,S.currentBet+S.minRaise),canRaise=max>S.currentBet&&p.stack>toCall;let slider=$('raiseSlider');if(!turn||!canRaise){slider.min=0;slider.max=1;slider.value=0;slider.disabled=true;$('raiseLabel').textContent='—';$('raiseAmount').disabled=true;$('raiseAmount').value=''}else{let prev=Number(slider.value);slider.min=min;slider.max=max;slider.step=1;slider.value=prev>=min&&prev<=max?prev:min;slider.disabled=false;$('raiseLabel').textContent=money(slider.value);$('raiseAmount').disabled=false;$('raiseAmount').min=min;$('raiseAmount').max=max;$('raiseAmount').value=slider.value}$('foldBtn').disabled=!turn;$('checkBtn').disabled=!turn||toCall>0;$('callBtn').disabled=!turn||toCall===0;$('callBtn').textContent=toCall?'Call '+money(Math.min(toCall,p.stack)):'Call';$('raiseBtn').disabled=!turn||!canRaise;$('allBtn').disabled=!turn||p.stack===0;$('nextBtn').classList.toggle('hidden',!S.finished||S.gameOver);$('betHelp').textContent=turn?`To call: ${money(Math.min(toCall,p.stack))} · Minimum raise total: ${canRaise?money(min):'unavailable'} · Your chips: ${money(p.stack)}`:S.finished?'Hand finished — choose Next Hand.':'Computer players are thinking…';renderLog()}
function spend(p,amount){let x=Math.min(Math.max(0,amount),p.stack);p.stack-=x;p.streetBet+=x;p.totalBet+=x;if(!p.stack)p.allIn=true;return x}function nextEligible(from){let n=S.players.length;for(let k=1;k<=n;k++){let i=(from+k)%n,p=S.players[i];if(!p.folded&&!p.allIn&&p.stack>0)return i}return -1}function live(){return S.players.filter(p=>!p.folded)}function contenders(){return S.players.filter(p=>!p.folded&&!p.allIn)}function startHand(){if(!S||S.gameOver)return;session++;clearTimeout(timer);S.players=S.players.filter(p=>p.human||p.stack>0);if(S.players[0].stack===0){gameOver();return}const rankedStacks=S.players.map(p=>p.stack).sort((a,b)=>b-a);const replacementStack=rankedStacks[1]??rankedStacks[0]??5000;while(S.players.length<S.desired+1){let p=freshCpu(S.players.length,replacementStack);S.players.push(p);log(p.name+' joins the table with '+money(replacementStack)+' (second-place stack).')}S.hand++;S.stats.hands++;S.dealer=(S.dealer+1)%S.players.length;S.deck=randDeck();S.board=[];S.street='Pre-flop';S.finished=false;S.showdown=false;S.currentBet=0;S.minRaise=50;S.lastFullRaise=50;for(let p of S.players){p.cards=[S.deck.pop(),S.deck.pop()];p.streetBet=0;p.totalBet=0;p.folded=false;p.allIn=false;p.acted=false}let n=S.players.length,sb=n===2?S.dealer:(S.dealer+1)%n,bb=(sb+1)%n;spend(S.players[sb],25);spend(S.players[bb],50);S.currentBet=S.players[bb].streetBet;S.current=n===2?S.dealer:(bb+1)%n;log(`Hand #${S.hand} — ${S.players[sb].name} posts $25, ${S.players[bb].name} posts $50.`);sound('deal');render();runTurn()}
function runTurn(){if(S.finished)return;if(live().length===1){finishHand();return}let pending=S.players.some(p=>!p.folded&&!p.allIn&&(!p.acted||p.streetBet<S.currentBet));if(!pending){advanceStreet();return}let p=S.players[S.current];if(!p||p.folded||p.allIn||(p.acted&&p.streetBet>=S.currentBet)){S.current=nextEligible(S.current);if(S.current<0)advanceStreet();else runTurn();return}render();if(!p.human){let id=session;timer=setTimeout(()=>{if(id===session)cpuAct(S.current)},550+Math.random()*650)}}
function action(index,kind,total=0){if(S.finished||index!==S.current)return;let p=S.players[index],toCall=Math.max(0,S.currentBet-p.streetBet),prior=S.currentBet,delta=0,txt='';if(kind==='fold'){p.folded=true;txt='folds'}else if(kind==='check'&&toCall===0){txt='checks'}else if(kind==='call'){delta=spend(p,toCall);txt=delta<toCall?'calls all-in '+money(delta):'calls '+money(delta)}else if(kind==='raise'||kind==='all'){let target=kind==='all'?p.streetBet+p.stack:Math.round(total);target=Math.min(target,p.streetBet+p.stack);if(target<=S.currentBet&&target<p.streetBet+p.stack){return}let added=spend(p,target-p.streetBet);if(p.streetBet>prior){let size=p.streetBet-prior;S.currentBet=p.streetBet;if(size>=S.minRaise){S.lastFullRaise=size;S.minRaise=size;for(let q of S.players)if(q!==p&&!q.folded&&!q.allIn)q.acted=false}txt=(p.allIn?'moves all-in to ':'raises to ')+money(p.streetBet)}else txt='calls all-in '+money(added)}else return;p.acted=true;log(`${p.name} ${txt}.`);sound(kind==='fold'?'fold':'chip');S.current=nextEligible(index);save();render();timer=setTimeout(runTurn,200)}
function advanceStreet(){if(live().length===1){finishHand();return}if(S.board.length===5){finishHand();return}for(let p of S.players){p.streetBet=0;p.acted=false}S.currentBet=0;S.minRaise=50;S.lastFullRaise=50;S.deck.pop();if(S.board.length===0){S.board.push(S.deck.pop(),S.deck.pop(),S.deck.pop());S.street='Flop'}else if(S.board.length===3){S.board.push(S.deck.pop());S.street='Turn'}else{S.board.push(S.deck.pop());S.street='River'}log('The '+S.street.toLowerCase()+' is dealt.');sound('deal');S.current=nextEligible(S.dealer);render();if(contenders().length<=1){timer=setTimeout(()=>advanceStreet(),950)}else timer=setTimeout(runTurn,500)}
function finishHand(){if(S.finished)return;S.finished=true;session++;clearTimeout(timer);let left=live(),pot=S.players.reduce((sum,p)=>sum+p.totalBet,0),winners=new Map();S.showdown=left.length>1;if(S.showdown)S.stats.showdowns++;let levels=[...new Set(S.players.map(p=>p.totalBet).filter(Boolean))].sort((a,b)=>a-b),prev=0;for(let level of levels){let eligible=S.players.filter(p=>!p.folded&&p.totalBet>=level),contributors=S.players.filter(p=>p.totalBet>=level),amount=(level-prev)*contributors.length;prev=level;if(!amount)continue;if(!eligible.length){ // uncalled excess is returned to its contributor
let owner=contributors[0];owner.stack+=amount;continue}let best=null,win=[];for(let p of eligible){let v=eligible.length===1?[0]:handValue([...p.cards,...S.board]);if(!best||compare(v,best)>0){best=v;win=[p]}else if(compare(v,best)===0)win.push(p)}let share=Math.floor(amount/win.length),rem=amount%win.length;for(let p of win){p.stack+=share;winners.set(p,(winners.get(p)||0)+share)}let ordered=[...win].sort((a,b)=>(S.players.indexOf(a)-S.dealer+S.players.length)%S.players.length-(S.players.indexOf(b)-S.dealer+S.players.length)%S.players.length);for(let i=0;i<rem;i++){ordered[i].stack++;winners.set(ordered[i],(winners.get(ordered[i])||0)+1)}}if(winners.has(S.players[0]))S.stats.wins++;let winnerText=[...winners].map(([p,x])=>`${p.name} wins ${money(x)}${S.showdown?' ('+bestName(handValue([...p.cards,...S.board]))+')':''}`).join(' · ');log(winnerText||'Hand ends.');S.history.unshift({hand:S.hand,pot,board:S.board.map(c=>(c.r===10?'10':ranks[c.r-2])+suits[c.s]).join(' '),result:winnerText,playerCards:S.players[0].cards.map(c=>(c.r===10?'10':ranks[c.r-2])+suits[c.s]).join(' ')});S.history=S.history.slice(0,50);for(let p of S.players)if(!p.human&&p.stack===0)log(`${p.name} is eliminated; a new player will join next hand.`);if(S.players[0].stack===0){S.gameOver=true;log('You are out of chips. Game over!')}save();render();if(S.gameOver)setTimeout(gameOver,800)}
// CPU strategy: approximate pre-flop strength plus made-hand category and draws; personalities alter betting thresholds.
function cpuAct(i){let p=S.players[i];if(S.finished||!p||p.human)return;let toCall=Math.max(0,S.currentBet-p.streetBet),pot=S.players.reduce((a,q)=>a+q.totalBet,0),strength=estimate(p),price=toCall/Math.max(1,pot+toCall),style=p.personality,aggr=style==='Aggressive'?.17:style==='Bluffer'?.11:style==='Cautious'?-.17:style==='Calculated'?-.04:0,noise=(Math.random()-.5)*.20,effective=strength+aggr+noise,bluff=(style==='Bluffer'?.17:style==='Aggressive'?.08:.025)>Math.random(),canRaise=p.stack>toCall&&p.streetBet+p.stack>S.currentBet;let kind='call',target=0;if(toCall&&effective<price+.14&&!bluff)kind='fold';else if(toCall===0)kind='check';if(canRaise&&(effective>.70||bluff&&toCall<pot*.35)){let increment=Math.max(50,Math.round((pot*(.35+Math.random()*.5))/25)*25);target=Math.min(p.streetBet+p.stack,S.currentBet+Math.max(S.minRaise,increment));if(target>S.currentBet)kind='raise'}if(kind==='call'&&toCall===0)kind='check';if(kind==='raise'&&target<=S.currentBet)kind=toCall?'call':'check';action(i,kind,target)}function estimate(p){let cards=p.cards;if(S.board.length===0){let [a,b]=cards,hi=Math.max(a.r,b.r),lo=Math.min(a.r,b.r),pair=a.r===b.r,suited=a.s===b.s,gap=hi-lo;return Math.min(.95,.17+hi/22+(pair?.20+hi/35:0)+(suited?.07:0)+(gap<=2?.06:0)-(gap>=5?.07:0))}let v=handValue([...cards,...S.board]),base=[.20,.44,.63,.79,.87,.91,.96,.985,.999][v[0]];let suitCounts=[0,0,0,0],rankSet=new Set;for(let c of [...cards,...S.board]){suitCounts[c.s]++;rankSet.add(c.r)}let draw=S.board.length<5?(Math.max(...suitCounts)===4?.12:0):0;return Math.min(.999,base+draw+v[1]/100+(Math.random()-.5)*.08)}
function gameOver(){S.gameOver=true;save();showModal(`<h1>Game Over</h1><p>You have run out of chips after ${S.hand} hands.</p><p>Hands won: <b>${S.stats.wins}</b></p><button class="primary" id="restart">Start New Game</button>`);$('restart').onclick=setup}
function showModal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}function closeModal(){$('overlay').classList.add('hidden')}function setup(){clearTimeout(timer);session++;showModal(`<h1>♠ Royal Felt</h1><p>Welcome to your private Texas Hold'em table. Each player starts with $5,000. Blinds stay fixed at $25/$50. When a CPU busts, a fresh opponent joins next hand with the same chips as the player in second place among the remaining players.</p><label for="cpuCount">Computer opponents</label><select id="cpuCount">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===(S?.desired||3)?'selected':''}>${n} CPU${n>1?'s':''}</option>`).join('')}</select><p class="small">Play-money chips only · No real-money wagering</p><button class="primary" id="startBtn">Deal Me In →</button> ${S&&!S.gameOver?'<button id="resumeBtn">Resume Saved Game</button>':''}<p class="small">Starting a new game replaces current saved progress.</p>`);$('startBtn').onclick=()=>{let n=+$('cpuCount').value;closeModal();initial(n)};if($('resumeBtn'))$('resumeBtn').onclick=()=>{closeModal();render();if(!S.finished)runTurn()}}
function rules(){showModal(`<h1>How to Play</h1><p><b>Goal:</b> Win chips by making the strongest five-card poker hand from your two private cards and five shared community cards, or by making everyone else fold.</p><ol><li><b>Pre-flop:</b> Everyone gets two cards; small blind $25 and big blind $50.</li><li><b>Flop:</b> Three community cards appear.</li><li><b>Turn:</b> A fourth community card appears.</li><li><b>River:</b> The fifth community card appears.</li><li><b>Showdown:</b> Remaining players reveal cards. Best five-card hand wins.</li></ol><p><b>Actions:</b> Fold (quit hand), Check (pass when no bet to call), Call (match wager), Raise (increase wager), All-In (commit your entire stack). Side pots are handled automatically.</p><p><b>Hand rankings:</b> Straight Flush → Four of a Kind → Full House → Flush → Straight → Three of a Kind → Two Pair → One Pair → High Card.</p><p>Dealer moves each hand. CPUs have different betting styles and are replaced if eliminated. Your progress is saved in this browser.</p><button class="primary" id="closeRules">Back to Table</button>`);$('closeRules').onclick=closeModal}
function history(tab='hands'){
 showModal(`<h1>Hands / Stats</h1><div class="modal-tabs" role="tablist"><button id="handsTab" class="${tab==='hands'?'selected':''}" role="tab" aria-selected="${tab==='hands'}">Hands</button><button id="statsTab" class="${tab==='stats'?'selected':''}" role="tab" aria-selected="${tab==='stats'}">Stats</button></div><div id="handsStatsContent"></div><button class="primary" id="closeHist" style="margin-top:16px">Back to Table</button>`);
 $('handsTab').onclick=()=>history('hands');$('statsTab').onclick=()=>history('stats');$('closeHist').onclick=closeModal;
 if(tab==='hands')$('handsStatsContent').innerHTML=`<div class="history-list">${S?.history?.length?S.history.map(h=>`<p><b>#${h.hand} — Pot ${money(h.pot)}</b><br>Your cards: ${esc(h.playerCards)}<br>Board: ${esc(h.board||'Not shown')}<br>${esc(h.result)}</p>`).join('<hr>'):'<p>No completed hands yet.</p>'}</div>`;
 else $('handsStatsContent').innerHTML=`<div class="stats-list">${[['Hands played',S?.stats?.hands||0],['Hands won',S?.stats?.wins||0],['Showdowns',S?.stats?.showdowns||0],['Net result',money((S?.players?.[0]?.stack||0)-5000)]].map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}</div>`;
}
function settings(){
 showModal(`<h1>⚙ Settings</h1><div class="settings-row"><div><b>Appearance</b><span>Choose your table interface theme</span></div><div class="toggle-choice"><button id="darkMode" class="${!options.light?'selected':''}">Dark</button><button id="lightMode" class="${options.light?'selected':''}">Light</button></div></div><div class="settings-row"><div><b>Sound effects</b><span>Cards, chips, and actions</span></div><button id="soundToggle" class="toggle-choice ${options.sound?'selected':''}">${options.sound?'On':'Off'}</button></div><div class="settings-row"><div><b>Background music</b><span>Optional casino ambience</span></div><button id="musicToggle" class="toggle-choice ${options.music?'selected':''}">${options.music?'On':'Off'}</button></div><button class="primary" id="closeSettings" style="margin-top:18px">Back to Table</button>`);
 $('darkMode').onclick=()=>{options.light=false;save();render();settings()};$('lightMode').onclick=()=>{options.light=true;save();render();settings()};$('soundToggle').onclick=()=>{options.sound=!options.sound;save();settings()};$('musicToggle').onclick=()=>{toggleMusic();settings()};$('closeSettings').onclick=closeModal;
}
function sound(type){if(!options.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type==='deal'?'triangle':'sine';o.frequency.setValueAtTime(type==='deal'?650:type==='fold'?210:390,t);o.frequency.exponentialRampToValueAtTime(type==='deal'?330:150,t+.11);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.13);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.14)}catch(e){}}
function toggleMusic(){options.music=!options.music;clearInterval(musicTimer);if(options.music){let notes=[220,277,330,294,247,330,294,220],i=0;musicTimer=setInterval(()=>{if(!options.music||!options.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.012,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.61)}catch(e){}},720)}save();render()}
function setRaise(value,source){let slider=$('raiseSlider'),field=$('raiseAmount');if(slider.disabled)return;let v=Number(value);if(!Number.isFinite(v))return;v=Math.max(Number(slider.min),Math.min(Number(slider.max),Math.round(v)));slider.value=v;$('raiseLabel').textContent=money(v);if(source!=='field')field.value=v;}
$('raiseSlider').oninput=e=>setRaise(e.target.value,'slider');
$('raiseAmount').oninput=e=>{let n=Number(e.target.value);if(e.target.value!==''&&Number.isFinite(n))setRaise(n,'field')};
$('raiseAmount').onchange=e=>{let slider=$('raiseSlider');if(!slider.disabled){setRaise(e.target.value||slider.min,'slider')}};
$('foldBtn').onclick=()=>action(0,'fold');$('checkBtn').onclick=()=>action(0,'check');$('callBtn').onclick=()=>action(0,'call');$('raiseBtn').onclick=()=>{let slider=$('raiseSlider'),value=Number($('raiseAmount').value);setRaise(value,'slider');action(0,'raise',Number(slider.value))};$('allBtn').onclick=()=>action(0,'all');$('nextBtn').onclick=()=>startHand();$('newBtn').onclick=()=>setup();$('rulesBtn').onclick=rules;$('historyBtn').onclick=()=>history();$('settingsBtn').onclick=settings;
if(load()){render();setup()}else setup();
