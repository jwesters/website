<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mah Jongg</title>
<style>
  :root{
    --blue:#05038d;
    --blue2:#08099f;
    --panel:#1015a4;
    --panel2:#07077e;
    --text:#f7fbff;
    --muted:#c9ddff;
    --tile-edge:#6d8396;
    --tile-edge-dark:#2e455b;
    --tile-face:#dce9ef;
    --tile-face-hi:#f9fdff;
    --tile-face-low:#aabdc8;
    --gold:#ffdf31;
    --green:#43ff6c;
    --red:#ff3b4d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:radial-gradient(circle at center,#1011ae 0,#05038d 58%,#01015e 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;padding:10px;}
  #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #shell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:min(100%,980px);}
  #toolbar{
    display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
    padding:8px 10px;border:1px solid rgba(255,255,255,.23);border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    box-shadow:0 18px 36px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16);
    backdrop-filter:blur(6px);
  }
  button{font:800 14px/1 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#2440dc,#0d168e);border:1px solid rgba(255,255,255,.34);border-radius:11px;box-shadow:0 4px 0 #010044,0 12px 18px rgba(0,0,0,.22);padding:9px 13px;min-height:36px;cursor:pointer;transition:transform .08s ease,box-shadow .08s ease,background .12s ease;}
  button:hover{background:linear-gradient(180deg,#3153ff,#111aa5)}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #010044,0 8px 14px rgba(0,0,0,.2)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 #010044,0 12px 18px rgba(0,0,0,.22)}
  select{font:800 14px/1 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#fff;background:linear-gradient(180deg,#2440dc,#0d168e);border:1px solid rgba(255,255,255,.34);border-radius:11px;box-shadow:0 4px 0 #010044,0 12px 18px rgba(0,0,0,.22);padding:9px 13px;min-height:36px;cursor:pointer;outline:none;}
  select:hover{background:linear-gradient(180deg,#3153ff,#111aa5)}
  select option{color:#111;background:#edf3ff}
  #stageWrap{position:relative;margin:0 auto;width:820px;height:446px;flex:0 0 auto;}
  #stage{position:absolute;left:0;top:0;width:820px;height:446px;background:#05038d;overflow:hidden;transform-origin:top left;border-radius:8px;box-shadow:0 22px 60px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.08);}
  #board{position:absolute;left:92px;top:0;width:637px;height:446px;}
  .stat{position:absolute;z-index:200000;font-weight:900;font-size:16px;line-height:1.05;text-shadow:2px 2px 0 #000;white-space:pre;text-align:left;user-select:none;pointer-events:none;font-family:"Courier New",monospace;letter-spacing:-.2px;padding:9px 6px;border-radius:10px;background:rgba(0,0,95,.20);}
  #tilesStat{left:16px;top:185px;width:88px;text-align:center;}
  #tilesLeft{display:block;margin-left:0;margin-top:8px;}
  #timeStat{left:735px;top:302px;width:70px;text-align:center;}
  #timer{display:block;margin-top:3px;}

  .tile{position:absolute;width:45px;height:57px;border:0;padding:0;margin:0;background:transparent;box-shadow:none;min-height:0;display:block;touch-action:manipulation;transition:opacity .16s ease, transform .12s ease;}
  .tileBody{position:absolute;inset:0;display:block;}
  .tileBody::before{content:"";position:absolute;left:0;top:6px;width:39px;height:51px;border-radius:6px;background:linear-gradient(135deg,#8299ab,#5e768a);border:2px solid var(--tile-edge-dark);box-shadow:inset 2px 2px 0 rgba(255,255,255,.24),inset -3px -3px 0 rgba(0,0,0,.2);}
  .face{position:absolute;left:5px;top:0;width:39px;height:52px;border-radius:6px;border:2px solid #24394b;background:linear-gradient(135deg,#f9fdff 0%,#dce9ef 50%,#aabdc8 100%);box-shadow:inset 2px 2px 0 rgba(255,255,255,.92),inset -4px -4px 0 rgba(86,116,137,.35),0 2px 0 rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .iconImg{width:31px;height:44px;display:block;object-fit:contain;image-rendering:auto;user-select:none;pointer-events:none;}
  .face::after{content:"";position:absolute;inset:4px;border-radius:4px;border:1px solid rgba(43,64,82,.18);pointer-events:none;}
  .free{cursor:pointer;}
  .blocked{cursor:not-allowed;}
  .blocked .face{opacity:.72;}
  .free:hover .face{box-shadow:inset 2px 2px 0 rgba(255,255,255,.92),inset -4px -4px 0 rgba(86,116,137,.35),0 0 0 2px rgba(255,255,255,.30),0 5px 10px rgba(0,0,0,.22);}
  .selected .face{box-shadow:inset 2px 2px 0 rgba(255,255,255,.92),inset -4px -4px 0 rgba(86,116,137,.35),0 0 0 3px var(--gold),0 0 16px rgba(255,223,49,.62);}
  .hint .face{box-shadow:inset 2px 2px 0 rgba(255,255,255,.92),inset -4px -4px 0 rgba(86,116,137,.35),0 0 0 3px var(--green),0 0 16px rgba(67,255,108,.65);animation:pulse .7s ease-in-out infinite alternate;}
  .bad .face{box-shadow:inset 2px 2px 0 rgba(255,255,255,.92),inset -4px -4px 0 rgba(86,116,137,.35),0 0 0 3px var(--red),0 0 16px rgba(255,59,77,.65);animation:shake .18s ease-in-out 2;}
  .removed{opacity:0;pointer-events:none;transform:translateY(5px) scale(.96);}
  @keyframes pulse{from{transform:translateY(0)}to{transform:translateY(-1px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}

  #message{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:300000;min-height:28px;max-width:560px;padding:6px 12px;border:1px solid rgba(255,255,255,.38);border-radius:10px;background:rgba(2,2,86,.92);color:#fff;font-weight:900;text-align:center;text-shadow:1px 1px 0 #000;opacity:0;pointer-events:none;transition:opacity .12s ease;box-shadow:0 8px 22px rgba(0,0,0,.28);}
  #message.show{opacity:1;}
  .shade{position:fixed;inset:0;z-index:999999;background:rgba(0,0,56,.72);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px);}
  .shade.open{display:flex;}
  .modal{width:min(520px,96vw);border:1px solid rgba(255,255,255,.32);border-radius:18px;background:linear-gradient(180deg,#1216a7,#050578);box-shadow:0 22px 70px rgba(0,0,0,.48);color:#fff;text-align:center;padding:20px;}
  .modal h2{font-size:29px;line-height:1;margin:0 0 12px;text-shadow:2px 2px 0 #000;}
  .modal p{font-size:17px;line-height:1.35;margin:8px 0 14px;}
  .scores{display:inline-block;text-align:left;font-size:16px;line-height:1.6;margin:6px auto 12px;}
  .modalBtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px;}
  @media (max-width:700px){body{padding:6px;align-items:flex-start;}#shell{gap:7px;}#toolbar{padding:7px 8px;gap:7px;}button{font-size:12px;padding:8px 10px;min-height:32px;}#stage{border-radius:6px;}}
</style>
</head>
<body>
<div id="app">
  <div id="shell">
    <div id="toolbar">
      <button id="newBtn" type="button">New Game</button>
      <button id="undoBtn" type="button">Undo</button>
      <button id="hintBtn" type="button">Hint</button>
      <button id="bestBtn" type="button">Best</button>
      <select id="layoutSelect" aria-label="Tile layout">
        <option value="turtle">Turtle</option>
        <option value="butterfly">Butterfly</option>
        <option value="castle">Castle</option>
        <option value="fish">Fish</option>
        <option value="fortress">Fortress</option>
              <option value="spider">Spider</option>
        <option value="dragon">Dragon</option>
        <option value="cross">Cross</option>
        <option value="stadium">Stadium</option>
        <option value="hourglass">Hourglass</option>
      </select>
      <button id="aboutBtn" type="button">About</button>
    </div>
    <div id="stageWrap">
      <div id="stage">
        <div id="tilesStat" class="stat">Tiles Left:<span id="tilesLeft">144</span></div>
        <div id="timeStat" class="stat">Time:<span id="timer">0:00</span></div>
        <div id="board" aria-label="Mah Jongg board"></div>
        <div id="message"></div>
      </div>
    </div>
  </div>
</div>
<div id="modalShade" class="shade" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalBtns" class="modalBtns"></div>
  </div>
</div>

        const row = (z,y,start,count) => { for(let i=0;i<count;i++) add(z, start + i*2, y); };

        // Fortress-inspired square foundation with raised keep.
        // 96 + 32 + 12 + 4 = 144.
        row(0,0,4,12);
        row(0,2,4,12);
        row(0,4,4,12);
        row(0,6,4,12);
        row(0,8,4,12);
        row(0,10,4,12);
        row(0,12,4,12);
        row(0,14,4,12);

        row(1,2,8,6);
        row(1,4,8,6);
        row(1,6,8,6);
        row(1,8,8,6);
        row(1,10,10,4);
        row(1,12,10,4);

        row(2,4,10,4);
        row(2,6,10,4);
        row(2,8,10,4);

        add(3,12,6); add(3,14,6);
        add(3,12,8); add(3,14,8);
        return pos;
      }
    },
    spider: {
      name: 'Spider',
      build(){
        const pos = [];
        let id = 0;
        const add = (z,x,y) => pos.push({id:id++, z, x, y});
        const row = (z,y,start,count) => { for(let i=0;i<count;i++) add(z, start + i*2, y); };

        // Spider-inspired: long body with side legs.
        // 88 + 36 + 16 + 4 = 144.
        row(0, 0, 8, 8);
        row(0, 2, 6,10);
        row(0, 4, 2,14);
        row(0, 6, 4,12);
        row(0, 8, 4,12);
        row(0,10, 2,14);
        row(0,12, 6,10);
        row(0,14, 8, 8);

        row(1, 2,10, 6);
        row(1, 4, 8, 8);
        row(1, 6, 8, 8);
        row(1, 8, 8, 8);
        row(1,10,10, 6);

        row(2, 4,10, 4);
        row(2, 6,10, 4);
        row(2, 8,10, 4);
        row(2,10,10, 4);

        add(3,12,6); add(3,14,6);
        add(3,12,8); add(3,14,8);
        return pos;
      }
    },
    dragon: {
      name: 'Dragon',
      build(){
        const pos = [];
        let id = 0;
        const add = (z,x,y) => pos.push({id:id++, z, x, y});
        const row = (z,y,start,count) => { for(let i=0;i<count;i++) add(z, start + i*2, y); };

        // Dragon-inspired: stepped head/tail with raised spine.
        // 88 + 36 + 16 + 4 = 144.
        row(0, 0, 2, 6);
        row(0, 2, 2,10);
        row(0, 4, 6,12);
        row(0, 6, 4,14);
        row(0, 8, 4,14);
        row(0,10, 6,12);
        row(0,12,10,10);
        row(0,14,14,10);

        row(1, 2, 8, 6);
        row(1, 4, 8, 8);
        row(1, 6,10, 8);
        row(1, 8,10, 8);
        row(1,10,12, 6);

        row(2, 4,12, 4);
        row(2, 6,12, 4);
        row(2, 8,12, 4);
        row(2,10,12, 4);

        add(3,14,6); add(3,16,6);
        add(3,14,8); add(3,16,8);
        return pos;
      }
    },
    cross: {
      name: 'Cross',
      build(){
        const pos = [];
        let id = 0;
        const add = (z,x,y) => pos.push({id:id++, z, x, y});
        const row = (z,y,start,count) => { for(let i=0;i<count;i++) add(z, start + i*2, y); };

        // Cross-inspired: broad horizontal/vertical arms.
        // 88 + 36 + 16 + 4 = 144.
        row(0, 0, 8, 8);
        row(0, 2, 8, 8);
        row(0, 4, 2,14);
        row(0, 6, 2,14);
        row(0, 8, 2,14);
        row(0,10, 2,14);
        row(0,12, 8, 8);
        row(0,14, 8, 8);

        row(1, 2,12, 4);
        row(1, 4, 8, 8);
        row(1, 6, 8, 8);
        row(1, 8, 8, 8);
        row(1,10, 8, 8);

        row(2, 4,10, 4);
        row(2, 6,10, 4);
        row(2, 8,10, 4);
        row(2,10,10, 4);

        add(3,12,6); add(3,14,6);
        add(3,12,8); add(3,14,8);
        return pos;
      }
    },
    stadium: {
      name: 'Stadium',
      build(){
        const pos = [];
        let id = 0;
        const add = (z,x,y) => pos.push({id:id++, z, x, y});
        const row = (z,y,start,count) => { for(let i=0;i<count;i++) add(z, start + i*2, y); };

        // Stadium-inspired: rounded outside and raised centre.
        // 92 + 32 + 16 + 4 = 144.
        row(0, 0, 8, 8);
        row(0, 2, 4,12);
        row(0, 4, 2,14);
        row(0, 6, 2,14);
        row(0, 8, 2,14);
        row(0,10, 4,12);
        row(0,12, 4,12);
        row(0,14, 8, 6);

        row(1, 2,10, 4);
        row(1, 4, 8, 6);
        row(1, 6, 8, 6);
        row(1, 8, 8, 6);
        row(1,10, 8, 6);
        row(1,12,10, 4);

        row(2, 4,10, 4);
        row(2, 6,10, 4);
        row(2, 8,10, 4);
        row(2,10,10, 4);

        add(3,12,6); add(3,14,6);
        add(3,12,8); add(3,14,8);
        return pos;
      }
    },
    hourglass: {
      name: 'Hourglass',
      build(){
        const pos = [];
        let id = 0;
        const add = (z,x,y) => pos.push({id:id++, z, x, y});
        const row = (z,y,start,count) => { for(let i=0;i<count;i++) add(z, start + i*2, y); };

        // Hourglass-inspired: wide ends, narrow waist.
        // 88 + 36 + 16 + 4 = 144.
        row(0, 0, 2,14);
        row(0, 2, 4,12);
        row(0, 4, 6,10);
        row(0, 6, 8, 8);
        row(0, 8, 8, 8);
        row(0,10, 6,10);
        row(0,12, 4,12);
        row(0,14, 2,14);

        row(1, 2, 6, 8);
        row(1, 4, 8, 6);
        row(1, 6,10, 4);
        row(1, 8,10, 4);
        row(1,10, 8, 6);
        row(1,12, 6, 8);

        row(2, 4,10, 4);
        row(2, 6,10, 4);
        row(2, 8,10, 4);
        row(2,10,10, 4);

        add(3,12,6); add(3,14,6);
        add(3,12,8); add(3,14,8);
        return pos;
      }
    }
  };

  function makeLayout(layoutKey=currentLayoutKey){
    const layout = LAYOUTS[layoutKey] || LAYOUTS.classic;
    const pos = layout.build();
    if(pos.length !== TOTAL_TILES) throw new Error('Layout tile count: ' + pos.length + ' for ' + layoutKey);
    pos.forEach((p, i) => p.id = i);
    return pos;
  }

  function xyFor(pos){
    return {
      left: Math.round(BASE_X + pos.x * UNIT_X + pos.z * LIFT),
      top: Math.round(BASE_Y + pos.y * UNIT_Y - pos.z * LIFT)
    };
  }

  function resizeStage(){
    const toolbarH = toolbar ? toolbar.getBoundingClientRect().height : 0;
    const maxW = Math.max(320, window.innerWidth - 16);
    const maxH = Math.max(300, window.innerHeight - toolbarH - 34);
    const scale = Math.min(maxW / DESIGN_W, maxH / DESIGN_H, 1.55);
    stage.style.transform = `scale(${scale})`;
    stageWrap.style.width = `${Math.round(DESIGN_W * scale)}px`;
    stageWrap.style.height = `${Math.round(DESIGN_H * scale)}px`;
  }

  window.addEventListener('resize', resizeStage, {passive:true});

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function rangesOverlap(a1,a2,b1,b2){ return a1 < b2 && b1 < a2; }
  function overlaps(a,b){ return a.x < b.x + 2 && b.x < a.x + 2 && a.y < b.y + 2 && b.y < a.y + 2; }

  function isFreePosition(pos, set){
    for(const oid of set){
      if(oid === pos.id) continue;
      const other = positions[oid];
      if(other.z > pos.z && overlaps(pos, other)) return false;
    }
    let leftBlocked = false;
    let rightBlocked = false;
    for(const oid of set){
      if(oid === pos.id) continue;
      const other = positions[oid];
      if(other.z !== pos.z) continue;
      if(other.x + 2 === pos.x && rangesOverlap(pos.y, pos.y + 2, other.y, other.y + 2)) leftBlocked = true;
      if(pos.x + 2 === other.x && rangesOverlap(pos.y, pos.y + 2, other.y, other.y + 2)) rightBlocked = true;
      if(leftBlocked && rightBlocked) return false;
    }
    return !leftBlocked || !rightBlocked;
  }

  function freeIdsFromSet(set){
    const ids = [];
    for(const id of set){
      if(isFreePosition(positions[id], set)) ids.push(id);
    }
    return ids;
  }

  function pairKinds(){
    const kinds = [];
    for(let k=0;k<KIND_COUNT;k++){
      for(let r=0;r<3;r++) kinds.push(k);
    }
    return shuffle(kinds);
  }

  function generateSolvableAssignment(){
    for(let attempt=0; attempt<900; attempt++){
      const set = new Set(positions.map(p => p.id));
      const assignment = new Array(positions.length);
      const kinds = pairKinds();
      let ok = true;
      for(const kind of kinds){
        const free = freeIdsFromSet(set);
        if(free.length < 2){ ok = false; break; }
        const ai = Math.floor(Math.random() * free.length);
        const a = free[ai];
        free.splice(ai, 1);
        const b = free[Math.floor(Math.random() * free.length)];
        assignment[a] = kind;
        assignment[b] = kind;
        set.delete(a);
        set.delete(b);
      }
      if(ok && set.size === 0 && assignment.every(v => Number.isInteger(v))) return assignment;
    }
    throw new Error('Could not make a solvable board.');
  }

  function formatTime(total){
    const m = Math.floor(total / 60);
    const s = total % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function startTimer(){
    stopTimer();
    timerHandle = setInterval(() => {
      elapsed++;
      timerEl.textContent = formatTime(elapsed);
    }, 1000);
  }
  function stopTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle = null; } }

  function clearHints(){ tiles.forEach(t => t.el && t.el.classList.remove('hint','bad')); }
  function clearSelection(){
    if(selectedId !== null && tiles[selectedId]) tiles[selectedId].el.classList.remove('selected');
    selectedId = null;
  }
  function isFree(tile){ return tile.active && isFreePosition(positions[tile.id], activeIds); }

  function drawAllFreeStates(){
    for(const tile of tiles){
      if(!tile.active){ tile.el.classList.remove('free','blocked'); continue; }
      const free = isFree(tile);
      tile.el.classList.toggle('free', free);
      tile.el.classList.toggle('blocked', !free);
      tile.el.disabled = false;
      tile.el.setAttribute('aria-disabled', free ? 'false' : 'true');
    }
  }

  function setMessage(text, ms=1600){
    clearTimeout(messageTimer);
    messageEl.textContent = text;
    messageEl.classList.add('show');
    messageTimer = setTimeout(() => messageEl.classList.remove('show'), ms);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
  }

  function scoreKey(layoutKey=currentLayoutKey){
    return STORE_KEY_PREFIX + layoutKey;
  }

  function loadScores(layoutKey=currentLayoutKey){
    try{
      const raw = localStorage.getItem(scoreKey(layoutKey));
      const scores = raw ? JSON.parse(raw) : [];
      return Array.isArray(scores) ? scores.filter(s => Number.isFinite(s.seconds)).slice(0,5) : [];
    }catch(e){ return []; }
  }

  function saveScore(seconds, layoutKey=currentLayoutKey){
    const scores = loadScores(layoutKey);
    scores.push({seconds, when:new Date().toLocaleString([], {dateStyle:'short', timeStyle:'short'})});
    scores.sort((a,b) => a.seconds - b.seconds);
    const top = scores.slice(0,5);
    try{ localStorage.setItem(scoreKey(layoutKey), JSON.stringify(top)); }catch(e){}
    return top;
  }

  function scoresHtml(scores){
    if(!scores.length) return '<p>No saved times yet.</p>';
    return '<div class="scores">' + scores.map((s,i) => `${i+1}. ${formatTime(s.seconds)} <span style="opacity:.75">${escapeHtml(s.when || '')}</span>`).join('<br>') + '</div>';
  }

  function showModal(title, bodyHtml, buttons){
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    modalBtns.innerHTML = '';
    buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = b.text;
      btn.addEventListener('click', () => {
        if(b.close !== false) closeModal();
        if(b.onClick) b.onClick();
      });
      modalBtns.appendChild(btn);
    });
    modalShade.classList.add('open');
  }
  function closeModal(){ modalShade.classList.remove('open'); }
  modalShade.addEventListener('click', e => { if(e.target === modalShade) closeModal(); });

  function makeTileElement(tile){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'tile';
    el.title = ICONS[tile.kind].name;
    el.setAttribute('aria-label', ICONS[tile.kind].name);
    const pos = positions[tile.id];
    const p = xyFor(pos);
    el.style.left = p.left + 'px';
    el.style.top = p.top + 'px';
    el.style.zIndex = String(1000 + pos.z * 10000 + pos.y * 100 + pos.x);
    const body = document.createElement('span');
    body.className = 'tileBody';
    const face = document.createElement('span');
    face.className = 'face';
    const img = document.createElement('img');
    img.className = 'iconImg';
    img.alt = '';
    img.draggable = false;
    img.src = ICONS[tile.kind].src;
    face.appendChild(img);
    body.appendChild(face);
    el.appendChild(body);
    el.addEventListener('click', () => onTile(tile.id));
    return el;
  }

  function updateUi(){
    tilesLeftEl.textContent = activeIds.size;
    undoBtn.disabled = gameOver || history.length === 0;
    hintBtn.disabled = gameOver || activeIds.size === 0;
    drawAllFreeStates();
  }

  function applyLayout(nextKey, skipConfirm=false){
    if(!LAYOUTS[nextKey]) return;
    if(nextKey === currentLayoutKey && positions.length){
      layoutSelect.value = currentLayoutKey;
      return;
    }
    const doApply = () => {
      currentLayoutKey = nextKey;
      layoutSelect.value = currentLayoutKey;
      positions = makeLayout(currentLayoutKey);
      newGame(true);
    };
    if(!skipConfirm && activeIds.size > 0 && activeIds.size < TOTAL_TILES && !gameOver){
      layoutSelect.value = currentLayoutKey;
      showModal('Change Layout?', `<p>Switch to <strong>${escapeHtml(LAYOUTS[nextKey].name)}</strong>? This will start a new game.</p>`, [
        {text:'Cancel'},
        {text:'Change Layout', onClick:() => doApply()}
      ]);
      return;
    }
    doApply();
  }

  function newGame(skipConfirm=false){
    if(!skipConfirm && activeIds.size > 0 && activeIds.size < TOTAL_TILES && !gameOver){
      showModal('New Game?', '<p>This will quit the current game.</p>', [
        {text:'Cancel'},
        {text:'New Game', onClick:() => newGame(true)}
      ]);
      return;
    }
    closeModal();
    stopTimer();
    elapsed = 0;
    timerEl.textContent = '0:00';
    gameOver = false;
    history = [];
    selectedId = null;
    board.innerHTML = '';
    clearTimeout(messageTimer);
    messageEl.classList.remove('show');
    activeIds = new Set(positions.map(p => p.id));

    let assignment;
    try{ assignment = generateSolvableAssignment(); }
    catch(e){ console.error(e); setMessage('Could not make a board. Try New Game.', 4200); return; }

    tiles = positions.map(pos => ({id:pos.id, kind:assignment[pos.id], active:true, el:null}));
    const drawOrder = tiles.slice().sort((a,b) => {
      const pa = positions[a.id], pb = positions[b.id];
      return (pa.z - pb.z) || (pa.y - pb.y) || (pa.x - pb.x);
    });
    for(const tile of drawOrder){
      tile.el = makeTileElement(tile);
      tiles[tile.id].el = tile.el;
      board.appendChild(tile.el);
    }
    updateUi();
    startTimer();
  }

  function onTile(id){
    if(gameOver) return;
    clearHints();
    const tile = tiles[id];
    if(!tile || !tile.active) return;
    if(!isFree(tile)){
      tile.el.classList.add('bad');
      setTimeout(() => tile.el.classList.remove('bad'), 300);
      setMessage('That tile is blocked.');
      return;
    }
    if(selectedId === null){
      selectedId = id;
      tile.el.classList.add('selected');
      return;
    }
    if(selectedId === id){ clearSelection(); return; }
    const first = tiles[selectedId];
    if(first && first.kind === tile.kind){
      removePair(first.id, tile.id);
    }else{
      tile.el.classList.add('bad');
      if(first) first.el.classList.add('bad');
      setMessage('Not a match.');
      setTimeout(() => {
        tile.el.classList.remove('bad');
        if(first) first.el.classList.remove('bad','selected');
        selectedId = null;
      }, 420);
    }
  }

  function removePair(a,b){
    const t1 = tiles[a], t2 = tiles[b];
    t1.active = false;
    t2.active = false;
    activeIds.delete(a);
    activeIds.delete(b);
    t1.el.classList.remove('selected','free','blocked','hint','bad');
    t2.el.classList.remove('selected','free','blocked','hint','bad');
    t1.el.classList.add('removed');
    t2.el.classList.add('removed');
    history.push({a,b});
    selectedId = null;
    updateUi();
    if(activeIds.size === 0) finishGame();
    else if(availablePairs().length === 0) setMessage('No moves left. Start a new game.', 4200);
  }

  function undo(){
    if(!history.length || gameOver) return;
    clearHints();
    clearSelection();
    const last = history.pop();
    [last.a,last.b].forEach(id => {
      tiles[id].active = true;
      activeIds.add(id);
      tiles[id].el.classList.remove('removed','bad','hint');
    });
    updateUi();
    setMessage('Undone.');
  }

  function availablePairs(){
    const free = tiles.filter(t => t.active && isFree(t));
    const groups = new Map();
    free.forEach(t => {
      if(!groups.has(t.kind)) groups.set(t.kind, []);
      groups.get(t.kind).push(t);
    });
    const pairs = [];
    groups.forEach(list => {
      if(list.length >= 2){
        for(let i=0;i<list.length;i++){
          for(let j=i+1;j<list.length;j++) pairs.push([list[i], list[j]]);
        }
      }
    });
    return shuffle(pairs);
  }

  function hint(){
    if(gameOver) return;
    clearHints();
    clearSelection();
    const pairs = availablePairs();
    if(!pairs.length){ setMessage('No available matches.'); return; }
    elapsed += 30;
    timerEl.textContent = formatTime(elapsed);
    const [a,b] = pairs[0];
    a.el.classList.add('hint');
    b.el.classList.add('hint');
    setMessage('Hint shown. +0:30');
    setTimeout(() => {
      if(a.el) a.el.classList.remove('hint');
      if(b.el) b.el.classList.remove('hint');
    }, 2600);
  }

  function finishGame(){
    gameOver = true;
    stopTimer();
    clearSelection();
    const scores = saveScore(elapsed, currentLayoutKey);
    updateUi();
    showModal(`Cleared! — ${LAYOUTS[currentLayoutKey].name}`, `<p>Time: <strong>${formatTime(elapsed)}</strong></p>${scoresHtml(scores)}`, [
      {text:'New Game', onClick:() => newGame(true)},
      {text:'Close'}
    ]);
  }


  function showAbout(){
    showModal('About', '<p>Credit to: Mah Johngg for Windows by Ron Balewski.<br>Tileset designed by Ron Balewski.</p>', [
      {text:'Close'}
    ]);
  }

  function showBest(){
    showModal(`Best Times — ${LAYOUTS[currentLayoutKey].name}`, scoresHtml(loadScores(currentLayoutKey)), [
      {text:'Close'},
      {text:'New Game', onClick:() => newGame(false)}
    ]);
  }

  newBtn.addEventListener('click', () => newGame(false));
  undoBtn.addEventListener('click', undo);
  hintBtn.addEventListener('click', hint);
  bestBtn.addEventListener('click', showBest);
  aboutBtn.addEventListener('click', showAbout);
  layoutSelect.addEventListener('change', () => applyLayout(layoutSelect.value, false));

  layoutSelect.value = currentLayoutKey;
  positions = makeLayout(currentLayoutKey);
  resizeStage();
  newGame(true);
})();
</script>
