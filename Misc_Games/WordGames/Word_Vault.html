function clueDisplay(a,word,i){
 if(a.solved.some(s=>s.word===word))return `<span class="foundWord">✓ ${safe(word)}</span>`;
 const c=a.clues[word]||{},shown=revealedPositions(a,word);
 // Hard/Expert only disclose the starting letter until a length hint is bought.
 const lengthKnown=a.difficulty<2||!!c.length;
 if(!lengthKnown){
  const fragments=[...shown].sort((x,y)=>x-y).filter(x=>x>0).map(x=>x===word.length-1?`ends in ${word[x]}`:`${x+1}:${word[x]}`);
  return `<span class="slotDots clued">${word[0]} <small>· length ?${fragments.length?' · '+safe(fragments.join(', ')):''}</small></span>`;
 }
 const display=[...word].map((c,i)=>shown.has(i)?safe(c):'·').join('');
 return `<span class="slotDots clued">${display} <small>(${word.length})</small></span>`;
}

function normalizedWords(text){return text.trim().toUpperCase().split(/[,;\n]+/).map(w=>w.trim()).filter(Boolean)}
function validatedWords(words){if(!Array.isArray(words)||words.length<3||words.length>5)return 'Enter between 3 and 5 words.';
 if(words.some(w=>!(/^[A-Z]{3,10}$/).test(w)))return 'Each word must contain 3–10 English letters (A–Z) only, with no spaces.';
 if(new Set(words).size!==words.length)return 'Please use different words; duplicates are not allowed.';
 let count=words.join('').length;if(!SIZES.includes(count))return `These words contain ${count} letters. Use exactly 12, 16, 20, or 24 letters.`;
 return null;
}
function encodePuzzle(words){const payload=JSON.stringify({v:1,w:words});const b64=btoa(payload).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return `WV1-${b64}.${hash(payload).toString(16)}`}
function decodePuzzle(code){try{let str=String(code||'').trim().replace(/\s/g,'');if(str.includes('#wv='))str=decodeURIComponent(str.split('#wv=')[1]);if(!str.startsWith('WV1-'))throw Error('This is not a Word Vault code.');let [b64,sum]=str.slice(4).split('.');if(!b64||!sum||b64.length>400)throw Error('Code is incomplete.');let data=b64.replace(/-/g,'+').replace(/_/g,'/');let payload=atob(data.padEnd(Math.ceil(data.length/4)*4,'='));if(hash(payload).toString(16)!==sum.toLowerCase())throw Error('Code checksum mismatch.');let parsed=JSON.parse(payload),words=parsed.w;if(parsed.v!==1||validatedWords(words))throw Error('This code does not contain a valid puzzle.');return {words,code:str};}catch(e){throw Error(e.message||'Invalid share code.')}}
function importPuzzle(code){try{let p=decodePuzzle(code),size=p.words.join('').length;startNew('custom',{size,difficulty:1,words:p.words,seed:'shared-'+hash(p.code),creatorCode:p.code})}catch(e){toast('Unable to open challenge: '+e.message);playSound('error')}}
function creatorInfo(){let inp=$('creatorWords'),out=$('creatorStatus'),prev=$('creatorPreview');if(!inp||!out||!prev)return;let words=normalizedWords(inp.value),err=validatedWords(words),total=words.join('').length;out.textContent=err||`✓ ${words.length} words · ${total} letters · Valid board!`;out.style.color=err?'var(--muted)':'var(--good)';prev.innerHTML=words.join('').slice(0,24).split('').map(c=>`<span class="previewTile">${safe(c)}</span>`).join('')||'<span class="note">Your preview appears here.</span>'}
function makeCreatorCode(){let text=$('creatorWords')?.value||'';let words=normalizedWords(text),error=validatedWords(words);if(error){toast(error);return}let code=encodePuzzle(words);db.customCreated++;checkAchievements();save();modal={type:'code',words,code};renderModal();playSound('coin');}

 const temp=document.createElement('textarea');temp.value=text;temp.style.position='fixed';temp.style.top='-999px';document.body.appendChild(temp);temp.select();let ok=false;try{ok=document.execCommand('copy')}catch{}temp.remove();if(ok)toast('Copied to clipboard!');else{toast('Select and copy the code manually.');let el=$('createdCode');if(el)el.select()}}
function openScreen(name){screen=name;modal=null;save();render()}
function restartCurrent(){let a=db.active;if(!a)return;if(a.mode==='chapters')openChapter(a.level);else if(a.mode==='daily')startDaily();else if(a.mode==='custom')startNew('custom',{size:a.size,difficulty:a.difficulty,words:a.words,seed:randSeed(),creatorCode:a.creatorCode},true);else if(a.mode==='timed')startTimed();else startUnlimited()}
function nextChapter(){let a=db.active;if(!a||a.level==null)return;openChapter(Math.min(239,a.level+1))}
function updateSetting(name,value){if(name==='boardSize')db.settings.boardSize=Number(value);if(name==='difficulty')db.settings.difficulty=Number(value);save()}
// All UI actions use one delegated handler so mobile tapping stays consistent through re-renders.
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action,id=button.dataset.id;
 if(action==='home'){openHome();return}
 if(action==='resume'){resumeGame();return}
 if(action==='toggle-theme'){db.settings.theme=db.settings.theme==='dark'?'light':'dark';save();render();return}
 if(action==='toggle-sound'){db.settings.sounds=!db.settings.sounds;save();render();if(db.settings.sounds)playSound('coin');return}
 if(action==='help'){setModal('help');return}
 if(action==='start-unlimited'){modal=null;startUnlimited();return}
 if(action==='start-daily'){modal=null;startDaily();return}
 if(action==='start-timed'||action==='new-timed'){modal=null;startTimed();return}
 if(action==='open-chapters'){openScreen('chapters');return}
 if(action==='open-create'){openScreen('create');return}
 if(action==='view-stats'){openScreen('stats');return}
 if(action==='expand-chapter'){expandedChapter=Number(id);render();return}
 if(action==='chapter-level'){openChapter(Number(id));return}
 if(action==='tile'){updateSelected(db.active,Number(id));return}
 if(action==='submit'){submitGuess();return}
 if(action==='backspace'){selectBackspace();return}
 if(action==='clear'){clearSelection();return}
 if(action==='shuffle'){shuffleBoard();return}
 if(action==='undo'){undoSolved();return}
 if(action==='hints'){setModal('hints');return}
 if(action==='buy-hint'){buyHint(id);return}
 if(action==='pause'){setModal('pause');return}
 if(action==='history'){setModal('history');return}
 if(action==='close-modal'){closeModal();return}
 if(action==='confirm-yes'){const cb=confirmCallback;closeModal();if(cb)cb();return}
 if(action==='next-chapter'){modal=null;nextChapter();return}
 if(action==='next-unlimited'){modal=null;startUnlimited();return}
 if(action==='restart'){let a=db.active;if(!a)return;askConfirm('Begin a fresh board?','Your current puzzle will be replaced, and this run will not be credited as a win.',()=>{db.active=null;save();restartWith(a)});return}
 if(action==='create-code'){makeCreatorCode();return}
 if(action==='copy-code'&&modal?.type==='code'){copyText(modal.code);return}
 if(action==='copy-link'&&modal?.type==='code'){copyText(location.href.split('#')[0]+'#wv='+encodeURIComponent(modal.code));return}
 if(action==='play-created'&&modal?.type==='code'){let code=modal.code;modal=null;importPuzzle(code);return}
 if(action==='import-code'){importPuzzle($('importCode')?.value);return}
});
function restartWith(a){if(a.mode==='chapters')startNew('chapters',{size:16,difficulty:a.difficulty,level:a.level,seed:`chapter-${a.level}`},true);
 else if(a.mode==='daily')startNew('daily',{size:16,difficulty:1,seed:'wordvault-daily-'+a.dailyKey,dailyKey:a.dailyKey},true);
 else if(a.mode==='custom')startNew('custom',{size:a.size,difficulty:a.difficulty,seed:randSeed(),words:a.words,creatorCode:a.creatorCode},true);
 else if(a.mode==='timed')startNew('timed',{size:16,difficulty:1,seed:randSeed(),run:{count:0,points:0,coins:0},runRemaining:240000},true);
 else startNew('unlimited',{size:a.size,difficulty:a.difficulty},true);
}
document.addEventListener('change',e=>{if(e.target.id==='boardSize'||e.target.id==='difficulty')updateSetting(e.target.id,e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='creatorWords')creatorInfo()});
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(modal){if(e.key==='Escape'&&!['win','timedEnd','confirm'].includes(modal.type)){e.preventDefault();closeModal()}return;}
 if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable)return;
 if(screen!=='game'||!db.active||db.active.finished||db.active.transition)return;
 if(e.key==='Escape'){e.preventDefault();setModal('pause')}
 else if(e.key==='Enter'){e.preventDefault();submitGuess()}
 else if(e.key==='Backspace'){e.preventDefault();selectBackspace()}
 else if(e.key.toLowerCase()==='s'&&e.shiftKey){e.preventDefault();shuffleBoard()}
 else if(/^[a-z]$/i.test(e.key)){e.preventDefault();typeLetter(e.key.toUpperCase())}
});
// Safe first-load handling for a URL-shared challenge.
if(db.active&&db.active.mode==='timed'&&db.active.transition&&!db.active.runEnded){
 const prev=db.active;
 db.active=createPuzzle('timed',{size:16,difficulty:1+Math.min(2,Math.floor(prev.run.count/3)),seed:randSeed(),run:prev.run,runRemaining:prev.runRemaining});
 db.stats.played++;save();
}
if(!db.active&&location.hash.startsWith('#wv=')){
 try{const p=decodePuzzle(location.hash.substring(4));db.active=createPuzzle('custom',{size:p.words.join('').length,difficulty:1,words:p.words,seed:'shared-'+hash(p.code),creatorCode:p.code});db.stats.played++;screen='game';save()}
 catch(e){console.warn('Unable to load shared challenge:',e)}
}
render();
</script>
</body></html>
