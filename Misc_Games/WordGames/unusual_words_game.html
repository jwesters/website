<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unusual Words: Lasting Streak</title>
<style>
  :root{
    --bg:#f4efe6;
    --panel:#fffaf2;
    --ink:#2f261e;
    --muted:#7c6b59;
    --accent:#b7791f;
    --accent2:#8c6239;
    --good:#2f855a;
    --bad:#c53030;
    --shadow:0 12px 30px rgba(0,0,0,.10);
    --radius:20px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,#f7f2ea 0%,#efe6d8 100%);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:min(900px,100%);
    background:var(--panel);
    border:2px solid #e8dcc7;
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .topbar{
    padding:18px 22px;
    background:linear-gradient(180deg,#fffdf8,#f8f1e5);
    border-bottom:2px solid #ebdec9;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .titleWrap h1{
    margin:0;
    font-size:clamp(1.5rem,2vw,2rem);
    line-height:1.1;
  }
  .subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:.98rem;
  }
  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .chip{
    background:#fff;
    border:2px solid #eadfcd;
    border-radius:999px;
    padding:10px 14px;
    font-weight:700;
    min-width:120px;
    text-align:center;
  }
  .main{
    padding:24px;
  }
  .card{
    background:#fffdf9;
    border:2px solid #eadfcd;
    border-radius:24px;
    padding:22px;
  }
  .promptLabel{
    color:var(--muted);
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:.82rem;
  }
  .word{
    margin:10px 0 8px;
    font-size:clamp(2rem,5vw,3.25rem);
    font-weight:800;
    letter-spacing:.01em;
    min-height:1.2em;
  }
  .instructions{
    margin:0 0 20px;
    color:var(--muted);
    font-size:1rem;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }
  .choice{
    appearance:none;
    width:100%;
    text-align:left;
    border:2px solid #e5d6bf;
    background:#fff;
    color:var(--ink);
    border-radius:18px;
    padding:16px 18px;
    font-size:1.02rem;
    line-height:1.4;
    cursor:pointer;
    transition:transform .08s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    box-shadow:0 3px 0 rgba(0,0,0,.04);
  }
  .choice:hover:not([disabled]){
    transform:translateY(-1px);
    border-color:#d3b280;
    background:#fffaf0;
  }
  .choice:active:not([disabled]){
    transform:translateY(1px);
  }
  .choice.correct{
    border-color:#99d3b0;
    background:#edf9f1;
    color:#1f5137;
  }
  .choice.wrong{
    border-color:#efb1b1;
    background:#fff1f1;
    color:#7f1d1d;
  }
  .choice:disabled{
    cursor:default;
  }
  .footerRow{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
  }
  .message{
    min-height:26px;
    font-weight:700;
  }
  .message.good{ color:var(--good); }
  .message.bad{ color:var(--bad); }
  .btn{
    appearance:none;
    border:none;
    border-radius:14px;
    padding:12px 16px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    background:var(--accent);
    color:white;
    box-shadow:0 4px 0 rgba(0,0,0,.10);
  }
  .btn.secondary{
    background:var(--accent2);
  }
  .btn:active{
    transform:translateY(1px);
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:30px 10px 10px;
  }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(47,38,30,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .hidden{ display:none !important; }
  .modal{
    width:min(520px,100%);
    background:var(--panel);
    border:2px solid #e8dcc7;
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:24px;
    text-align:center;
  }
  .modal h2{
    margin:0 0 8px;
    font-size:2rem;
  }
  .modal p{
    margin:8px 0;
    font-size:1.05rem;
  }
  .modal .big{
    font-size:3rem;
    font-weight:800;
    margin:8px 0 12px;
    color:var(--accent2);
  }
  .modalButtons{
    margin-top:18px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  @media (max-width:640px){
    .topbar,.main{padding:16px}
    .card{padding:16px}
    .chip{min-width:unset; flex:1 1 100px}
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="titleWrap">
        <h1>Unusual Words</h1>
        <div class="subtitle">Pick the correct definition. One wrong answer and it’s game over.</div>
      </div>
      <div class="stats">

    <div class="main">

        <div class="footerRow">

          <div>
            <button id="startBtn" class="btn">Start Game</button>
            <button id="restartBtn" class="btn secondary">Restart</button>
          </div>
        </div>
      </div>
      <div id="emptyMsg" class="empty hidden">You’ve gone through every word in the set. Restart to play again.</div>
    </div>
  </div>

  <div id="gameOverOverlay" class="overlay hidden" aria-hidden="true">
    <div class="modal">
      <h2>Game Over</h2>
      <p>Your streak was</p>
      <div class="big" id="finalScore">0</div>
      <p id="gameOverWord"></p>
      <p id="gameOverAnswer"></p>
      <div class="modalButtons">
        <button id="playAgainBtn" class="btn">Play Again</button>
        
      </div>
    </div>
  </div>

let remaining = [];
let current = null;
let streak = 0;
let best = Number(localStorage.getItem('unusualWordsBest') || 0);
let active = false;
let locked = false;

const streakEl = document.getElementById('streak');
const bestEl = document.getElementById('best');
const wordEl = document.getElementById('word');
const choicesEl = document.getElementById('choices');
const messageEl = document.getElementById('message');
const emptyMsgEl = document.getElementById('emptyMsg');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const finalScoreEl = document.getElementById('finalScore');
const gameOverWordEl = document.getElementById('gameOverWord');
const gameOverAnswerEl = document.getElementById('gameOverAnswer');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setMessage(text='', type='') {
  messageEl.textContent = text;
  messageEl.className = 'message' + (type ? ' ' + type : '');
}

function updateStats() {
  streakEl.textContent = streak;
  bestEl.textContent = best;
}

function saveBest() {
  if (streak > best) {
    best = streak;
    localStorage.setItem('unusualWordsBest', String(best));
  }
}

function resetDeck() {
  remaining = shuffle(WORDS);
  active = false;
  locked = false;
  current = null;
  streak = 0;
  saveBest();
  updateStats();
  wordEl.textContent = ''; // only requested change: no "Press Start" text
  choicesEl.innerHTML = '';
  setMessage('');
  emptyMsgEl.classList.add('hidden');
}

function startGame() {
  resetDeck();
  active = true;
  nextQuestion();
}

function nextQuestion() {
  if (!active) return;
  if (remaining.length === 0) {
    wordEl.textContent = 'All done!';
    choicesEl.innerHTML = '';
    setMessage('You cleared the whole deck. Amazing run!', 'good');
    emptyMsgEl.classList.remove('hidden');
    active = false;
    return;
  }

  locked = false;
  setMessage('');
  current = remaining.pop();
  wordEl.textContent = current.word;

  const distractors = shuffle(
    WORDS.filter(item => item.word !== current.word && item.definition !== current.definition)
  ).slice(0, 3).map(item => item.definition);

  const options = shuffle([current.definition, ...distractors]);
  choicesEl.innerHTML = '';

  options.forEach(def => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = def;
    btn.addEventListener('click', () => handleChoice(btn, def));
    choicesEl.appendChild(btn);
  });

  updateStats();
}

function handleChoice(btn, chosenDef) {
  if (locked || !current || !active) return;
  locked = true;

  const allButtons = [...document.querySelectorAll('.choice')];
  allButtons.forEach(b => b.disabled = true);

  const correctDef = current.definition;
  const isCorrect = chosenDef === correctDef;

  allButtons.forEach(b => {
    if (b.textContent === correctDef) b.classList.add('correct');
  });

  if (isCorrect) {
    btn.classList.add('correct');
    streak++;
    saveBest();
    updateStats();
    setMessage('Next round', 'good');
    setTimeout(() => {
      nextQuestion();
    }, 550);
  } else {
    btn.classList.add('wrong');
    updateStats();
    setMessage('Incorrect. Game over.', 'bad');
    active = false;
    showGameOver(current.word, correctDef, streak);
  }
}

function showGameOver(word, correctDef, finalStreak) {
  finalScoreEl.textContent = finalStreak;
  gameOverWordEl.textContent = 'Word: ' + word;
  gameOverAnswerEl.textContent = 'Correct definition: ' + correctDef;
  gameOverOverlay.classList.remove('hidden');
  gameOverOverlay.setAttribute('aria-hidden', 'false');
}

function closeOverlay() {
  gameOverOverlay.classList.add('hidden');
  gameOverOverlay.setAttribute('aria-hidden', 'true');
}

document.getElementById('startBtn').addEventListener('click', () => {
  closeOverlay();
  startGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  closeOverlay();
  startGame();
});

document.getElementById('playAgainBtn').addEventListener('click', () => {
  closeOverlay();
  startGame();
});



bestEl.textContent = best;
resetDeck();
</script>
</body>
</html>
