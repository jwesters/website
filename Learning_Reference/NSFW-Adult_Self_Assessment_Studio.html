'How often do you have trouble wrapping up the final details of a project, once the challenging parts have been done?',
'How often do you have difficulty getting things in order when you have to do a task that requires organization?',
'How often do you have problems remembering appointments or obligations?',
'When you have a task that requires a lot of thought, how often do you avoid or delay getting started?',
'How often do you fidget or squirm with your hands or feet when you have to sit down for a long time?',
'How often do you feel overly active and compelled to do things, like you were driven by a motor?'
];

const PHQ=[
'Little interest or pleasure in doing things',
'Feeling down, depressed, or hopeless',
'Trouble falling or staying asleep, or sleeping too much',
'Feeling tired or having little energy',
'Poor appetite or overeating',
'Feeling bad about yourself — or that you are a failure or have let yourself or your family down',
'Trouble concentrating on things, such as reading the newspaper or watching television',
'Moving or speaking so slowly that other people could have noticed? Or the opposite — being so fidgety or restless that you have been moving around a lot more than usual',
'Thoughts that you would be better off dead or of hurting yourself in some way'
];
// Generalized Anxiety Disorder-7: Spitzer, Kroenke, Williams, Lowe et al.
const GAD=[
'Feeling nervous, anxious, or on edge',
'Not being able to stop or control worrying',
'Worrying too much about different things',
'Trouble relaxing',
'Being so restless that it is hard to sit still',
'Becoming easily annoyed or irritable',
'Feeling afraid as if something awful might happen'
];
// K10 © Ronald C. Kessler, PhD (2003). Retains original 10 item wording.
// Each item completes the original lead-in: "During that month, how often did you feel ..."
const K10=[
'… tired out for no good reason?',
'… nervous?',
'… so nervous that nothing could calm you down?',
'… hopeless?',
'… restless or fidgety?',
'… so restless that you could not sit still?',
'… depressed?',
'… so depressed that nothing could cheer you up?',
'… that everything was an effort?',
'… worthless?'
];
// WHO-5 © WHO (2024), CC BY-NC-SA 3.0 IGO. Original English wording.
const WHO5=[
'I have felt cheerful and in good spirits',
'I have felt calm and relaxed',
'I have felt active and vigorous',
'I woke up feeling fresh and rested',
'My daily life has been filled with things that interest me'

  asrs:{title:'Adult ADHD Screener',short:'ASRS v1.1',label:'ADHD symptoms',items:ASRS,

    url:'https://www.phqscreeners.com/',authors:'Kroenke K., Spitzer R.L., Williams J.B.W. (2001). The PHQ-9: Validity of a brief depression severity measure. Journal of General Internal Medicine, 16, 606–613.',

  gad:{title:'Anxiety Symptoms',short:'GAD-7',label:'Anxiety',items:GAD,
    blurb:'Seven questions that measure anxiety symptom severity over the past two weeks.',
    purpose:'Over the last 2 weeks, how often have you been bothered by these problems?',
    url:'https://www.phqscreeners.com/',authors:'Spitzer R.L., Kroenke K., Williams J.B.W., Löwe B. (2006). A brief measure for assessing generalized anxiety disorder: The GAD-7. Archives of Internal Medicine, 166, 1092–1097.',

    url:'https://rckessler.scholars.harvard.edu/k10-and-k6-scales',authors:'Kessler R.C. et al. (2003). Screening for serious mental illness in the general population. Archives of General Psychiatry, 60(2), 184–189.',

const app={view:'home',current:null,steps:{asrs:0,phq:0,gad:0,k10:0,who5:0},answers:Object.fromEntries(keys.map(k=>[k,Array(measures[k].items.length).fill(null)])),impact:{phq:null,gad:null},mobileOpen:false};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function questions(k){return measures[k].items;}
function total(k){return questions(k).length;}
function count(k){return app.answers[k].filter(Number.isInteger).length;}
function done(k){return count(k)===total(k);}
function options(k){if(k==='asrs')return ['Never','Rarely','Sometimes','Often','Very Often'];if(k==='k10')return ['All of the time','Most of the time','Some of the time','A little of the time','None of the time'];if(k==='who5')return ['All of the time','Most of the time','More than half of the time','Less than half of the time','Some of the time','At no time'];return ['Not at all','Several days','More than half the days','Nearly every day'];}
function optionScore(k,i){return k==='k10'?5-i:k==='who5'?5-i:i;}
function summed(k){return app.answers[k].reduce((acc,i)=>acc+optionScore(k,i),0);}
function phqBand(v){return v<=4?'Minimal':v<=9?'Mild':v<=14?'Moderate':v<=19?'Moderately severe':'Severe';}
function gadBand(v){return v<=4?'Minimal':v<=9?'Mild':v<=14?'Moderate':'Severe';}
function kBand(v){return v<=15?'Low':v<=21?'Moderate':v<=29?'High':'Very high';}
function score(k){if(!done(k))return null;
 if(k==='asrs'){const matched=app.answers[k].reduce((n,v,i)=>n+(v>=(i<3?2:3)?1:0),0);return{value:matched,max:6,display:matched+' / 6',flag:matched>=4,status:matched>=4?'Positive screen':'Below screening threshold',caption:'Count of responses in the original shaded screening categories. 4 or more indicates a positive ADHD screen.',note:'A positive ASRS screen means a qualified professional may wish to evaluate ADHD symptoms. It does not establish ADHD or exclude other explanations.'};}
 if(k==='phq'){const v=summed(k);return{value:v,max:27,display:v+' / 27',flag:v>=10,status:phqBand(v),caption:'PHQ-9 symptom severity: 0–4 minimal · 5–9 mild · 10–14 moderate · 15–19 moderately severe · 20–27 severe.',note:'Scores of 10 or more are often used as a screening threshold for further depression evaluation; severity bands cannot establish a diagnosis.'};}
 if(k==='gad'){const v=summed(k);return{value:v,max:21,display:v+' / 21',flag:v>=10,status:gadBand(v),caption:'GAD-7 symptom severity: 0–4 minimal · 5–9 mild · 10–14 moderate · 15–21 severe.',note:'A score of 10 or more is a common threshold for considering further anxiety evaluation; the form alone cannot diagnose an anxiety disorder.'};}
 if(k==='k10'){const v=summed(k);return{value:v,max:50,min:10,display:v+' / 50',flag:v>=22,status:kBand(v),caption:'Australian Bureau of Statistics bands: 10–15 low · 16–21 moderate · 22–29 high · 30–50 very high.',note:'K10 measures non-specific distress rather than a specific disorder. Bands are population-oriented descriptions, not personal diagnostic probabilities.'};}
 const raw=summed(k),pct=raw*4;return{value:pct,max:100,display:pct+' / 100',flag:raw<13,status:raw<13?'Reduced well-being':'Above suggested low-well-being cutoff',caption:'WHO-5 raw total '+raw+' / 25 × 4 = '+pct+' / 100. Higher scores indicate better well-being.',note:'WHO suggests that scores below 50 (raw score below 13) may indicate lower well-being and merit a broader clinical conversation, not a diagnosis.'};
}
function initialNotice(){return `<div class="notice"><span class="symbol">ⓘ</span><div><strong>Important: information only — not medical advice or a diagnosis.</strong>These self-report questionnaires are for personal reflection and conversations with a qualified professional. Results cannot establish or rule out any condition, estimate your individual probability of diagnosis, or recommend treatment. No one is monitoring your responses.</div></div>`;}
function helpNotice(){return `<div class="notice alert"><span class="symbol">♡</span><div><strong>Support is available.</strong>If you may harm yourself, feel unsafe, or need immediate help, do not rely on this app. In Canada, call or text <strong style="display:inline">988</strong> for suicide crisis support, or call <strong style="display:inline">911</strong> for immediate danger. Elsewhere, contact your local crisis service.</div></div>`;}
function sourceCredit(k){let m=measures[k];return `<div class="sourcecredit">Source: ${esc(m.short)} · <a target="_blank" rel="noopener noreferrer" href="${esc(m.url)}">official information and attribution</a> · See <a href="#" data-nav="sources">sources &amp; scoring</a>.</div>`;}
function overview(){let h=`<section class="hero"><div class="eyebrow">PRIVATE · SELF-CONTAINED · FOR ADULTS</div><h1>Understand your responses. Keep the context.</h1><p>Complete five established adult questionnaires, see how scores are calculated, and take notes or results to a healthcare professional if you wish. Every question is included here — no separate PDFs required.</p></section>${initialNotice()}<div class="section-title"><h2>Choose an assessment</h2><p>${keys.filter(done).length} / 5 completed</p></div><section class="cards">`;
 for(const k of keys){const m=measures[k],n=count(k),c=total(k),isDone=done(k);h+=`<article class="card"><span class="tag">COMPLETE QUESTIONNAIRE</span><h3>${esc(m.title)}</h3><div class="muted" style="font-weight:800">${esc(m.short)} · ${c} questions</div><p>${esc(m.blurb)}</p><div class="progressline"><div class="progressfill" style="width:${Math.round(100*n/c)}%"></div></div><div class="cardfoot"><span class="meta">${n} / ${c} answered</span><button class="btn small" data-open="${k}">${n===0?'Start':isDone?'Review':'Continue'} →</button></div></article>`;}
 h+=`</section>`;
 let completed=keys.filter(done);if(completed.length){h+=`<div class="results-overview"><h3>Your completed results</h3><p class="fineprint">Separate scores are shown as published; do not add them together or read them as chances of having a diagnosis.</p>`;for(let k of completed){let m=measures[k],s=score(k);h+=`<div class="resultmini"><div><strong>${esc(m.short)}</strong> · ${esc(s.status)}<div class="fineprint">${esc(m.title)}</div></div><button class="btn small ghost" data-results="${k}">${esc(s.display)} →</button></div>`}h+=`<div class="btnrow" style="margin-top:12px"><button class="btn soft" data-export="csv">Export score summary</button><button class="btn ghost" data-nav="sources">Scoring methods</button></div></div>`;}
 h+=`<div class="section-title"><h2>Good to know</h2></div><div class="bulletsection"><div class="info"><h3>✓ Questions and scoring are included</h3><p>No PDFs, online form embeds, or account required. Each measure retains its original response scale and scoring method.</p></div><div class="info"><h3>✓ Nothing is uploaded</h3><p>Your answers stay in this open browser tab unless you decide to export a local file. This app makes no requests for scoring.</p></div><div class="info"><h3>✓ Save when you choose</h3><p>Use "Save progress" to export a JSON file. Return later with "Restore progress"; refresh or closing the tab otherwise clears answers.</p></div><div class="info"><h3>✓ Scoring is not diagnosis</h3><p>Symptoms can overlap across conditions. A licensed healthcare professional considers clinical history, function, context and other information.</p></div></div><div class="actions"><button class="btn ghost" data-export="json">Save progress (.json)</button><label class="btn ghost" style="cursor:pointer">Restore progress <input hidden data-import type="file" accept=".json,application/json"></label><button class="btn danger" data-clear>Clear all answers</button></div>`;
 return h;
}
function questionnaire(k){const m=measures[k],i=app.steps[k],q=questions(k),v=app.answers[k][i],num=count(k),opts=options(k),complete=done(k);
 let h=`<div class="assessmenthead"><div><div class="sectionmark">${esc(m.short)} · ${q.length} questions</div><h1>${esc(m.title)}</h1><div class="muted">${esc(m.purpose)}</div></div><button class="btn ghost small" data-nav="home">← All assessments</button></div><div class="progressline"><div class="progressfill" style="width:${Math.round(100*num/q.length)}%"></div></div><div class="questioncounts">${num} / ${q.length} answered</div><div class="assessmentgrid"><section class="whitepanel"><div class="stepbadge">QUESTION ${i+1} / ${q.length}</div>${k==='k10'?`<p class="questiontextprefix">During the past 30 days, how often did you feel…</p>`:''}<div class="question">${esc(q[i])}</div><div class="choices" role="group" aria-label="Response choices">`;
 opts.forEach((label,n)=>{h+=`<button type="button" class="choice ${v===n?'selected':''}" data-rate="${n}" aria-pressed="${v===n}" aria-label="${esc(label)}"><span class="radio"></span><span style="flex:1">${esc(label)}</span><span class="opt-index">${n+1}</span></button>`;});h+=`</div>`;
 if(k==='phq'&&i===8)h+=helpNotice();
 if((k==='phq'||k==='gad')&&i===q.length-1)h+=`<div class="fieldline"><label for="impact" class="fineprint">Optional: How difficult have these problems made it to work, take care of things at home, or get along with other people? (Not included in symptom score.)</label><select id="impact" style="padding:11px;border:1px solid #cddede;border-radius:9px"><option value="">Prefer not to say</option>${['Not difficult at all','Somewhat difficult','Very difficult','Extremely difficult'].map((x,n)=>`<option value="${n}" ${app.impact[k]===n?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
 h+=`<div class="controlrow"><button class="btn ghost" data-step="back" ${i===0?'disabled':''}>← Previous</button><div class="btnrow">${complete?`<button class="btn soft" data-results="${k}">View results</button>`:''}<button class="btn" data-step="next" ${v===null?'disabled':''}>${i===q.length-1?'See results':'Next →'}</button></div></div><div class="qnav" aria-label="Jump to a question">${q.map((_,n)=>`<button class="qjump ${app.answers[k][n]!==null?'done':''} ${i===n?'current':''}" data-jump="${n}" title="Question ${n+1}" aria-label="Jump to question ${n+1}">${n+1}</button>`).join('')}</div><p class="fineprint">Tip: press number keys 1–${opts.length} to select an answer, then Enter to continue. You can change an answer any time.</p></section>`;
 h+=`<aside class="asidebox"><h3>How to answer</h3><p>${esc(m.blurb)}</p><div class="mini-divider"></div><p><strong>Scale:</strong> ${esc(opts[0])} → ${esc(opts[opts.length-1])}.</p><p>Every question is required to calculate a score, but you may leave any questionnaire unfinished or stop whenever you wish.</p><div class="mini-divider"></div><p><strong>Not medical advice.</strong> No single score or set of scores proves a diagnosis.</p>${sourceCredit(k)}</aside></div>`;return h;}
function resultLine(k){const m=measures[k],s=score(k);return `<div class="resultmini"><div><strong>${esc(m.short)} · ${esc(m.title)}</strong><div class="fineprint">${esc(s.status)}</div></div><span><strong>${esc(s.display)}</strong></span></div>`;}
function results(k){if(!done(k))return `<section class="reshead"><h2>Finish the questions to see a result</h2><p>${total(k)-count(k)} question(s) still unanswered. This score will not be estimated from missing responses.</p></section><button class="btn" data-open="${k}">Return to questions</button>${initialNotice()}`;
 const m=measures[k],s=score(k);let h=`<section class="reshead"><span class="eyebrow">PERSONAL SCREENING SUMMARY · ${esc(m.short)}</span><h2>${esc(m.title)}</h2><p>Completed ${esc(new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}))} · Informational only · Not a diagnosis.</p></section>${initialNotice()}`;
 if(k==='phq'&&app.answers.phq[8]>0)h+=`<div class="inlinewarning"><strong>Important response to PHQ-9 item 9.</strong> Your response mentions thoughts of death or self-harm. The total score cannot assess your immediate safety. Please reach out promptly to a professional or trusted person. In Canada, call or text 988 for support; if in immediate danger call 911.</div>`;
 h+=`<section class="metricgrid"><div class="metric"><h3>${k==='asrs'?'Positive-category responses':k==='who5'?'Well-being index':k==='k10'?'Distress total':'Symptom total'}</h3><strong>${esc(s.display)}</strong><div class="bartrack"><div class="barfill" style="width:${Math.round(100*s.value/s.max)}%"></div></div><p>${esc(s.caption)}</p></div><div class="metric"><h3>Interpretation</h3><div class="status ${s.flag?'warn':'good'}" style="margin:6px 0">${esc(s.status)}</div><p>${esc(s.note)}</p><p style="font-weight:750">This is not a probability of having a diagnosis.</p></div></section>`;
 if(k==='asrs')h+=`<div class="info" style="margin-top:18px"><h3>Exact ASRS screening rule</h3><p>On items 1–3, "Sometimes," "Often," or "Very Often" counts as a marked response. On items 4–6, "Often" or "Very Often" counts. Four or more marked responses equals a positive screening result. The score is a count, not a symptom total.</p></div>`;
 if(k==='who5')h+=`<div class="info" style="margin-top:18px"><h3>WHO-5 scoring</h3><p>For each item, All of the time = 5 through At no time = 0. The raw total (0–25) is multiplied by four to create the 0–100 well-being index. <strong>100 describes the highest well-being score, not a 100% chance of good mental health.</strong></p></div>`;
 if((k==='phq'||k==='gad')&&app.impact[k]!==null)h+=`<div class="minicard"><strong>Optional functional-impact response</strong><p>${esc(['Not difficult at all','Somewhat difficult','Very difficult','Extremely difficult'][app.impact[k]])}. This answer is not part of the total score.</p></div>`;
 h+=`<section class="whitepanel" style="margin-top:18px"><h3 class="chartheading">Your individual responses</h3>`;
 const labels=options(k),maxOpt=labels.length-1;for(let i=0;i<total(k);i++){const n=app.answers[k][i];h+=`<div class="domainresult"><div><div class="domaintitle">Question ${i+1}</div><div class="domainsub">${esc(questions(k)[i])}</div></div><div><div style="font-size:11px;text-align:right;font-weight:800">${esc(labels[n])}</div><div class="bartrack"><div class="barfill" style="width:${Math.round(100*(k==='k10'||k==='who5'?maxOpt-n:n)/maxOpt)}%"></div></div></div></div>`;}
 h+=`</section><div class="summarynote">Consider sharing these results with a qualified healthcare professional if the symptoms affect your daily life or you would like additional support. Another explanation or condition may better account for the pattern. Repeating self-report forms cannot substitute for a full assessment.</div>${sourceCredit(k)}<div class="actions"><button class="btn" data-open="${k}">Review answers</button><button class="btn ghost" data-print>Print / save as PDF</button><button class="btn ghost" data-export="json">Save responses (.json)</button><button class="btn ghost" data-export="csv">Export score summary (.csv)</button><button class="btn ghost" data-nav="home">All assessments</button></div><p class="printonly print-source">Educational / informational purposes only. Not medical advice. Not a diagnosis. Score source: ${esc(m.authors)}</p>`;
 return h;
}
function sources(){let h=`<section class="hero"><div class="eyebrow">CLEAR SOURCES AND SCORING</div><h1>Five complete questionnaires. Original authors credited.</h1><p>All question text is embedded locally; the links below are for transparency and original-source credit, never required to complete the app.</p></section>${initialNotice()}<div class="section-title"><h2>Original sources and scoring</h2></div>`;
 const notes={asrs:'Six-question ASRS v1.1 screener: questions 1–3 flag Sometimes or higher; questions 4–6 flag Often or higher. ≥4 flagged responses = positive adult ADHD screen. Not a diagnosis.',phq:'Sum nine items (0–3 each), range 0–27. Bands: 0–4 minimal; 5–9 mild; 10–14 moderate; 15–19 moderately severe; 20–27 severe. Item 9 is a separate safety consideration.',gad:'Sum seven items (0–3 each), range 0–21. Bands: 0–4 minimal; 5–9 mild; 10–14 moderate; 15–21 severe. ≥10 is a common screening threshold.',k10:'Sum ten answers using the Australian 1–5 scoring convention, range 10–50 (rather than the alternate 0–40 convention). Low 10–15; moderate 16–21; high 22–29; very high 30–50. Bands describe nonspecific distress.',who5:'Sum five answers scored 5 (All of the time) to 0 (At no time), range 0–25; multiply by 4 for the 0–100 well-being score. Scores <50 (raw <13) suggest reduced well-being.'};
 for(const k of keys){const m=measures[k];h+=`<div class="sourceitem"><h3>${esc(m.short)} — ${esc(m.title)}</h3><p><strong>Scoring:</strong> ${esc(notes[k])}</p><p><strong>Original citation:</strong> ${esc(m.authors)}</p><p><strong>Reproduction notice:</strong> ${esc(m.rights)}</p><p><a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Official source / original questionnaire</a>${k==='who5'?' · <a href="https://creativecommons.org/licenses/by-nc-sa/3.0/igo/" target="_blank" rel="noopener noreferrer">WHO-5 licence</a>':''}</p></div>`;}
 h+=`<div class="info"><h3>Why WFIRS-S and WSR-II are not included</h3><p>The earlier version relied on those two copyrighted PDFs and showed item numbers instead of questions. This revision replaces them with the fully interactive K10 and WHO-5, whose owners publish explicit terms allowing reuse under their respective conditions. The K10 and WHO-5 do not measure exactly the same constructs as the removed Weiss instruments. There is no invented overall diagnostic risk score.</p></div><div class="actions"><button class="btn" data-nav="home">Back to assessments</button></div>`;
 return h;
}
function privacy(){return `<section class="hero"><div class="eyebrow">PRIVATE AND RESPONSIBLE</div><h1>Understand what stays on your device.</h1><p>No sign-in, no analytics, no automatic storage of answers and no internet connection required for the questionnaire itself.</p></section>${initialNotice()}${helpNotice()}<div class="section-title"><h2>Privacy and limitations</h2></div><div class="bulletsection"><div class="info"><h3>No automatic storage</h3><p>Answers exist only in the current tab memory until you export. Closing or refreshing the page can clear unfinished work. No browser localStorage or server databases are used.</p></div><div class="info"><h3>Exports are sensitive</h3><p>Downloadable JSON contains your answers and scores; CSV contains a score summary. Files remain wherever you save or share them, including any cloud-synced downloads directory.</p></div><div class="info"><h3>External source links</h3><p>Scoring runs entirely offline. Clicking an official source or licence link opens that separate website but does not send your answers with it.</p></div><div class="info"><h3>Not medical advice</h3><p>Results are not a clinical evaluation, medical advice, diagnosis, assessment of safety, prescription guidance or estimated personal chance of having a condition. A low score cannot rule out a problem.</p></div><div class="info"><h3>Support in a crisis</h3><p>If you or someone else is in danger, contact emergency services. In Canada, call/text 988 for suicide crisis support; for an immediate emergency call 911.</p></div><div class="info"><h3>Reuse conditions</h3><p>The WHO-5 questionnaire is provided for non-commercial use under CC BY-NC-SA 3.0 IGO and credits WHO. Each other assessment carries its original attribution. This app is not affiliated with or endorsed by the source organizations.</p></div></div><div class="actions"><button class="btn" data-nav="home">Back to assessments</button><button class="btn ghost" data-export="json">Save progress</button><label class="btn ghost" style="cursor:pointer">Restore progress <input type="file" accept=".json,application/json" data-import hidden></label><button class="btn danger" data-clear>Clear responses</button></div>`;}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function nav(view){app.view=view;app.mobileOpen=false;render();goTop();}
function openKey(k){app.current=k;app.view='assessment';app.mobileOpen=false;render();goTop();}
function viewResults(k){app.current=k;app.view='results';app.mobileOpen=false;render();goTop();}
function reset(){if(!confirm('Clear all questionnaire responses from this tab? This cannot be undone.'))return;keys.forEach(k=>{app.answers[k].fill(null);app.steps[k]=0;});app.impact={phq:null,gad:null};nav('home');}
function forward(){const k=app.current,i=app.steps[k];if(app.answers[k][i]===null)return;if(i===total(k)-1){if(done(k))viewResults(k);else{app.steps[k]=app.answers[k].findIndex(x=>x===null);render();}}else{app.steps[k]++;render();goTop();}}
function back(){app.steps[app.current]=Math.max(0,app.steps[app.current]-1);render();goTop();}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function exportData(format){if(format==='csv'){let rows=['"Questionnaire","Score","Score range","Interpretation","Items answered"'];for(let k of keys){let s=score(k);rows.push([measures[k].short,s?s.display:'Incomplete',s?(s.min||0)+'-'+s.max:'',s?s.status:'Not scored',count(k)+'/'+total(k)].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','));}return download(new Blob([rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),'Adult_Self_Assessment_Score_Summary.csv');}
 let payload={format:'Adult Self-Assessment Studio',version:2,exported:new Date().toISOString(),disclaimer:'Not medical advice or diagnosis. No individual diagnosis probability.',answers:app.answers,impact:app.impact,scores:Object.fromEntries(keys.map(k=>[k,score(k)]))};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'Adult_Self_Assessment_Progress.json');}
async function importData(file){if(!file)return;try{if(file.size>1000000)throw new Error('The file is too large.');let obj=JSON.parse(await file.text());if(obj?.format!=='Adult Self-Assessment Studio'||!obj.answers)throw new Error('This is not a compatible studio progress file.');if(!confirm('Restore this progress file? It will replace any current answers.'))return;for(const k of keys){let arr=Array.isArray(obj.answers[k])?obj.answers[k]:[],n=options(k).length;app.answers[k]=Array.from({length:total(k)},(_,i)=>Number.isInteger(arr[i])&&arr[i]>=0&&arr[i]<n?arr[i]:null);app.steps[k]=0;}app.impact={phq:null,gad:null};for(let k of ['phq','gad']){let n=obj.impact?.[k];if(Number.isInteger(n)&&n>=0&&n<=3)app.impact[k]=n;}nav('home');alert('Progress was restored.');}catch(e){alert('Could not restore: '+e.message);}}
function renderNav(){document.getElementById('sideList').innerHTML=keys.map(k=>`<button class="sidebutton ${app.current===k&&['assessment','results'].includes(app.view)?'active':''}" data-open="${k}"><span>◉</span><span>${esc(measures[k].short)}</span><span class="dot">${count(k)}/${total(k)}</span></button>`).join('');document.querySelectorAll('.sidebutton[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===app.view));document.getElementById('mobileLinks').innerHTML=`<button data-nav="home">Overview</button>${keys.map(k=>`<button data-open="${k}">${esc(measures[k].title)}</button>`).join('')}<button data-nav="sources">Sources and scoring</button><button data-nav="privacy">Privacy and safety</button>`;document.getElementById('mobileLinks').classList.toggle('open',app.mobileOpen);}
function render(){renderNav();document.getElementById('crumb').textContent=app.view==='home'?'OVERVIEW / ASSESSMENTS':app.view==='privacy'?'PRIVACY / SAFETY':app.view==='sources'?'REFERENCE / SCORING':(app.view==='results'?'RESULTS / ':'ASSESSMENT / ')+measures[app.current].short.toUpperCase();document.getElementById('content').innerHTML=app.view==='home'?overview():app.view==='privacy'?privacy():app.view==='sources'?sources():app.view==='results'?results(app.current):questionnaire(app.current);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-open],[data-results],[data-rate],[data-step],[data-jump],[data-export],[data-print],[data-clear]');if(!b)return;e.preventDefault();if(b.dataset.open){openKey(b.dataset.open);return;}if(b.dataset.nav){nav(b.dataset.nav);return;}if(b.dataset.results){viewResults(b.dataset.results);return;}if(b.hasAttribute('data-rate')){app.answers[app.current][app.steps[app.current]]=Number(b.dataset.rate);render();return;}if(b.dataset.step){b.dataset.step==='next'?forward():back();return;}if(b.dataset.jump!==undefined){app.steps[app.current]=Number(b.dataset.jump);render();goTop();return;}if(b.dataset.export){exportData(b.dataset.export);return;}if(b.hasAttribute('data-print')){window.print();return;}if(b.hasAttribute('data-clear')){reset();return;}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-import'))importData(e.target.files?.[0]);if(e.target.id==='impact')app.impact[app.current]=e.target.value===''?null:Number(e.target.value);});
document.getElementById('mobileMenu').addEventListener('click',()=>{app.mobileOpen=!app.mobileOpen;renderNav();});
window.addEventListener('keydown',e=>{if(app.view!=='assessment'||!app.current||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;const k=app.current,n=options(k).length;if(/^[1-6]$/.test(e.key)&&Number(e.key)<=n){app.answers[k][app.steps[k]]=Number(e.key)-1;render();}if(e.key==='Enter'){e.preventDefault();forward();}});
window.__assessmentTest={app,measures,keys,total,count,done,options,score,summed,optionScore,viewResults,render};
render();
</script>
</body>
</html>
