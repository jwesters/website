<body>
<div class="app">
<aside class="side" id="sidebar">
<div class="identity"><span class="mark">✧</span><div><strong>Adult Self-<br>Assessment Studio</strong><small>PRIVATE · OFFLINE TOOL</small></div></div>
<div class="smallhead">Workspace</div><button class="sidebutton active" data-nav="home">◫ &nbsp; Overview</button>
<div class="smallhead">Assessments</div><div id="sideList"></div>
<div class="smallhead">Utilities</div><button class="sidebutton" data-nav="sources">ⓘ &nbsp; Sources &amp; scoring</button><button class="sidebutton" data-nav="privacy">◇ &nbsp; Privacy &amp; safety</button>
<div class="sidefooter"><strong>Not medical advice</strong>No diagnosis, treatment recommendation, or personal probability estimate is provided.</div>
</aside>
<main class="main"><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" id="mobileMenu" aria-label="Open menu">☰</button><span class="crumb" id="crumb">OVERVIEW / ASSESSMENTS</span></div><div class="topright"><span class="tiny-lock"></span> RESPONSES STAY IN THIS TAB</div></header><nav id="mobileLinks" class="mobilelinks"></nav><div class="content" id="content"></div></main>
</div>
<script>
'use strict';
const ASRS = [
'How often do you have trouble wrapping up the final details of a project, once the challenging parts have been done?',
'How often do you have difficulty getting things in order when you have to do a task that requires organization?',
'How often do you have problems remembering appointments or obligations?',
'When you have a task that requires a lot of thought, how often do you avoid or delay getting started?',
'How often do you fidget or squirm with your hands or feet when you have to sit down for a long time?',
'How often do you feel overly active and compelled to do things, like you were driven by a motor?'
];
const PHQ = [
'Little interest or pleasure in doing things',
'Feeling down, depressed, or hopeless',
'Trouble falling or staying asleep, or sleeping too much',
'Feeling tired or having little energy',
'Poor appetite or overeating',
'Feeling bad about yourself — or that you are a failure or have let yourself or your family down',
'Trouble concentrating on things, such as reading the newspaper or watching television',
'Moving or speaking so slowly that other people could have noticed? Or the opposite — being so fidgety or restless that you have been moving around a lot more than usual',
'Thoughts that you would be better off dead or of hurting yourself in some way'
];
const GAD = [
'Feeling nervous, anxious, or on edge',
'Not being able to stop or control worrying',
'Worrying too much about different things',
'Trouble relaxing',
'Being so restless that it is hard to sit still',
'Becoming easily annoyed or irritable',
'Feeling afraid as if something awful might happen'
];
const wfDomains = [
{id:'A',name:'Family',count:8,page:1},
{id:'B',name:'Work',count:11,page:1},
{id:'C',name:'School',count:10,page:1},
{id:'D',name:'Life skills',count:12,page:1},
{id:'E',name:'Self-concept',count:5,page:2},
{id:'F',name:'Social',count:9,page:2},
{id:'G',name:'Risk',count:14,page:2}
];
const wsDomains = [
{id:'01',name:'Attention',count:9,page:1},
{id:'02',name:'Hyperactivity and impulsivity',count:9,page:1},
{id:'03',name:'Oppositional',count:8,page:1},
{id:'04',name:'Development and learning',count:6,page:2},
{id:'05',name:'Autism spectrum',count:6,page:2},
{id:'06',name:'Motor disorders',count:3,page:2},
{id:'07',name:'Psychosis',count:4,page:2},
{id:'08',name:'Depression',count:11,page:2},
{id:'09',name:'Mood regulation',count:7,page:3},
{id:'10',name:'Suicide',count:2,page:3},
{id:'11',name:'Anxiety',count:11,page:3},
{id:'12',name:'Stress-related disorders',count:4,page:3},
{id:'13',name:'PTSD',count:3,page:3},
{id:'14',name:'Sleep',count:3,page:4},
{id:'15',name:'Eating',count:5,page:4},
{id:'16',name:'Conduct',count:11,page:4},
{id:'17',name:'Substance use',count:7,page:4},
{id:'18',name:'Addictions',count:3,page:5},
{id:'19',name:'Personality',count:11,page:5},
{id:'20',name:'Other concern (optional)',count:1,page:5,optional:true}
];
const meta={
asrs:{title:'Adult ADHD Screener',short:'ASRS v1.1 · 6 items',category:'Interactive questionnaire',length:6,about:'Screens for adult ADHD symptoms over the past six months. Uses the six-question, electronically permitted ASRS v1.1 screener.',purpose:'Over the past six months, how often have you experienced the following?',source:'https://www.hcp.med.harvard.edu/ncs/asrs.php',sourceName:'Official ASRS information'},
phq:{title:'Depression Symptoms',short:'PHQ-9 · 9 items',category:'Interactive questionnaire',length:9,about:'Explores symptoms of depression over the last two weeks. Total score describes symptom severity, not a diagnosis.',purpose:'Over the last two weeks, how often have you been bothered by these problems?',source:'https://www.nih.gov/node/19946',sourceName:'PHQ-9 information'},
gad:{title:'Anxiety Symptoms',short:'GAD-7 · 7 items',category:'Interactive questionnaire',length:7,about:'Explores anxiety symptoms over the last two weeks. Total score describes symptom severity, not a diagnosis.',purpose:'Over the last two weeks, how often have you been bothered by these problems?',source:'https://www.phqscreeners.com/',sourceName:'GAD-7 information'},
wfirs:{title:'Everyday Functioning',short:'WFIRS-S · 69 items',category:'Official-PDF scoring companion',length:69,about:'Scores seven areas of functioning. Enter the ratings from the official WFIRS-S PDF without changing its questions.',purpose:'Using the original WFIRS-S PDF, rate how emotional or behavioural problems affected functioning during the past month.',source:'https://www.caddra.ca/wp-content/uploads/WFIRS-S.pdf',sourceName:'Official WFIRS-S PDF'},
wsr:{title:'Broad Symptom Review',short:'WSR-II · 123 items + optional',category:'Official-PDF scoring companion',length:123,about:'Scores broad mental-health symptom domains. Use the official WSR-II PDF alongside this numbered response sheet.',purpose:'Read each item in the official WSR-II PDF, then enter its rating here. Unanswered items prevent scoring.',source:'https://www.caddra.ca/wp-content/uploads/WSR-II.pdf',sourceName:'Official WSR-II PDF'}
};
const keys=['asrs','phq','gad','wfirs','wsr'];
const answers={asrs:Array(6).fill(null),phq:Array(9).fill(null),gad:Array(7).fill(null),wfirs:{},wsr:{}};
const app={view:'home',current:null,steps:{asrs:0,phq:0,gad:0,wfirs:0,wsr:0},answers,consent:false,impact:{phq:null,gad:null},localPdf:{},pdfVisible:{},revealAnswers:{},mobileOpen:false};
const svg={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isSmall(k){return ['asrs','phq','gad'].includes(k);}
function domainList(k){return k==='wfirs'?wfDomains:wsDomains;}
function allItems(k){if(isSmall(k))return (k==='asrs'?ASRS:k==='phq'?PHQ:GAD).map((text,i)=>({id:String(i),text}));return domainList(k).filter(d=>!d.optional).flatMap(d=>Array.from({length:d.count},(_,i)=>({id:d.id+'-'+(i+1),section:d,text:'Item '+(i+1)})));}
function getAnswered(k){let items=allItems(k);if(isSmall(k))return items.filter(x=>Number.isInteger(app.answers[k][Number(x.id)])).length;return items.filter(x=>{let v=app.answers[k][x.id];return Number.isInteger(v)||v==='na';}).length;}
function needed(k){return allItems(k).length;}
function completed(k){return getAnswered(k)===needed(k);}
function goTop(){window.scrollTo({top:0,behavior:'instant'});}
function notice(){return `<div class="notice"><span class="symbol">ⓘ</span><div><strong>Important: informational screening only — not medical advice.</strong>This tool does not diagnose ADHD, depression, anxiety, or any other condition. Results are not a percentage likelihood of a diagnosis, a treatment recommendation, or a substitute for evaluation by a qualified healthcare professional. Screening can miss conditions or flag symptoms caused by other factors.</div></div>`;}
function crisis(){return `<div class="notice alert"><span class="symbol">♡</span><div><strong>Support matters more than a score.</strong>If you are thinking about suicide or self-harm, contact a healthcare professional or someone you trust promptly. In Canada, call or text <strong style="display:inline">988</strong> for 24/7 suicide crisis support. If you or someone else is in immediate danger, call <strong style="display:inline">911</strong> or local emergency services. This page cannot monitor your safety or send an alert.</div></div>`;}
function openKey(k){app.current=k;app.view='assessment';app.mobileOpen=false;render();goTop();}
function nav(v){app.view=v;app.mobileOpen=false;render();goTop();}
function resetAll(){if(!confirm('Clear all responses and results from this tab? This cannot be undone.'))return;keys.forEach(k=>{if(isSmall(k))app.answers[k].fill(null);else app.answers[k]={};app.steps[k]=0;});app.impact={phq:null,gad:null};nav('home');}
function overview(){let html=`<section class="hero"><div class="eyebrow">YOUR PRIVATE SCREENING WORKSPACE</div><h1>A clearer picture of your wellbeing, one question at a time.</h1><p>Explore five established adult questionnaires, understand the scoring, and take a useful summary to a professional if you choose.</p></section>${notice()}<div class="section-title"><h2>Choose an assessment</h2><p>Complete any or all, in any order</p></div><div class="cards">`;
keys.forEach(k=>{let m=meta[k],n=getAnswered(k),total=needed(k),comp=!isSmall(k);html+=`<article class="card"><span class="tag ${comp?'companion':''}">${comp?'SCORING COMPANION':'DIRECTLY INTERACTIVE'}</span><h3>${esc(m.title)}</h3><div class="muted" style="font-weight:800">${esc(m.short)}</div><p>${esc(m.about)}</p><div class="progressline"><div class="progressfill" style="width:${Math.round(n/total*100)}%"></div></div><div class="cardfoot"><span class="meta">${n} / ${total} answered</span><button type="button" class="btn small" data-open="${k}">${n?'Continue':'Begin'} →</button></div></article>`});
html+=`</div><div class="section-title"><h2>How it works</h2></div><div class="bulletsection"><div class="info"><h3>✓ Designed for personal use</h3><p>The ADHD, depression and anxiety questionnaires are completed directly here. For the two Weiss assessments, open the official PDF and enter each item’s rating into the companion scorer.</p></div><div class="info"><h3>◇ You control your information</h3><p>Answers stay in this open browser tab. They are not uploaded or automatically saved. Exports happen only if you choose them. Closing or reloading the page clears unsaved responses.</p></div></div><div class="actions"><button class="btn ghost" data-nav="sources">Read scoring rules</button><button class="btn ghost" data-nav="privacy">Privacy &amp; safety</button><button class="btn ghost" data-export="json">Save progress (.json)</button><label class="btn ghost" style="cursor:pointer">Restore saved progress<input type="file" accept=".json,application/json" data-import hidden></label></div>`;
return html;}
function questionOptions(k){return k==='asrs'?['Never','Rarely','Sometimes','Often','Very Often']:['Not at all','Several days','More than half the days','Nearly every day'];}
function questionnaire(k){let m=meta[k],idx=app.steps[k],q=k==='asrs'?ASRS:k==='phq'?PHQ:GAD, val=app.answers[k][idx],n=getAnswered(k),opts=questionOptions(k);
let html=`<div class="assessmenthead"><div><span class="sectionmark">${esc(m.short)}</span><h1>${esc(m.title)}</h1><span class="muted">${esc(m.purpose)}</span></div><button class="btn ghost small" data-nav="home">← All assessments</button></div><div class="progressline"><div class="progressfill" style="width:${Math.round(n/q.length*100)}%"></div></div><div class="muted" style="text-align:right;margin-bottom:17px">${n} of ${q.length} answered</div><div class="assessmentgrid"><section class="whitepanel"><div class="stepbadge">QUESTION ${idx+1} / ${q.length}</div><h2 class="question">${esc(q[idx])}</h2><div class="choices" role="group" aria-label="Select your response">`;
opts.forEach((t,i)=>{html+=`<button class="choice ${val===i?'selected':''}" data-rate="${i}" aria-pressed="${val===i}"><span class="radio"></span><span style="flex:1">${esc(t)}</span><span class="opt-index">${i+1}</span></button>`});
html+=`</div>`;
if(k==='phq'&&idx===8)html+=`<div style="margin-top:17px">${crisis()}</div>`;
if((k==='phq'||k==='gad')&&idx===q.length-1)html+=`<div class="fieldline" style="margin-top:24px"><label for="impact">Optional: How difficult have these problems made it to work, manage home, or get along with people? (Not included in the total score.)</label><select id="impact" style="padding:10px;border:1px solid #cddfdf;border-radius:9px;width:100%"><option value="">Prefer not to say</option>${['Not difficult at all','Somewhat difficult','Very difficult','Extremely difficult'].map((t,i)=>`<option value="${i}" ${app.impact[k]===i?'selected':''}>${t}</option>`).join('')}</select></div>`;
html+=`<div class="controlrow"><button class="btn ghost" data-step="back" ${idx===0?'disabled':''}>← Previous</button><div style="display:flex;gap:7px">${completed(k)?`<button class="btn soft" data-results="${k}">View results</button>`:''}<button class="btn" data-step="next" ${val===null?'disabled':''}>${idx===q.length-1?'See results':'Next question →'}</button></div></div><div class="key" style="margin-top:17px">Tip: use keys 1–${opts.length} to choose; press Enter to continue. You can revisit any answer.</div></section><aside class="asidebox"><h3>About this questionnaire</h3><p>${esc(m.about)}</p><div class="mini-divider"></div><h3>What you’ll receive</h3><p>${k==='asrs'?'A positive or below-threshold screening result based on the number of answers in the original scoring categories.':'A total score with established symptom-severity bands. A score alone cannot confirm a disorder.'}</p><div class="mini-divider"></div><button class="btn ghost small" data-export="json">Save progress</button><div class="mini-divider"></div><a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">Original source ↗</a></aside></div>`;
return html;}
function scoreValue(k,id){return app.answers[k][id];}
function domainProgress(k,d){let a=Array.from({length:d.count},(_,i)=>scoreValue(k,d.id+'-'+(i+1)));return a.filter(x=>Number.isInteger(x)||x==='na').length;}
function dangerFromAnswers(){return Number(app.answers.phq[8])>0||Number(app.answers.wsr['10-1'])>0||Number(app.answers.wsr['10-2'])>0;}
function companion(k){let domains=domainList(k),idx=app.steps[k],d=domains[idx],m=meta[k],n=getAnswered(k),tot=needed(k),qcount=domainProgress(k,d),origin=app.localPdf[k]||m.source+'#page='+d.page;
let html=`<div class="assessmenthead"><div><span class="sectionmark">${esc(m.short)}</span><h1>${esc(m.title)}</h1><span class="muted">${esc(m.purpose)}</span></div><button class="btn ghost small" data-nav="home">← All assessments</button></div><div class="progressline"><div id="compProgress" class="progressfill" style="width:${Math.round(100*n/tot)}%"></div></div><div id="compCount" class="muted" style="text-align:right;margin-bottom:15px">${n} of ${tot} entered</div><div class="domainnav">${domains.map((t,i)=>`<button class="domainchip ${idx===i?'active':''} ${domainProgress(k,t)===t.count?'done':''}" data-domain="${i}" title="${esc(t.name)}">${esc(t.id)} · ${esc(t.name)}</button>`).join('')}</div><div class="assessmentgrid"><section class="whitepanel"><div class="stepbadge">SECTION ${idx+1} / ${domains.length}</div><h2 class="question" style="margin-bottom:9px">${esc(d.name)}</h2><div class="muted" id="domainCount" style="margin-bottom:17px">${qcount} of ${d.count} responses completed · Match item numbers to the official PDF; the original questionnaire wording is not reproduced here.</div><div class="notice" style="margin:0 0 15px"><span class="symbol">↗</span><div><strong>Use the original questionnaire for every item.</strong><a href="${esc(m.source)}#page=${d.page}" target="_blank" rel="noopener noreferrer">Open official PDF (page ${d.page}) ↗</a> and then mark its matching item numbers below. This companion is for scoring, not a rewritten or substituted questionnaire.</div></div><div class="fieldline"><button class="btn ghost small" data-toggle-pdf="${k}">${app.pdfVisible[k]?'Hide PDF viewer':'Show PDF viewer'}</button><label class="btn ghost small" style="cursor:pointer">Load a PDF from device<input type="file" accept="application/pdf,.pdf" data-pdf-file="${k}" hidden></label>${app.localPdf[k]?'<span class="muted">Using local PDF</span>':''}</div>`;
if(app.pdfVisible[k])html+=`<div class="viewer"><iframe title="Questionnaire PDF viewer" src="${esc(origin)}" loading="lazy"></iframe><div class="viewerhelp">Online PDF requires an internet connection. A local PDF loaded from your device stays on your device and is not uploaded. Some browsers may block embedded PDFs; use the open-in-new-tab link above if needed.</div></div>`;
html+=`<div class="rows">`;
for(let i=1;i<=d.count;i++){let id=d.id+'-'+i,v=scoreValue(k,id);html+=`<div class="itemrow"><div class="itemlabel">${esc(d.id)} · Item ${i}${d.optional?' (optional)':''}<small>Answer using the wording from the official PDF.</small></div><div class="ratinggroup" aria-label="Rating for ${esc(d.name)} item ${i}">${[0,1,2,3,'na'].map(num=>`<button class="rate ${v===num?'active':''}" data-entry="${esc(id)}" data-val="${num}" title="${['None / never','Mild / sometimes','Moderate / often','Severe / very often','Not applicable'][num==='na'?4:num]}" aria-pressed="${v===num}">${num==='na'?'N/A':num}</button>`).join('')}</div></div>`;}
html+=`</div>`;
if(k==='wsr'&&d.id==='10')html+=crisis();
html+=`<div class="controlrow"><button class="btn ghost" data-step="back" ${idx===0?'disabled':''}>← Previous section</button><div style="display:flex;gap:7px">${completed(k)?`<button class="btn soft" data-results="${k}">Results</button>`:''}<button class="btn" data-step="next" ${idx===domains.length-1?'disabled':''}>Next section →</button></div></div></section><aside class="asidebox"><h3>Scoring companion</h3><p>The Weiss questionnaire text is copyrighted. We have linked to the official version rather than embedding or altering the item wording.</p><div class="mini-divider"></div><h3>Rating guide</h3><p><strong>0</strong> — ${k==='wfirs'?'Never / not at all':'None'}</p><p><strong>1</strong> — ${k==='wfirs'?'Sometimes / somewhat':'Mild'}</p><p><strong>2</strong> — ${k==='wfirs'?'Often / much':'Moderate'}</p><p><strong>3</strong> — ${k==='wfirs'?'Very often / very much':'Severe'}</p><p><strong>N/A</strong> — Not relevant; excluded from averages</p><div class="mini-divider"></div><button class="btn ghost small" data-export="json">Save progress</button><div class="mini-divider"></div><p>${k==='wfirs'?'A domain is flagged if its average is ≥ 1.5, two items are scored 2, or one is scored 3.':'A domain average ≥ 1.5 is flagged. Individual answers of 2 or 3 also merit professional review.'}</p><a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">Original PDF ↗</a></aside></div>`;
return html;}
function severity(k,n){if(k==='phq')return n<=4?'Minimal':n<=9?'Mild':n<=14?'Moderate':n<=19?'Moderately severe':'Severe';return n<=4?'Minimal':n<=9?'Mild':n<=14?'Moderate':'Severe';}
function simpleScore(k){if(k==='asrs'){let flagged=app.answers.asrs.reduce((acc,v,i)=>acc+(v>=(i<3?2:3)?1:0),0);return{score:flagged,max:6,flag:flagged>=4,status:flagged>=4?'Positive screen':'Below screening threshold'};}let n=app.answers[k].reduce((a,b)=>a+b,0);return{score:n,max:k==='phq'?27:21,flag:n>=10,status:severity(k,n)};}
function domainScore(k,d){let values=Array.from({length:d.count},(_,i)=>app.answers[k][d.id+'-'+(i+1)]).filter(Number.isInteger),sum=values.reduce((a,b)=>a+b,0),mean=values.length?sum/values.length:null,n2=values.filter(n=>n===2).length,n3=values.filter(n=>n===3).length,significant=k==='wfirs'?(mean!==null&&(mean>=1.5||n2>=2||n3>=1)):(mean!==null&&mean>=1.5),items2=values.filter(n=>n>=2).length;return{sum,mean,n:values.length,n2,n3,items2,significant};}
function results(k){if(!completed(k))return incomplete(k);let m=meta[k], html=`<section class="reshead"><span class="eyebrow">YOUR RESULTS · ${esc(m.short)}</span><h2>${esc(m.title)}</h2><p>Completed ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})} · For informational screening only, not diagnosis.</p></section>${notice()}`;
if(dangerFromAnswers()&&(k==='phq'||k==='wsr'))html+=crisis();
if(isSmall(k)){let s=simpleScore(k);html+=`<div class="metricgrid"><div class="metric"><h3>${k==='asrs'?'Shaded-response count':'Total symptom score'}</h3><strong>${s.score}<span class="muted"> / ${s.max}</span></strong><div class="bartrack"><div class="barfill" style="width:${100*s.score/s.max}%"></div></div><p>${k==='asrs'?'Count uses the original six-question shaded-response rule.':'All items scored 0–3, summed across the scale.'}</p></div><div class="metric"><h3>Screening interpretation</h3><span class="status ${s.flag?'flag':''}">${esc(s.status)}</span><p>${k==='asrs'?(s.flag?'Four or more marked responses fall in the original screener’s scoring categories. Consider speaking with a qualified professional.':'Fewer than four marked responses fall in the original screener’s scoring categories. This does not rule out ADHD.'):'This describes symptom frequency over the previous two weeks. Other explanations may be possible; only a clinician can evaluate diagnostic criteria.'}</p></div></div>`;
if(k==='asrs')html+=`<div class="info" style="margin-top:17px"><h3>How the ADHD screening rule works</h3><p>For questions 1–3, Sometimes / Often / Very Often count as a marked response. For questions 4–6, Often / Very Often count. Four or more marked responses indicate a positive screen. <strong>This is not a probability or a diagnosis.</strong></p></div>`;
else html+=`<div class="info" style="margin-top:17px"><h3>What the categories mean</h3><p>${k==='phq'?'0–4 minimal · 5–9 mild · 10–14 moderate · 15–19 moderately severe · 20–27 severe':'0–4 minimal · 5–9 mild · 10–14 moderate · 15–21 severe'}. These are symptom-severity categories, not proof of a particular condition.</p>${app.impact[k]!==null?`<p style="margin-top:9px"><strong>Reported functional difficulty:</strong> ${esc(['Not difficult at all','Somewhat difficult','Very difficult','Extremely difficult'][app.impact[k]])} (not part of total).</p>`:''}</div>`;
if(k==='phq'&&app.answers.phq[8]>0)html+=`<div class="inlinewarning"><strong>Important response to item 9:</strong> You reported some thoughts of death or self-harm. Your total score cannot tell whether you are safe. Please speak promptly with a clinician or trusted person. In Canada, call/text 988; in immediate danger, call 911.</div>`;
html+=`<div class="whitepanel" style="margin-top:17px"><h3 class="chartheading">Response pattern</h3>${allItems(k).map(x=>{let v=app.answers[k][Number(x.id)],max=k==='asrs'?4:3;return `<div class="domainresult"><div><div class="domaintitle">Item ${Number(x.id)+1}</div><div class="domainsub">${esc(x.text)}</div></div><div><div style="font-size:12px;font-weight:800">${esc(questionOptions(k)[v])}</div><div class="bartrack"><div class="barfill" style="width:${100*v/max}%"></div></div></div><div class="status">${v} / ${max}</div></div>`}).join('')}</div>`;
}else{
let domains=domainList(k).filter(d=>!d.optional),arr=domains.map(d=>({...d,stats:domainScore(k,d)})),flags=arr.filter(d=>d.stats.significant).length,concerns=arr.reduce((a,d)=>a+d.stats.items2,0);html+=`<div class="metricgrid"><div class="metric"><h3>Domains reaching the published flag threshold</h3><strong>${flags}<span class="muted"> / ${domains.length}</span></strong><p>Flagged areas suggest topics to discuss with a qualified professional, not a list of diagnoses.</p></div><div class="metric"><h3>Responses rated 2 or 3</h3><strong>${concerns}</strong><p>${k==='wfirs'?'A domain may also be flagged by two ratings of 2 or a single rating of 3.':'The WSR-II guidance advises further evaluation of any response rated 2 or 3, even when its domain average is below 1.5.'}</p></div></div><section class="whitepanel" style="margin-top:17px"><h3 class="chartheading">Domain-level results</h3><p class="muted" style="margin:0 0 8px">Average of applicable scored items; N/A responses excluded. An empty domain is not given a score. An average of 1.5 is a screening flag, not a diagnosis.</p>${arr.map(d=>{let s=d.stats;return `<div class="domainresult"><div><div class="domaintitle">${esc(d.name)}</div><div class="domainsub">${s.n} applicable · ${s.items2} items scored 2–3</div></div><div><div style="font-size:12px;font-weight:800">${s.mean===null?'N/A':s.mean.toFixed(2)+' / 3'}</div><div class="bartrack"><div class="barfill" style="width:${s.mean===null?0:100*s.mean/3}%"></div></div></div><span class="status ${s.significant?'flag':''}">${s.mean===null?'No score':s.significant?'Flagged':'Below threshold'}</span></div>`}).join('')}</section>`;
if(k==='wsr')html+=`<div class="info" style="margin-top:17px"><h3>Additional WSR-II screening note</h3><p>For WSR-II, even if a domain average is below 1.5, any applicable item scored 2 or 3 is worth further clinical evaluation. The categories do not have separately validated diagnostic-probability cutoffs.</p></div>`;
if(k==='wfirs')html+=`<div class="info" style="margin-top:17px"><h3>Functional impact is different from symptom diagnosis</h3><p>WFIRS-S describes where emotional or behavioural difficulties affect day-to-day functioning. A flagged domain does not identify which condition causes the difficulty.</p></div>`;
}
html+=`<div class="actions"><button class="btn" data-back-review="${k}">Review answers</button><button class="btn ghost" data-print>Print / save as PDF</button><button class="btn ghost" data-export="json">Export response data</button><button class="btn ghost" data-export="csv">Export CSV</button><button class="btn ghost" data-nav="home">Other assessments</button></div><div class="sourcecite">Methodology: <a href="${esc(m.source)}" target="_blank" rel="noopener noreferrer">${esc(m.sourceName)}</a>. Other source links and permission notes are in <a href="#" data-nav="sources">Sources &amp; scoring</a>.</div><div class="bottom">This computer-generated interpretation has not been reviewed by a healthcare professional. If you have concerns regardless of your score, seek clinical advice.</div>`;
return html;}
function incomplete(k){let remaining=needed(k)-getAnswered(k);return `<div class="reshead"><h2>Complete the questionnaire to see results</h2><p>${remaining} item${remaining!==1?'s':''} still require an answer or N/A selection.</p></div><div class="actions"><button class="btn" data-back-review="${k}">Return to questions</button></div>${notice()}`;}
function sources(){return `<section class="hero"><div class="eyebrow">TRANSPARENT METHODOLOGY</div><h1>Scoring rules and original sources</h1><p>Every assessment keeps its own scoring criteria. There is deliberately no combined diagnosis score or percentage likelihood.</p></section>${notice()}<div class="section-title"><h2>Original instruments</h2></div><div class="linkgrid"><a class="linktile" href="https://www.hcp.med.harvard.edu/ncs/asrs.php" target="_blank" rel="noopener noreferrer">ASRS v1.1 six-question screener ↗</a><a class="linktile" href="https://www.nih.gov/node/19946" target="_blank" rel="noopener noreferrer">PHQ-9 · NIH ↗</a><a class="linktile" href="https://www.phqscreeners.com/" target="_blank" rel="noopener noreferrer">GAD-7 · PHQ Screeners ↗</a><a class="linktile" href="https://www.caddra.ca/wp-content/uploads/WFIRS-S.pdf" target="_blank" rel="noopener noreferrer">WFIRS-S · official questionnaire ↗</a><a class="linktile" href="https://www.caddra.ca/wp-content/uploads/WSR-II.pdf" target="_blank" rel="noopener noreferrer">WSR-II · official questionnaire ↗</a><a class="linktile" href="https://adhdtreat.caddra.ca/wp-content/uploads/2025/01/Weiss-Functional-Impairment-Rating-Scale-Self-WFIRS-S%E2%80%93Scoring-Guide-1.pdf" target="_blank" rel="noopener noreferrer">WFIRS-S · scoring guide ↗</a><a class="linktile" href="https://adhdtreat.caddra.ca/wp-content/uploads/2025/01/Weiss-Symptom-Record-II-WSR-II-%E2%80%93-Scoring-Guide.pdf" target="_blank" rel="noopener noreferrer">WSR-II · scoring guide ↗</a></div><div class="section-title"><h2>What the scores actually mean</h2></div><div class="bulletsection"><div class="info"><h3>ASRS v1.1 · six-question adult screener</h3><p>Five response options. The first three items are shaded if answered Sometimes or more often; the last three if answered Often or Very Often. Four or more shaded responses means a positive ADHD screen, not a confirmed diagnosis. The original 18-item checklist requires separate rights to reproduce electronically, so this app uses only the licensed six-item screener.</p></div><div class="info"><h3>PHQ-9 · symptom severity</h3><p>Sum nine responses (0–3) for 0–27. Bands: minimal 0–4; mild 5–9; moderate 10–14; moderately severe 15–19; severe 20–27. Item 9 is a safety flag whenever above zero; a low total does not cancel that concern.</p></div><div class="info"><h3>GAD-7 · symptom severity</h3><p>Sum seven responses (0–3) for 0–21. Bands: minimal 0–4; mild 5–9; moderate 10–14; severe 15–21. These measure symptom levels, not an individual’s diagnostic probability.</p></div><div class="info"><h3>WFIRS-S · functioning</h3><p>For each domain, average all applicable items, excluding N/A. Flag a domain if mean ≥ 1.5 OR at least two items are rated 2 OR one item is rated 3. If all items are N/A, report no score. This is not an ADHD diagnosis.</p></div><div class="info"><h3>WSR-II · broad symptom record</h3><p>For each domain, average applicable items (0–3). Mean ≥ 1.5 is a follow-up flag. Separately, any item scored 2 or 3 merits professional review, even when the mean is lower. The optional Other field is excluded from standard domain counts.</p></div><div class="info"><h3>Copyright and permissions</h3><p>ASRS v1.1 six-item screener: © New York University and the President and Fellows of Harvard College. Created by Dr. Lenard Adler and Dr. Ronald Kessler; electronic use is permitted with attribution and no modifications to the scale. PHQ-9/GAD-7 are public domain. WFIRS-S/WSR-II © Margaret Danielle Weiss, MD, PhD: original item text is intentionally not reproduced here. Contact the rights holder before posting or reproducing Weiss instruments online. Linked scoring guides © CADDRA.</p></div></div><div class="actions"><button class="btn" data-nav="home">Back to assessments</button></div>`;}
function privacy(){return `<section class="hero"><div class="eyebrow">HOW THIS APP HANDLES INFORMATION</div><h1>Private by design. Clear about its limitations.</h1><p>Your answers are not sent to a server and cannot be reviewed by anyone through this app.</p></section>${notice()}${crisis()}<div class="section-title"><h2>Privacy and safety</h2></div><div class="bulletsection"><div class="info"><h3>No accounts, analytics, or uploads</h3><p>Questionnaire responses are held only in this page’s temporary memory. There are no online API requests for scoring or automatic response uploads. Opening external source links contacts those websites, but does not share your completed answers.</p></div><div class="info"><h3>You choose what to export</h3><p>Printing or downloading CSV/JSON creates a local file that you control. Those files may contain sensitive responses. Store them securely, especially on a shared computer.</p></div><div class="info"><h3>Closing the tab clears unsaved answers</h3><p>No automatic browser saving is used. Refreshing or closing this tab can erase answers. You can export a JSON copy from a results screen if you want a record.</p></div><div class="info"><h3>Not a medical tool</h3><p>There is no clinical supervision, diagnosis, monitoring, or emergency response. Symptoms overlap across conditions and can relate to sleep, stress, medication, physical illness, or many other causes.</p></div><div class="info"><h3>Sensitive questions</h3><p>Some assessments ask about self-harm, suicide, trauma, substance use, or abuse. You can stop at any time. For urgent help in Canada, call/text 988, and for immediate emergencies call 911.</p></div><div class="info"><h3>Scope of the included tools</h3><p>ASRS, PHQ-9 and GAD-7 are directly interactive. WFIRS-S and WSR-II are linked official-PDF response scorers rather than reproductions of the copyrighted question text. They require the original PDFs for accurate completion.</p></div></div><div class="actions"><button class="btn" data-nav="home">Back to assessments</button><button class="btn ghost" data-export="json">Save progress</button><label class="btn ghost" style="cursor:pointer">Restore progress<input type="file" accept=".json,application/json" data-import hidden></label><button class="btn danger" data-clear>Clear responses from this tab</button></div>`;}
function exportData(format){const data={title:'Adult Self-Assessment Studio',timestamp:new Date().toISOString(),disclaimer:'Educational screening only; not medical advice, diagnosis, clinical probability estimate or crisis monitoring.',answers:app.answers,impact:app.impact,scored:{}};keys.forEach(k=>{if(completed(k)){data.scored[k]=isSmall(k)?simpleScore(k):domainList(k).filter(d=>!d.optional).map(d=>({name:d.name,...domainScore(k,d)}));}});if(format==='json')return download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'Adult_Self_Assessment_Responses.json');let csv='Questionnaire,Item,Domain,Score\r\n';keys.forEach(k=>{allItems(k).forEach(it=>{let value=isSmall(k)?app.answers[k][Number(it.id)]:app.answers[k][it.id];if(value===null||value===undefined)return;const cols=[k,it.id,it.section?.name||'',value];csv+=cols.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')+'\r\n';});});return download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'Adult_Self_Assessment_Responses.csv');}
async function importData(file){if(!file)return;try{if(file.size>2000000)throw new Error('File is too large.');const data=JSON.parse(await file.text());if(data.title!=='Adult Self-Assessment Studio'||!data.answers||typeof data.answers!=='object')throw new Error('Not a recognized assessment progress file.');if(!confirm('Restore this saved progress? This will replace answers currently in this tab.'))return;keys.forEach(k=>{if(isSmall(k)){const incoming=Array.isArray(data.answers[k])?data.answers[k]:[];const max=k==='asrs'?4:3;app.answers[k]=Array.from({length:needed(k)},(_,i)=>Number.isInteger(incoming[i])&&incoming[i]>=0&&incoming[i]<=max?incoming[i]:null);}else{const incoming=data.answers[k]||{},obj=Object.create(null);domainList(k).forEach(d=>{for(let i=1;i<=d.count;i++){const id=d.id+'-'+i,value=incoming[id];if(value==='na'||Number.isInteger(value)&&value>=0&&value<=3)obj[id]=value;}});app.answers[k]=obj;}app.steps[k]=0;});app.impact={phq:null,gad:null};for(let k of ['phq','gad']){let v=data.impact?.[k];if(Number.isInteger(v)&&v>=0&&v<=3)app.impact[k]=v;}nav('home');alert('Saved responses restored.');}catch(err){alert('Could not restore this file: '+err.message);}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function sidebarRender(){let lines=keys.map(k=>`<button class="sidebutton ${app.current===k&&['assessment','results'].includes(app.view)?'active':''}" data-open="${k}"><span>${({asrs:'◉',phq:'◈',gad:'◌',wfirs:'◎',wsr:'✳'})[k]}</span><span>${esc(meta[k].short.split(' · ')[0])}</span><span class="dot">${getAnswered(k)}/${needed(k)}</span></button>`).join('');document.getElementById('sideList').innerHTML=lines;document.getElementById('mobileLinks').innerHTML=`<button data-nav="home">Overview</button>${keys.map(k=>`<button data-open="${k}">${esc(meta[k].title)}</button>`).join('')}<button data-nav="sources">Sources &amp; scoring</button><button data-nav="privacy">Privacy &amp; safety</button>`;document.getElementById('mobileLinks').classList.toggle('open',app.mobileOpen);document.querySelectorAll('.sidebutton[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===app.view));}
function render(){sidebarRender();let k=app.current;document.getElementById('crumb').textContent=app.view==='home'?'OVERVIEW / ASSESSMENTS':app.view==='sources'?'REFERENCE / SCORING':app.view==='privacy'?'PRIVACY / SAFETY':(app.view==='results'?'RESULTS / ':'ASSESSMENT / ')+(k?meta[k].short.toUpperCase():'');let html=app.view==='home'?overview():app.view==='privacy'?privacy():app.view==='sources'?sources():app.view==='results'?results(k):isSmall(k)?questionnaire(k):companion(k);document.getElementById('content').innerHTML=html;}
function review(k){app.current=k;app.view='assessment';if(isSmall(k)){let missing=app.answers[k].findIndex(x=>x===null);if(missing>=0)app.steps[k]=missing;}else{let idx=domainList(k).findIndex(d=>domainProgress(k,d)!==d.count);if(idx>=0)app.steps[k]=idx;}render();goTop();}
function next(){let k=app.current;if(isSmall(k)){if(app.answers[k][app.steps[k]]===null)return;if(app.steps[k]===needed(k)-1){if(completed(k))showResults(k);else review(k);}else{app.steps[k]++;render();goTop();}}else{app.steps[k]=Math.min(domainList(k).length-1,app.steps[k]+1);render();goTop();}}
function prev(){let k=app.current;app.steps[k]=Math.max(0,app.steps[k]-1);render();goTop();}
function showResults(k){app.current=k;app.view='results';render();goTop();}
window.addEventListener('keydown',e=>{if(app.view!=='assessment'||!app.current||!isSmall(app.current)||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;let k=app.current,opts=questionOptions(k);if(/^[1-5]$/.test(e.key)&&Number(e.key)<=opts.length){app.answers[k][app.steps[k]]=Number(e.key)-1;render();}if(e.key==='Enter'){e.preventDefault();next();}});
document.addEventListener('click',e=>{let t=e.target.closest('[data-nav],[data-open],[data-rate],[data-step],[data-domain],[data-entry],[data-results],[data-back-review],[data-clear],[data-print],[data-export],[data-toggle-pdf]');if(!t)return;e.preventDefault();if(t.dataset.open){openKey(t.dataset.open);return;}if(t.dataset.nav){nav(t.dataset.nav);return;}if(t.dataset.rate!==undefined){let k=app.current;app.answers[k][app.steps[k]]=Number(t.dataset.rate);render();return;}if(t.dataset.step){t.dataset.step==='next'?next():prev();return;}if(t.dataset.domain!==undefined){app.steps[app.current]=Number(t.dataset.domain);render();goTop();return;}if(t.dataset.entry!==undefined){let k=app.current,v=t.dataset.val;app.answers[k][t.dataset.entry]=v==='na'?'na':Number(v);let row=t.closest('.itemrow');row?.querySelectorAll('.rate').forEach(b=>{let selected=b.dataset.val===v;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});let n=getAnswered(k),tot=needed(k),domain=domainList(k)[app.steps[k]];let progress=document.getElementById('compProgress'),count=document.getElementById('compCount'),dc=document.getElementById('domainCount');if(progress)progress.style.width=Math.round(100*n/tot)+'%';if(count)count.textContent=n+' of '+tot+' entered';if(dc)dc.textContent=domainProgress(k,domain)+' of '+domain.count+' responses completed · Match item numbers to the official PDF; the original questionnaire wording is not reproduced here.';let chip=document.querySelector('.domainchip.active');if(chip)chip.classList.toggle('done',domainProgress(k,domain)===domain.count);return;}if(t.dataset.results){showResults(t.dataset.results);return;}if(t.dataset.backReview){review(t.dataset.backReview);return;}if(t.hasAttribute('data-clear')){resetAll();return;}if(t.hasAttribute('data-print')){window.print();return;}if(t.dataset.export){exportData(t.dataset.export);return;}if(t.dataset.togglePdf){app.pdfVisible[t.dataset.togglePdf]=!app.pdfVisible[t.dataset.togglePdf];render();return;}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-import')){importData(e.target.files?.[0]);return;}if(e.target.id==='impact'){app.impact[app.current]=e.target.value===''?null:Number(e.target.value);return;}if(e.target.dataset.pdfFile){let k=e.target.dataset.pdfFile,file=e.target.files?.[0];if(!file)return;if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){alert('Please choose a PDF file.');return;}if(app.localPdf[k]?.startsWith('blob:'))URL.revokeObjectURL(app.localPdf[k]);app.localPdf[k]=URL.createObjectURL(file);app.pdfVisible[k]=true;render();}});
document.getElementById('mobileMenu').addEventListener('click',()=>{app.mobileOpen=!app.mobileOpen;sidebarRender();});
window.__assessmentTest={app,meta,allItems,completed,simpleScore,domainScore,severity,domainList,needed,showResults};
render();
</script>
