'How often do you have difficulty getting things in order when you have to do a task that requires organization?',
'How often do you have problems remembering appointments or obligations?',
'When you have a task that requires a lot of thought, how often do you avoid or delay getting started?',
'How often do you fidget or squirm with your hands or feet when you have to sit down for a long time?',
'How often do you feel overly active and compelled to do things, like you were driven by a motor?'

const PHQ=[
'Little interest or pleasure in doing things',
'Feeling down, depressed, or hopeless',
'Trouble falling or staying asleep, or sleeping too much',
'Feeling tired or having little energy',

function privacy(){return `<section class="hero"><div class="eyebrow">PRIVATE AND RESPONSIBLE</div><h1>Understand what stays on your device.</h1><p>No sign-in, no analytics, no automatic storage of answers and no internet connection required for the questionnaire itself.</p></section>${initialNotice()}${helpNotice()}<div class="section-title"><h2>Privacy and limitations</h2></div><div class="bulletsection"><div class="info"><h3>No automatic storage</h3><p>Answers exist only in the current tab memory until you export. Closing or refreshing the page can clear unfinished work. No browser localStorage or server databases are used.</p></div><div class="info"><h3>Exports are sensitive</h3><p>Downloadable JSON contains your answers and scores; CSV contains a score summary. Files remain wherever you save or share them, including any cloud-synced downloads directory.</p></div><div class="info"><h3>External source links</h3><p>Scoring runs entirely offline. Clicking an official source or licence link opens that separate website but does not send your answers with it.</p></div><div class="info"><h3>Not medical advice</h3><p>Results are not a clinical evaluation, medical advice, diagnosis, assessment of safety, prescription guidance or estimated personal chance of having a condition. A low score cannot rule out a problem.</p></div><div class="info"><h3>Support in a crisis</h3><p>If you or someone else is in danger, contact emergency services. In Canada, call/text 988 for suicide crisis support; for an immediate emergency call 911.</p></div><div class="info"><h3>Reuse conditions</h3><p>The WHO-5 component is offered under CC BY-NC-SA 3.0 IGO with attribution. The Weiss scales are included based on permission reported by the app publisher. Sources and author credits appear on the Sources page. No source organization endorses this independent app.</p></div></div><div class="actions"><button class="btn" data-nav="home">Back to assessments</button><button class="btn ghost" data-expo function renderNav(){document.getElementById('sideList').innerHTML=keys.map(k=>`<button class="sidebutton ${app.current===k&&['assessment','results'].includes(app.view)?'active':''}" data-open="${k}"><span>◉</span><span>${esc(measures[k].short)}</span><span class="dot">${count(k)}/${total(k)}</span></button>`).join('');document.querySelectorAll('.sidebutton[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===app.view));document.getElementById('mobileLinks').innerHTML=`<button data-nav="home">Overview</button>${keys.map(k=>`<button data-open="${k}">${esc(measures[k].title)}</button>`).join('')}<button data-nav="dashboard">Combined results</button><button data-nav="sources">Sources and scoring</button><button data-nav="privacy">Privacy and safety</button>`;document.getElementById('mobileLinks').classList.toggle('open',app.mobileOpen);}
function render(){renderNav();document.getElementById('crumb').textContent=app.view==='home'?'OVERVIEW / ASSESSMENTS':app.view==='privacy'?'PRIVACY / SAFETY':app.view==='sources'?'REFERENCE / SCORING':app.view==='dashboard'?'RESULTS / COMBINED':(app.view==='results'?'RESULTS / ':'ASSESSMENT / ')+measures[app.current].short.toUpperCase();document.getElementById('content').innerHTML=app.view==='home'?overview():app.view==='privacy'?privacy():app.view==='sources'?sources():app.view==='dashboard'?dashboard():app.view==='results'?results(app.current):questionnaire(app.current);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-open],[data-results],[data-rate],[data-step],[data-jump],[data-set],[data-group],[data-section-step],[data-export],[data-print],[data-clear]');if(!b)return;e.preventDefault();if(b.dataset.open){openKey(b.dataset.open);return;}if(b.hasAttribute('data-set')){const k=app.current,v=Number(b.dataset.set);if(b.hasAttribute('data-extra'))app.others[Number(b.dataset.extra)].value=v;else app.answers[k][Number(b.dataset.q)]=v;const pos=window.scrollY;render();window.scrollTo({top:pos,behavior:'instant'});return;}if(b.hasAttribute('data-group')){app.groups[app.current]=Number(b.dataset.group);render();goTop();return;}if(b.hasAttribute('data-section-step')){const k=app.current,limit=domainRanges(k).length+(k==='wsr'?1:0);if(b.dataset.sectionStep==='prev'){app.groups[k]=Math.max(0,app.groups[k]-1);}else if(app.groups[k]<limit-1){app.groups[k]++;}else if(done(k)){viewResults(k);return;}else{const groups=domainRanges(k),first=groups.findIndex(g=>domainStats(k,g).missing>0);app.groups[k]=first>=0?first:limit-1;}render();goTop();return;}if(b.dataset.nav){nav(b.dataset.nav);return;}if(b.dataset.results){viewResults(b.dataset.results);return;}if(b.hasAttribute('data-rate')){app.answers[app.current][app.steps[app.current]]=Number(b.dataset.rate);render();return;}if(b.dataset.step){b.dataset.step==='next'?forward():back();return;}if(b.dataset.jump!==undefined){app.steps[app.current]=Number(b.dataset.jump);render();goTop();return;}if(b.dataset.export){exportData(b.dataset.export);return;}if(b.hasAttribute('data-print')){window.print();return;}if(b.hasAttribute('data-clear')){reset();return;}});
document.addEventListener('change',e=>{if(e.target.hasAttribute('data-import'))importData(e.target.files?.[0]);if(e.target.id==='impact')app.impact[app.current]=e.target.value===''?null:Number(e.target.value);if(e.target.hasAttribute('data-othertext'))app.others[Number(e.target.dataset.othertext)].text=e.target.value.slice(0,180);});
document.getElementById('mobileMenu').addEventListener('click',()=>{app.mobileOpen=!app.mobileOpen;renderNav();});
window.addEventListener('keydown',e=>{if(app.view!=='assessment'||!app.current||app.current==='wfirs'||app.current==='wsr'||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;const k=app.current,n=options(k).length;if(/^[1-6]$/.test(e.key)&&Number(e.key)<=n){app.answers[k][app.steps[k]]=Number(e.key)-1;render();}if(e.key==='Enter'){e.preventDefault();forward();}});
let printDetailState=[];
window.addEventListener('beforeprint',()=>{printDetailState=Array.from(document.querySelectorAll('#content details')).map(d=>[d,d.open]);printDetailState.forEach(([d])=>d.open=true);});
window.addEventListener('afterprint',()=>{printDetailState.forEach(([d,isOpen])=>{if(d.isConnected)d.open=isOpen;});printDetailState=[];});
window.__assessmentTest={app,measures,keys,total,count,done,options,score,summed,optionScore,viewResults,render,domainRanges,domainStats,wsrSafety,groupedQuestionnaire,groupedResults,dashboard};
render();
</script>
</body>
</html>
