<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basketball Drill Locker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <p class="eyebrow">Practice Builder</p>
      <h1>Basketball Drill Locker</h1>
      <p class="tagline">Solo, partner, and team drills with clear steps, coaching cues, and court diagrams.</p>
      <div class="hero__actions">
        <button id="randomBtn" class="primary-btn">Pick a Random Drill</button>
        <button id="printBtn" class="secondary-btn">Print / Save Drill Plan</button>
      </div>
    </div>
    <div class="score-card" aria-label="App summary">
      <strong id="drillCount">0</strong>
      <span>drills loaded</span>
      <small>Works offline once downloaded</small>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="Filters">
      <label class="search-wrap">
        <span>Search drills</span>
        <input id="searchInput" type="search" placeholder="shooting, layups, passing, defence..." />
      </label>
      <label>
        <span>Section</span>
        <select id="sectionFilter">
          <option value="all">All sections</option>
          <option value="Solo">Solo drills</option>
          <option value="Partner / Small Group">Partner / Small group</option>
          <option value="Team">Team drills</option>
          <option value="Warm-Up / Conditioning">Warm-up / conditioning</option>
        </select>
      </label>
      <label>
        <span>Skill focus</span>
        <select id="skillFilter">
          <option value="all">All skills</option>
        </select>
      </label>
      <label>
        <span>Difficulty</span>
        <select id="difficultyFilter">
          <option value="all">Any level</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </label>
    </section>

    <section class="planner" aria-label="Selected practice plan">
      <div>
        <h2>Practice Plan</h2>
        <p>Tap “Add to plan” on drills you want to use. Your picks are saved on this device.</p>
      </div>
      <div class="planner__actions">
        <button id="clearPlanBtn" class="ghost-btn">Clear Plan</button>
      </div>
      <div id="planList" class="plan-list"></div>
    </section>

    <section class="results-bar">
      <h2 id="resultsTitle">All Drills</h2>
      <p id="resultsMeta"></p>
    </section>

    <section id="drillsGrid" class="drills-grid" aria-live="polite"></section>
  </main>

  <dialog id="drillDialog" class="drill-dialog">
    <button id="closeDialog" class="close-btn" aria-label="Close">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <template id="emptyTemplate">
    <div class="empty-state">
      <h3>No drills found</h3>
      <p>Try a different search, section, skill, or difficulty.</p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
