<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oblique Strategies</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #111;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  .title {
    margin-bottom: 20px;
    font-size: 28px;
    font-weight: bold;
  }
  .card {
    background: #fff;
    color: #000;
    padding: 40px;
    border-radius: 12px;
    max-width: 400px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    user-select: none;
  }
  .footer {
    margin-top: 20px;
    font-size: 14px;
  }
  .footer a {
    color: #aaa;
    text-decoration: none;
  }
  .footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="title">Oblique Strategies</div>

<div class="card" id="card">Click to start</div>

<div class="footer">
  <a href="https://en.wikipedia.org/wiki/Oblique_Strategies" target="_blank">
    Oblique Strategies
  </a>
</div>

<script>
const strategies = [
"Honor thy error as a hidden intention",
"Use an old idea",
"Emphasize the flaws",
"Do something boring",
"Reverse",
"Work at a different speed",
"Ask your body",
"Take a break",
"Change nothing and continue consistently",
"Give way to your worst impulse",
"Remove specifics and convert to ambiguities",
"Only a part, not the whole",
"Faced with a choice, do both",
"Repetition is a form of change",
"Trust in the you of now",
"Do the last thing first",
"Listen to the quiet voice",
"Make a sudden, destructive unpredictable action; incorporate",
"Look at the order in which you do things",
"What would your closest friend do?"
];

const card = document.getElementById("card");

function newStrategy() {
  const random = strategies[Math.floor(Math.random() * strategies.length)];
  card.textContent = random;
}

card.addEventListener("click", newStrategy);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") {
    newStrategy();
  }
});
</script>

</body>
</html>
