<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,viewport-fit=cover"><base href="../"><link rel="stylesheet" href="assets/game.css"><style>#gameTools{display:none!important}#loading{position:fixed;inset:0;background:#081426;display:grid;place-items:center;color:#e3f4ff;font:600 17px system-ui;z-index:10;text-align:center;padding:24px}#loading small{display:block;color:#91bbcb;margin-top:12px}</style></head><body><div id="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="Playable game"></canvas><div id="gameTools"></div><div id="touchControls"></div><div id="rotateHint">↻ Rotate device for a larger game view</div></div><div id="loading" role="status">Preparing game…<small>The first preview may take a moment.</small></div><script>
(function(){'use strict';const paths=["assets/runtime.js", "assets/engines-arcade.js", "assets/engines-puzzle.js", "assets/engines-sim.js", "assets/engines-sports.js", "assets/engines-fps.js", "assets/engines-extra.js", "assets/engines-mechanics-a.js", "assets/engines-falling.js", "assets/engines-mechanics-b.js", "assets/engines-mechanics-c.js", "assets/engines-mechanics-d.js", "assets/engines-mechanics-e.js"];let started=false;
function script(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Missing game engine file: '+src));document.body.appendChild(s)})}
window.addEventListener('message',async e=>{if(e.source!==parent||e.data?.type!=='AW_LOAD'||started)return;started=true;try{window.ARCADE_CONFIG=e.data.config;window.AW_DEFER_BOOT=true;for(const path of paths)await script(path);window.AW_BOOT?.();document.getElementById('loading').remove();parent.postMessage({type:'AW_STARTED',engine:window.ARCADE_CONFIG.engine},'*')}catch(err){let message=err.message||String(err);document.getElementById('loading').innerHTML='Unable to launch the game.<small>'+message.replace(/[<>]/g,'')+'</small>';parent.postMessage({type:'AW_ERROR',message},'*')}});
parent.postMessage({type:'AW_READY'},'*');})();</script></body></html>
