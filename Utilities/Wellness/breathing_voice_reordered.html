<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Breathing Voice Reordered</title>
<style>
:root{
  --bg:#071326; --card:#101f3a; --line:rgba(255,255,255,.16);
  --text:#eef6ff; --muted:#bed4f2; --accent:#68d8ff; --accent2:#9cf0c9;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top left,#1a3f76 0,#071326 42%,#030914 100%)}
.wrap{width:min(1120px,94vw);margin:0 auto;padding:28px 0 40px}
header,.card{border:1px solid var(--line);border-radius:28px;background:rgba(16,31,58,.86);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
header{display:grid;gap:14px;margin-bottom:20px;padding:26px}
h1{margin:0;font-size:clamp(2rem,5vw,4.2rem);line-height:.98}
.subtitle{margin:0;color:var(--muted);font-size:1.08rem;max-width:800px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding-top:14px}}
.card{padding:20px}
h2{margin:0 0 14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
button,select,input[type=number]{font:inherit;border-radius:16px;border:1px solid var(--line)}
button{cursor:pointer;color:var(--text);background:rgba(255,255,255,.08);padding:12px 14px;font-weight:800}
button:hover{background:rgba(255,255,255,.13)}button.primary{background:linear-gradient(135deg,#1c95e8,#19c69b);border:0;color:white}
button.danger{background:rgba(255,112,112,.16);color:#ffe3e3}button.active{background:rgba(104,216,255,.22);border-color:rgba(104,216,255,.55)}button:disabled{opacity:.45;cursor:not-allowed}
label{display:grid;gap:7px;margin:12px 0;color:var(--text);font-weight:800}label span{color:#eaf4ff;font-weight:900}
select,input[type=number]{width:100%;padding:13px 14px;color:white;background:#0b172c;border-color:rgba(255,255,255,.24);font-size:1.03rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.checks{display:grid;gap:10px;margin:14px 0}.check{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06);font-weight:750}.check input{width:20px;height:20px}
.stage{display:grid;place-items:center;min-height:370px;text-align:center;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line);padding:22px;position:relative;overflow:hidden}
.circle{width:min(280px,70vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:8px solid rgba(104,216,255,.5);box-shadow:0 0 55px rgba(104,216,255,.18),inset 0 0 45px rgba(104,216,255,.12);transition:transform 1s linear,border-color .25s}
.circle.inhale{transform:scale(1.13);border-color:rgba(156,240,201,.75)}.circle.exhale{transform:scale(.88);border-color:rgba(255,212,128,.8)}
.prompt{font-size:clamp(2rem,7vw,4.4rem);font-weight:950;line-height:1}.time{margin-top:12px;font-size:clamp(2.4rem,10vw,5.8rem);font-weight:950;color:var(--accent)}.subtime{margin-top:8px;color:var(--muted);font-weight:800}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}@media(max-width:560px){.controls{grid-template-columns:1fr}}
.status{margin-top:12px;padding:12px;border-radius:16px;background:rgba(0,0,0,.16);color:var(--muted);font-weight:750}
.clip-list{display:grid;gap:10px}.clip{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px}.clip strong{display:block}.clip em{display:block;color:var(--muted);font-style:normal;font-size:.9rem}.clip button{padding:9px 10px;border-radius:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(104,216,255,.13);color:#dff7ff;border:1px solid rgba(104,216,255,.23);font-weight:850;margin:4px 4px 0 0}
.notice,.footer-note{color:var(--muted);line-height:1.45}.footer-note{font-size:.92rem;margin-top:12px}
</style>

<style>
.controls.single-row { grid-template-columns: 1fr 1fr !important; }
@media(max-width:560px){ .controls.single-row { grid-template-columns: 1fr !important; } }
</style>

</head>
<body>
<div class="wrap">
<header>
  <h1>Breathing Guide</h1>
  <p class="subtitle">Choose a breathing pattern, follow the visual timer, and use your device’s natural voice for guided prompts.</p>
</header>
<div class="grid">
<section class="card">
  <div class="tabs"><button id="boxTab" class="active">Box breathing</button><button id="tab478">4-7-8 breathing</button></div>
  <div id="boxOptions"><label><span>Box breathing pattern</span><select id="boxPattern"><option value="3">3-3-3-3</option><option value="4" selected>4-4-4-4</option><option value="5">5-5-5-5</option></select></label></div>
  <div class="row">
    <label><span>Session length</span><select id="lengthMode"><option value="minutes" selected>Minutes</option><option value="rounds">Rounds</option></select></label>
    <label><span id="lengthLabel">Minutes (max 10)</span><input id="lengthInput" type="number" min="1" max="10" value="3" /></label>
  </div>
  <div class="checks">
<label>
      <span>Voice</span>
      <select id="voiceGender">
        <option value="female" selected>Female</option>
        <option value="male">Male</option>
      </select>
    </label>
    <label class="check"><input id="voiceToggle" type="checkbox" checked /> Play natural voice prompts</label>
    
    <label class="check"><input id="countToggle" type="checkbox" checked /> Count each second with soft ticks</label>
  </div>
  <div class="controls single-row"><button id="startBtn" class="primary">Start session</button><button id="stopBtn" class="danger">Stop</button></div>
  <div id="summary" class="status">Box breathing • 4-4-4-4 • 3 minutes</div></section>
<section class="card">
  <h2 id="sessionTitle">Box Breathing</h2>
  <div class="stage"><div class="circle" id="circle"><div><div class="prompt" id="prompt">Ready</div><div class="time" id="timeLeft">—</div><div class="subtime" id="roundInfo">Record prompts or press Start.</div></div></div></div>
</section>
</div>
</div>


<script>
const $=id=>document.getElementById(id);
const els={
  boxTab:$('boxTab'),tab478:$('tab478'),boxOptions:$('boxOptions'),boxPattern:$('boxPattern'),
  lengthMode:$('lengthMode'),lengthInput:$('lengthInput'),lengthLabel:$('lengthLabel'),
  voice:$('voiceToggle'),voiceGender:$('voiceGender'),sessionTitle:$('sessionTitle'),count:$('countToggle'),
  start:$('startBtn'),stop:$('stopBtn'),
  summary:$('summary'),prompt:$('prompt'),time:$('timeLeft'),round:$('roundInfo'),circle:$('circle')
};

let mode='box';
let running=false;
let paused=false;
let currentTimers=[];

function steps(){
  if(mode==='478'){
    return [
      {label:'Breathe in', seconds:4, phrase:'Breathe in for 4 seconds'},
      {label:'Hold', seconds:7, phrase:'Hold for 7 seconds'},
      {label:'Breathe out', seconds:8, phrase:'Breathe out for 8 seconds'}
    ];
  }
  const n=Number(els.boxPattern.value);
  return [
    {label:'Breathe in', seconds:n, phrase:`Breathe in for ${n} seconds`},
    {label:'Hold', seconds:n, phrase:`Hold for ${n} seconds`},
    {label:'Breathe out', seconds:n, phrase:`Breathe out for ${n} seconds`},
    {label:'Hold', seconds:n, phrase:`Hold for ${n} seconds`}
  ];
}

function rounds(){
  const v=Math.max(1,Number(els.lengthInput.value)||1);
  if(els.lengthMode.value==='rounds') return Math.min(20,v);
  const cycle=steps().reduce((a,s)=>a+s.seconds,0);
  return Math.max(1,Math.floor((Math.min(10,v)*60)/cycle));
}

function updateUI(){
  if(mode==='box'){
    els.boxTab.classList.add('active');
    els.tab478.classList.remove('active');
    els.boxOptions.style.display='block';
  }else{
    els.tab478.classList.add('active');
    els.boxTab.classList.remove('active');
    els.boxOptions.style.display='none';
  }

  if(els.lengthMode.value==='minutes'){
    els.lengthInput.max=10;
    els.lengthLabel.textContent='Minutes (max 10)';
    if(Number(els.lengthInput.value)>10) els.lengthInput.value=10;
  }else{
    els.lengthInput.max=20;
    els.lengthLabel.textContent='Rounds (max 20)';
    if(Number(els.lengthInput.value)>20) els.lengthInput.value=20;
  }

  const pat=mode==='box'
    ? `${els.boxPattern.value}-${els.boxPattern.value}-${els.boxPattern.value}-${els.boxPattern.value}`
    : '4-7-8';

  const modeName = mode==='box' ? 'Box Breathing' : '4-7-8 Breathing';
  if(els.sessionTitle) els.sessionTitle.textContent = modeName;
  els.summary.textContent=`${modeName} • ${pat} • ${els.lengthInput.value} ${els.lengthMode.value} • ${rounds()} rounds`;
}

function clearTimers(){
  currentTimers.forEach(t=>clearTimeout(t));
  currentTimers=[];
}

function wait(ms){
  return new Promise(resolve=>{
    const t=setTimeout(resolve,ms);
    currentTimers.push(t);
  });
}

function voiceLooksFemale(v){
  const n=(v.name||'').toLowerCase();
  return /(female|woman|zira|jenny|aria|samantha|victoria|karen|moira|tessa|susan|eva|hazel|sara|heather|catherine|serena)/.test(n);
}

function voiceLooksMale(v){
  const n=(v.name||'').toLowerCase();
  return /(male|man|david|mark|daniel|alex|fred|tom|guy|george|ryan|oliver|arthur|brian|ralph)/.test(n);
}

function getBestVoice(){
  const voices=speechSynthesis.getVoices().filter(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
  if(!voices.length) return null;

  const wantsFemale = !els.voiceGender || els.voiceGender.value === 'female';
  const genderMatch = voices.find(v=>wantsFemale ? voiceLooksFemale(v) : voiceLooksMale(v));
  if(genderMatch) return genderMatch;

  const natural = voices.find(v=>/natural|premium|enhanced|neural|google|microsoft/i.test(v.name));
  if(natural) return natural;

  return voices[0];
}

function speak(text){
  return new Promise(resolve=>{
    if(!els.voice.checked || !('speechSynthesis' in window)){
      resolve();
      return;
    }
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    const voice=getBestVoice();
    if(voice) u.voice=voice;
    u.rate=0.86;
    u.pitch=0.92;
    u.volume=1;
    u.onend=()=>resolve();
    u.onerror=()=>resolve();
    speechSynthesis.speak(u);
    setTimeout(resolve, Math.min(2600, Math.max(900, text.length*55)));
  });
}

function softTick(){
  if(!els.count.checked) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ac=new AC();
  const o=ac.createOscillator();
  const g=ac.createGain();
  o.frequency.value=520;
  g.gain.value=.025;
  o.connect(g);
  g.connect(ac.destination);
  o.start();
  o.stop(ac.currentTime+.045);
}

async function runSession(){
  if(running) return;
  running=true;
  paused=false;
  clearTimers();
  els.start.textContent='Pause';
  els.start.classList.remove('primary');

  const total=rounds();
  const sequence=steps();

  for(let r=1;r<=total && running;r++){
    for(const s of sequence){
      if(!running) break;
      while(paused && running) await wait(120);

      els.prompt.textContent=s.label;
      els.circle.className='circle '+(s.label.includes('in')?'inhale':s.label.includes('out')?'exhale':'');
      els.round.textContent=`Round ${r} of ${total} • ${s.phrase}`;

      speak(s.phrase);

      for(let t=s.seconds;t>=1 && running;t--){
        while(paused && running) await wait(120);
        els.time.textContent=t;
        softTick();
        await wait(1000);
      }
    }
  }

  if(running){
    els.prompt.textContent='Done';
    els.time.textContent='✓';
    els.round.textContent='Session complete.';
  }
  running=false;
  paused=false;
  els.start.textContent='Start session';
  els.start.classList.add('primary');
  els.circle.className='circle';
}

function toggleStartPause(){
  if(!running){
    runSession();
    return;
  }

  paused = !paused;
  if(paused){
    els.start.textContent='Resume';
    if('speechSynthesis' in window) speechSynthesis.pause();
  }else{
    els.start.textContent='Pause';
    if('speechSynthesis' in window) speechSynthesis.resume();
  }
}

function stopSession(){
  running=false;
  paused=false;
  clearTimers();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  els.start.textContent='Start session';
  els.start.classList.add('primary');
  els.prompt.textContent='Ready';
  els.time.textContent='—';
  els.round.textContent='Press Start.';
  els.circle.className='circle';
}

function switchMode(newMode){
  if(running) stopSession();
  mode=newMode;
  updateUI();
}

els.boxTab.onclick=()=>switchMode('box');
els.tab478.onclick=()=>switchMode('478');
[els.boxPattern,els.lengthMode,els.lengthInput,els.voice,els.voiceGender,els.count].filter(Boolean).forEach(e=>e.addEventListener('input',updateUI));
els.start.onclick=toggleStartPause;
els.stop.onclick=stopSession;

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged=()=>getBestVoice();
}

updateUI();
</script>


</body>
</html>
