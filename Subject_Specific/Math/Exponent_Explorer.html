{display:none}.lesson-page{max-width:1120px}.tight{margin-top:0}.slim{max-width:820px}.icon-text{font-size:16px;margin-right:5px}.lesson-switch{max-width:310px}.review-list{margin-top:15px}.info-row{display:flex;gap:10px;align-items:center}.space-above{margin-top:22px}.notice{font-size:12px;color:var(--secondary);line-height:1.6}.track-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.track-card{padding:20px}.track-card h3{margin:5px 0 8px;font-size:16px}.track-card p{color:var(--secondary);font-size:12px}.track-card .math{font-size:22px}.path-banner{border:1px solid var(--border);border-radius:15px;background:var(--surface-2);padding:20px;display:flex;align-items:center;justify-content:space-between;gap:15px}.hide-for-print{}@media(max-width:1100px){.lessons-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-layout{grid-template-columns:minmax(0,1fr)}.lesson-side{position:static;order:-1}.lesson-side .toc{display:grid;grid-template-columns:repeat(3,1fr)}.hero-art{right:5%;opacity:.4}.achievements{grid-template-columns:repeat(2,1fr)}}

<script>
'use strict';
const LESSONS = [
{id:'basics',name:'Understanding exponents',subtitle:'Bases, exponents and powers',time:'6 min',symbol:'3^4',idea:'An exponent tells you how many times to use a base as a factor. It is a compact way of writing repeated multiplication.',rule:'a^n = a × a × ··· × a',qual:'There are n copies of the base a, for positive whole-number n.',why:'The base is the number being multiplied; the exponent counts how many copies of that base appear. It does not tell you to multiply the base by the exponent.',steps:[['Identify the parts','In 3^4, the base is 3 and the exponent is 4.'],['Expand the power','3^4 = 3 × 3 × 3 × 3.'],['Evaluate','3 × 3 × 3 × 3 = 81.']],trap:'3^4 is not 3 × 4. A power represents repeated multiplication, not multiplication by its exponent.',hint:'Find the large base and the smaller raised exponent. Count copies of the base.',viz:'basic'},
{id:'expanded',name:'Expanded form & evaluation',subtitle:'From notation to numerical value',time:'7 min',symbol:'2^5',idea:'To evaluate a power, write its base as repeated factors, then multiply carefully. The exponent affects only its base unless brackets tell you otherwise.',rule:'4^3 = 4 × 4 × 4 = 64',qual:'Exponents act before multiplication and addition in the order of operations.',why:'Each multiplication uses the same base again. Breaking a large power into smaller steps can make mental calculation easier.',steps:[['Expand','2^5 means 2 × 2 × 2 × 2 × 2.'],['Group sensibly','(2 × 2) × (2 × 2) × 2 = 4 × 4 × 2.'],['Finish','4 × 4 × 2 = 32.']],trap:'4^3 = 64, not 12. For 2^4 + 3, evaluate the power first: 16 + 3 = 19.',hint:'Write the repeated factors first, then multiply from left to right or group convenient pairs.',viz:'basic'},
{id:'product',name:'Product of powers',subtitle:'Multiply powers with the same base',time:'7 min',symbol:'x^3 × x^4',idea:'When multiplying powers with the same base, keep the base and add the exponents.',rule:'a^m × a^n = a^(m+n)',qual:'The bases must match. The rule works whenever the powers are defined.',why:'One group has m copies of the base and the other has n copies. Joining the groups makes m + n copies.',steps:[['Check the bases','x^3 × x^4 has the same base x in both powers.'],['Combine the factors','There are 3 copies of x plus 4 more copies of x.'],['Add the exponents','x^(3+4) = x^7.']],trap:'Do not add exponents for addition: x^3 + x^4 is not x^7. And 2^3 × 3^4 does not have a common base.',hint:'Keep the base; add the raised numbers only when the bases are identical.',viz:'product'},
{id:'quotient',name:'Quotient of powers',subtitle:'Divide powers with the same base',time:'7 min',symbol:'x^8 ÷ x^3',idea:'When dividing powers with the same nonzero base, subtract the denominator exponent from the numerator exponent.',rule:'a^m / a^n = a^(m−n)',qual:'The base a cannot be zero in the denominator.',why:'Each matching factor in the numerator and denominator cancels. The unmatched factors remain.',steps:[['Check the bases','x^8 ÷ x^3 uses the same base x.'],['Cancel common factors','Three copies of x in the numerator cancel three in the denominator.'],['Subtract','x^(8−3) = x^5.']],trap:'Subtract in the correct order: numerator minus denominator. x^7/x^2 = x^5, not x^(2−7).',hint:'Think “top exponent minus bottom exponent.”',viz:'quotient'},
{id:'power',name:'Power of a power',subtitle:'Raise one power to another',time:'7 min',symbol:'(x^3)^4',idea:'When raising a power to another power, multiply the exponents.',rule:'(a^m)^n = a^(m×n)',qual:'Apply the outer exponent to the entire inner power.',why:'The inside group is repeated n times. Each group has m factors, giving m × n factors altogether.',steps:[['See the repeated groups','(x^3)^4 means four copies of x^3 multiplied together.'],['Count factors','Each group has three x factors: 3 × 4 = 12.'],['Write one power','(x^3)^4 = x^12.']],trap:'Do not add these exponents: (x^3)^4 is x^12, not x^7.',hint:'For power raised to a power, multiply the exponents.',viz:'power'},
{id:'productPower',name:'Power of a product',subtitle:'Distribute a power to every factor',time:'7 min',symbol:'(2x)^3',idea:'An exponent outside brackets applies to every factor multiplied inside the brackets.',rule:'(ab)^n = a^n × b^n',qual:'This works for products, not sums.',why:'(ab)^3 means (ab)(ab)(ab). Regrouping all the a factors and all the b factors gives a^3b^3.',steps:[['Identify both factors','(2x)^3 has factors 2 and x inside the brackets.'],['Raise each factor','(2x)^3 = 2^3 × x^3.'],['Simplify the coefficient','2^3 = 8, so the result is 8x^3.']],trap:'(a + b)^2 is NOT a^2 + b^2. Exponents do not distribute over addition.',hint:'Give every factor inside the brackets the outer exponent.',viz:'productPower'},
{id:'quotientPower',name:'Power of a quotient',subtitle:'Distribute a power across a fraction',time:'7 min',symbol:'(x/y)^3',idea:'An exponent outside a fraction applies to the numerator AND the denominator.',rule:'(a/b)^n = a^n / b^n',qual:'The denominator b must be nonzero.',why:'Multiplying a fraction by itself repeatedly multiplies its numerators together and its denominators together.',steps:[['Repeat the fraction','(x/y)^3 = (x/y)(x/y)(x/y).'],['Group numerators and denominators','The top is x × x × x; the bottom is y × y × y.'],['Rewrite as powers','x^3/y^3.']],trap:'Do not raise only the numerator: (2/3)^2 is 4/9, not 4/3.',hint:'Raise the top and bottom of the fraction separately.',viz:'quotientPower'},
{id:'zero',name:'The zero-exponent law',subtitle:'Why any nonzero base to zero is one',time:'6 min',symbol:'7^0 = 1',idea:'Every nonzero number or expression raised to the zero power equals 1.',rule:'a^0 = 1',qual:'a ≠ 0. The expression 0^0 is outside this rule and is left undefined in this app.',why:'Dividing a^3 by a^3 gives 1. The quotient rule also gives a^(3−3) = a^0. Therefore a^0 = 1 when a is nonzero.',steps:[['Start with a true quotient','5^3 / 5^3 = 1.'],['Apply the quotient law','5^(3−3) = 5^0.'],['Compare','5^0 = 1.']],trap:'0^5 = 0 but 5^0 = 1. The positions of the 0 matter.',hint:'If the exponent is zero and the base is nonzero, the result is always 1.',viz:'zero'},
{id:'negative',name:'Negative exponents',subtitle:'Rewrite powers as reciprocals',time:'8 min',symbol:'x^−3 = 1/x^3',idea:'A negative exponent means take the reciprocal of the corresponding positive power.',rule:'a^(−n) = 1/a^n',qual:'The base a must be nonzero. A negative exponent does not mean the answer is negative.',why:'To preserve the quotient law, a^2/a^5 = a^(2−5) = a^−3. After cancelling common factors, this is 1/a^3.',steps:[['Start with a negative exponent','2^−3.'],['Take the reciprocal','2^−3 = 1/2^3.'],['Evaluate','1/2^3 = 1/8.']],trap:'2^−3 = 1/8, not −8. For a negative fraction power, flip the fraction first.',hint:'Move the power across the fraction bar and make the exponent positive.',viz:'negative'},
{id:'fractional',name:'Fractional exponents',subtitle:'Connect powers and roots',time:'9 min',symbol:'27^(2/3)',idea:'A fractional exponent describes a root and a power. The denominator tells you which root to take; the numerator tells you the power.',rule:'a^(m/n) = (ⁿ√a)^m',qual:'For even roots, use nonnegative real bases. In this app all fractional-exponent questions use nonnegative perfect powers.',why:'The n-th root undoes raising to the n-th power. Thus a^(1/n) is the n-th root of a, and multiplying the exponent by m raises that result to m.',steps:[['Read the denominator','In 27^(2/3), the 3 means cube root.'],['Find the cube root','The cube root of 27 is 3.'],['Apply the numerator','3^2 = 9, so 27^(2/3) = 9.']],trap:'27^(2/3) is not 27 × 2/3. The 3 represents a cube root, not division of the base by 3.',hint:'Denominator = root; numerator = power. Take the root first for perfect powers.',viz:'fractional'},
{id:'mixed',name:'Combining exponent laws',subtitle:'Choose the right laws in the right order',time:'10 min',symbol:'(x^2)^3 × x^4',idea:'Complex expressions are built from the same small set of laws. Simplify brackets, combine matching bases and check the final exponents.',rule:'(a^m)^n × a^p = a^(mn+p)',qual:'Use the product rule only for like bases, and do not distribute powers over addition.',why:'Breaking expressions into manageable steps makes it easier to see exactly which law applies at each point.',steps:[['Simplify the power of a power','(x^2)^3 × x^4 becomes x^6 × x^4.'],['Combine common bases','x^6 × x^4 = x^(6+4).'],['Finish','The simplified expression is x^10.']],trap:'Be careful with brackets and signs. For example, (−3)^2 = 9, but −3^2 = −9.',hint:'First simplify powers in brackets, then products or quotients with matching bases.',viz:'mixed'}
];
const MODES={guided:{title:'Guided practice',desc:'6 questions with optional hints and detailed feedback after each answer.',icon:'◉'},practice:{title:'Free practice',desc:'A targeted or mixed set of questions. Learn from solutions as you go.',icon:'✎'},quiz:{title:'Unit assessment',desc:'Test your understanding without hints. Review worked solutions at the end.',icon:'▤'},challenge:{title:'90-second sprint',desc:'Answer as many questions as you can against the clock.',icon:'⚡'}};
const defaultData=()=>({completed:[],attempted:0,correct:0,streak:0,bestStreak:0,byTopic:{},runs:[],bestChallenge:0,theme:'light'});
let data;
try{data=Object.assign(defaultData(),JSON.parse(localStorage.getItem('exponent_explorer_save_v1')||'{}'));}catch(e){data=defaultData();}
if(!Array.isArray(data.completed))data.completed=[];if(!data.byTopic||typeof data.byTopic!=='object')data.byTopic={};if(!Array.isArray(data.runs))data.runs=[];
const state={view:'home',lesson:'basics',mode:'practice',topic:'all',difficulty:'standard',count:10,answerType:'mixed',session:null,vizA:2,vizB:3,vizBase:3,selected:null,feedback:false,hint:false};
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem('exponent_explorer_save_v1',JSON.stringify(data));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function powerMarkup(s){return esc(s).replace(/\^\(([^()]+)\)/g,'<sup>$1</sup>').replace(/\^([−-]?\d+(?:\/\d+)?|[A-Za-z])/g,'<sup>$1</sup>').replace(/\*/g,' · ');}function asMath(s){return '<span class="math">'+powerMarkup(s)+'</span>';}function proseMath(s){return powerMarkup(s);}
function pct(a,b){return b?Math.round(100*a/b):0;}
function getLesson(id){return LESSONS.find(x=>x.id===id)||LESSONS[0];}
function isDone(id){return data.completed.includes(id);}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('visible');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('visible'),2800);}
function navTitle(){return ({home:'Overview',learn:'Learn the laws',lesson:getLesson(state.lesson).name,practice:'Practice studio',assess:'Assessments',progress:'My progress',session:state.session?MODES[state.session.mode].title:'Practice',results:'Your results'})[state.view]||'Overview';}
function updateShell(){document.body.dataset.theme=data.theme==='dark'?'dark':'light';const dark=data.theme==='dark';$('#sideTheme').textContent=dark?'☀':'☾';$('#topTheme').textContent=dark?'☀':'☾';$('#sideCount').textContent=`${data.completed.length}/${LESSONS.length}`;$('#sideBar').style.width=pct(data.completed.length,LESSONS.length)+'%';$('#streakChip').innerHTML=`⚡ <strong>${data.bestStreak||0}</strong> best streak`;$('#breadcrumb').innerHTML=`Exponent Explorer <span style="color:var(--muted)">/</span> <strong>${esc(navTitle())}</strong>`;document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===(state.view==='lesson'?'learn':state.view==='session'||state.view==='results'?(state.session?.mode==='quiz'||state.session?.mode==='challenge'?'assess':'practice'):state.view)));document.querySelector('meta[name="theme-color"]').content=dark?'#0d1421':'#f6f8fc';}
function toggleTheme(){data.theme=data.theme==='dark'?'light':'dark';save();updateShell();}
function openDrawer(){document.body.classList.add('drawer-open');}function closeDrawer(){document.body.classList.remove('drawer-open');}
function navigate(view,id){closeDrawer();if(state.session&&(state.view==='session')&&view!=='session'&&view!=='results'){confirmDialog('Leave this session?','Your unfinished answers will not be saved to your results.',()=>{state.session=null;state.view=view;if(id)state.lesson=id;render();});return;}state.view=view;if(id)state.lesson=id;render();}
function render(){app.classList.toggle('lesson-page',state.view==='lesson');updateShell();if(state.view==='home')renderHome();else if(state.view==='learn')renderLearn();else if(state.view==='lesson')renderLesson();else if(state.view==='practice'||state.view==='assess')renderSetup();else if(state.view==='progress')renderProgress();else if(state.view==='session')renderQuestion();else if(state.view==='results')renderResults();window.scrollTo({top:0,behavior:'instant'});}
function sectionHead(title,sub='',action=''){return `<div class="split-heading"><div><h2 class="section-heading">${title}</h2>${sub?`<p class="section-sub">${sub}</p>`:''}</div>${action}</div>`;}

function updateViz(){const out=$('#vizStage');if(!out)return;let a=state.vizA,b=state.vizB,z=state.vizBase,v=getLesson(state.lesson).viz;let heading='',factors='',caption='';const base=String(z);const bounded=n=>Number.isSafeInteger(n)?n.toLocaleString('en-CA'):'Large value';switch(v){case 'product':heading=`${asMath(`${base}^${a} * ${base}^${b} = ${base}^${a+b}`)}`;factors=`<div class="factors">${factorRow(z,a)}<span class="factor op">×</span>${factorRow(z,b,true)}</div>`;caption=`${a} blue factors + ${b} green factors = ${a+b} total factors.`;break;case 'quotient':{let top=a+b;heading=asMath(`${base}^${top} / ${base}^${b} = ${base}^${a}`);factors=`<div class="factors">${factorRow(z,a)}${a&&b?'<span class="factor op">×</span>':''}${factorRow(z,b,true)}</div>`;caption=`In the fraction, ${b} matching numerator and denominator factors cancel. ${a} factors remain.`;break;}case 'power':heading=asMath(`(${base}^${a})^${b} = ${base}^${a*b}`);factors=`<div class="factors">${Array.from({length:b},(_,i)=>`<span class="factor ${i%2?'alt':''}" style="padding:0 12px">${base}<sup style="font-size:10px">${a}</sup></span>`).join('<span class="factor op">×</span>')}</div>`;caption=`${b} groups × ${a} factors in each group = ${a*b} factors.`;break;case 'productPower':heading=asMath(`(${z}x)^${a} = ${bounded(z**a)}x^${a}`);factors=`<div class="factors">${Array.from({length:a},()=>`<span class="factor">${z}</span><span class="factor alt">x</span>`).join('<span class="factor op">×</span>')}</div>`;caption=`The outer exponent ${a} applies to both ${z} and x.`;break;case 'quotientPower':heading=asMath(`(${z}/x)^${a} = ${bounded(z**a)}/x^${a}`);factors=`<div class="factors">${Array.from({length:a},()=>`<span class="factor">${z}</span><span class="factor op">/</span><span class="factor alt">x</span>`).join('<span class="factor op">×</span>')}</div>`;caption=`${a} identical fractions are multiplied; both numerator and denominator receive exponent ${a}.`;break;case 'zero':heading=asMath(`${z}^0 = ${z}^${a}/${z}^${a} = 1`);factors=`<div class="factors">${factorRow(z,a)}<span class="factor op">÷</span>${factorRow(z,a,true)}</div>`;caption='A nonzero expression divided by itself is 1; the exponent difference is 0.';break;case 'negative':heading=asMath(`${z}^(-${a}) = 1/${z}^${a} = 1/${bounded(z**a)}`);factors=`<div class="factors"><span class="factor">1</span><span class="factor op">÷</span>${factorRow(z,a,true)}</div>`;caption='A negative exponent gives a reciprocal, not a negative result.';break;case 'fractional':{let root=Math.min(4,a+1),factor=z,exp=Math.min(3,b),value=factor**root;heading=asMath(`${value}^(${exp}/${root}) = ${factor}^${exp} = ${bounded(factor**exp)}`);factors=`<div class="factors">${factorRow(factor,root)}</div>`;caption=`${value} is ${factor} raised to the ${root} power. Take the ${root}${root===2?'nd':root===3?'rd':'th'} root to get ${factor}, then raise it to ${exp}.`;break;}case 'mixed':heading=asMath(`(${base}^${a})^${b} * ${base}^${a} = ${base}^${a*b+a}`);factors=`<div class="factors">${factorRow(z,Math.min(20,a*b+a))}</div>`;caption=`Multiply ${a} × ${b}, then add the remaining exponent ${a}.`;break;default:heading=asMath(`${z}^${a} = ${bounded(z**a)}`);factors=`<div class="factors">${factorRow(z,a)}</div>`;caption=`${a} copies of ${z}, all multiplied. The value is ${bounded(z**a)}.`;break;}out.innerHTML=`<div class="viz-expression">${heading}</div>${factors}<div class="viz-caption">${caption}</div>`;}
function pick(list){return list[Math.floor(Math.random()*list.length)];}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=rnd(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
const variables=['x','y','a','m'];

}
case 'productPower':{

}
case 'quotientPower':{
 const n=rnd(2,level==='stretch'?4:3);if(Math.random()<.48){let p=rnd(2,4),q=p+rnd(1,3);return make('Raise the entire fraction to a power.',`(${p}/${q})^${n}`,`${p**n}/${q**n}`,[`${p**n}/${q}`,`${p}/${q**n}`,`${p*n}/${q*n}`,`${q**n}/${p**n}`],`Raise both numerator and denominator: (${p}/${q})^${n} = ${p}^${n}/${q}^${n} = ${p**n}/${q**n}.`,`Both the top and the bottom receive exponent ${n}.`);}
 return make('Distribute the exponent to both parts.',`(x/y)^${n}`,`x^${n}/y^${n}`,[`x^${n}/y`,`x/y^${n}`,`x^${n+1}/y^${n}`,`y^${n}/x^${n}`],`Apply exponent ${n} to the numerator and to the denominator: x^${n}/y^${n}, assuming y is nonzero.`,`Both numerator and denominator are raised to the power.`);
}
case 'zero':{
 const z=pick([String(rnd(2,99)),pick(variables),`(${rnd(2,5)}x)`]);return make('Evaluate using the zero-exponent law.',`${z}^0`,'1',['0',z,'-1','2'],`Any nonzero base raised to the zero power is 1. This assumes the base ${z} is not zero.`,`Nonzero base, exponent zero → 1.`);

function normalizeInput(raw){let s=String(raw||'').trim().toLowerCase();const superMap={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g,v=>'^'+[...v].map(x=>superMap[x]).join(''));return s.replace(/[−–]/g,'-').replace(/[×·⋅]/g,'*').replace(/[÷]/g,'/').replace(/[\[\{]/g,'(').replace(/[\]\}]/g,')').replace(/\s+/g,'').replace(/,/g,'');}
function evalExpression(raw,variables){const s=normalizeInput(raw);if(!s||s.length>160||/[^0-9.a-z+*\/^()\-]/.test(s))throw Error('Use numbers, variables, parentheses and arithmetic symbols.');const t=[];let i=0;while(i<s.length){const r=s.slice(i);const number=r.match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(number){t.push({type:'number',value:Number(number[0])});i+=number[0].length;continue;}const identifier=r.match(/^[a-z]+/);if(identifier){if(identifier[0]!=='sqrt'&&identifier[0].length>1){for(const c of identifier[0])t.push({type:'variable',value:c});}else t.push({type:'variable',value:identifier[0]});i+=identifier[0].length;continue;}t.push({type:s[i],value:s[i]});i++;}t.push({type:'end'});let p=0;const peek=()=>t[p].type,consume=k=>{if(peek()!==k)throw Error('Check the arithmetic symbols and brackets.');p++;};function primary(){if(peek()==='number')return t[p++].value;if(peek()==='variable'){const v=t[p++].value;if(v==='sqrt'){consume('(');let x=addition();consume(')');if(x<0)throw Error('Cannot take the square root of a negative number here.');return Math.sqrt(x);}if(!(v in variables))throw Error('Use the variables shown in the question.');return variables[v];}if(peek()==='('){consume('(');let v=addition();consume(')');return v;}throw Error('Enter a mathematical expression, such as x^5 or 1/8.');}function powered(){let v=primary();if(peek()==='^'){consume('^');v=Math.pow(v,unary());}return v;}function unary(){if(peek()==='+'){consume('+');return unary();}if(peek()==='-'){consume('-');return -unary();}return powered();}function multiplication(){let v=unary();while(true){if(peek()==='*'){consume('*');v*=unary();}else if(peek()==='/'){consume('/');v/=unary();}else if(['number','variable','('].includes(peek())){v*=unary();}else break;}return v;}function addition(){let v=multiplication();while(peek()==='+'||peek()==='-'){let op=peek();p++;const n=multiplication();v=op==='+'?v+n:v-n;}return v;}const result=addition();if(peek()!=='end')throw Error('Check for missing operator ${sectionHead('Progress controls','Your data lives in this browser. Export a backup if you change devices or clear browser data.')}<div class="card card-pad"><div class="selector-row hide-for-print"><button class="btn btn-ghost" onclick="exportProgress()">↓ Export progress</button><button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">↑ Import progress</button><button class="btn btn-ghost" onclick="resetProgress()" style="color:var(--red)">Reset saved progress</button><input id="importFile" type="file" accept="application/json,.json" class="hidden" onchange="importProgress(event)"></div><p class="notice space-above" style="margin-bottom:0">Data is stored locally on this device. Imported backups replace the progress currently saved in this browser.</p></div>`;}
function exportProgress(){const payload=JSON.stringify({app:'Exponent Explorer',version:1,exported:new Date().toISOString(),progress:data},null,2);const blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='Exponent_Explorer_Progress.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Progress backup exported.');}
async function importProgress(event){const file=event.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.app!=='Exponent Explorer'||!obj.progress||!Array.isArray(obj.progress.completed)||!Array.isArray(obj.progress.runs)||typeof obj.progress.byTopic!=='object')throw Error('Not an Exponent Explorer backup.');confirmDialog('Replace your saved progress?',`Import ${obj.progress.completed.length} completed lessons and ${obj.progress.runs.length} recorded sessions? This will replace your current record.`,()=>{const backup=obj.progress;data=Object.assign(defaultData(),backup);data.completed=data.completed.filter(id=>LESSONS.some(l=>l.id===id));data.theme=backup.theme==='dark'?'dark':'light';save();toast('Progress imported.');render();});}catch(e){toast('Import failed: '+e.message);}finally{event.target.value='';}}
function resetProgress(){confirmDialog('Reset all progress?','This permanently clears local lesson completion, statistics, achievements and score history. You may export a backup first.',()=>{const theme=data.theme;data=defaultData();data.theme=theme;save();toast('Saved progress reset.');render();},true);}
function showHelp(){showModal(`<div class="eyebrow">Quick guide</div><h2>How to use Exponent Explorer</h2><p>Learn an exponent law, explore how it works, then apply it to new questions.</p><ul><li><strong>Learn the laws:</strong> 11 short lessons with examples and interactive factor visualizations. Mark each lesson complete when ready.</li><li><strong>Guided practice:</strong> Six questions with optional hints and immediate worked explanations.</li><li><strong>Free practice:</strong> Choose a topic, difficulty and question count.</li><li><strong>Assessment:</strong> Complete a quiz before seeing explanations, or attempt a 90-second sprint.</li><li><strong>My progress:</strong> See accuracy, completed lessons, best scores and achievements. Export or import your progress.</li></ul><div class="help-tip"><strong>Typing answers:</strong> Use <code>x^6</code> for x to the sixth power, <code>1/x^3</code> for a reciprocal, <code>9x^2</code> for a coefficient, and <code>4/9</code> for a fraction. Mathematically equivalent expressions count as correct.</div><p>During a question, press <strong>1–4</strong> to choose an option or <strong>Enter</strong> to submit. The app works offline and stores progress only in your browser.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="closeModal();navigate('learn')">Explore lessons →</button></div>`);}
function showModal(html){document.getElementById('modalHost').innerHTML=`<div class="modal-shade" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="Dialog">${html}</section></div>`;$('.modal .btn')?.focus({preventScroll:true});}
function closeModal(){$('#modalHost').innerHTML='';}
let confirmAction=null;function confirmDialog(title,message,callback,danger=false){confirmAction=callback;showModal(`<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn ${danger?'btn-dark':'btn-primary'}" onclick="runConfirmation()">${danger?'Yes, reset':'Confirm'}</button></div>`);}
function runConfirmation(){const cb=confirmAction;confirmAction=null;closeModal();if(cb)cb();}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalHost').children.length){closeModal();return;}if($('#modalHost').children.length)return;if(state.view!=='session'||!state.session)return;const q=state.session.questions[state.session.index];if(!q)return;const typing=e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT';if(!typing&&q.type==='mc'&&['1','2','3','4'].includes(e.key)){chooseOption(Number(e.key)-1);return;}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(state.feedback)advanceQuestion();else if(state.selected)submitAnswer();}});
window.addEventListener('storage',e=>{if(e.key==='exponent_explorer_save_v1'){try{data=Object.assign(defaultData(),JSON.parse(e.newValue||'{}'));if(state.view!=='session')render();}catch(_){}}});
render();
</script>
</body>
</html>
