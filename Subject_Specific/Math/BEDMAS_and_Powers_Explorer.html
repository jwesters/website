eight:750;color:var(--green)}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:30px;background:#e3ece2;border-radius:24px;margin-bottom:27px}.hero p{max-width:490px}.board{background:var(--ink);color:white;padding:25px;border-radius:19px;box-shadow:0 12px 24px #19363215}.board .tag{color:var(--ink)}.board .muted{color:#c1d8cb}.rulegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rule{padding:11px 13px;background:#2c4d45;border-radius:10px;display:flex;gap:12px;align-items:center}.rule b{color:var(--gold);font-size:21px}.rule span{font-size:13px}.rule small{display:block;color:#c1d8cb}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:23px}.card{display:flex;flex-direction:column}.card p{font-size:14px;flex:1}.card .num{font-size:13px;font-weight:700;color:var(--green);margin-bottom:10px}.card button{align-self:flex-start}.tag{display:inline-block;font-size:12px;font-weight:650;padding:3px 8px;background:var(--mint);border-radius:7px}.bonus{background:#fff0d0;color:#785418}.sectiontitle{margin:28px 0 16px}.progress{height:8px;background:#dce5dc;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.lessonlayout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:20px}.callout{background:#f0f5ed;border-left:4px solid var(--green);padding:15px 18px;border-radius:0 12px 12px 0;margin:18px 0}.warning{background:#fff6e2;border-color:#c29437}.math{font:clamp(25px,4vw,36px)/1.6 Georgia,serif;overflow-wrap:anywhere;margin:17px 0}.math.sm{font-size:24px}.math sup,sup{font-size:.65em;line-height:0}.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;font-size:.83em;line-height:1.3;margin:0 3px}.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 4px}.frac>span:last-child{padding:0 4px}.step{border-top:1px solid var(--line);padding:12px 0}.step p{margin:3px 0;font-size:14px}.step .math{margin:0;font-size:25px}.options{display:grid;gap:10px;margin:20px 0}.options button{text-align:left;padding:15px 18px;font-weight:500}.options button.selected{border:2px solid var(--green);background:var(--mint)}.options button.correct{border:2px solid var(--green);background:var(--mint)}.options button.wrong{border:2px solid #bc6c6c;background:#fff0ee}.feedback{padding:16px;border-radius:12px;background:var(--mint);margin:16px 0}.feedback.bad{background:#fff0ee}.feedback p:last-child{margin-bottom:0}.questionbox{max-width:790px;margin:20px auto}.answerrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input[type=text]{width:220px;max-width:100%;padding:12px;border:1px solid #9aae9f;border-radius:10px}input[type=checkbox]{width:19px;height:19px;accent-color:var(--green)}select{padding:10px;border:1px solid #9aae9f;border-radius:10px;background:white;max-width:100%}label{cursor:pointer}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.checklist label{display:flex;align-items:center;gap:10px;padding:11px;background:#f2f6ef;border-radius:10px}.field{display:grid;gap:7px;margin:15px 0}.score{font-size:56px;line-height:1.2;font-weight:750;letter-spacing:-2px}.review{margin:14px 0;border-left:4px solid var(--green)}.review.miss{border-left-color:#b85845}details{margin:12px 0}summary{cursor:pointer;font-weight:650}.records{width:100%;border-collapse:collapse;font-size:14px}.records td,.records th{text-align:left;border-bottom:1px solid var(--line);padding:11px 6px}dialog{border:0;border-radius:20px;background:#fff;color:var(--ink);padding:25px;max-width:520px;width:calc(100% - 32px);max-height:88dvh;overflow:auto;box-shadow:0 15px 80px #0005}dialog::backdrop{background:#14282399}dialog h2{padding-right:35px}.close{position:absolute;right:13px;top:13px;padding:4px 12px}.calc{position:fixed;right:20px;bottom:20px;width:310px;max-width:calc(100vw - 32px);z-index:5;box-shadow:0 16px 65px #0004;background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.calc input{width:100%;margin:10px 0}.calcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calcgrid button{padding:8px}.calcoutput{min-height:28px;font-size:22px;font-weight:700;overflow-wrap:anywhere}.empty{padding:35px;text-align:center}.small{font-size:13px}.hidden{display:none!important}footer{margin-top:22px;font-size:13px;color:var(--muted)}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr;padding:23px}.lessonlayout{grid-template-columns:1fr}.brand{font-size:17px}header{padding:15px;gap:10px}.brand small{display:none}.logo{width:36px;height:36px;margin-right:8px}.headtools{flex-wrap:wrap;justify-content:flex-end}main{padding:20px 15px 35px}nav{margin-top:12px;padding:0 10px}.hero h1{font-size:32px}}@media(max-width:480px){.cards,.checklist{grid-template-columns:1fr}.card{padding:20px}.hero{padding:20px}.headtools button{font-size:12px;min-height:40px;padding:6px 9px}.logo{display:none}header .brand{max-width:160px}.rule{padding:9px}.panel{padding:20px}.math{font-size:28px}.row>button{flex-grow:1}nav button{padding:9px 12px}.checklist label{font-size:14px}.records{font-size:12px}}@media print{header,nav,button,.calc{display:none!important}body{background:white}main{max-width:none}.review{break-inside:avoid}.panel{box-shadow:none}}
</style></head><body><header><div class="brandrow"><span class="logo">x²</span><div class="brand">BEDMAS & Powers Explorer<small>Learn · Practise · Check your understanding</small></div></div><div class="headtools"><button id="termBtn" onclick="toggleTerm()" aria-label="Switch order of operations acronym">BEDMAS ⇄</button><button onclick="toggleCalc()">Calculator</button><button onclick="help()">How to use</button></div></header><nav aria-label="Main navigation" id="nav"></nav><main id="app"></main><dialog id="modal"></dialog><aside id="calculator" class="calc hidden" aria-label="Calculator"><div class="row between"><strong>Calculator</strong><button onclick="toggleCalc()" aria-label="Close calculator">×</button></div><label class="small" for="calcInput">Use ^ for powers; e.g. 2^3 + 4</label><input id="calcInput" type="text" inputmode="text" autocomplete="off"><div id="calcOutput" class="calcoutput" aria-live="polite"></div><div class="calcgrid" id="calcKeys"></div><p class="small muted" style="margin-bottom:0">Try the steps yourself before checking.</p></aside><script>
'use strict';
const $=id=>document.getElementById(id), P=(b,e)=>`${b}<sup>${e}</sup>`, F=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lessons=[
{t:'Start with the operations',g:0,desc:'Build confidence with the four operations and mathematical symbols.',body:'Addition combines quantities. Subtraction finds a difference. Multiplication combines equal groups. Division shares or groups equally. Symbols × and · both mean multiply; ÷ and a fraction bar both mean divide.',rule:'When only addition and subtraction appear, work from left to right. The same is true when only multiplication and division appear.',trap:'Subtraction and division cannot usually be rearranged: 12 − 5 is different from 5 − 12.',ex:'18 − 7 + 4',steps:[['11 + 4','Subtract 7 first because it is the leftmost operation.'],['15','Then add 4.']],check:['In 24 ÷ 6 × 2, what comes first?',['24 ÷ 6','6 × 2','24 × 2'],0,'Division and multiplication have equal priority. Start at the left.']},
{t:'Meet BEDMAS / PEMDAS',g:0,desc:'Know the four priority levels, without the common acronym trap.',body:'BEDMAS means Brackets, Exponents, Division, Multiplication, Addition, Subtraction. PEMDAS uses Parentheses and lists Multiplication before Division. Both describe exactly the same order.',rule:'1. Grouping symbols → 2. Exponents → 3. Multiply OR divide, left to right → 4. Add OR subtract, left to right.',trap:'Neither acronym says “always divide before multiplying” or “always add before subtracting.” Each pair shares a level.',ex:'7 + 3 × 4',steps:[['7 + 12','Multiply before adding: 3 × 4 = 12.'],['19','Add 7 + 12.']],check:['Which part of 6 + 4 × 3 should you calculate first?',['6 + 4','4 × 3','6 + 3'],1,'Multiplication has higher priority than addition.']},
{t:'Equal priority: left to right',g:0,desc:'Handle multiplication/division and addition/subtraction correctly.',body:'Scan for the highest remaining priority. If two operations share that priority, use the leftmost one. Only then move to the next operation.',rule:'Multiply and divide share one level. Add and subtract share another.',trap:'In 20 − 6 + 2, adding 6 + 2 first would change the expression.',ex:'24 ÷ 6 × 2 − 3',steps:[['4 × 2 − 3','Divide first: 24 ÷ 6 = 4.'],['8 − 3','Multiply next: 4 × 2 = 8.'],['5','Subtract last.']],check:['What is the first step in 8 × 3 ÷ 4?',['3 ÷ 4','8 × 3','8 ÷ 4'],1,'Multiplication is leftmost among the equal-priority operations.']},
{t:'Brackets change the plan',g:0,desc:'Treat a group as a calculation that must be completed first.',body:'Complete calculations inside brackets before using the group in the rest of the expression. Round brackets ( ) and square brackets [ ] both group quantities.',rule:'Inside a group, still use the order of operations.',trap:'3 × (4 + 2) is 18, while 3 × 4 + 2 is 14. Brackets matter!',ex:'5 × (3 + 4) − 6',steps:[['5 × 7 − 6','Complete the bracket: 3 + 4 = 7.'],['35 − 6','Multiply 5 × 7.'],['29','Subtract 6.']],check:['In 2 × (3 + 4 × 2), which calculation is first?',['2 × 3','3 + 4','4 × 2'],2,'Inside the bracket, multiply before adding.']},
{t:'Nested brackets',g:1,desc:'Work from the innermost group toward the outside.',body:'Nested brackets are groups inside other groups. Finish the innermost group, simplify the surrounding group, then continue outward.',rule:'Inner group → outer group → remaining operations.',trap:'Do not remove brackets until their contents have been simplified, unless you are using a valid algebraic rule.',ex:'3 × [10 − (2 + 4)]',steps:[['3 × [10 − 6]','Innermost group: 2 + 4 = 6.'],['3 × 4','Outer group: 10 − 6 = 4.'],['12','Multiply.']],check:['In 4 × [9 − (2 + 3)], what comes first?',['4 × 9','9 − 2','2 + 3'],2,'Start inside the innermost brackets.']},
{t:'Bases, exponents & powers',g:1,desc:'Read powers as repeated multiplication, not multiplication by the exponent.',body:`In ${P(3,4)}, 3 is the base and 4 is the exponent. The whole expression is a power. For a positive whole-number exponent, multiply the base by itself that many times. A square has exponent 2; a cube has exponent 3.`,rule:`${P('a','n')} = a × a × … × a (n factors, for positive whole-number n).`,trap:`${P(3,4)} is not 3 × 4. Also, ${P(5,1)} = 5.`,ex:P(3,4),steps:[['3 × 3 × 3 × 3','Write four factors of 3.'],['9 × 3 × 3','Multiply the first two factors.'],['27 × 3','Multiply by the third factor.'],['81','Multiply by the fourth factor.']],check:[`What does ${P(4,3)} mean?`,['4 × 3','4 × 4 × 4','3 × 3 × 3 × 3'],1,'The base is 4 and the exponent tells you to use three factors.']},
{t:'Powers in BEDMAS',g:1,desc:'Combine powers with brackets and the four operations.',body:'Evaluate exponents after grouping symbols and before multiplication or division. If the base is a bracketed expression, simplify that base first.',rule:'Group first, evaluate powers next, then continue with the usual priorities.',trap:`In 2 + ${P(3,2)}, only 3 is squared. In ${P('(2 + 3)',2)}, the whole group is squared.`,ex:`2 × ${P('(3 + 1)',2)} + 5`,steps:[[`2 × ${P(4,2)} + 5`,'Brackets first: 3 + 1 = 4.'],['2 × 16 + 5','Evaluate the power: 4² = 16.'],['32 + 5','Multiply.'],['37','Add.']],check:[`What comes first in 3 + 2 × ${P(5,2)}?`,['3 + 2','2 × 5',`${P(5,2)}`],2,'No brackets remain, so evaluate the power first.']},
{t:'Negative bases & signs',g:1,desc:'See why parentheses change the sign of a power.',body:`In ${P('(−3)',2)}, the base is −3. In −${P(3,2)}, the base is 3 and the negative sign stays outside the power. An even number of negative factors gives a positive result; an odd number gives a negative result.`,rule:`${P('(−3)',2)} = 9, but −${P(3,2)} = −9.`,trap:'A negative base is not the same thing as a negative exponent.',ex:`${P('(−2)',3)} + ${P('(−2)',2)}`,steps:[['(−2) × (−2) × (−2) + (−2) × (−2)','Expand both powers.'],['−8 + 4','Three negative factors give −8; two give +4.'],['−4','Add.']],check:[`What is −${P(4,2)}?`,['16','−16','−8'],1,'Square 4 first, then apply the negative sign.']},
{t:'Decimals, fractions & groups',g:1,desc:'Apply the same order to more types of numbers.',body:'The priorities do not change for decimals, fractions or negative numbers. A fraction bar groups the entire numerator and the entire denominator: simplify each before dividing.',rule:`${F('6 + 2','5 − 1')} = ${F(8,4)} = 2. The bar acts like (6 + 2) ÷ (5 − 1).`,trap:'Keep the full denominator together. Dividing by a fraction means multiplying by its reciprocal.',ex:'1.5 + 0.5 × (8 − 2)',steps:[['1.5 + 0.5 × 6','Brackets: 8 − 2 = 6.'],['1.5 + 3','Multiply 0.5 × 6.'],['4.5','Add 1.5 + 3.']],check:[`Which is equivalent to ${F('8 + 4','3 + 1')}?`,['8 + 4 ÷ 3 + 1','(8 + 4) ÷ (3 + 1)','(8 + 4) ÷ 3 + 1'],1,'The fraction bar groups both the numerator and denominator.']},
{t:'Product law',g:2,desc:'Multiply powers with the same base by adding exponents.',body:'When multiplying powers of the same base, combine all the factors. The base stays the same and the exponents add.',rule:`${P('a','m')} × ${P('a','n')} = ${P('a','m + n')}`,trap:`This rule does not apply to addition: ${P(2,3)} + ${P(2,2)} = 12, not ${P(2,5)}. The bases must match.`,ex:`${P(2,3)} × ${P(2,4)}`,steps:[['(2 × 2 × 2) × (2 × 2 × 2 × 2)','There are seven factors of 2 in total.'],[P(2,'3 + 4'),'Add the exponents; keep the base.'],[P(2,7),'This is a single power. Evaluate only if asked: 128.']],check:[`${P('x',3)} × ${P('x',5)} simplifies to…`,[P('x',15),P('x',8),P('x',2)],1,'Same base, so add: 3 + 5 = 8.']},
{t:'Quotient law',g:2,desc:'Divide powers with the same nonzero base by subtracting exponents.',body:'Matching factors in the numerator and denominator cancel. Subtract the denominator’s exponent from the numerator’s exponent.',rule:`${P('a','m')} ÷ ${P('a','n')} = ${P('a','m − n')}, where a ≠ 0.`,trap:'Keep the subtraction in order: top exponent minus bottom exponent. Do not divide the exponents.',ex:`${P(3,5)} ÷ ${P(3,2)}`,steps:[[F('3 × 3 × 3 × 3 × 3','3 × 3'),'Cancel two pairs of matching factors.'],[P(3,'5 − 2'),'Subtract the exponents.'],[P(3,3),'The single power is 3³. Its value is 27.']],check:[`${P('a',7)} ÷ ${P('a',3)} (a ≠ 0) simplifies to…`,[P('a',10),P('a',4),P('a',21)],1,'Subtract 7 − 3 = 4.']},
{t:'Power of a power',g:2,desc:'Raise a power to another power by multiplying exponents.',body:'The outer exponent repeats the entire inner power. This creates equal groups of factors, so the exponents multiply.',rule:`${P(`(${P('a','m')})`,'n')} = ${P('a','m × n')}`,trap:'For a power of a power, multiply the exponents. For a product of same-base powers, add them.',ex:P(`(${P(2,3)})`,2),steps:[[`(${P(2,3)}) × (${P(2,3)})`,'The outer exponent 2 repeats the whole inner power twice.'],[P(2,'3 × 2'),'There are six factors of 2.'],[P(2,6),'Single power: 2⁶. Its value is 64.']],check:[`${P(`(${P('x',4)})`,3)} simplifies to…`,[P('x',7),P('x',12),P('x',64)],1,'Multiply the exponents: 4 × 3 = 12.']},
{t:'Power of a product',g:2,desc:'Apply an outside exponent to every factor inside a product.',body:'An exponent outside a product applies to every factor in that product, including a numerical coefficient.',rule:`${P('(ab)','n')} = ${P('a','n')}${P('b','n')}`,trap:`${P('(a + b)',2)} is not ${P('a',2)} + ${P('b',2)}. The product rule does not distribute over addition.`,ex:P('(2 × 3)',3),steps:[['(2 × 3) × (2 × 3) × (2 × 3)','Repeat the whole product three times.'],[`${P(2,3)} × ${P(3,3)}`,'Group the three 2s and three 3s.'],['8 × 27 = 216','Evaluate if asked. Also, 6³ = 216.']],check:[`${P('(3x)',2)} simplifies to…`,[`3${P('x',2)}`,`6${P('x',2)}`,`9${P('x',2)}`],2,'Square both factors: 3²x² = 9x².']},
{t:'Power of a quotient',g:2,desc:'Apply the exponent to both numerator and denominator.',body:'When a fraction is raised to a power, raise the numerator and the denominator to that power. The denominator must be nonzero.',rule:`${P(`(${F('a','b')})`,'n')} = ${F(P('a','n'),P('b','n'))}, b ≠ 0.`,trap:'The exponent belongs to the entire fraction only when grouping makes that clear.',ex:P(`(${F(2,3)})`,3),steps:[[F('2 × 2 × 2','3 × 3 × 3'),'Repeat the numerator and denominator three times each.'],[F(P(2,3),P(3,3)),'Apply the power to both.'],[F(8,27),'Evaluate both powers.']],check:[`${P(`(${F('x',5)})`,2)} simplifies to…`,[F(P('x',2),5),F(P('x',2),25),F('2x',10)],1,'Square both x and 5.']},
{t:'Zero exponents & mixed laws',g:2,desc:'Understand the zero exponent and combine the laws.',body:`Any nonzero base raised to zero is 1. The quotient law explains why: ${P(5,3)} ÷ ${P(5,3)} = 1 and also equals ${P(5,'3 − 3')} = ${P(5,0)}.`,rule:`${P('a',0)} = 1 when a ≠ 0. Simplify grouped powers, then products and quotients.`,trap:`${P(0,0)} is not covered by this rule. Do not use it in these exercises. Also, ${P('(3x)',0)} = 1 only if x ≠ 0.`,ex:`${P(`(${P(2,2)})`,3)} ÷ ${P(2,6)}`,steps:[[` ${P(2,6)} ÷ ${P(2,6)}`,'Power of a power: multiply 2 × 3.'],[P(2,'6 − 6'),'Quotient law: subtract the exponents.'],[`${P(2,0)} = 1`,'A nonzero base to the zero power is 1.']],check:[`What is ${P(9,0)} + ${P(2,3)}?`,['8','9','10'],1,'9⁰ = 1 and 2³ = 8, so the sum is 9.']},
{t:'Negative exponents',g:3,desc:'Bonus enrichment: use reciprocals to interpret negative exponents.',body:'A negative exponent means take the reciprocal of the corresponding positive power. It does not mean make the answer negative.',rule:`${P('a','−n')} = ${F(1,P('a','n'))}, a ≠ 0.`,trap:`${P(2,'−3')} = ${F(1,8)}, not −8. For a negative base, keep the sign rules too: ${P('(−2)','−3')} = −${F(1,8)}.`,ex:`${P(3,2)} ÷ ${P(3,4)}`,steps:[[P(3,'2 − 4'),'Subtract exponents using the quotient law.'],[P(3,'−2'),'The exponent is negative.'],[F(1,P(3,2)),'Rewrite as a reciprocal with a positive exponent.'],[F(1,9),'Evaluate.']],check:[`What does ${P(5,'−2')} equal?`,['−25',F(1,25),F(1,10)],1,'Take the reciprocal of 5² = 25.']}
];
const groups=['First steps','Build your skills','Exponent laws · through Grade 9','Bonus enrichment'];
let saved={done:[],practice:{},records:[],term:'BEDMAS'},storageOK=true;try{const s=JSON.parse(localStorage.getItem('bedmasPowersV1'));if(s&&Array.isArray(s.done)&&Array.isArray(s.records))saved={...saved,...s};}catch(e){storageOK=false}function save(){try{localStorage.setItem('bedmasPowersV1',JSON.stringify(saved))}catch(e){storageOK=false}}
let page='Learn',lessonId=0,reveal=0,quick=null,quickQuestion=null,session=null,selected=null,feedback=false,hintShown=false;
function nav(){ $('nav').innerHTML=['Learn','Practise','Quiz','Progress'].map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${x}</button>`).join('');$('termBtn').textContent=saved.term+' ⇄'}
function modal(html){$('modal').innerHTML=`<button class="close" aria-label="Close dialog" onclick="$('modal').close()">×</button>${html}`;$('modal').showModal()}
function confirmAction(title,description,action){modal(`<h2>${title}</h2><p>${description}</p><div class="row"><button onclick="$('modal').close()">Cancel</button><button class="primary" id="confirmYes">Confirm</button></div>`);$('confirmYes').onclick=()=>{$('modal').close();action()}}
function go(p){if(session&&!session.finished){confirmAction('Leave this session?','Your unfinished questions will be discarded. Completed progress stays saved.',()=>{session=null;go(p)});return}page=p;nav();if(p==='Learn')home();if(p==='Practise'||p==='Quiz')setup();if(p==='Progress')progress();window.scrollTo(0,0)}

function help(){modal(`<h2>How to use</h2><p><b>Learn:</b> Choose a lesson, reveal the worked example one step at a time, then try its quick check. Mark it complete when you are ready.</p><p><b>Practise:</b> Pick topics and answer questions. Hints and worked solutions are available after each attempt.</p><p><b>Quiz:</b> Choose 5, 10, 15 or 20 questions. You can go back and change answers. Scoring and solutions appear only after submission.</p><p>For number answers, enter a decimal, integer or fraction such as <b>1/8</b>. Multiple-choice powers use raised exponents.</p><p>Negative exponents are optional bonus enrichment. Mixed core quizzes exclude them unless selected.</p><p>Progress and the best five quiz scores per topic selection and length are saved in this browser when storage is available. Extract the ZIP and open the HTML in a browser; no internet is needed.</p>`)}

function openLesson(id){lessonId=id;reveal=0;quick=null;quickQuestion=gen(id);page='Learn';nav();renderLesson();window.scrollTo(0,0)}
function renderLesson(){const l=lessons[lessonId];$('app').innerHTML=`<div class="row between"><button onclick="home()">← All lessons</button><span class="tag ${l.g===3?'bonus':''}">${groups[l.g]} · ${lessonId+1} / 16</span></div><h1 id="lessonTitle">${l.t}</h1><p class="muted">${l.desc}</p><div class="lessonlayout"><section class="panel"><h2>The idea</h2><p>${l.body}</p><div class="callout">${l.rule}</div><div class="callout warning"><b>Watch for this</b><br>${l.trap}</div><h3>Quick check</h3><p>${quickQuestion.prompt}</p><div class="math sm">${quickQuestion.expr}</div><div class="options">${quickQuestion.opts.map((o,i)=>`<button ${quick!==null?'disabled':''} onclick="quick=${i};renderLesson()" class="${quick===i?(o===quickQuestion.answer?'correct':'wrong'):''}">${o}</button>`).join('')}</div>${quick!==null?`<div class="feedback ${quickQuestion.opts[quick]===quickQuestion.answer?'':'bad'}" role="status"><b>${quickQuestion.opts[quick]===quickQuestion.answer?'That’s right.':'Let’s look at it.'}</b> ${quickQuestion.steps.join(' ')}</div><button onclick="quick=null;quickQuestion=gen(lessonId);renderLesson()">Try a different quick check</button>`:''}</section><section class="panel"><span class="eyebrow">Worked example</span><div class="math">${l.ex}</div>${l.steps.slice(0,reveal).map((s,i)=>`<div class="step"><span class="tag">Step ${i+1}</span><div class="math">${s[0]}</div><p class="muted">${s[1]}</p></div>`).join('')}<div class="row" style="margin-top:18px">${reveal<l.steps.length?'<button class="primary" onclick="reveal++;renderLesson()">Reveal next step →</button>':'<span class="tag">Example complete</span>'}${reveal?'<button onclick="reveal=0;renderLesson()">Reset example</button>':''}</div></section></div><div class="panel" style="margin-top:20px"><div class="row between"><div><h3>Ready to use this idea?</h3><span class="muted small">Practise this topic or continue your learning path.</span></div><div class="row"><button onclick="startSession('practice',[${lessonId}],5)">Practise this lesson</button><button class="primary" onclick="completeLesson()">${saved.done.includes(lessonId)?'Continue →':'Mark complete & continue →'}</button></div></div></div>`}
function completeLesson(){if(!saved.done.includes(lessonId))saved.done.push(lessonId);save();lessonId<15?openLesson(lessonId+1):home()}
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function num(expr,answer,steps,hint){return{expr,answer,steps,hint,type:'num',prompt:'Evaluate the expression.'}}
function mc(expr,right,wrong,steps,hint,prompt='Simplify the expression.'){let opts=shuffle([...new Set([right,...wrong])]);return{expr,answer:right,opts,steps,hint,prompt,type:'mc'}}
function gen(id){let a=ri(2,9),b=ri(2,7),c=ri(2,5),d=ri(1,6),m=ri(2,5),n=ri(2,4),q,v=ri(0,2);switch(id){
case 0:q=v===0?num(`${a+b} − ${b} + ${c}`,a+c,[`${a+b} − ${b} = ${a}`,`${a} + ${c} = ${a+c}`],'Add and subtract from left to right.'):v===1?num(`${a*b} ÷ ${b} × ${c}`,a*c,[`${a*b} ÷ ${b} = ${a}`,`${a} × ${c} = ${a*c}`],'Multiply and divide from left to right.'):num(`${a} × ${b} ÷ ${b}`,a,[`${a} × ${b} = ${a*b}`,`${a*b} ÷ ${b} = ${a}`],'Start with the leftmost multiplication.');break;
case 1:q=num(`${a} + ${b} × ${c}`,a+b*c,[`${b} × ${c} = ${b*c}`,`${a} + ${b*c} = ${a+b*c}`],'Multiply before adding.');break;
case 2:q=v?num(`${a*b} ÷ ${b} × ${c} − ${d}`,a*c-d,[`${a*b} ÷ ${b} = ${a}`,`${a} × ${c} = ${a*c}`,`${a*c} − ${d} = ${a*c-d}`],'Division and multiplication tie: work left to right.'):num(`${a*b} − ${b} + ${c}`,a*b-b+c,[`${a*b} − ${b} = ${a*b-b}`,`${a*b-b} + ${c} = ${a*b-b+c}`],'Subtraction and addition tie: work left to right.');break;
case 3:q=num(`${a} × (${b} + ${c}) − ${d}`,a*(b+c)-d,[`${b} + ${c} = ${b+c}`,`${a} × ${b+c} = ${a*(b+c)}`,`${a*(b+c)} − ${d} = ${a*(b+c)-d}`],'Complete the bracket first.');break;
case 4:q=num(`${c} × [${a+b+d} − (${b} + ${d})]`,c*a,[`${b} + ${d} = ${b+d}`,`${a+b+d} − ${b+d} = ${a}`,`${c} × ${a} = ${c*a}`],'Start with the innermost group.');break;
case 5:q=v?num(P(c,n),c**n,[`${P(c,n)} = ${Array(n).fill(c).join(' × ')}`,`The value is ${c**n}.`],'The exponent counts the number of factors.'):mc(Array(n).fill(a).join(' × '),P(a,n),[P(a,n+1),P(a,n+2),P(a+1,n)],[`There are ${n} factors of ${a}, so write ${P(a,n)}.`],'Count the repeated factors.','Write the product as a power.');break;
case 6:q=v?num(`${a} + ${b} × ${P(c,2)}`,a+b*c*c,[`${P(c,2)} = ${c*c}`,`${b} × ${c*c} = ${b*c*c}`,`${a} + ${b*c*c} = ${a+b*c*c}`],'Evaluate the power before multiplying.'):num(`${P(`(${b} + ${c})`,2)} − ${a}`,(b+c)**2-a,[`${b} + ${c} = ${b+c}`,`${P(b+c,2)} = ${(b+c)**2}`,`${(b+c)**2} − ${a} = ${(b+c)**2-a}`],'The base is a group: simplify it before squaring.');break;
case 7:q=v?num(P(`(−${c})`,n),(-c)**n,[`${Array(n).fill(`(−${c})`).join(' × ')}`,`${n} negative factors give a ${n%2?'negative':'positive'} result: ${(-c)**n}.`],'An even number of negative factors gives positive; an odd number gives negative.'):num(`−${P(c,n)}`,-(c**n),[`${P(c,n)} = ${c**n}`,`The negative sign is outside the power: −${c**n}.`],'Without parentheses, the negative sign is outside the power.');break;
case 8:q=v===0?num(`${a/2} + 0.5 × (${b+c} − ${c})`,a/2+b/2,[`${b+c} − ${c} = ${b}`,`0.5 × ${b} = ${b/2}`,`${a/2} + ${b/2} = ${(a+b)/2}`],'Brackets, then multiplication, then addition.'):v===1?num(F(`${a*b} + ${b*c}`,`${b+d} − ${d}`),a+c,[`Numerator: ${a*b} + ${b*c} = ${b*(a+c)}`,`Denominator: ${b+d} − ${d} = ${b}`,`${b*(a+c)} ÷ ${b} = ${a+c}`],'A fraction bar groups the whole numerator and denominator.'):num(`${F(1,2)} + ${F(1,4)} × ${c}`,(2+c)/4,[`${F(1,4)} × ${c} = ${F(c,4)}`,`${F(1,2)} = ${F(2,4)}`,`${F(2,4)} + ${F(c,4)} = ${F(2+c,4)} = ${(2+c)/4}`],'Multiply first. Use equal denominators to add.');break;
case 9:q=mc(`${P('x',m)} × ${P('x',n)}`,P('x',m+n),[P('x',m*n+1),P('x',Math.abs(m-n)),P('2x',m+n)],[`Same base: add exponents ${m} + ${n} = ${m+n}.`,`The result is ${P('x',m+n)}.`],'For a product of same-base powers, add exponents.');break;
case 10:q=mc(`${P('a',m+n)} ÷ ${P('a',n)} <span class="small">(a ≠ 0)</span>`,P('a',m),[P('a',m+2*n),P('a',(m+n)*n),P('a',m+1)],[`Subtract the denominator exponent: ${m+n} − ${n} = ${m}.`,`The result is ${P('a',m)}.`],'Keep the base; subtract top exponent minus bottom exponent.');break;
case 11:q=mc(P(`(${P('x',m)})`,n),P('x',m*n),[P('x',m*n+1),P('x',m+n===m*n?m+n+2:m+n),P('x',m)],[`Multiply exponents: ${m} × ${n} = ${m*n}.`,`The result is ${P('x',m*n)}.`],'The outside exponent repeats the whole inner power.');break;
case 12:q=mc(P(`(${c}x)`,n),`${c**n}${P('x',n)}`,[`${c}${P('x',n)}`,`${c*n}${P('x',n+1)}`,`${c**n}x`],[`Apply the exponent to both factors: ${P(c,n)} × ${P('x',n)}.`,`${P(c,n)} = ${c**n}, so the result is ${c**n}${P('x',n)}.`],'Raise the coefficient and the variable to the power.');break;
case 13:q=mc(P(`(${F('x',c)})`,n),F(P('x',n),c**n),[F(P('x',n),c),F('x',c**n),F(P('x',n+1),c*n)],[`Apply the power to numerator and denominator: ${F(P('x',n),P(c,n))}.`,`Evaluate the denominator: ${c**n}.`],'Raise both numerator and denominator to the power.');break;
case 14:q=v===0?num(`${P(a,0)} + ${P(c,2)}`,1+c*c,[`${P(a,0)} = 1`,`${P(c,2)} = ${c*c}`,`1 + ${c*c} = ${1+c*c}`],'Every nonzero base raised to zero equals 1.'):mc(`${P(`(${P('x',m)})`,n)} ÷ ${P('x',m*n-d)} <span class="small">(x ≠ 0)</span>`,P('x',d),[P('x',m*n*2-d),P('x',d+1),'0'],[`Power of a power: ${m} × ${n} = ${m*n}.`,`Quotient: ${m*n} − (${m*n-d}) = ${d}.`,`Result: ${P('x',d)}.`],'Multiply the nested exponents, then subtract the denominator exponent.');if(m*n-d<0&&v!==0)return gen(id);break;
case 15:q=v?num(P(c,'−'+n),1/c**n,[`${P(c,'−'+n)} = ${F(1,P(c,n))}`,`${F(1,c**n)} ≈ ${+(1/c**n).toPrecision(7)}`],'A negative exponent means reciprocal. Enter an exact fraction such as 1/8.'):mc(`${P('x',m)} ÷ ${P('x',m+n)} <span class="small">(x ≠ 0)</span>`,F(1,P('x',n)),[P('x',n),`−${P('x',n)}`,F(1,P('x',n+1))],[`Subtract: ${m} − ${m+n} = −${n}.`,`${P('x','−'+n)} = ${F(1,P('x',n))}.`],'Subtract the exponents, then rewrite the negative exponent as a reciprocal.','Simplify using positive exponents.');break;
}q.id=id;return q;}
function setup(){const quiz=page==='Quiz';$('app').innerHTML=`<span class="eyebrow">${quiz?'Check your understanding':'Build confidence'}</span><h1>${quiz?'Build your quiz':'Choose your practice'}</h1><p class="muted">${quiz?'Your score and worked solutions appear after you submit.':'Get a hint when you need one, then explore each worked solution.'}</p><section class="panel"><div class="row"><button onclick="preset('foundation')">First steps</button><button onclick="preset('order')">Order of operations</button><button onclick="preset('laws')">Exponent laws</button><button onclick="preset('core')">All core topics</button><button onclick="preset('none')">Clear selection</button></div><div class="checklist">${lessons.map((l,i)=>`<label><input type="checkbox" name="topic" value="${i}" ${i<15?'checked':''}><span>${i+1}. ${l.t}${i===15?' <span class="tag bonus">Bonus</span>':''}</span></label>`).join('')}</div><div class="row between"><div class="field"><label for="count">Number of questions</label><select id="count">${[5,10,15,20].map(n=>`<option ${n===10?'selected':''}>${n}</option>`).join('')}</select></div><div><p class="small muted">Choose any combination of topics.</p><button class="primary" onclick="beginSetup()">Start ${quiz?'quiz':'practice'} →</button></div></div><p id="setupError" role="alert"></p></section>`}
function preset(p){document.querySelectorAll('[name=topic]').forEach(el=>{let i=+el.value;el.checked=p==='foundation'?i<4:p==='order'?i<9:p==='laws'?i>=9&&i<15:p==='core'?i<15:false})}
function beginSetup(){const ids=[...document.querySelectorAll('[name=topic]:checked')].map(e=>+e.value);if(!ids.length){$('setupError').textContent='Select at least one topic to begin.';return}startSession(page==='Quiz'?'quiz':'practice',ids,+$('count').value)}
function startSession(mode,ids,count){page=mode==='quiz'?'Quiz':'Practise';nav();let qs=[],seen=new Set(),order=shuffle([...ids]);for(let i=0;i<count;i++){let id=order[i%order.length],q;for(let tries=0;tries<200;tries++){q=gen(id);if(!seen.has(q.expr))break}seen.add(q.expr);qs.push(q)}session={mode,ids,count,qs,answers:Array(count).fill(null),index:0,finished:false,checked:Array(count).fill(false),correct:Array(count).fill(false)};feedback=false;selected=null;hintShown=false;renderQuestion();window.scrollTo(0,0)}
function parseAnswer(v){let s=String(v).trim().replace(/−/g,'-');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\s*\/\s*[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s))return NaN;let parts=s.split('/').map(Number);return parts.length===1?parts[0]:parts[1]===0?NaN:parts[0]/parts[1]}
function correct(q,v){if(v===null)return false;return q.type==='mc'?v===q.answer:Number.isFinite(parseAnswer(v))&&Math.abs(parseAnswer(v)-q.answer)<=Math.max(5.01e-7,Math.abs(q.answer)*0.000001)}
function rememberInput(){if(!session)return;const q=session.qs[session.index];if(q.type==='num'&&$('answer'))session.answers[session.index]=$('answer').value.trim()||null}
function renderQuestion(){let s=session,i=s.index,q=s.qs[i],quiz=s.mode==='quiz',checked=s.checked[i];$('app').innerHTML=`<div class="row between"><button onclick="go('${page}')">← ${quiz?'Quiz':'Practice'} setup</button><span class="tag">${quiz?'Quiz':'Practice'} · Question ${i+1} of ${s.count}</span></div><div class="progress" style="margin-top:18px"><i style="width:${(i+1)/s.count*100}%"></i></div><section class="panel questionbox"><span class="eyebrow">${lessons[q.id].t}</span><h2 style="margin-top:10px">${q.prompt}</h2><div class="math">${q.expr}</div>${q.type==='mc'?`<div class="options" role="group" aria-label="Answer choices">${q.opts.map((o,j)=>`<button class="${s.answers[i]===o?'selected':''} ${checked&&o===q.answer?'correct':''} ${checked&&s.answers[i]===o&&o!==q.answer?'wrong':''}" aria-pressed="${s.answers[i]===o}" ${checked?'disabled':''} onclick="choose(${j})">${o}</button>`).join('')}</div>`:`<label for="answer">Your answer</label><div class="answerrow"><input id="answer" type="text" autocomplete="off" placeholder="e.g. 12, −4, or 1/8" value="${esc(s.answers[i]??'')}" ${checked?'disabled':''} oninput="rememberInput()"></div><p class="small muted">Integers, decimals and fractions accepted. Use at least 6 decimal places if rounding.</p>`}<div id="inputError" role="alert" class="small"></div>${!quiz&&!checked?`<div class="row"><button class="primary" onclick="checkPractice()">Check answer</button><button onclick="hintShown=true;rememberInput();renderQuestion()">Show hint</button></div>${hintShown?`<div class="callout">${q.hint}</div>`:''}`:''}${checked?`<div class="feedback ${s.correct[i]?'':'bad'}" role="status"><b>${s.correct[i]?'Correct!':'Here’s how to solve it.'}</b><p>Answer: ${answerDisplay(q)}</p>${q.steps.map((step,k)=>`<p><b>${k+1}.</b> ${step}</p>`).join('')}</div>`:''}<div class="row between" style="margin-top:24px">${quiz?`<button ${i===0?'disabled':''} onclick="moveQuestion(-1)">← Previous</button><button class="primary" onclick="${i===s.count-1?'submitQuiz()':'moveQuestion(1)'}">${i===s.count-1?'Submit quiz':'Next →'}</button>`:checked?`<button class="primary" onclick="${i===s.count-1?'finishSession()':'moveQuestion(1)'}">${i===s.count-1?'See practice summary':'Next question →'}</button>`:''}</div>${quiz?`<p class="small muted">${s.answers.filter(a=>a!==null).length} of ${s.count} answered. You can change answers before submitting.</p>`:''}</section>`;if($('answer'))$('answer').onkeydown=e=>{if(e.key==='Enter'){if(quiz){i===s.count-1?submitQuiz():moveQuestion(1)}else if(!checked)checkPractice()}}}
function choose(j){let q=session.qs[session.index];session.answers[session.index]=q.opts[j];renderQuestion()}
function answerDisplay(q){return q.type==='mc'?q.answer:(q.id===15&&q.answer>0&&q.answer<1?F(1,Math.round(1/q.answer)):String(q.answer).replace('-','−'))}
function checkPractice(){rememberInput();let s=session,i=s.index,q=s.qs[i],v=s.answers[i];if(v===null||(q.type==='num'&&!Number.isFinite(parseAnswer(v)))){$('inputError').textContent='Enter a valid number or fraction, or choose an answer.';return}if(s.checked[i])return;s.checked[i]=true;s.correct[i]=correct(q,v);let p=saved.practice[q.id]||{attempts:0,correct:0};p.attempts++;if(s.correct[i])p.correct++;saved.practice[q.id]=p;save();renderQuestion()}
function moveQuestion(delta){rememberInput();session.index+=delta;hintShown=false;renderQuestion();window.scrollTo(0,0)}
function submitQuiz(){rememberInput();let unanswered=session.answers.filter(x=>x===null).length;confirmAction('Submit this quiz?',unanswered?`${unanswered} question${unanswered===1?' is':'s are'} unanswered and will count as incorrect. Submit now?`:'Finish and reveal your score and worked solutions?',finishSession)}
function finishSession(){let s=session;if(s.finished)return;s.finished=true;s.correct=s.qs.map((q,i)=>correct(q,s.answers[i]));let score=s.correct.filter(Boolean).length;if(s.mode==='quiz'){let key=s.ids.slice().sort((a,b)=>a-b).join(',')+'|'+s.count;let rec={key,score,total:s.count,date:new Date().toISOString(),ids:s.ids};saved.records.push(rec);saved.records=saved.records.filter(r=>r.key!==key).concat(saved.records.filter(r=>r.key===key).sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date)).slice(0,5));save()}renderResults()}
function renderResults(){let s=session,score=s.correct.filter(Boolean).length;$('app').innerHTML=`<section class="panel"><span class="eyebrow">${s.mode==='quiz'?'Quiz complete':'Practice complete'}</span><div class="row between"><div><div class="score">${score}<span style="font-size:26px;color:var(--muted)"> / ${s.count}</span></div><p>${Math.round(score/s.count*100)}% · ${score===s.count?'Excellent work.':score/s.count>=.7?'Good progress. Review the missed questions below.':'Keep building your skills. Use the worked solutions below.'}</p></div><div class="row"><button onclick="startSession(session.mode,session.ids,session.count)">New questions</button><button class="primary" onclick="go('Learn')">Back to lessons</button><button onclick="window.print()">Print results</button></div></div></section><h2 class="sectiontitle">Your answers & worked solutions</h2>${s.qs.map((q,i)=>`<section class="panel review ${s.correct[i]?'':'miss'}"><div class="row between"><b>Question ${i+1} · ${lessons[q.id].t}</b><span class="tag">${s.correct[i]?'✓ Correct':'Review'}</span></div><p>${q.prompt}</p><div class="math sm">${q.expr}</div><p>Your answer: ${s.answers[i]===null?'Not answered':q.type==='mc'?s.answers[i]:esc(s.answers[i])}<br><b>Correct answer: ${answerDisplay(q)}</b></p><details ${s.correct[i]?'':'open'}><summary>Worked solution</summary>${q.steps.map((step,k)=>`<p>${k+1}. ${step}</p>`).join('')}<button onclick="openLessonFromResults(${q.id})">Review this lesson →</button></details></section>`).join('')}`;window.scrollTo(0,0)}
function openLessonFromResults(id){session=null;openLesson(id)}
function progress(){let keys=[...new Set(saved.records.map(r=>r.key))];$('app').innerHTML=`<span class="eyebrow">Your progress</span><h1>Keep building your skills</h1><p class="muted">${saved.done.filter(i=>i<15).length} / 15 core lessons complete · Bonus ${saved.done.includes(15)?'complete':'not complete'}</p>${!storageOK?'<div class="callout warning">Browser storage is unavailable. Progress will last only for this open session.</div>':''}<section class="panel"><h2>Practice by topic</h2><table class="records"><thead><tr><th>Topic</th><th>Lesson</th><th>First attempts</th></tr></thead><tbody>${lessons.map((l,i)=>{let p=saved.practice[i];return `<tr><td>${l.t}</td><td>${saved.done.includes(i)?'✓ Complete':'Not complete'}</td><td>${p?`${p.correct} / ${p.attempts}`:'—'}</td></tr>`}).join('')}</tbody></table></section><h2 class="sectiontitle">Best quiz scores</h2><p class="muted">Top five per topic selection and quiz length. Newest wins ties.</p>${keys.length?keys.map(key=>{let rs=saved.records.filter(r=>r.key===key).sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date));let title=rs[0].ids.length===15&& !rs[0].ids.includes(15)?'All core topics':rs[0].ids.map(i=>lessons[i].t).join(' · ');return `<section class="panel" style="margin-bottom:15px"><h3>${title}</h3><span class="tag">${rs[0].total} questions</span><table class="records"><thead><tr><th>Rank</th><th>Score</th><th>Date & time</th></tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</td><td>${new Date(r.date).toLocaleString()}</td></tr>`).join('')}</tbody></table></section>`}).join(''):'<section class="panel empty">Complete a quiz to record your first score.</section>'}<footer>Progress belongs to this browser. Clearing browser data can remove it.</footer><button style="margin-top:20px" onclick="confirmAction('Reset all progress?','This removes completed lesson marks, practice totals and quiz records from this browser.',()=>{saved={done:[],practice:{},records:[],term:saved.term};save();progress()})">Reset progress</button>`}
// Restricted arithmetic parser: no code evaluation or external dependencies.
function calculate(str){let toks=str.replace(/×/g,'*').replace(/[÷]/g,'/').replace(/−/g,'-').replace(/\s+/g,'').match(/(?:\d*\.\d+|\d+\.?\d*)|[()+\-*/^]/g)||[];let clean=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');if(toks.join('')!==clean||toks.length>100)throw Error('Check the expression.');let i=0;function atom(){if(toks[i]==='('){i++;let v=add();if(toks[i++]!==')')throw Error('Close the brackets.');return v}let t=toks[i++];if(!t||!/^\d|^\./.test(t))throw Error('Enter a number.');return Number(t)}function power(){let v=atom();if(toks[i]==='^'){i++;v=v**unary()}return v}function unary(){if(toks[i]==='-'){i++;return -unary()}if(toks[i]==='+'){i++;return unary()}return power()}function mul(){let v=unary();while(toks[i]==='*'||toks[i]==='/'){let op=toks[i++],b=unary();v=op==='*'?v*b:v/b}return v}function add(){let v=mul();while(toks[i]==='+'||toks[i]==='-'){let op=toks[i++],b=mul();v=op==='+'?v+b:v-b}return v}let val=add();if(i!==toks.length||!Number.isFinite(val))throw Error('Undefined or invalid expression.');return +val.toPrecision(12)}
function toggleCalc(){$('calculator').classList.toggle('hidden');if(!$('calculator').classList.contains('hidden'))$('calcInput').focus()}
function calcKey(k){if(k==='C'){$('calcInput').value='';$('calcOutput').textContent='';return}if(k==='⌫'){$('calcInput').value=$('calcInput').value.slice(0,-1);return}if(k==='='){try{$('calcOutput').textContent=calculate($('calcInput').value)}catch(e){$('calcOutput').textContent=e.message}return}$('calcInput').value+=k}
$('calcKeys').innerHTML=['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','^','+','='].map(k=>`<button ${k==='='?'class="primary" style="grid-column:1/-1"':''} onclick="calcKey('${k}')">${k}</button>`).join('');$('calcInput').onkeydown=e=>{if(e.key==='Enter')calcKey('=')};nav();home();
</script></body></html>
