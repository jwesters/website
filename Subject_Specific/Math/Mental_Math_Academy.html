// Chapter 1 – pp. 1–16.
add(1,'add-two','Two-digit addition', '2–4','Build sums by adding the tens before the ones.', ['Split the second number into tens and ones.','Add the tens first; keep the running total in mind.','Add the ones to finish.'],()=>{let a=R(24,86),b=R(13,79),t=Math.floor(b/10)*10,u=b%10;return qa(`${a} + ${b}`,a+b,[ss(`Add ${t} first: ${a} + ${t}`,a+t),ss(`Then add ${u}`,a+b)],`Break ${b} into ${t} + ${u}.`)});
add(1,'add-three','Three-digit addition','4–7','Carry left-to-right through hundreds, tens, then ones.',['Break one addend into its place-value parts.','Add hundreds, then tens, then ones.','Listen to or visualize each new running total.'],()=>{let a=R(235,875),b=R(121,689),h=Math.floor(b/100)*100,t=Math.floor(b%100/10)*10,u=b%10;return qa(`${a} + ${b}`,a+b,[ss(`${a} + ${h}`,a+h),ss(`${a+h} + ${t}`,a+h+t),ss(`Finish by adding ${u}`,a+b)],`Try ${h}, then ${t}, then ${u}.`)});
add(1,'add-four','Four-digit addition','6–9','Keep the same strategy even when the numbers get larger.',['Separate the thousands, hundreds, tens and ones.','Combine each place-value piece with the running total.','Check the size with a quick rounded estimate.'],()=>{let a=R(1200,8400),b=R(1100,4900),parts=[Math.floor(b/1000)*1000,Math.floor(b%1000/100)*100,Math.floor(b%100/10)*10,b%10].filter(Boolean),v=a;return qa(`${fmt(a)} + ${fmt(b)}`,a+b,parts.map(p=>{let before=v;v+=p;return ss(`${fmt(before)} + ${fmt(p)}`,fmt(v))}),`Add ${parts.map(fmt).join(', then ')}.`)} ,2);
add(1,'add-comp','Addition by compensation','6–7','Round a difficult addend to a friendly number and correct it.',['Round one number to a nearby multiple of 10 or 100.','Add the rounded number.','Undo the rounding by subtracting the extra amount.'],()=>{let a=R(180,899),base=pick([100,200,300,400,500,600]),d=R(2,9),b=base-d;return qa(`${a} + ${b}`,a+b,[ss(`Round ${b} up to ${base}: ${a} + ${base}`,a+base),ss(`Subtract the extra ${d}`,a+b)],`Think of ${b} as ${base} − ${d}.`)});
add(1,'subtract-two','Two-digit subtraction','9–11','Subtract tens first, then subtract ones.',['Split the amount being subtracted into tens and ones.','Take away the tens before the ones.','Use the intermediate result to avoid borrowing on paper.'],()=>{let a=R(56,99),b=R(11,a-8),t=Math.floor(b/10)*10,u=b%10;return qa(`${a} − ${b}`,a-b,[ss(`${a} − ${t}`,a-t),ss(`${a-t} − ${u}`,a-b)],`Subtract ${t}, then ${u}.`)});
add(1,'subtract-three','Three-digit subtraction','11–13','Subtract hundreds, tens and ones with a running total.',['Start at the largest place value.','Reduce the problem one piece at a time.','Check by adding your answer back to the subtracted number.'],()=>{let a=R(540,980),b=R(150,a-100),h=Math.floor(b/100)*100,t=Math.floor(b%100/10)*10,u=b%10,v=a;return qa(`${a} − ${b}`,a-b,[h,t,u].filter(Boolean).map(p=>{let old=v;v-=p;return ss(`${old} − ${p}`,v)}),`Take away ${h}, then ${t}, then ${u}.`)});
add(1,'subtract-round','Subtraction by rounding','11–13','Subtract a convenient nearby value and then correct.',['Round the subtrahend up to a friendly ten or hundred.','Subtract that larger amount.','Add back the extra amount you took away.'],()=>{let b=pick([200,300,400,500,600,700])-R(2,19),a=b+R(130,420),base=Math.ceil(b/100)*100,d=base-b;return qa(`${a} − ${b}`,a-b,[ss(`Subtract ${base}: ${a} − ${base}`,a-base),ss(`Return the ${d} extra`,a-b)],`Since ${b} = ${base} − ${d}, add ${d} back.`)});
add(1,'complements','Complements of 100','13–15','Find the missing amount needed to reach 100.',['Ask what the tens digit needs to reach 9.','Ask what the ones digit needs to reach 10.','Check that the two numbers add to 100.'],()=>{let a=R(11,89),b=100-a;return qa(`What number completes ${a} + ___ = 100?`,b,[ss(`Subtract from 100: 100 − ${a}`,b),ss(`Check: ${a} + ${b}`,100)],`The missing number is the complement of ${a}.`)});
// Chapter 2 – pp. 17–38.
add(2,'times-two-one','Two-digit × one-digit','18–21','Use place value instead of a memorized long product.',['Split the two-digit number into tens and ones.','Multiply each piece by the single-digit factor.','Add the two products.'],()=>{let a=R(21,89),b=R(3,9),t=Math.floor(a/10)*10,u=a%10;return qa(`${a} × ${b}`,a*b,[ss(`${t} × ${b}`,t*b),ss(`${u} × ${b}`,u*b),ss(`Add partial products: ${t*b} + ${u*b}`,a*b)],`Use (${t} + ${u}) × ${b}.`)});
add(2,'times-round','Multiply by rounding','20–22','Multiples near a round ten are friendlier to multiply.',['Replace a factor such as 49 with 50 − 1.','Multiply by the easy round value.','Subtract the correction.'],()=>{let a=pick([29,39,49,59,79,89,99]),b=R(3,9),t=a+1;return qa(`${a} × ${b}`,a*b,[ss(`${t} × ${b}`,t*b),ss(`Subtract 1 × ${b}`,a*b)],`Use ${a} = ${t} − 1.`)});
add(2,'times-three-one','Three-digit × one-digit','22–29','Decompose a three-digit number into manageable pieces.',['Multiply the hundreds piece first.','Add the tens product, then the ones product.','Keep a running total after each stage.'],()=>{let a=R(123,876),b=R(3,9),parts=[Math.floor(a/100)*100,Math.floor(a%100/10)*10,a%10].filter(Boolean),v=0;return qa(`${a} × ${b}`,a*b,parts.map(p=>{v+=p*b;return ss(`${p} × ${b}; cumulative product`,v)}),`Use (${parts.join(' + ')}) × ${b}.`)});
add(2,'times-five','Multiply by five','20–27','Multiplying by five is half of multiplying by ten.',['Multiply by 10 by adding a zero.','Divide that result by 2.','This works for any whole-number factor.'],()=>{let a=R(14,190);return qa(`${a} × 5`,a*5,[ss(`${a} × 10`,a*10),ss(`Take half`,a*5)],`Five is half of ten.`)});
add(2,'square-two','Square near a multiple of ten','29–33','Balance equally above and below the target, then add a small square.',['Find the nearest multiple of ten.','Multiply two numbers equally far below and above the original.','Add the square of the distance.'],()=>{let a=R(13,96),base=roundTo(a,10),d=Math.abs(a-base),lo=a-d,hi=a+d;return qa(`${a}²`,sq(a),[ss(`Balanced product: ${lo} × ${hi}`,lo*hi),ss(`Add the difference squared, ${d}² = ${d*d}`,sq(a))],`Use (${a} − ${d})(${a} + ${d}) + ${d}².`)});
add(2,'square-five','Squares ending in five','31–33','A fast pattern emerges when squaring a number ending in 5.',['Take the tens digit, call it n.','Multiply n by n + 1.','Append the digits 25.'],()=>{let n=R(1,17),a=n*10+5;return qa(`${a}²`,a*a,[ss(`Multiply ${n} × ${n+1}`,n*(n+1)),ss(`Append 25`,a*a)],`Use ${n} × ${n+1}, then write 25.`)});
add(2,'distributive','Why splitting works','33–35','The distributive property justifies the mental steps.',['Express one factor as a sum.','Multiply each term by the other factor.','Add partial products to reconstruct the original product.'],()=>{let x=R(11,29),b=R(3,8),p=10,u=x-10;return qa(`(${p} + ${u}) × ${b}`,x*b,[ss(`${p} × ${b}`,p*b),ss(`${u} × ${b}`,u*b),ss(`Combine`,x*b)],`a(b + c) = ab + ac.`)});
// Chapter 3 – pp. 39–60.
add(3,'two-two','Two-digit × two-digit','40–44','Multiply one factor in tens and ones.',['Split the first factor into tens and ones.','Multiply each piece by the other two-digit number.','Add the partial results.'],()=>{let a=R(21,87),b=R(22,89),t=Math.floor(a/10)*10,u=a%10;return qa(`${a} × ${b}`,a*b,[ss(`${t} × ${b}`,t*b),ss(`${u} × ${b}`,u*b),ss('Sum the products',a*b)],`Treat ${a} as ${t} + ${u}.`)});
add(3,'two-two-sub','Multiplication by subtraction','43–46','For factors near a round number, subtracting can be faster.',['Round a factor up to the nearest ten.','Multiply with the round number.','Subtract the small difference times the other factor.'],()=>{let a=pick([38,49,58,69,79,89,98]),b=R(21,88),base=Math.ceil(a/10)*10,d=base-a;return qa(`${a} × ${b}`,a*b,[ss(`${base} × ${b}`,base*b),ss(`Subtract ${d} × ${b}`,a*b)],`Use ${a} = ${base} − ${d}.`)});
add(3,'factor-products','Factor one multiplier','47–51','A convenient factor pair can replace a harder multiplication.',['Look for small factors such as 4 × 6 or 7 × 8.','Multiply by one small factor.','Multiply that result by the other factor.'],()=>{let a=R(23,79),[f,g]=pick([[4,6],[6,7],[7,8],[3,9],[5,9],[4,11]]),b=f*g;return qa(`${a} × ${b}`,a*b,[ss(`${a} × ${f}`,a*f),ss(`${a*f} × ${g}`,a*b)],`Factor ${b} as ${f} × ${g}.`)});
add(3,'double-half','Double and halve','47–51','Keep the product unchanged while making a factor easier.',['If one factor is even, divide it by two.','Double the other factor.','Repeat if this makes the computation easier.'],()=>{let a=R(18,68),b=pick([24,36,48,64,84,96]),h=b/2;return qa(`${a} × ${b}`,a*b,[ss(`Double ${a}`,a*2),ss(`Halve ${b}`,h),ss(`Multiply ${a*2} × ${h}`,a*b)],`Twice one factor and half the other gives the same product.`)});
add(3,'times-eleven','Multiplication by eleven','41–44, 49','Split eleven into ten plus one.',['Multiply the number by ten.','Add one more copy of the number.','This works even with carries.'],()=>{let n=R(23,294);return qa(`${n} × 11`,n*11,[ss(`${n} × 10`,n*10),ss(`Add ${n}`,n*11)],`11 = 10 + 1.`)});
add(3,'square-three','Three-digit squares','53–57','Apply the same balanced-number trick used for two-digit squares.',['Choose a nearby multiple of 100.','Multiply equally spaced values around the number.','Add the square of the distance.'],()=>{let n=R(113,886),b=roundTo(n,100),d=Math.abs(n-b),lo=n-d,hi=n+d;return qa(`${n}²`,n*n,[ss(`${lo} × ${hi}`,lo*hi),ss(`Add ${d}² (${d*d})`,n*n)],`Use (${n} − ${d})(${n} + ${d}) + ${d}².`)},2);
add(3,'near-100','Products around 100','45–47','Use distance from 100 to simplify two nearby factors.',['Write both factors as 100 plus or minus a small change.','Multiply 100 by the sum of 100 and the changes.','Add the product of the changes.'],()=>{let a=100+R(-18,18),b=100+R(-18,18),da=a-100,db=b-100,k=100*(100+da+db);return qa(`${a} × ${b}`,a*b,[ss(`100 × (100 ${da>=0?'+':'−'} ${Math.abs(da)} ${db>=0?'+':'−'} ${Math.abs(db)})`,k),ss(`Add correction (${da}) × (${db})`,a*b)],`(100+a)(100+b)=100(100+a+b)+ab.`)},2);
// Chapter 4 – pp. 61–82.
add(4,'divide-one','Divide by one digit','61–64','Work through the dividend from left to right.',['Choose a large multiple of your divisor.','Subtract it, then divide the remaining part.','Combine the quotient pieces.'],()=>{let d=R(3,9),a=R(11,49),b=R(1,9),q=a*10+b,n=d*q,h=Math.floor(q/10)*10;return qa(`${n} ÷ ${d}`,q,[ss(`Take ${d} × ${h} = ${d*h}; quotient so far`,h),ss(`Remaining ${n-d*h} ÷ ${d}`,q-h),ss(`Combine quotient pieces`,q)],`Find the tens in the quotient first.`)});
add(4,'divide-rem','Division with a remainder','63–66','Keep track of what the divisor leaves over.',['Estimate how many whole groups fit.','Multiply to check how much is used.','Subtract to find the remainder.'],()=>{let d=R(3,9),q=R(24,109),r=R(1,d-1),n=d*q+r;return qa(`What is the remainder when ${n} is divided by ${d}?`,r,[ss(`Largest multiple not exceeding ${n}: ${d} × ${q}`,d*q),ss(`Subtract: ${n} − ${d*q}`,r)],`The remainder is smaller than ${d}.`)});
add(4,'divide-two','Divide by two digits','67–73','Simplify using chunks that are easy multiples of the divisor.',['Take out a convenient multiple of the divisor.','Divide the smaller amount left.','Add the partial quotients.'],()=>{let d=R(12,29),q=R(12,69),n=d*q,t=Math.floor(q/10)*10;return qa(`${n} ÷ ${d}`,q,[ss(`Use ${t} groups: ${d} × ${t}`,d*t),ss(`Left over: ${n} − ${d*t}`,n-d*t),ss(`Add the last ${q-t} groups`,q)],`Try ${t} groups first.`)});
add(4,'divide-factor','Simplify division by factors','71–73','Cancel a common factor in the dividend and divisor.',['Identify a shared factor.','Divide the top and bottom by it.','Evaluate the simpler division.'],()=>{let k=pick([2,3,4,5,6,8]),d=R(7,19),q=R(8,35),n=k*d*q;return qa(`${n} ÷ ${d*k}`,q,[ss(`Divide both numbers by ${k}: ${n/k} ÷ ${d}`,q),ss(`Check ${d*k} × ${q}`,n)],`Both numbers contain a factor of ${k}.`)});
add(4,'divide-decimal','Fractions as decimals','73–77','A quotient can be represented as a decimal to a chosen precision.',['Convert the fraction to a familiar decimal.','When needed, add zeros to continue division.','Distinguish exact decimals from rounded ones.'],()=>{let d=pick([2,4,5,8,10,20,25,40,50]),n=R(1,d-1),value=n/d;return qa(`Write ${n}/${d} as a decimal (up to 3 places).`,value,[ss(`Compute ${n} ÷ ${d}`,value),ss(`Check: ${value} × ${d}`,n)],`Use a denominator of 10, 100 or 1,000 when possible.`, 'decimal')});
add(4,'divide-repeating','Repeating decimals','74–76','Some fractions repeat rather than terminate.',['Divide the numerator by the denominator.','Look for a remainder you have already seen.','That remainder signals a repeating digit pattern.'],()=>{let d=pick([3,6,9,11]),n=R(1,d-1),decimal=(n/d).toFixed(3);return qa(`Round ${n}/${d} to 3 decimal places.`,decimal,[ss(`Long division gives ${String(n/d).slice(0,11)}…`,decimal),ss(`Round to 3 decimal places`,decimal)],`The decimal may repeat. Round, do not truncate.`, 'decimal')});
for(const d of [2,3,4,5,6,7,8,9,11]){
 const rules={2:'Check whether the last digit is even.',3:'Add the digits; the sum must be a multiple of 3.',4:'Only the last two digits need to be divisible by 4.',5:'The last digit must be 0 or 5.',6:'The number must be divisible by both 2 and 3.',7:'Subtract twice the last digit from the remaining number; repeat as needed.',8:'Only the last three digits need to be divisible by 8.',9:'Add the digits; the sum must be a multiple of 9.',11:'Find the difference between alternating-position digit sums; it must be a multiple of 11.'};
 add(4,`divide-test-${d}`,`Divisibility by ${d}`,d===7?'80–81':d===11?'80–81':'77–80',rules[d],['Apply the test without doing full division.',rules[d],'A result of “yes” means there is no remainder.'],()=>{let n=R(110,7000),yes=Math.random()<.5;if(yes)n=Math.floor(n/d)*d;else if(n%d===0)n++;let extra=d===3||d===9?` Digit sum = ${digitsum(n)}.`:d===4?` Last two digits = ${n%100}.`:d===8?` Last three digits = ${n%1000}.`:d===11?` Alternating digit difference = ${String(n).split('').reduce((acc,s,i)=>acc+(i%2? -1:1)*Number(s),0)}.`:'';return qa(`Is ${fmt(n)} divisible by ${d}? Type yes or no.`,n%d===0?'yes':'no',[ss(`Apply the rule.${extra}`,n%d===0?'yes':'no'),ss(`Check remainder: ${fmt(n)} ÷ ${d}`,n%d)],rules[d],'yesno')});
}
// Chapter 5 – pp. 83–98.
add(5,'estimate-add','Estimate addition','83–85','Round both addends to a convenient place value.',['Choose a precision that fits the question.','Round each number to the nearest hundred.','Add the rounded values for a fast estimate.'],()=>{let a=R(230,860),b=R(230,860),x=roundTo(a,100),y=roundTo(b,100);return qa(`Estimate ${a} + ${b} by rounding EACH number to the nearest 100.`,x+y,[ss(`Round ${a}`,x),ss(`Round ${b}`,y),ss(`Add the estimates`,x+y)],`Round to the nearest 100; this is an estimate, not the exact sum.`)});
add(5,'estimate-sub','Estimate subtraction','85–86','Estimate a difference using friendly hundreds.',['Round the larger number.','Round the smaller number using the same precision.','Subtract the rounded amounts.'],()=>{let a=R(710,1550),b=R(170,620),x=roundTo(a,100),y=roundTo(b,100);return qa(`Estimate ${a} − ${b} by rounding each number to the nearest 100.`,x-y,[ss(`Round ${a}`,x),ss(`Round ${b}`,y),ss(`Take the difference`,x-y)],`Nearest hundred for both values.`)});
add(5,'estimate-mul','Estimate multiplication','88–90','Use rounded factors to judge the size of a product.',['Round each factor to the nearest ten.','Multiply those easy factors.','Use the original numbers to judge whether your estimate is high or low.'],()=>{let a=R(22,98),b=R(22,98),x=roundTo(a,10),y=roundTo(b,10);return qa(`Estimate ${a} × ${b}, rounding each factor to the nearest 10.`,x*y,[ss(`Round ${a}`,x),ss(`Round ${b}`,y),ss(`Multiply rounded values`,x*y)],`This practice uses a specific rounding rule for consistent answers.`)});
add(5,'estimate-div','Estimate division','86–88','Choose compatible numbers for quick quotient estimates.',['Look for a nearby multiple that divides evenly.','Calculate the compatible-number quotient.','Compare with the exact value to judge your estimate.'],()=>{let d=pick([4,5,6,8,9,12]),q=R(12,49),off=R(-Math.min(3,d-1),Math.min(3,d-1)),n=d*q+off;return qa(`Estimate ${n} ÷ ${d} using the nearby multiple ${d*q}.`,q,[ss(`Replace ${n} with ${d*q}`,d*q),ss(`${d*q} ÷ ${d}`,q)],`Use the nearby compatible dividend ${d*q}.`)});
add(5,'estimate-roots','Estimate square roots','91–94','Bracket an unfamiliar square root between familiar whole squares.',['Locate the two consecutive perfect squares around the number.','The square root lies between their roots.','Choose the lower whole number as the integer part.'],()=>{let a=R(8,45),n=a*a+R(1,2*a),lo=a*a,hi=(a+1)**2;return qa(`What is the INTEGER PART of √${fmt(n)}?`,a,[ss(`${a}²`,lo),ss(`${a+1}²`,hi),ss(`√${n} is between ${a} and ${a+1}; integer part`,a)],`Compare ${a}² and ${a+1}².`)});
add(5,'divide-average','Divide-and-average root refinement','91–94','Improve a square-root estimate by averaging a guess with the quotient.',['Make a whole-number guess for the root.','Divide the target number by that guess.','Average the guess and quotient to improve the estimate.'],()=>{let root=R(6,29),n=root*root,g=root+pick([-2,-1,1,2]);let refined=(g+n/g)/2;return qa(`For √${n}, start with ${g}. What is the NEW estimate, rounded to 2 decimals, after one divide-and-average step?`,refined.toFixed(2),[ss(`${n} ÷ ${g}, rounded to 4 decimals`,(n/g).toFixed(4)),ss(`Average the guess and quotient: (${g} + ${Number((n/g).toFixed(4))}) ÷ 2`,refined.toFixed(2))],`Compute (${g} + ${n}/${g}) ÷ 2.`,'decimal')});
// Chapter 6 – pp. 99–116.
add(6,'column-sums','Column totals','99–101','Group a longer list of values into easier subtotals.',['Pair numbers that form friendly totals.','Add the pair totals.','Verify by a second grouping if you have time.'],()=>{let a=R(15,85),b=100-a,c=R(17,79),d=100-c,e=R(12,85);return qa(`Add these five numbers: ${a}, ${c}, ${e}, ${b}, ${d}`,200+e,[ss(`${a} + ${b}`,100),ss(`${c} + ${d}`,100),ss(`100 + 100 + ${e}`,200+e)],`Find pairs adding to 100.`)});
add(6,'casting-nine','Casting out nines','100–102','A digital-root check can expose mistakes in a calculation.',['Add the digits repeatedly, treating multiples of 9 as 9.','Compare digit roots of both sides of the equation.','A mismatch proves an error; a match is not a guarantee.'],()=>{let a=R(21,89),b=R(13,59),c=a*b,wrong=Math.random()<.5?c:c+pick([1,2,4,5,7]);let exp=dr(a)*dr(b),check=dr(wrong);return qa(`Does ${a} × ${b} = ${wrong} PASS the casting-out-nines test? Type yes or no.`,dr(exp)===check?'yes':'no',[ss(`Digit root of factors: ${dr(a)} × ${dr(b)} →`,dr(exp)),ss(`Digit root of stated product ${wrong}`,check),ss(`Do these digital roots match?`,dr(exp)===check?'yes':'no')],`Compare the products modulo 9. A passing check might still be wrong.`,'yesno')});
add(6,'paper-roots','Square-root digit extraction','102–105','Learn the logic of the written square-root algorithm using perfect squares.',['Group digits into pairs, starting at the decimal point.','Select the largest square not exceeding the leading pair.','Bring down a pair and choose the next root digit using (20r + d)d.'],()=>{let root=R(11,89),n=root*root,r=Math.floor(root/10),d=root%10,head=Math.floor(n/100),rem=n-r*r*100;return qa(`√${n} (a perfect square)`,root,[ss(`Largest square ≤ first digit-pair ${head}: ${r}²`,r),ss(`Bring down final pair; remainder after ${r*r} hundreds`,rem),ss(`Choose d so (20×${r} + d)×d = ${rem}`,d),ss(`Combine root digits`,root)],`Use (20×${r} + d)d for the next digit.`)},2);
add(6,'crisscross-2','Criss-cross multiplication (2 digits)','105–109','Sum digit products diagonally, handling carries from right to left.',['Multiply the ones digits for the right column.','Cross-multiply and add for the middle column.','Multiply the tens digits for the left column, carrying as needed.'],()=>{let a=R(12,89),b=R(12,89),a1=a%10,a0=Math.floor(a/10),b1=b%10,b0=Math.floor(b/10),ones=a1*b1,mid=a0*b1+a1*b0+Math.floor(ones/10),left=a0*b0+Math.floor(mid/10);return qa(`${a} × ${b}`,a*b,[ss(`Ones column: ${a1}×${b1}; write ones digit`,ones%10),ss(`Cross-products + carry (${a0}×${b1} + ${a1}×${b0} + ${Math.floor(ones/10)}), write ones digit`,mid%10),ss(`Left digits + carry`,left),ss(`Final combined product`,a*b)],`Work diagonal groups from right to left.`)});
add(6,'crisscross-3','Criss-cross multiplication (3 digits)','105–109','The same diagonal-convolution pattern scales to three-digit factors.',['Match every digit pair that contributes to a place value.','Add the products from right to left.','Carry tens into the next diagonal sum.'],()=>{let a=R(102,399),b=R(102,299),A=String(a).split('').reverse().map(Number),B=String(b).split('').reverse().map(Number),carry=0,st=[];for(let k=0;k<5;k++){let sum=carry;for(let i=0;i<3;i++)if(k-i>=0&&k-i<3)sum+=A[i]*B[k-i];st.push(ss(`Diagonal ${k+1}: write ${sum%10}, carry ${Math.floor(sum/10)}`,sum%10));carry=Math.floor(sum/10);}st.push(ss('Reassemble all columns',a*b));return qa(`${a} × ${b}`,a*b,st,`Each digit pair contributes to the place value matching its positions.`)},2);
add(6,'casting-eleven','Casting out elevens','110–113','Use alternating sums of digits to check whether a value is a multiple of eleven.',['Add digits in alternating positions.','Subtract one group from the other.','A result divisible by 11 indicates the original is divisible by 11.'],()=>{let k=R(23,899),n=k*11+(Math.random()<.5?0:pick([1,2,3,5]));let alt=String(n).split('').reduce((s,d,i)=>s+(i%2? -1:1)*Number(d),0);return qa(`Is ${n} divisible by 11? Type yes or no.`,n%11===0?'yes':'no',[ss('Alternating digit sum',alt),ss('Is it a multiple of 11?',n%11===0?'yes':'no')],`Try alternating + and − across the digits.`,'yesno')});
add(6,'inverse-check','Check by inverse operation','101–103','Addition and subtraction can verify one another.',['To check subtraction, add the difference to the subtrahend.','To check addition, subtract an addend from the sum.','Use an inverse operation to spot errors.'],()=>{let a=R(360,920),b=R(115,320),c=a-b+pick([0,0,0,1,2,-3]);return qa(`Does ${a} − ${b} = ${c} pass an inverse-operation check? Type yes or no.`,c+b===a?'yes':'no',[ss(`Add back: ${c} + ${b}`,c+b),ss(`Does that equal ${a}?`,c+b===a?'yes':'no')],`Add the claimed difference and the number taken away.`,'yesno')});

function setLesson(id,tab='learn'){let t=topicById[id]||entries[0];ui.lesson=t.id;ui.chapter=t.c;ui.tab=tab;ui.workStep=0;ui.workQ=t.make();ui.q=t.make();ui.feedback=null;ui.hint=false;ui.answer='';ui.memoryVisible=true;markLearned(t.id)}
function currentTopic(){return topicById[ui.lesson]||entries[0]}
function sourceNote(t){return `Benjamin & Shermer, <em>Mathemagics</em>, chapter ${t.c}, print pp. ${esc(t.page)}`}
function sidebar(){return `<aside class="sidebar ${ui.mobileNav?'open':''}" id="sidebar"><div class="brand"><div class="brand-logo" aria-hidden="true">M<span style="font-size:13px;align-self:end;margin:0 0 9px 1px">²</span></div><div class="brand-text"><strong>Mental Math Academy</strong><small>Learn, practise, progress</small></div></div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation">${nav('home','home','Dashboard')}${nav('library','book','All lessons')}${nav('quiz-setup','target','Knowledge checks')}${nav('sprint-setup','clock','Speed challenge')}${nav('achievements','award','Achievements')}</nav><div class="nav-label">Nine chapters</div><nav class="nav" aria-label="Chapters">${CHAPTERS.map((ch,i)=>`<button class="nav-btn ${ui.view==='chapter'&&ui.chapter===i+1?'active':''}" data-action="chapter" data-val="${i+1}"><span class="nav-icon">${ico(ch.icon)}</span><span style="flex:1;min-width:0">${i+1}. ${esc(ch.name)}</span><span class="nav-n">${chapterDone(i+1)}/${chapterTopics(i+1).length}</span></button>`).join('')}</nav><div class="nav-label">Preferences</div><nav class="nav">${nav('settings','settings','Settings & backup')}${nav('sources','info','Book & credits')}</nav><div class="side-footer"><strong>Based on <em>Mathemagics</em></strong><br>Arthur Benjamin & Michael Shermer<br>Original teaching material · 74 lessons<br>Offline · Progress stored on this device</div></aside>`}
function nav(id,icon,title){return `<button class="nav-btn ${ui.view===id?'active':''}" data-action="${id}"><span class="nav-icon">${ico(icon)}</span><span>${title}</span></button>`}
function topbar(){let pageNames={home:'Dashboard',library:'Lesson library',chapter:`Chapter ${ui.chapter}`,lesson:'Learning workspace','quiz-setup':'Knowledge checks',quiz:'Knowledge check','quiz-result':'Assessment results','sprint-setup':'Speed challenge',sprint:'Timed challenge','sprint-result':'Challenge results',achievements:'Achievements',settings:'Settings & backup',sources:'Credits & references'};return `<header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" data-action="menu" aria-label="Open navigation">${ico('menu')}</button><div><h1>${esc(pageNames[ui.view]||'Mental Math Academy')}</h1></div></div><div class="top-actions"><div class="tiny-stat">${ico('check','sm')} ${overall()} of ${entries.length} practising</div><button data-action="toggle-theme" class="icon-btn" aria-label="Switch colour theme" title="Switch colour theme">${ico(store.settings.theme==='dark'?'sun':'moon')}</button><button data-action="sources" class="icon-btn" title="About the source book" aria-label="About the source book">${ico('info')}</button></div></header>`}
function footer(){return `<div class="footer-line">Inspired by the methods in <em>Mathemagics: How to Look Like a Genius Without Really Trying</em> by Arthur Benjamin and Michael Shermer (1993/1994). Original independent learning activities.</div>`}
function courseCard(ch,i){let done=chapterDone(i+1),count=chapterTopics(i+1).length;return `<button class="course-card" data-action="chapter" data-val="${i+1}"><span class="index">${pad(i+1,2)}</span><h4>${esc(ch.name)}</h4><p>${esc(ch.desc)}</p>${progressBar(done,count)}<div class="course-foot"><span>${count} lessons · pp. ${ch.range}</span><span>${percent(done,count)}%</span></div></button>`}
function pageHead(eyebrow,title,sub,action=''){return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2>${sub?`<p class="subheading">${sub}</p>`:''}</div>${action}</div>`}
function home(){const t=lastLesson();return `<section class="hero"><div><p class="eyebrow">Your learning space</p><h2>Mental Math Academy</h2><p class="subheading">Short lessons, interactive examples and as much practice as you need. Explore 74 skills based on nine chapters of mental mathematics.</p><div class="btn-row" style="margin-top:22px">${button('resume',`${ico('play','sm')} ${overall()?'Continue learning':'Start learning'}`)}${button('quiz-setup','Take a knowledge check','secondary')}</div></div><div class="hero-ring" style="--p:${percent(overall(),entries.length)}%"><span><strong>${percent(overall(),entries.length)}%</strong><small>Skills practising</small></span></div></section><div class="stats-grid"><div class="stat"><div class="stat-label">Practising or mastered</div><strong>${overall()} <span style="font-size:14px;color:var(--muted)">/ ${entries.length}</span></strong><small>Across 9 chapters</small></div><div class="stat"><div class="stat-label">Correct answers</div><strong>${fmt(totalCorrect())}</strong><small>Recorded on this device</small></div><div class="stat"><div class="stat-label">Knowledge checks</div><strong>${store.quizzes.length}</strong><small>Completed quizzes</small></div><div class="stat"><div class="stat-label">Mastered skills</div><strong>${entries.filter(t=>progressOf(t.id).peak>=3).length}</strong><small>7+ correct at ≥80% accuracy</small></div></div><div class="section-title"><h3>Explore the nine chapters</h3><span class="pill gray">${entries.length} individual lessons</span></div><div class="course-grid">${CHAPTERS.map(courseCard).join('')}</div><div class="split" style="margin-top:22px"><div class="panel"><div class="section-title"><h3>Your next lesson</h3></div><div class="mini-row"><div><b>${esc(t.title)}</b><small>Chapter ${t.c} · pp. ${esc(t.page)}</small></div>${button('resume',`Open ${ico('arrow','sm')}`,'secondary')}</div><p class="inline-note">You can move freely among chapters or follow them in order. Everything stays available; no forced unlocks.</p></div><div class="panel source-panel"><div class="section-title"><h3>About the source</h3></div><p>Concepts are informed by <em>Mathemagics</em> (Arthur Benjamin & Michael Shermer). Each lesson links its method to the book's printed pages.</p>${button('sources','View complete credits','secondary')}</div></div>`}
function levelLabel(t){return ['','Beginner','Intermediate','Advanced'][t.level]||'Beginner'}
function lessonCard(t,i){let p=progressOf(t.id),[state,cls]=rating(p);return `<button class="lesson-card" data-action="lesson" data-val="${esc(t.id)}"><span class="lesson-index">${pad(i+1,2)}</span><span class="lesson-card-body"><h4>${esc(t.title)}</h4><p>${esc(t.blurb)}</p><span class="lesson-meta"><span class="pill ${cls}">${esc(state)}</span><span>p. ${esc(t.page)}</span><span>· ${levelLabel(t)}</span></span></span>${ico('chevron','sm')}</button>`}
function chapterView(){let ch=CHAPTERS[ui.chapter-1],list=chapterTopics(ui.chapter),done=chapterDone(ui.chapter);return `<div class="crumb"><button data-action="home">Home</button>${ico('chevron','sm')}<span>Chapter ${ui.chapter}</span></div><div class="panel chapter-overview" style="margin-bottom:21px"><div><p class="eyebrow">Chapter ${pad(ui.chapter,2)} · pp. ${ch.range}</p><h2>${esc(ch.name)}</h2><p>${esc(ch.desc)} Work at your own pace, revisit any topic or challenge yourself with a chapter quiz.</p><div style="max-width:400px;margin:15px 0 0">${progressBar(done,list.length)}<p class="inline-note">${done} of ${list.length} skills practising or mastered</p></div></div><div class="btn-row">${button('chapter-first',`${ico('play','sm')} Start chapter`,'primary',`data-val="${ui.chapter}"`)}${button('chapter-quiz','Chapter quiz','secondary',`data-val="${ui.chapter}"`)}</div></div><div class="section-title"><h3>Lessons in this chapter</h3><span class="pill gray">${list.length} topics</span></div><div class="lesson-grid">${list.map(lessonCard).join('')}</div>`}
function libraryView(){const q=ui.search.toLowerCase().trim();const found=entries.filter(t=>(ui.filterLevel==='all'||Number(ui.filterLevel)===t.level)&&(!q||`${t.title} ${t.blurb} ${CHAPTERS[t.c-1].name}`.toLowerCase().includes(q)));return `${pageHead('Complete library','Explore every lesson','Search all 74 topics. You can study in any order and return as often as you need.') }<div class="panel" style="margin-bottom:20px"><div class="btn-row"><div style="flex:1;min-width:190px"><label class="sr-only" for="searchTopic">Search lessons</label><input id="searchTopic" class="search-input" value="${safeAttr(ui.search)}" placeholder="Search lessons, skills or chapters…" autocomplete="off"></div><label class="sr-only" for="levelSelect">Difficulty</label><select id="levelSelect" class="form-select" aria-label="Filter lessons by difficulty"><option value="all" ${ui.filterLevel==='all'?'selected':''}>All levels</option><option value="1" ${ui.filterLevel==='1'?'selected':''}>Beginner</option><option value="2" ${ui.filterLevel==='2'?'selected':''}>Intermediate</option><option value="3" ${ui.filterLevel==='3'?'selected':''}>Advanced</option></select></div></div>${found.length?`<div class="lesson-grid">${found.map(t=>lessonCard(t,chapterTopics(t.c).indexOf(t))).join('')}</div>`:'<div class="panel empty">No lessons match your search. Try a different keyword.</div>'}`}
function lessonAside(t){const p=progressOf(t.id),[state,cls]=rating(p),chapterList=chapterTopics(t.c),idx=chapterList.indexOf(t),next=chapterList[idx+1]||entries[entries.indexOf(t)+1];return `<aside class="lesson-aside"><div class="panel flat"><p class="kicker">Your progress</p><p><span class="pill ${cls}">${esc(state)}</span></p><div class="side-progress"><strong>${p.correct||0} / ${p.attempts||0} correct</strong>${progressBar(p.correct||0,Math.max(7,p.attempts||0))}</div><p class="inline-note">Mastery starts at 7 correct answers and at least 80% accuracy. Practice anytime; your strongest status is retained.</p><div class="divider"></div><p class="kicker">Lesson reference</p><p class="quote-ref">${sourceNote(t)}</p><div class="divider"></div><p class="kicker">Next lesson</p>${next?`<b style="display:block;font-size:13px;margin:10px 0">${esc(next.title)}</b>${button('lesson',`Continue ${ico('arrow','sm')}`,'secondary',`data-val="${esc(next.id)}"`)}`:`<p class="inline-note">You have reached the end of the learning path.</p>`}</div><div class="panel flat"><p class="kicker">Learning tools</p><p class="inline-note">Each example is newly generated. Reveal its reasoning, then solve a fresh problem with optional hints. Assessments save explanations until the end.</p><div class="divider"></div>${button('lesson-quiz',`${ico('target','sm')} Quiz on this skill`,'secondary',`data-val="${esc(t.id)}"`)}</div></aside>`}
function stepsBlock(q,n=q.steps.length){return `<div class="steps">${q.steps.slice(0,n).map((s,i)=>`<div class="step"><span class="step-index">${i+1}</span><div class="step-text">${esc(s.label)}${s.value!==''?`<strong>${esc(s.value)}</strong>`:''}</div></div>`).join('')}</div>`}
function lessonView(){let t=currentTopic(),steps=t.how.map(s=>`<li>${esc(s)}</li>`).join('');return `<div class="crumb"><button data-action="home">Home</button>${ico('chevron','sm')}<button data-action="chapter" data-val="${t.c}">Chapter ${t.c}</button>${ico('chevron','sm')}<span>${esc(t.title)}</span></div>${pageHead('Lesson · Chapter '+t.c,esc(t.title),esc(t.blurb))}<div class="lesson-layout"><div class="lesson-main"><div class="tabbar" role="tablist" aria-label="Lesson sections">${[['learn','Mini lesson'],['explore','Explore steps'],['practice','Your turn']].map(([id,label])=>`<button role="tab" aria-selected="${ui.tab===id}" class="tab ${ui.tab===id?'active':''}" data-action="tab" data-val="${id}">${label}</button>`).join('')}</div>${ui.tab==='learn'?`<div class="panel"><p class="eyebrow">Learn the strategy</p><h3 style="font-size:21px;letter-spacing:-.3px;margin:0 0 12px">A simpler way to think</h3><p class="subheading">${esc(t.blurb)} This is an independently written explanation of a strategy presented in the source book.</p><ol class="number-list">${steps}</ol><div class="lesson-tip">${ico('info','sm')} <strong>Tip:</strong> Take your time at first. Aim for accuracy and understanding before speed.</div><div class="btn-row">${button('tab',`Explore an example ${ico('arrow','sm')}`,'primary','data-val="explore"')}${button('tab','Start practising','secondary','data-val="practice"')}</div></div>`:ui.tab==='explore'?exploreView(t):practiceView(t)}</div>${lessonAside(t)}</div>`}
function exploreView(t){let q=ui.workQ||t.make(),n=ui.workStep;return `<div class="panel"><p class="eyebrow">Interactive walkthrough</p><h3 style="margin:0;font-size:20px">Follow the reasoning</h3><p class="subheading">Reveal one step at a time. Try predicting the next intermediate value before showing it.</p><div class="problem-block"><div class="problem-label">Worked example</div><div class="problem-prompt">${esc(q.prompt)}</div></div>${q.kind==='memory'?`<div class="memory-display">${esc(q.show||q.answer)}</div>`:''}${n?stepsBlock(q,n):'<div class="notice">Think through the first step, then select “Reveal next step”.</div>'}${n===q.steps.length?`<div class="answer-display">${ico('check','sm')} Final answer: ${esc(q.answer)}</div>`:''}<div class="work-controls">${button('work-next',`Reveal next step ${ico('arrow','sm')}`,'primary',n>=q.steps.length?'disabled':'')}${button('work-new',`${ico('refresh','sm')} New example`,'secondary')}${button('work-reset','Start over','ghost')}</div><div class="divider"></div>${button('tab',`Now try it yourself ${ico('arrow','sm')}`,'secondary','data-val="practice"')}</div>`}
function memoryControl(q){if(q.kind!=='memory')return '';return `<div class="memory-display">${ui.memoryVisible?esc(q.show):'• • • • • • • •'}</div><div class="btn-row">${button('memory-toggle',ui.memoryVisible?'Hide digits and answer':'Show digits again','secondary')}</div><p class="inline-note">Study the digits, hide them, then enter the sequence from memory. Leading zeros count.</p>`}
function practiceView(t){let q=ui.q||t.make(),f=ui.feedback;return `<div class="panel"><div class="section-title"><h3>Independent practice</h3><span class="pill gray">Unlimited questions</span></div><p class="subheading">Try the strategy with a new problem. Hints and worked steps are optional; feedback is immediate.</p><div class="problem-block"><span class="problem-label">Your problem</span><div class="problem-prompt">${esc(q.prompt)}</div></div>${memoryControl(q)}<form id="practice-form" class="practice-entry"><label class="sr-only" for="practiceInput">Your answer</label><input autocomplete="off" id="practiceInput" class="answer-input" inputmode="${q.kind==='word'||q.kind==='yesno'?'text':'decimal'}" placeholder="Your answer" value="${safeAttr(ui.answer)}" ${f?'disabled':''} aria-describedby="answerGuide"><button class="btn" type="submit" ${f?'disabled':''}>Check answer ${ico('arrow','sm')}</button></form><p id="answerGuide" class="inline-note">${q.kind==='yesno'?'Type yes or no.':q.kind==='word'?'Type the English weekday name.':q.kind==='digits'||q.kind==='memory'?'Enter digits in the correct order (including leading zeros).':'Enter a number; commas and spaces are optional.'}</p><div class="btn-row">${button('hint','Show a hint','secondary',ui.hint||f?'disabled':'')}${button('practice-new',`${ico('refresh','sm')} New question`,'secondary')}</div>${ui.hint?`<div class="feedback neutral"><b>Hint</b>${esc(q.hint)}</div>`:''}${f?`<div class="feedback ${f.good?'correct':'incorrect'}"><b>${f.good?'Correct — well done!':'Not quite — review the steps'}</b>${f.good?'Your calculation matches the expected result.':`Your answer was ${esc(f.given||'(blank)')}. The expected answer is ${esc(q.answer)}.`}</div>${stepsBlock(q)}<div class="work-controls">${button('practice-new',`Next problem ${ico('arrow','sm')}`,'primary')}</div>`:''}</div>`}
function quizSetup(){let s=ui.quizCfg.scope,available=getQuizPool(s,ui.quizCfg.diff).length,scopeLabel=s==='all'?'All lessons':s.startsWith('chapter:')?`Chapter ${s.split(':')[1]} — ${CHAPTERS[Number(s.split(':')[1])-1].name}`:s.startsWith('lesson:')?`${topicById[s.split(':')[1]]?.title||'Selected lesson'}`:'All lessons';return `${pageHead('Knowledge checks','Put your understanding to the test','Choose a skill, chapter or complete course. Questions are freshly generated; explanations appear only after submission.')}<div class="panel challenge-setup"><p class="kicker">1. Choose what to assess</p><label for="scopeSelect" class="sr-only">Question scope</label><select class="form-select" id="scopeSelect" style="width:100%;margin:9px 0 20px"><option value="all" ${s==='all'?'selected':''}>All lessons (mixed practice)</option>${CHAPTERS.map((ch,i)=>`<option value="chapter:${i+1}" ${s==='chapter:'+(i+1)?'selected':''}>Chapter ${i+1}: ${esc(ch.name)}</option>`).join('')}${s.startsWith('lesson:')?`<option selected value="${safeAttr(s)}">Selected skill: ${esc(scopeLabel)}</option>`:''}</select><p class="kicker">2. Difficulty level</p><div class="choice-grid difficulty-grid">${[['all','All'],['1','Beginner'],['2','Intermediate'],['3','Advanced']].map(([v,label])=>`<button class="choice ${ui.quizCfg.diff===v?'active':''}" data-action="quiz-difficulty" data-val="${v}">${label}</button>`).join('')}</div><p class="kicker">3. Questions in your check</p><div class="choice-grid">${[5,10,20].map(n=>`<button class="choice ${ui.quizCfg.size===n?'active':''}" data-action="quiz-size" data-val="${n}">${n} questions</button>`).join('')}</div><div class="switch-row"><div><b>Optional timer</b><small>Show elapsed time. No time limit or penalty.</small></div><button data-action="quiz-timer" class="toggle ${store.settings.timed?'on':''}" role="switch" aria-checked="${store.settings.timed}" aria-label="Toggle quiz stopwatch"></button></div><div class="notice" style="margin:18px 0">${available?`${available} lesson ${available===1?'generator':'generators'} available for this selection. Feedback and worked steps are shown after the final question.`:'No lessons at this difficulty in this chapter. Choose another difficulty or “All”.'}</div>${button('quiz-start',`Start ${ui.quizCfg.size}-question quiz ${ico('arrow','sm')}`,'primary',available?'':'disabled')}</div>`}
function getQuizPool(scope,diff){let pool=scope.startsWith('lesson:')?[topicById[scope.slice(7)]].filter(Boolean):scope.startsWith('chapter:')?chapterTopics(Number(scope.split(':')[1])):entries;return diff==='all'?pool:pool.filter(t=>String(t.level)===diff)}
function selectQuizTopics(scope,count,diff){let pool=getQuizPool(scope,diff);if(!pool.length)return [];let out=[];while(out.length<count){let batch=[...pool].sort(()=>Math.random()-.5);for(const t of batch){if(out.length>=count)break;out.push(t)}}return out}
function startQuiz(){let scope=ui.quizCfg.scope,size=ui.quizCfg.size;ui.quiz={scope,size,qs:selectQuizTopics(scope,size,ui.quizCfg.diff).map(t=>({id:t.id,q:t.make()})),idx:0,answers:[],began:Date.now(),elapsed:0,memoryVisible:true};ui.view='quiz';render()}
function quizView(){let z=ui.quiz;if(!z)return quizSetup();const item=z.qs[z.idx],q=item.q;return `<div class="quiz-layout"><div class="quiz-header"><span class="quiz-progress">Knowledge check · Question ${z.idx+1} of ${z.size}</span><span class="pill gray">${store.settings.timed?`${Math.floor((Date.now()-z.began)/1000)}s elapsed`:'Untimed'}</span></div>${progressBar(z.idx,z.size)}<div class="panel" style="margin-top:20px"><div class="section-title"><span class="question-counter">QUESTION ${pad(z.idx+1,2)} / ${pad(z.size,2)}</span><span class="pill gray">Chapter ${topicById[item.id].c}</span></div><p class="inline-note">${esc(topicById[item.id].title)}</p><div class="quiz-prompt">${esc(q.prompt)}</div>${q.kind==='memory'?`<div class="memory-display">${z.memoryVisible?esc(q.show):'••••••••'}</div><div class="btn-row" style="margin-bottom:16px">${button('quiz-memory',z.memoryVisible?'Hide digits':'Show digits','secondary')}</div>`:''}<form id="quiz-form"><label class="sr-only" for="quizInput">Answer to question ${z.idx+1}</label><input id="quizInput" class="answer-input" autocomplete="off" inputmode="${q.kind==='word'||q.kind==='yesno'?'text':'decimal'}" placeholder="Type your answer" style="max-width:100%;width:100%;margin-bottom:15px"><div class="btn-row"><button class="btn" type="submit">${z.idx===z.size-1?'Finish & see results':'Save answer & next'} ${ico('arrow','sm')}</button>${button('quiz-skip','Skip question','secondary')}</div></form><p class="inline-note" style="margin-top:16px">You may leave an answer blank and skip; feedback is saved for the end.</p></div></div>`}
function advanceQuiz(given){let z=ui.quiz,item=z.qs[z.idx];z.answers.push(String(given??''));z.idx++;z.memoryVisible=true;if(z.idx>=z.size){z.elapsed=Math.floor((Date.now()-z.began)/1000);let correct=z.qs.reduce((sum,item,i)=>sum+(isCorrect(item.q,z.answers[i])?1:0),0);store.quizzes.unshift({date:Date.now(),size:z.size,correct,scope:z.scope,elapsed:z.elapsed});store.quizzes=store.quizzes.slice(0,60);z.qs.forEach((it,i)=>recordAnswer(it.id,isCorrect(it.q,z.answers[i])));persist();ui.view='quiz-result';}render();if(ui.view==='quiz')$('quizInput')?.focus()}
function quizResult(){const z=ui.quiz;if(!z)return quizSetup();let score=z.qs.reduce((sum,item,i)=>sum+(isCorrect(item.q,z.answers[i])?1:0),0),pc=percent(score,z.size);return `<div class="quiz-layout">${pageHead('Assessment complete','Your results','Review every question and the reasoning behind the correct answers.')}<div class="panel"><span class="pill ${pc>=80?'success':'warning'}">${pc>=80?'Strong performance':'Keep practising'}</span><div class="result-score">${pc}%</div><p style="font-size:15px;margin-top:0"><strong>${score} / ${z.size}</strong> correct${store.settings.timed?` · ${z.elapsed}s elapsed`:''}</p>${progressBar(score,z.size)}<div class="btn-row" style="margin-top:19px">${button('quiz-start',`${ico('refresh','sm')} Retry with new questions`)}${button('quiz-setup','Change quiz','secondary')}${button('home','Dashboard','secondary')}</div></div><div class="section-title" style="margin-top:24px"><h3>Worked answer review</h3></div>${z.qs.map((it,i)=>{let ok=isCorrect(it.q,z.answers[i]),q=it.q;return `<div class="panel" style="margin-bottom:13px"><div class="section-title"><strong>Question ${i+1} · ${esc(topicById[it.id].title)}</strong><span class="pill ${ok?'success':'warning'}">${ok?'Correct':'Review'}</span></div><div style="font-size:17px;font-weight:750;line-height:1.45;margin-bottom:12px">${esc(q.prompt)}</div><p class="inline-note">Your answer: <strong>${esc(z.answers[i]||'Skipped')}</strong> · Expected: <strong>${esc(q.answer)}</strong></p><div class="divider" style="margin:12px 0"></div>${stepsBlock(q)}<p class="quote-ref" style="margin-top:13px">${sourceNote(topicById[it.id])}</p></div>`}).join('')}</div>`}
let sprintClock=null;
function stopSprintClock(){if(sprintClock){clearInterval(sprintClock);sprintClock=null}}
function sprintSetup(){return `${pageHead('Optional challenge','60-second sprint','Practise accurate mental arithmetic against the clock. This challenge focuses on approachable calculations, not advanced multi-digit questions.')}<div class="panel challenge-setup"><p class="eyebrow">Challenge details</p><h3>How many can you solve?</h3><p class="subheading">You have 60 seconds. Correct answers count toward your score; mistakes do not subtract points. Your best result is saved on this device.</p><div class="notice" style="margin:19px 0">The timer is completely optional. All the regular lessons and quizzes can be completed without racing.</div>${button('sprint-start',`${ico('bolt','sm')} Start challenge`)}</div>`}
function newSprintQ(){const pool=entries.filter(t=>t.level===1&&t.c<=5&&t.c!==4||['divide-one','divide-two','divide-decimal'].includes(t.id));const t=pick(pool);return {id:t.id,q:t.make()}}
function startSprint(){ui.sprint={began:Date.now(),deadline:Date.now()+60000,score:0,attempts:0,items:[],current:newSprintQ()};ui.view='sprint';ui.sprintFeedback=null;render();stopSprintClock();sprintClock=setInterval(()=>{if(ui.view!=='sprint')return stopSprintClock();let ms=Math.max(0,ui.sprint.deadline-Date.now());if($('sprintTime'))$('sprintTime').textContent=Math.ceil(ms/1000)+'s';if(ms<=0)endSprint()},160)}
function sprintSubmit(value){let z=ui.sprint;if(!z||Date.now()>=z.deadline)return endSprint();let ok=isCorrect(z.current.q,value);z.items.push({id:z.current.id,ok});z.score+=ok?1:0;z.attempts++;z.current=newSprintQ();ui.sprintFeedback=ok?'Correct — keep going!':'Next one — keep your rhythm!';render();$('sprintInput')?.focus()}
function endSprint(){stopSprintClock();if(!ui.sprint)return;let z=ui.sprint;for(const item of z.items)recordAnswer(item.id,item.ok);store.sprints.unshift({date:Date.now(),score:z.score,attempts:z.attempts});store.sprints=store.sprints.slice(0,40);persist();ui.view='sprint-result';render()}
function sprintView(){let z=ui.sprint;if(!z)return sprintSetup();let time=Math.max(0,Math.ceil((z.deadline-Date.now())/1000));return `<div class="quiz-layout"><div class="page-head"><div><p class="eyebrow">Speed challenge</p><h2>Think fast, stay accurate.</h2></div><span class="pill warning" style="font-size:18px;padding:11px 15px" id="sprintTime">${time}s</span></div><div class="panel"><div class="section-title"><h3>${z.score} correct</h3><span class="pill gray">${z.attempts} attempted</span></div><div class="problem-block"><div class="problem-label">Current challenge</div><div class="problem-prompt">${esc(z.current.q.prompt)}</div></div><form id="sprint-form" class="practice-entry"><label class="sr-only" for="sprintInput">Your answer</label><input id="sprintInput" autocomplete="off" class="answer-input" inputmode="${z.current.q.kind==='yesno'?'text':'decimal'}" placeholder="Answer" autofocus><button class="btn" type="submit">Submit ${ico('arrow','sm')}</button></form>${ui.sprintFeedback?`<p class="inline-note" aria-live="polite">${esc(ui.sprintFeedback)}</p>`:''}<div class="divider"></div>${button('sprint-end','Finish early','secondary')}</div></div>`}
function sprintResult(){let z=ui.sprint;if(!z)return sprintSetup();let best=Math.max(...store.sprints.map(x=>x.score),0);return `${pageHead('Challenge complete','Your 60-second results','A quick snapshot of accuracy under time pressure.')}<div class="panel challenge-setup"><p class="kicker">Correct answers</p><div class="result-score">${z.score}</div><p class="subheading">${z.attempts} attempted · ${percent(z.score,z.attempts)}% accurate · Personal best: ${best}</p><div class="btn-row" style="margin-top:24px">${button('sprint-start',`${ico('refresh','sm')} Try again`)}${button('home','Back to dashboard','secondary')}</div></div>`}
const AWARDS=[['First step','Learn one lesson',()=>entries.some(t=>progressOf(t.id).learned),'book'],['Getting started','Answer 10 questions correctly',()=>totalCorrect()>=10,'check'],['Keeping at it','Answer 50 questions correctly',()=>totalCorrect()>=50,'chart'],['Century club','Answer 100 questions correctly',()=>totalCorrect()>=100,'award'],['Making progress','Practise or master 5 different lessons',()=>overall()>=5,'target'],['Well rounded','Practise or master a lesson in all nine chapters',()=>CHAPTERS.every((c,i)=>chapterTopics(i+1).some(topicDone)),'grid'],['Perfect check','Finish a quiz with every answer correct',()=>store.quizzes.some(x=>x.correct===x.size),'trophy'],['Challenge accepted','Complete a 60-second sprint',()=>store.sprints.length>0,'clock'],['Quick calculator','Reach 10 correct in a sprint',()=>store.sprints.some(x=>x.score>=10),'bolt'],['Deep understanding','Master 3 different skills',()=>entries.filter(t=>progressOf(t.id).peak>=3).length>=3,'brain']];
function achievements(){let unlocked=AWARDS.filter(x=>x[2]()).length;return `${pageHead('Milestones','Achievements','Celebrate steady, meaningful progress. No artificial unlocks or required timers.')}<div class="panel" style="margin-bottom:19px"><strong style="font-size:22px">${unlocked} / ${AWARDS.length} earned</strong><div style="margin-top:14px">${progressBar(unlocked,AWARDS.length)}</div></div><div class="achievements">${AWARDS.map(([title,desc,fn,ic])=>`<div class="award ${fn()?'':'locked'}"><span class="award-symbol">${ico(ic,'lg')}</span><div><strong>${esc(title)} ${fn()?'✓':''}</strong><small>${esc(desc)}</small></div></div>`).join('')}</div>`}
function settingsView(){let s=store.settings;return `${pageHead('Preferences','Settings & backup','Your progress is kept in this browser on this device. You can export and reimport a backup.')}<div class="two-cols"><div class="panel"><h3 style="margin-top:0">Appearance & practice</h3><div class="switch-row"><div><b>Dark mode</b><small>Switch between light and dark interfaces.</small></div><button data-action="toggle-theme" class="toggle ${s.theme==='dark'?'on':''}" role="switch" aria-checked="${s.theme==='dark'}" aria-label="Dark mode"></button></div><div class="switch-row"><div><b>Quiz stopwatch</b><small>Show elapsed time during knowledge checks.</small></div><button data-action="quiz-timer" class="toggle ${s.timed?'on':''}" role="switch" aria-checked="${s.timed}" aria-label="Quiz timer"></button></div><p class="inline-note" style="margin-top:19px">All learning content is available offline. A stopwatch never changes your quiz score.</p></div><div class="panel"><h3 style="margin-top:0">Local data</h3><p class="subheading">Create a JSON backup before clearing your browser data or moving to another device.</p><div class="btn-row" style="margin:22px 0">${button('export',`${ico('download','sm')} Export progress`,'secondary')}${button('import',`${ico('upload','sm')} Import progress`,'secondary')}</div><input type="file" accept=".json,application/json" id="importFile" hidden><div class="divider"></div>${button('reset-data','Reset all progress','danger')}</div></div><div class="panel" style="margin-top:19px"><h3 style="margin-top:0">Progress model</h3><p class="subheading">A lesson is <strong>Started</strong> after you open it. It becomes <strong>Practising</strong> after at least 3 correct responses at 55% or better accuracy. <strong>Mastered</strong> requires at least 7 correct responses with 80% or higher accuracy. Your highest attained status is retained.</p></div>`}
function sources(){return `${pageHead('Acknowledgments','Book & credits','This app is a separate educational learning resource, not an official edition or endorsement.')}<div class="two-cols"><div class="panel source-panel"><p class="eyebrow">Primary source</p><h3><em>Mathemagics: How to Look Like a Genius Without Really Trying</em></h3><p><strong>Authors:</strong> Arthur Benjamin, Ph.D., and Michael Brant Shermer, Ph.D.</p><p><strong>Publisher:</strong> Lowell House / Contemporary Books<br><strong>Original copyright:</strong> © 1993, 1994, Arthur Benjamin, Michael Shermer and RGA Publishing Group, Inc.</p><p><strong>ISBN:</strong> 0-929923-54-5 (hardcover); 1-56565-118-9 (paperback).</p><p>Chapter and page references use the <strong>printed page numbers</strong> in the supplied 240-page PDF, not the PDF viewer's page index.</p></div><div class="panel source-panel"><p class="eyebrow">Adaptation approach</p><h3>Independent teaching content</h3><p>This resource builds new explanatory text, new randomized problems, and its own interactive presentation around mathematical techniques addressed in the book. It does not reproduce the book's illustrations, exercises or narrative.</p><p>Chapter 9 is presented as <strong>Number Patterns & Dates</strong> to match the requested modern, non-themed appearance, while retaining references to the source chapter.</p><p>Mathematics described here is for learning and recreation. For high-stakes or real-world calculations, independently verify results.</p></div></div><div class="panel" style="margin-top:20px"><h3 style="margin:0 0 15px">Source chapter index</h3><div class="mini-list">${CHAPTERS.map((ch,i)=>`<div class="mini-row"><div><b>${i+1}. ${esc(ch.name)}</b><small>Book chapter ${i+1}, printed pp. ${ch.range}</small></div>${button('chapter',`Open ${ico('chevron','sm')}`,'secondary',`data-val="${i+1}"`)}</div>`).join('')}</div></div>`}
function modalView(){if(!ui.modal)return '';let m=ui.modal;return `<div class="modal-layer" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h3 id="modalTitle">${esc(m.title)}</h3><p>${esc(m.text)}</p><div class="btn-row" style="justify-content:flex-end;margin-top:23px">${button('modal-cancel','Cancel','secondary')}${button('modal-confirm',m.confirmText||'Confirm','danger')}</div></div></div>`}
function render(){setTheme();let v=ui.view,body=v==='home'?home():v==='chapter'?chapterView():v==='library'?libraryView():v==='lesson'?lessonView():v==='quiz-setup'?quizSetup():v==='quiz'?quizView():v==='quiz-result'?quizResult():v==='sprint-setup'?sprintSetup():v==='sprint'?sprintView():v==='sprint-result'?sprintResult():v==='achievements'?achievements():v==='settings'?settingsView():v==='sources'?sources():home();$('app').innerHTML=`<div class="layout">${sidebar()}<div class="shell">${topbar()}<main class="main" id="mainContent">${body}${footer()}</main></div></div>${ui.mobileNav?'<div class="modal-layer" data-action="close-menu" style="z-index:4;background:rgba(0,0,0,.35)"></div>':''}${modalView()}`}
function newPractice(){let t=currentTopic();ui.q=t.make();ui.feedback=null;ui.hint=false;ui.answer='';ui.memoryVisible=true;render();$('practiceInput')?.focus()}
function startFromHash(){let h=decodeURIComponent(location.hash.replace(/^#/,'')).split('/');if(h[0]==='lesson'&&topicById[h[1]]){ui.view='lesson';setLesson(h[1])}else if(h[0]==='chapter'&&Number(h[1])>=1&&Number(h[1])<=9){ui.view='chapter';ui.chapter=Number(h[1])}else if(['home','library','quiz-setup','sprint-setup','achievements','settings','sources'].includes(h[0]))ui.view=h[0];else ui.view='home';render()}
function exportProgress(){let blob=new Blob([JSON.stringify({app:'Mental Math Academy',version:1,data:store},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mental_Math_Academy_Progress.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function confirmImport(obj){if(obj?.app!=='Mental Math Academy'||obj?.version!==1||!obj.data||!obj.data.topics||!Array.isArray(obj.data.quizzes)||!obj.data.settings)throw Error('Not a valid Mental Math Academy backup');const data=obj.data;store={...freshStore(),...data,topics:{...data.topics},settings:{...freshStore().settings,...data.settings}};persist();toast('Progress imported successfully.');navigate('home')}
// Delegated events keep the app fully standalone and offline.
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,v=el.dataset.val;switch(a){case 'home':case 'library':case 'quiz-setup':case 'sprint-setup':case 'achievements':case 'settings':case 'sources':navigate(a);break;
case 'chapter':navigate('chapter',v);break;case 'lesson':navigate('lesson',v);break;case 'resume':navigate('lesson',store.last||entries[0].id);break;case 'chapter-first':navigate('lesson',chapterTopics(Number(v))[0].id);break;
case 'chapter-quiz':ui.quizCfg.scope='chapter:'+v;navigate('quiz-setup');break;case 'lesson-quiz':ui.quizCfg.scope='lesson:'+v;navigate('quiz-setup');break;
case 'tab':ui.tab=v;if(v==='practice'&&!ui.q)ui.q=currentTopic().make();render();break;
case 'work-next':ui.workStep=Math.min(ui.workStep+1,ui.workQ.steps.length);render();break;case 'work-new':ui.workQ=currentTopic().make();ui.workStep=0;render();break;case 'work-reset':ui.workStep=0;render();break;
case 'memory-toggle':ui.memoryVisible=!ui.memoryVisible;render();if(!ui.memoryVisible)$('practiceInput')?.focus();break;
case 'hint':ui.hint=true;render();break;case 'practice-new':newPractice();break;
case 'quiz-size':ui.quizCfg.size=Number(v);render();break;case 'quiz-difficulty':ui.quizCfg.diff=v;render();break;case 'quiz-timer':store.settings.timed=!store.settings.timed;persist();render();break;case 'quiz-start':startQuiz();break;case 'quiz-skip':advanceQuiz('');break;case 'quiz-memory':ui.quiz.memoryVisible=!ui.quiz.memoryVisible;render();break;
case 'sprint-start':startSprint();break;case 'sprint-end':endSprint();break;
case 'toggle-theme':store.settings.theme=store.settings.theme==='dark'?'light':'dark';persist();render();break;
case 'menu':ui.mobileNav=!ui.mobileNav;render();break;case 'close-menu':ui.mobileNav=false;render();break;
case 'export':exportProgress();break;case 'import':$('importFile')?.click();break;
case 'reset-data':ui.modal={title:'Reset all learning progress?',text:'This deletes your local practice results, quizzes, achievements and challenge records. Export a backup first if you want to preserve your work.',confirmText:'Reset everything',action:'reset'};render();break;
case 'modal-cancel':ui.modal=null;render();break;case 'modal-confirm':if(ui.modal?.action==='reset'){store=freshStore();persist();ui.modal=null;ui.q=null;ui.quiz=null;navigate('home');toast('Progress has been reset.')}break;
}});
document.addEventListener('submit',e=>{if(e.target.id==='practice-form'){e.preventDefault();let s=$('practiceInput').value;ui.answer=s;if(!s.trim()){toast('Enter an answer first.');return}let q=ui.q,good=isCorrect(q,s);ui.feedback={good,given:s};recordAnswer(ui.lesson,good);render()}else if(e.target.id==='quiz-form'){e.preventDefault();advanceQuiz($('quizInput').value)}else if(e.target.id==='sprint-form'){e.preventDefault();const v=$('sprintInput').value;if(v.trim())sprintSubmit(v)}});
document.addEventListener('input',e=>{if(e.target.id==='practiceInput')ui.answer=e.target.value;if(e.target.id==='searchTopic'){ui.search=e.target.value;const index=e.target.selectionStart;render();let el=$('searchTopic');if(el){el.focus();el.setSelectionRange(index,index)}}});
document.addEventListener('change',async e=>{if(e.target.id==='scopeSelect'){ui.quizCfg.scope=e.target.value;render()}else if(e.target.id==='levelSelect'){ui.filterLevel=e.target.value;render()}else if(e.target.id==='importFile'){let file=e.target.files?.[0];if(!file)return;try{if(file.size>1_000_000)throw Error('The backup is unexpectedly large.');confirmImport(JSON.parse(await file.text()))}catch(err){toast('Could not import: '+err.message)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal){ui.modal=null;render()}else if(ui.mobileNav){ui.mobileNav=false;render()}}});
window.addEventListener('popstate',()=>startFromHash());
startFromHash();
</script></body></html>
