function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}

 $('#submitAnswer').onclick=()=>{let answer=q.response;if(kind==='numeric'){let raw=$('#responseField').value;answer=inputFraction(raw);q.inputRaw=raw;if(!answer){$('#answerError').innerHTML='<div class="feedback bad">Enter a valid number. Examples: −0.75, −3/4 or −1 1/2.</div>';return}}if(kind==='place'&&answer===null){$('#answerError').innerHTML='<div class="feedback bad">Move the slider to select your answer.</div>';return}if(kind==='order'&&(!Array.isArray(answer)||answer.length!==q.items.length)){$('#answerError').innerHTML='<div class="feedback bad">Choose every number before submitting.</div>';return}if(answer===null||answer===''){$('#answerError').innerHTML='<div class="feedback bad">Choose an answer first.</div>';return}q.response=answer;onAnswer(answer)};

}
function startLocalPractice(){let mod=LESSONS[STATE.lesson].m,sub=STATE.lesson%4;STATE.practice={lesson:STATE.lesson,current:0,correct:0,questions:[],seen:new Set(),finished:false};for(let i=0;i<5;i++)STATE.practice.questions.push(prepareQ(newQuestion(mod,sub,'balanced',i===1||i===4?'mc':null,STATE.practice.seen)));localQuestion()}
function localQuestion(){let s=STATE.practice;if(!s||s.lesson!==STATE.lesson)return;$('#localPracticeCounter').textContent=s.finished?'Finished':`${Math.min(s.current+1,5)} / 5`;let box=$('#localQuestion');if(s.finished){box.innerHTML=`<div class="divider"></div><div class="eyebrow">Quick check complete</div><h3 style="margin:8px 0">${s.correct} out of 5 first tries correct</h3><p class="muted">Review the worked explanations and repeat with new questions whenever you want. You can continue to the next mini-lesson at any time.</p><div class="qbtns"><button class="btn primary" id="anotherSet">Try 5 new questions</button><button class="btn ghost" id="goNextMini">Next mini-lesson →</button></div>`;$('#anotherSet').onclick=startLocalPractice;$('#goNextMini').onclick=()=>setPage(STATE.lesson===23?'progress':'lesson',Math.min(23,STATE.lesson+1));return}let q=s.questions[s.current];if(q.finished){showLocalFeedback(q);return}questionUI(q,'localQuestion',answer=>{q.answered=true;q.finished=true;q.correct=grade(q,answer);if(q.correct)s.correct++;DATA.practice.attempted++;if(q.correct)DATA.practice.correct++;save();showLocalFeedback(q)})}
function showLocalFeedback(q){let box=$('#localQuestion'),correct=q.correct;box.innerHTML=`<div class="question"><div class="qprompt">${q.prompt}</div><div class="feedback ${correct?'good':'bad'}"><strong>${correct?'✓ Correct!':'Not quite — here is how to solve it.'}</strong><div>Your answer: ${formatAnswer(q,q.response)}</div>${correct?'':`<div>Correct answer: <strong style="display:inline">${expectedAnswer(q)}</strong></div>`}<div style="margin-top:9px">${q.explanation}</div></div><div class="qbtns"><button class="btn primary" id="nextQuickQuestion">${STATE.practice.current===4?'See quick-check results':'Next question →'}</button></div></div>`;$('#nextQuickQuestion').onclick=()=>{STATE.practice.current++;if(STATE.practice.current>=5)STATE.practice.finished=true;localQuestion()}}
function renderPractice(){let m=MODULES[STATE.topic];mount(`<div class="eyebrow">Independent practice</div><h2 style="font-size:34px;letter-spacing:-1px;margin:8px 0">Practice lab</h2><p class="muted">Choose a topic, answer a question, see the explanation and try another. Examples are generated fresh as you work.</p><div class="card"><div class="control-group"><label>Topic<select id="practiceTopic" class="select-lesson">${MODULES.map((x,i)=>`<option value="${i}" ${STATE.topic===i?'selected':''}>${x.code} · ${x.short}</option>`).join('')}</select></label><label>Challenge level<select id="practiceLevel"><option value="gentle" ${STATE.level==='gentle'?'selected':''}>Gentle</option><option value="balanced" ${STATE.level==='balanced'?'selected':''}>Balanced</option><option value="stretch" ${STATE.level==='stretch'?'selected':''}>Stretch</option></select></label><button class="btn secondary" id="practiceReset">New practice set ↻</button></div><div class="divider"></div><div class="quiz-meta"><span class="pill teal" id="labCount">0 answered</span><span class="pill" id="labCorrect">0 correct</span></div><div id="labQuestion"></div></div><div class="footer-note">Practice gives immediate feedback. Quiz Studio hides answers until the end so you can check what you know independently.</div>`);$('#practiceTopic').onchange=ev=>{STATE.topic=+ev.target.value;STATE.lab=null;renderPractice()};$('#practiceLevel').onchange=ev=>{STATE.level=ev.target.value;STATE.lab=null;renderPractice()};$('#practiceReset').onclick=()=>{STATE.lab=null;startLab()};if(!STATE.lab||STATE.lab.module!==STATE.topic||STATE.lab.level!==STATE.level)startLab();else labQuestion()}
function startLab(){STATE.lab={module:STATE.topic,level:STATE.level,current:null,count:0,correct:0,seen:new Set()};labNext()}
function labNext(){let s=STATE.lab;s.current=prepareQ(newQuestion(s.module,null,s.level,s.count%3===1?'mc':null,s.seen));labQuestion()}
function labQuestion(){let s=STATE.lab;if(!s)return;$('#labCount').textContent=s.count+' answered';$('#labCorrect').textContent=s.correct+' correct';let q=s.current;if(q.finished){$('#labQuestion').innerHTML=`<div class="qprompt">${q.prompt}</div><div class="feedback ${q.correct?'good':'bad'}"><strong>${q.correct?'✓ Correct!':'Here is the solution.'}</strong>Your answer: ${formatAnswer(q,q.response)}${q.correct?'':`<div>Correct answer: ${expectedAnswer(q)}</div>`}<div style="margin-top:8px">${q.explanation}</div></div><div class="qbtns"><button class="btn primary" id="labNextBtn">Another question →</button></div>`;$('#labNextBtn').onclick=labNext;return}questionUI(q,'labQuestion',answer=>{q.finished=true;q.correct=grade(q,answer);s.count++;if(q.correct)s.correct++;DATA.practice.attempted++;if(q.correct)DATA.practice.correct++;save();labQuestion()})}
function renderQuiz(){let qz=STATE.quiz;if(qz&&qz.active&&!qz.complete){renderQuizSession();return}if(qz&&qz.complete){renderQuizResults();return}renderQuizConfig()}
function renderQuizConfig(){mount(`<div class="eyebrow">Self-assessment</div><h2 style="font-size:35px;letter-spacing:-1px;margin:8px 0">Build your own quiz</h2><p class="muted">Choose length, topics and difficulty. Quizzes mix multiple-choice, typed and interactive questions. Correctness and worked solutions appear at the end only.</p><div class="card"><h3>How many questions?</h3><div class="quiz-select" id="quizLengths">${[5,10,15,20].map(n=>`<button class="quiz-length ${STATE.quizLength===n?'active':''}" data-qlen="${n}">${n}</button>`).join('')}</div><div class="divider"></div><div class="quiz-meta"><h3 style="margin:0">Topics to include</h3><div class="inline-actions"><button class="btn ghost small" id="selectAll">Select all</button><button class="btn ghost small" id="selectNone">Clear</button></div></div><div class="select-modules" id="quizMods">${MODULES.map((m,i)=>`<label class="toggle"><input type="checkbox" value="${i}" ${STATE.quizMods.includes(i)?'checked':''}>${m.code} · ${m.name}</label>`).join('')}</div><div class="divider"></div><h3>Difficulty</h3><div class="control-group"><label>Question difficulty<select id="quizDifficulty"><option value="gentle" ${STATE.level==='gentle'?'selected':''}>Gentle · Friendly numbers</option><option value="balanced" ${STATE.level==='balanced'?'selected':''}>Balanced · Typical Grade 9</option><option value="stretch" ${STATE.level==='stretch'?'selected':''}>Stretch · More complex values</option></select></label></div><div class="feedback" style="margin:20px 0">The optional calculator can be opened or hidden at any time. Practice explains answers immediately; quizzes reveal feedback only after completion.</div><button class="btn primary" id="startQuiz">Start ${STATE.quizLength}-question quiz →</button><div id="quizConfigError"></div></div>`);$$('[data-qlen]').forEach(b=>b.onclick=()=>{STATE.quizLength=+b.dataset.qlen;renderQuizConfig()});$('#selectAll').onclick=()=>{STATE.quizMods=[0,1,2,3,4,5];renderQuizConfig()};$('#selectNone').onclick=()=>{STATE.quizMods=[];renderQuizConfig()};$$('#quizMods input').forEach(b=>b.onchange=()=>{STATE.quizMods=$$('#quizMods input:checked').map(x=>+x.value)});$('#quizDifficulty').onchange=ev=>STATE.level=ev.target.value;$('#startQuiz').onclick=()=>{if(!STATE.quizMods.length){$('#quizConfigError').innerHTML='<div class="feedback bad">Select at least one topic to start the quiz.</div>';return}beginQuiz()}}
function beginQuiz(){let mods=shuffle(STATE.quizMods.slice()),seen=new Set();let questions=[];for(let i=0;i<STATE.quizLength;i++){let mod=mods[i%mods.length];let q;let want=i%4===0?'mc':i%4===1?'numeric':i%4===2?'interactive':null;let tries=0;do{let sub=want==='interactive'?(mod===0?pick([1,2,3]):mod===3||mod===4?0:rand(0,5)):rand(0,5);q=newQuestion(mod,sub,STATE.level,want,seen);tries++}while(tries<12 && ((want==='numeric'&&q.kind!=='numeric')||(want==='interactive'&&!['compare','place','order','sign'].includes(q.kind))));if(want==='mc'&&q.kind==='numeric')q=asMultipleChoice(q);questions.push(prepareQ(q))}STATE.quiz={active:true,complete:false,index:0,questions,started:Date.now(),duration:0,level:STATE.level,modules:STATE.quizMods.slice(),length:STATE.quizLength};renderQuizSession()}
function renderQuizSession(){const s=STATE.quiz,q=s.questions[s.index],count=s.questions.filter(x=>x.answered).length;mount(`<div class="eyebrow">Quiz in progress</div><div class="quiz-meta" style="margin:12px 0 17px"><div><h2 style="margin:0;font-size:29px;letter-spacing:-.9px">Question ${s.index+1} of ${s.length}</h2><div class="topic-label" style="margin-top:5px">${MODULES[q.module].code} · ${MODULES[q.module].name}</div></div><div class="inline-actions"><span class="pill">${count}/${s.length} saved</span><button class="btn ghost small" id="quitQuiz">Exit quiz</button></div></div><div class="progress-track" style="margin-bottom:18px"><div class="progress-fill" style="width:${pct(count,s.length)}%"></div></div><div class="card"><div class="quiz-meta"><span class="pill teal">${q.kind==='mc'?'Multiple choice':q.kind==='numeric'?'Type your answer':q.kind==='order'?'Interactive ordering':q.kind==='place'?'Number line':q.kind==='compare'?'Comparison':'Sign prediction'}</span><span class="tiny muted">Answers appear after the final question</span></div><div id="quizQuestion"></div><div class="tip" style="margin-top:14px">You may go back to a previous question. Answers already saved will remain selected.</div></div>`);$('#quitQuiz').onclick=()=>{if(window.confirm('Leave this quiz? Your unsaved quiz results will be lost.')){STATE.quiz=null;renderQuizConfig()}};questionUI(q,'quizQuestion',answer=>{q.response=answer;q.answered=true;if(s.index===s.length-1){let unanswered=s.questions.findIndex(x=>!x.answered);if(unanswered!==-1){s.index=unanswered;toast('Please answer the remaining question(s).');renderQuizSession()}else finishQuiz()}else{s.index++;renderQuizSession()}},{quiz:true,allowBack:s.index>0?()=>{s.index--;renderQuizSession()}:null})}
function finishQuiz(){const s=STATE.quiz;s.active=false;s.complete=true;s.duration=Math.max(1,Math.round((Date.now()-s.started)/1000));s.correct=s.questions.filter(q=>grade(q,q.response)).length;s.score=pct(s.correct,s.length);DATA.scores.unshift({date:new Date().toISOString(),length:s.length,correct:s.correct,score:s.score,modules:s.modules,level:s.level,seconds:s.duration});DATA.scores=DATA.scores.slice(0,40);save();renderQuizResults()}
function renderQuizResults(){let s=STATE.quiz;let mins=Math.floor(s.duration/60),seconds=s.duration%60,correct=s.correct;let results=MODULES.map((m,i)=>{let questions=s.questions.filter(x=>x.module===i);return {m,questions,correct:questions.filter(x=>grade(x,x.response)).length}}).filter(x=>x.questions.length);mount(`<div class="eyebrow">Quiz complete</div><h2 style="font-size:35px;letter-spacing:-1px;margin:9px 0 18px">Your results</h2><div class="grid g3"><div class="card"><div class="tiny muted">Score</div><div class="stat-wide">${s.score}%</div><div class="tiny muted">${correct} of ${s.length} correct</div></div><div class="card"><div class="tiny muted">Time</div><div class="stat-wide" style="font-size:35px;margin:17px 0 6px">${mins}m ${seconds}s</div><div class="tiny muted">Completed at your own pace</div></div><div class="card"><div class="tiny muted">Feedback</div><h3 style="margin:15px 0 8px">${s.score>=85?'Strong understanding':s.score>=65?'Good progress':'Keep practising'}</h3><div class="tiny muted">Use the explanations below to target your next practice session.</div></div></div><div class="section-title"><h3>Topic breakdown</h3></div><div class="grid g2">${results.map(x=>`<div class="card"><b>${x.m.code} · ${x.m.short}</b><div class="progress-track" style="margin:12px 0"><div class="progress-fill" style="width:${pct(x.correct,x.questions.length)}%"></div></div><div class="tiny muted">${x.correct} / ${x.questions.length} correct</div><button class="btn ghost small" style="margin-top:12px" data-practop="${MODULES.indexOf(x.m)}">Practise this topic</button></div>`).join('')}</div><div class="section-title"><h3>Answer review</h3><span class="pill">Worked explanations included</span></div><div class="card">${s.questions.map((q,i)=>{let ok=grade(q,q.response);return `<div class="quiz-review-item"><div class="quiz-meta"><span class="pill">Question ${i+1} · ${MODULES[q.module].code}</span><span class="${ok?'review-correct':'review-wrong'}">${ok?'✓ Correct':'✕ Incorrect'}</span></div><div class="qprompt" style="font-size:16px;margin:13px 0">${q.prompt}</div><div class="review-ans">Your answer: ${formatAnswer(q,q.response)}</div>${ok?'':`<div class="review-ans"><b>Correct answer:</b> ${expectedAnswer(q)}</div>`}<div class="feedback" style="margin-top:10px">${q.explanation}</div></div>`}).join('')}</div><div class="lesson-bottom"><button class="btn ghost" id="quizNew">Create another quiz</button><button class="btn primary" id="quizHome">Back to overview →</button></div>`);$$('[data-practop]').forEach(b=>b.onclick=()=>{STATE.topic=+b.dataset.practop;STATE.lab=null;setPage('practice')});$('#quizNew').onclick=()=>{STATE.quiz=null;renderQuizConfig()};$('#quizHome').onclick=()=>{STATE.quiz=null;setPage('home')}}
function fmtDate(s){let x=new Date(s);return Number.isNaN(x.getTime())?'Unknown':x.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
function renderProgress(){let done=DATA.done.length,stats=DATA.practice;let sorted=DATA.scores.slice().sort((a,b)=>b.score-a.score||a.seconds-b.seconds).slice(0,5);mount(`<div class="eyebrow">Your learning history</div><h2 style="font-size:35px;letter-spacing:-1px;margin:9px 0">Progress tracker</h2><p class="muted">Stored only in this browser. No account or internet connection is needed.</p><div class="grid g3"><div class="card"><div class="tiny muted">Lessons completed</div><div class="metric">${done}/24</div><div class="progress-track"><div class="progress-fill" style="width:${pct(done,24)}%"></div></div></div><div class="card"><div class="tiny muted">Practice questions</div><div class="metric">${stats.attempted}</div><div class="tiny muted">${stats.correct} correct</div></div><div class="card"><div class="tiny muted">Quiz high score</div><div class="metric">${sorted.length?sorted[0].score+'%':'—'}</div><div class="tiny muted">${DATA.scores.length} total quizzes completed</div></div></div><div class="section-title"><h3>Lesson completion</h3></div><div class="grid g2">${MODULES.map((m,i)=>{let lessons=LESSONS.map((l,j)=>({...l,id:j})).filter(l=>l.m===i);let ct=lessons.filter(l=>DATA.done.includes(l.id)).length;return `<div class="card"><b>${m.code} · ${m.short}</b><div class="progress-track" style="margin:12px 0"><div class="progress-fill" style="width:${pct(ct,4)}%"></div></div><p class="tiny muted">${ct}/4 mini-lessons marked complete</p><div class="chip-row">${lessons.map(l=>`<button class="btn small ${DATA.done.includes(l.id)?'secondary':'ghost'}" data-progresslesson="${l.id}" title="${htmlSafe(l.title)}">${DATA.done.includes(l.id)?'✓':'○'} ${l.id%4+1}</button>`).join('')}</div></div>`}).join('')}</div><div class="section-title"><h3>Top 5 quiz results</h3></div><div class="card">${sorted.length?sorted.map((s,i)=>`<div class="quiz-meta" style="padding:12px 0;${i?'border-top:1px solid var(--border)':''}"><div><b>${i+1}. ${s.score}%</b> <span class="tiny muted">· ${s.correct}/${s.length} · ${s.level}</span><div class="tiny muted">${fmtDate(s.date)}</div></div><div class="pill">${s.length} questions</div></div>`).join(''):'<p class="muted">No completed quizzes yet. Take a quiz to start a high-score history.</p>'}</div><div class="section-title"><h3>Manage your progress</h3></div><div class="card"><p class="muted tiny">You can reset the saved lesson completion, practice totals and quiz results for this device. This cannot be undone.</p><button class="btn danger small" id="clearProgress">Reset all saved progress</button></div>`);$$('[data-progresslesson]').forEach(b=>b.onclick=()=>setPage('lesson',+b.dataset.progresslesson));$('#clearProgress').onclick=()=>{if(window.confirm('Permanently erase all saved Rational Numbers Explorer progress on this device?')){let theme=DATA.theme;DATA={done:[],scores:[],practice:{attempted:0,correct:0},theme};save();renderProgress();toast('Progress reset')}}}
// Drag-and-drop calculator using a small, safe parser (never eval).
const CALC_KEYS=['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','=','⌫','^','1/2','Close'];
let calcExpr='',calcResult='';
function calcParse(expr){let text=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');let i=0;function ws(){}function exprBP(){let n=term();while(text[i]==='+'||text[i]==='-'){let op=text[i++],r=term();n=op==='+'?n+r:n-r}return n}function term(){let n=unary();while(text[i]==='*'||text[i]==='/'){let op=text[i++],r=unary();if(op==='/'&&r===0)throw Error('Cannot divide by zero');n=op==='*'?n*r:n/r}return n}function unary(){if(text[i]==='+'){i++;return unary()}if(text[i]==='-'){i++;return -unary()}return power()}function power(){let x=primary();if(text[i]==='^'){i++;x=x**unary()}return x}function primary(){if(text[i]==='('){i++;let x=exprBP();if(text[i++]!==')')throw Error('Missing bracket');return x}let m=text.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error('Check expression');i+=m[0].length;return Number(m[0])}let value=exprBP();if(i!==text.length)throw Error('Check expression');if(!Number.isFinite(value))throw Error('Result too large');return +value.toPrecision(12)}
function toggleCalculator(force){STATE.calcOpen=typeof force==='boolean'?force:!STATE.calcOpen;renderCalc()}
function renderCalc(){let mount=$('#calcMount');if(!STATE.calcOpen){mount.innerHTML='';return}mount.innerHTML=`<div class="calc" id="calculator" role="dialog" aria-label="Movable calculator"><div class="calc-head" id="calcDrag"><span>▦ Calculator · drag to move</span><button id="calcX" aria-label="Close calculator">×</button></div><div class="calc-display" id="calcScreen">${htmlSafe(calcExpr||'0')}</div><div class="calc-keys">${CALC_KEYS.map(k=>`<button type="button" class="${['÷','×','−','+','^'].includes(k)?'op':''} ${k==='='?'eq':''}" data-calc-key="${k}">${k}</button>`).join('')}</div><div class="calc-note">Use ÷, ×, parentheses and ^ for powers. This is an optional learning tool.</div></div>`;$('#calcX').onclick=()=>toggleCalculator(false);$$('[data-calc-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.calcKey;if(k==='Close'){toggleCalculator(false);return}if(k==='C'){calcExpr='';calcResult=''}else if(k==='⌫'){calcExpr=calcExpr.slice(0,-1)}else if(k==='='){try{calcResult=String(calcParse(calcExpr));calcExpr=calcResult}catch(err){calcResult=err.message}}else if(k==='±'){if(calcExpr.startsWith('−'))calcExpr=calcExpr.slice(1);else calcExpr='−'+calcExpr}else if(k==='1/2')calcExpr+='(1÷2)';else calcExpr+=k;$('#calcScreen').textContent=k==='='?calcResult:calcExpr||'0'});let el=$('#calculator'),head=$('#calcDrag'),drag=null;head.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;let rect=el.getBoundingClientRect();drag={px:ev.clientX,py:ev.clientY,left:rect.left,top:rect.top};head.setPointerCapture(ev.pointerId);ev.preventDefault()});head.addEventListener('pointermove',ev=>{if(!drag)return;let left=Math.max(5,Math.min(window.innerWidth-el.offsetWidth-5,drag.left+ev.clientX-drag.px)),top=Math.max(5,Math.min(window.innerHeight-el.offsetHeight-5,drag.top+ev.clientY-drag.py));el.style.left=left+'px';el.style.top=top+'px';el.style.right='auto'});head.addEventListener('pointerup',()=>drag=null);head.addEventListener('pointercancel',()=>drag=null)}
$('#calcBtn').onclick=()=>toggleCalculator();$('#themeBtn').onclick=()=>{DATA.theme=DATA.theme==='dark'?'light':'dark';document.body.classList.toggle('theme-dark',DATA.theme==='dark');save()};$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('on');STATE.menuOpen=true};$('#overlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('on');STATE.menuOpen=false};document.body.classList.toggle('theme-dark',DATA.theme==='dark');window.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(STATE.calcOpen)toggleCalculator(false);else if(STATE.menuOpen)$('#overlay').click()}});setPage('home');
