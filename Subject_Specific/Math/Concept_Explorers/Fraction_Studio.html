{id:'same-add',title:'Add like denominators',tag:'01 · Foundations',sub:'Same-sized pieces',description:'When the denominators match, the pieces are already the same size. Add the numerators and keep the denominator.',idea:'Add the numerators. Keep the denominator.',tip:'Do not add the denominators. Two sevenths and three sevenths make five sevenths—not five fourteenths.',a:[2,7],b:[3,7],op:'+',goal:'Add fractions with the same denominator.'},

{id:'unlike-add',title:'Add unlike denominators',tag:'03 · Building skills',sub:'Find common-sized parts',description:'Before adding unlike fractions, rename them with a common denominator so every part is the same size.',idea:'Find a common denominator, make equivalent fractions, then add.',tip:'The least common denominator is the least common multiple (LCM) of the denominators. Any common multiple works, but the LCM keeps numbers smaller.',a:[1,3],b:[1,4],op:'+',goal:'Add fractions with unlike denominators.'},

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}

function newProblem(topic,level='building'){

function distractors(p){const r=result(p), pool=[],a=p.a,b=p.b;

 state.quiz={questions:qs,index:0,finished:false,started:new Date().toISOString()};showApp(true)
}
function renderQuizQuestion(){const qz=state.quiz,q=qz.questions[qz.index],p=q.p;return `<section class="card quiz-start quiz-panel"><div class="question-top"><span class="eyebrow">QUESTION ${qz.index+1} OF ${qz.questions.length}</span><span class="pill">${getLesson(p.topic).title}</span></div><div class="quiz-progress"><div style="width:${qz.index/qz.questions.length*100}%"></div></div><div class="question-stage"><p>${q.type==='mc'?'Choose the correct simplified answer.':'Calculate the answer. Use a fraction or mixed number.'}</p><div class="equation">${exprHTML(p)}<span class="math-symbol">= ?</span></div></div>${q.type==='mc'?`<div class="mc-options">${q.choices.map((c,i)=>`<button data-action="quiz-choice" data-value="${c.n}/${c.d}" class="mc-option ${q.answer===`${c.n}/${c.d}`?'chosen':''}" aria-pressed="${q.answer===`${c.n}/${c.d}`}"><span class="mc-letter">${'ABCD'[i]}</span>${mixedHTML(c)}</button>`).join('')}</div>`:`<div class="field"><label for="quiz-answer">Your answer</label><input class="answer-input" id="quiz-answer" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="e.g. 3/4 or 1 2/3" value="${safeText(q.answer)}"></div><div class="examples-hint">Equivalent answers accepted. You can change an answer before you submit.</div>`}<div class="quiz-actions"><button class="btn btn-soft" data-action="quiz-back" ${qz.index===0?'disabled':''}>← Previous</button><div class="btn-row"><button class="btn btn-plain" data-action="quiz-exit">Exit quiz</button><button class="btn btn-primary" data-action="quiz-next">${qz.index===qz.questions.length-1?'Submit quiz ✓':'Next question →'}</button></div></div><p class="small muted" style="margin-top:14px">Question ${qz.index+1} of ${qz.questions.length} · ${q.answer?'Answer selected/entered':'No answer yet'} · No timer</p></section>`}
function parseAnswer(input){let s=String(input||'').trim().replace(/[−–]/g,'-').replace(/⁄/g,'/').replace(/\s+/g,' ');if(!s)return null;
 let m=s.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m){const w=Number(m[1]),n=Number(m[2]),d=Number(m[3]);if(!d||n>=d||n<0)return null;return F((w<0?-1:1)*(Math.abs(w)*d+n),d)}
 m=s.match(/^([+-]?\d+)\s*\/\s*(\d+)$/);if(m){const d=Number(m[2]);return d?F(Number(m[1]),d):null}
 if(/^[-+]?\d+$/.test(s))return F(Number(s));return null
}
function renderQuizResult(){const qz=state.quiz,total=qz.questions.length,good=qz.questions.filter(q=>eq(parseAnswer(q.answer),result(q.p))).length,rate=Math.round(good*100/total),phrase=rate>=90?'Excellent understanding!':rate>=70?'Strong work—keep building.':rate>=50?'Good progress. Keep practising.':'Every attempt is a chance to learn.';
 return hero('QUIZ · results','Your work, explained.','Review your results and see the steps behind each problem. Your score is saved on this device.')+`<div class="card quiz-start" style="text-align:center"><span class="eyebrow">QUIZ COMPLETED</span><div class="result-number">${good}<span> / ${total}</span></div><h2 style="font-size:23px;letter-spacing:-.6px;margin:4px 0">${phrase}</h2><p class="score-subtitle">${rate}% correct · ${state.quizLevel==='foundation'?'Foundations':state.quizLevel==='building'?'Building skills':'Challenge'}</p><div class="btn-row" style="justify-content:center;margin-top:20px"><button class="btn btn-primary" data-action="quiz-restart">Try another quiz ↻</button><button class="btn btn-soft" data-action="quiz-review">${state.quizReview?'Hide answer review':'Review every answer'}</button><button class="btn btn-plain" data-action="nav" data-value="progress">View progress</button></div></div>${state.quizReview?`<section class="card" style="max-width:900px;margin:18px auto 0"><div class="section-heading" style="margin-top:0"><h3>Question-by-question review</h3><span class="section-tag">${good} of ${total} correct</span></div><div class="review-list">${qz.questions.map((q,i)=>{const correct=eq(parseAnswer(q.answer),result(q.p)),m=methodData(q.p,q.p.topic==='regroup'?'mixed':'common');return `<article class="review-item ${correct?'':'wrong'}"><div class="review-title"><strong class="small">Question ${i+1} · ${getLesson(q.p.topic).title}</strong><span class="${correct?'correct-label':'wrong-label'}">${correct?'✓ Correct':'× Review'}</span></div><div class="review-detail"><span>${exprHTML(q.p)}</span><span>Your answer: <strong>${q.answer?safeText(q.answer):'Not answered'}</strong></span><span>Answer: ${mixedHTML(result(q.p))}</span></div><div class="review-explain"><strong>How to solve:</strong> ${m.steps.map(s=>`${s.title}: ${s.html}`).join('<br>')}</div></article>`}).join('')}</div></section>`:''}`}
function renderProgress(){const percent=stats.practised?Math.round(stats.correct*100/stats.practised):0,best=stats.history.length?Math.max(...stats.history.map(h=>h.pct)):null;return hero('PROGRESS · saved on this device','Look how far you’ve come.','Track practice accuracy by skill and see recent quiz results. Nothing is uploaded or shared.')+`<div class="stat-grid"><div class="stat-card"><span class="caps">Practice answered</span><strong>${stats.practised}</strong><small>Checked practice questions</small></div><div class="stat-card"><span class="caps">Practice accuracy</span><strong>${percent}%</strong><small>${stats.correct} correct answers</small></div><div class="stat-card"><span class="caps">Best quiz score</span><strong>${best===null?'—':best+'%'}</strong><small>${stats.history.length} quiz${stats.history.length===1?'':'zes'} completed</small></div></div><div class="learn-grid"><section class="card"><div class="section-heading" style="margin-top:0"><h3>Practice skills</h3><span class="small muted">Correct / attempted</span></div>${LESSONS.map(l=>{const s=stats.topics[l.id]||{attempts:0,correct:0},pct=s.attempts?Math.round(s.correct/s.attempts*100):0;return `<div class="topic-meter"><div class="topic-meter-head"><span>${l.title}</span><span class="muted">${s.correct}/${s.attempts}</span></div><div class="meter-track"><div style="width:${pct}%"></div></div></div>`}).join('')}<p class="tiny muted">Each question is counted once when you first check it. You can always try again to learn.</p></section><section class="card"><div class="section-heading" style="margin-top:0"><h3>Recent quiz results</h3><span class="small muted">Most recent first</span></div>${stats.history.length?stats.history.slice(0,10).map(h=>`<div class="history-row"><div><strong>${h.correct}/${h.total} correct</strong><small>${safeText(h.focus)}</small></div><span class="muted">${new Date(h.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</span><strong style="color:${h.pct>=70?'#188174':'#b36b53'}">${h.pct}%</strong></div>`).join(''):`<div class="empty-state">No quiz results yet. Take a quiz to start tracking your learning.</div>`}<div class="btn-row" style="margin-top:17px"><button class="btn btn-primary" data-action="nav" data-value="quiz">Take a quiz →</button><button class="btn btn-soft" data-action="nav" data-value="practice">Practise skills</button></div><hr class="divider"><div class="caps">Privacy</div><p class="small muted">Your progress stays in this browser using local storage. Clearing browser data or switching devices may erase it.</p><button class="btn btn-warn" data-action="progress-reset">Reset saved progress</button></section></div>`}
function toast(message){const t=$('#toast-host');t.innerHTML=`<div class="toast">${safeText(message)}</div>`;clearTimeout(toast._timer);toast._timer=setTimeout(()=>t.innerHTML='',2600)}
function modal(html){$('#modal-host').innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</div></div>`;$('#modal-host .btn')?.focus()}
function closeModal(){$('#modal-host').innerHTML=''}
function help(){modal(`<span class="eyebrow">WELCOME TO FRACTION STUDIO</span><h2 id="modal-title">How to use this app</h2><p>Learn addition and subtraction of fractions—including improper fractions and mixed numbers—at your own pace.</p><div class="how-grid"><div class="how-row"><span class="step-num">1</span><div><strong>Learn</strong><br><span>Choose one of eight lessons. Switch between five strategies and reveal the solution one step at a time.</span></div></div><div class="how-row"><span class="step-num">2</span><div><strong>Fraction Lab</strong><br><span>Explore generated examples or build your own mixed-number calculations.</span></div></div><div class="how-row"><span class="step-num">3</span><div><strong>Practice</strong><br><span>Type fractions like 3/4 or mixed numbers like 1 2/3. Use hints and worked solutions.</span></div></div><div class="how-row"><span class="step-num">4</span><div><strong>Quiz & Progress</strong><br><span>Choose 5, 10, 15 or 20 questions. See scores and full explanations at the end.</span></div></div></div><div class="modal-close"><button class="btn btn-primary" data-action="close-modal">Got it — let's learn!</button></div>`)}
function practiceNew(){const topics=state.practiceTopic==='all'?LESSONS.map(l=>l.id):[state.practiceTopic];state.practice=newProblem(choose(topics),state.practiceLevel);state.practiceHint=false;state.practiceFeedback=null;state.practiceSolution=false;state.practiceAnswer='';state.practiceAttempts=0;showApp()}
function registerPractice(correct){stats.practised++;if(correct){stats.correct++;state.streak++}else{state.streak=0}const id=state.practice.topic,existing=stats.topics[id]||{attempts:0,correct:0};existing.attempts++;if(correct)existing.correct++;stats.topics[id]=existing;saveStats()}
function checkPractice(){const answer=$('#practice-answer');if(!answer)return;const s=answer.value;state.practiceAnswer=s;const parsed=parseAnswer(s);if(!parsed){state.practiceFeedback={correct:false,msg:'Use a whole number (2), fraction (3/4), or mixed number (1 2/3). Denominators cannot be zero.'};showApp();$('#practice-answer')?.focus();return}
 const isCorrect=eq(parsed,result(state.practice));if(state.practiceAttempts===0)registerPractice(isCorrect);state.practiceAttempts++;state.practiceFeedback={correct:isCorrect,msg:isCorrect?'Your answer represents exactly the right amount.':`That answer does not match the calculation. Try an equivalent-fraction method, or select “Show solution” to see the worked steps.`};showApp();if(!isCorrect)$('#practice-answer')?.focus()}
function rememberQuizInput(){if(state.quiz&& !state.quiz.finished){const q=state.quiz.questions[state.quiz.index],input=$('#quiz-answer');if(input)q.answer=input.value.trim()}}
function finishQuiz(){rememberQuizInput();const qz=state.quiz;qz.finished=true;const correct=qz.questions.filter(q=>eq(parseAnswer(q.answer),result(q.p))).length;stats.history.unshift({date:new Date().toISOString(),correct,total:qz.questions.length,pct:Math.round(correct/qz.questions.length*100),focus:state.quizTopic==='all'?'All skills':state.quizTopic==='mixed'?'Mixed numbers':state.quizTopic==='denominators'?'Fractions only':state.quizTopic==='regroup'?'Regrouping':getLesson(state.quizTopic).title});stats.history=stats.history.slice(0,30);saveStats();state.quizReview=true;showApp(true)}
function action(ev){const btn=ev.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action,v=btn.dataset.value;
 if(act==='nav'){if(state.quiz&&!state.quiz.finished&&state.view==='quiz'&&v!=='quiz'&&!confirm('Leave this unfinished quiz? Your answers will be discarded.'))return;if(state.view==='quiz'&&v!=='quiz'&&state.quiz&&!state.quiz.finished)state.quiz=null;state.view=v;if(v==='quiz'&&state.quiz?.finished)state.quiz=null;showApp(true)}
 else if(act==='help')help();else if(act==='close-modal')closeModal();
 else if(act==='lesson'){state.lessonId=v;state.method='bars';state.shown=1;showApp()}
 else if(act==='fresh-lesson'){state.lessonExamples[state.lessonId]=newProblem(state.lessonId,'building');state.shown=1;showApp()}
 else if(act==='method'){state.method=v;state.shown=1;showApp()}
 else if(act==='reveal-next'){state.shown++;showApp()}
 else if(act==='reveal-all'){state.shown=99;showApp()}
 else if(act==='reveal-reset'){state.shown=1;showApp()}
 else if(act==='lesson-practise'){state.practiceTopic=state.lessonId;state.view='practice';practiceNew();window.scrollTo({top:0,behavior:'smooth'})}
 else if(act==='lesson-lab'){state.lab=state.lessonExamples[state.lessonId];state.labTopic=state.lessonId;state.method='bars';state.shown=1;state.view='explore';showApp(true)}
 else if(act==='lab-new'){state.lab=newProblem(state.labTopic,state.labLevel);state.shown=1;state.builderMessage='';showApp()}
 else if(act==='builder-op'){state.builder.op=v;state.builderMessage='';showApp()}
 else if(act==='builder-use'){const b=state.builder;if(b.an>=b.ad||b.bn>=b.bd){state.builderMessage='For each mixed number, the numerator must be smaller than its denominator. Choose smaller numerators or larger denominators.';showApp();return}const a=raw(b.aw*b.ad+b.an,b.ad),bb=raw(b.bw*b.bd+b.bn,b.bd);if(b.op==='−'&&value(a)<value(bb)){state.builderMessage='For now, choose a first amount that is at least as large as the second amount.';showApp();return}state.lab=problem(a,bb,b.op,'custom');state.method='bars';state.shown=1;state.builderMessage='';showApp();toast('Your custom fraction problem is ready')}
 else if(act==='practice-new'){practiceNew()}
 else if(act==='practice-hint'){state.practiceHint=!state.practiceHint;showApp()}
 else if(act==='practice-solution'){state.practiceSolution=!state.practiceSolution;showApp()}
 else if(act==='practice-check')checkPractice();
 else if(act==='quiz-start'){startQuiz()}
 else if(act==='quiz-choice'){state.quiz.questions[state.quiz.index].answer=v;showApp()}
 else if(act==='quiz-back'){rememberQuizInput();state.quiz.index=Math.max(0,state.quiz.index-1);showApp()}
 else if(act==='quiz-next'){rememberQuizInput();if(state.quiz.index===state.quiz.questions.length-1)finishQuiz();else{state.quiz.index++;showApp()}}
 else if(act==='quiz-exit'){if(confirm('Exit this quiz? Your unfinished answers will not be saved.')){state.quiz=null;showApp(true)}}
 else if(act==='quiz-restart'){state.quiz=null;state.quizReview=false;showApp(true)}
 else if(act==='quiz-review'){state.quizReview=!state.quizReview;showApp()}
 else if(act==='progress-reset'){modal(`<span class="eyebrow">RESET LEARNING HISTORY</span><h2 id="modal-title">Erase saved progress?</h2><p>This clears practice counts and quiz history stored in this browser. You cannot undo it.</p><div class="modal-close"><button class="btn btn-soft" data-action="close-modal">Cancel</button><button class="btn btn-warn" data-action="reset-confirm">Erase progress</button></div>`)}
 else if(act==='reset-confirm'){stats=newStats();saveStats();closeModal();showApp();toast('Local progress cleared')}
}
function setting(ev){const el=ev.target;if(el.dataset.setting){const key=el.dataset.setting;const val=key==='quizLength'?Number(el.value):el.value;state[key]=val;if(key==='practiceLevel'||key==='practiceTopic')practiceNew();else if(key==='labLevel'||key==='labTopic'){state.lab=newProblem(state.labTopic,state.labLevel);state.shown=1;showApp()}}
 else if(el.dataset.builder){state.builder[el.dataset.builder]=Number(el.value);state.builderMessage='';/* Don't redraw while a dropdown is being used. */}
}
document.addEventListener('click',action);document.addEventListener('change',setting);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if(ev.key==='Enter'&&ev.target.id==='practice-answer'){ev.preventDefault();checkPractice()}if(ev.key==='Enter'&&ev.target.id==='quiz-answer'){ev.preventDefault();rememberQuizInput();if(state.quiz.index===state.quiz.questions.length-1)finishQuiz();else{state.quiz.index++;showApp()}}});
document.addEventListener('input',ev=>{if(ev.target.id==='practice-answer')state.practiceAnswer=ev.target.value;if(ev.target.id==='quiz-answer'&&state.quiz&&!state.quiz.finished)state.quiz.questions[state.quiz.index].answer=ev.target.value});
showApp();
})();
</script>
</body>
</html>
