const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), fmt=n=>String(Object.is(n,-0)?0:n).replace(/-/g,'−'), par=n=>n<0?'('+fmt(n)+')':fmt(n), signed=n=>n>0?'+'+n:fmt(n), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rnd(0,a.length-1)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}, clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const topics={intro:'Integers & zero',line:'Number lines',opposite:'Opposites',abs:'Absolute value',compare:'Compare & order',addsame:'Addition: same signs',adddiff:'Addition: different signs',sub:'Subtraction',subneg:'Subtract negatives',multi:'Multiple additions/subtractions',mul:'Multiplication',mulneg:'Multiply negatives',div:'Division',bedmas:'Order of operations',word:'Word problems',powers:'Integer powers',missing:'Missing integers',error:'Error analysis',sign:'Sign of an expression'};
const lessons=[
['Meet the integers','intro','5–6 · Foundation','Identify positive integers, negative integers and zero.','An integer is a whole number or its opposite, including zero. Positive integers are greater than zero; negative integers are less than zero. Zero is neither positive nor negative. Fractions such as 1/2 and decimals such as 2.5 are not integers.','Temperature, elevation and money','A temperature of −6°C is six degrees below zero. An elevation of +12 m is twelve metres above the reference level. A balance of $0 is neither debt nor credit.','−6, 0, +12','Each value is an integer.','The sign describes direction relative to a reference point.','context',-6,4,'+'],
['Explore the number line','line','5–6 · Foundation','Locate integers and describe direction and distance.','A number line places integers in order with equally spaced tick marks. Values increase to the right and decrease to the left. Moving across zero does not change the size of a step.','Horizontal and vertical number lines','Start at −4 and move 7 spaces right. Count each interval, not each tick mark.','−4 + 7 = 3','Start at −4. Move seven intervals right, crossing zero.','You land at +3.','line',-4,7,'+'],
['Opposites','opposite','5–6 · Foundation','Identify opposite integers and zero pairs.','Opposite integers have the same distance from zero but lie on different sides. The opposite of −8 is +8, and the opposite of 0 is 0. Adding opposites makes zero.','Reflection and zero pairs','A point 5 units left of zero reflects to a point 5 units right.','−(−5) = 5','Reflect −5 across zero.','The two integers sum to zero: −5 + 5 = 0.','opposite',-5,5,'+'],
['Absolute value','abs','6–7 · Foundation','Find the distance of an integer from zero.','Absolute value measures distance, not direction. A distance cannot be negative. The symbols | | mean absolute value. |−9| = 9 and |9| = 9.','Distance on a number line','A submarine at −7 m is 7 m from sea level.','|−7| = 7','Count seven intervals from −7 to zero.','The absolute value is 7, not −7.','opposite',-7,7,'+'],
['Compare and order','compare','6–7 · Foundation','Compare integers and arrange them from least to greatest.','The integer farther right is greater. For two negative integers, the one nearer zero is greater. Zero is greater than every negative integer. The open side of an inequality symbol faces the greater value.','Number line and temperature','−3 is warmer than −8, even though 8 has a greater absolute value.','−8 < −3 < 0 < 4','Place the integers on a number line.','Read the points from left to right for least to greatest.','compare',-8,-3,'+'],
['Add integers: same signs','addsame','6–7 · Core','Add two positive or two negative integers.','Adding means combining quantities. When both integers have the same nonzero sign, add their absolute values and keep that sign. Adding zero leaves an integer unchanged.','Number line, counters and mental math','Two debts of $4 and $3 combine into a debt of $7.','(−4) + (−3) = −7','Start at −4 and move three spaces left. Or combine four negative counters with three negative counters.','Add 4 + 3 = 7; keep the negative sign.','line',-4,-3,'+'],
['Add integers: different signs','adddiff','6–7 · Core','Use zero pairs to add integers with different signs.','One positive counter and one negative counter form a zero pair. Cancel matching pairs. Subtract the smaller absolute value from the larger and use the sign of the integer with larger absolute value. Equal absolute values give zero.','Zero pairs, number line and mental math','A balance of −$6 receives a deposit of $4. Four zero pairs cancel.','(−6) + 4 = −2','Combine six negative counters and four positive counters. Remove four zero pairs.','Two negative counters remain.','counters',-6,4,'+'],
['Subtract integers','sub','6–7 · Core','Understand subtraction as removing a quantity or adding its opposite.','Subtraction asks for the difference between values. On a number line, subtracting a positive integer moves left. In a counter model, remove the counters named by the second integer; add zero pairs if you do not have enough.','Removal, number line and adding the opposite','Start with +2 and remove 5 positive counters. Add three zero pairs first to make removal possible.','2 − 5 = −3','Start at 2. Move five spaces left, or rewrite as 2 + (−5).','The difference is −3.','counters',2,5,'−'],
['Subtract negative integers','subneg','7–8 · Core','Explain why subtracting a negative is adding a positive.','Subtracting a negative integer means removing a negative quantity. Add zero pairs if needed, then remove negative counters. The result increases by the magnitude removed. In symbols, a − (−b) = a + b for positive b.','Zero pairs, number line and adding the opposite','Start with −2. To remove five negative counters, first add three zero pairs.','(−2) − (−5) = 3','Add three zero pairs. Remove five negative counters. Three positive counters remain.','Equivalently, −2 + 5 = 3.','counters',-2,-5,'−'],
['Combine several integers','multi','7–8 · Core','Evaluate chains of addition and subtraction.','Evaluate addition and subtraction from left to right, or rewrite every subtraction as adding the opposite and then group terms. Never regroup subtraction as though it were addition.','Grouping and mental mathematics','Group positive and negative terms only after rewriting subtraction.','−6 + 9 − (−2) = 5','Rewrite as −6 + 9 + 2. Group 9 + 2 = 11.','11 − 6 = 5.','expression',-6,9,'+'],
['Multiply integers','mul','7–8 · Core','Interpret multiplication with positive group counts and signed quantities.','A positive whole-number multiplier counts equal groups. Three groups of −4 produce −12. Same signs give a positive product; different signs give a negative product; any factor of zero gives zero.','Repeated addition and groups','Three days of losing $4 each day produce a total change of −$12.','3 × (−4) = −12','Write (−4) + (−4) + (−4).','Three groups of −4 total −12.','groups',3,-4,'×'],
['Why negative × negative is positive','mulneg','7–8 · Core','Justify the sign of a product using patterns and the distributive property.','Negative group counts are not literal groups of objects. Extend a multiplication pattern across zero. The distributive property also explains the rule: (−4) × (3 + (−3)) = 0, so −12 plus the unknown product must equal zero.','Pattern table and distributive reasoning','As the second factor decreases by 1, multiplying by −4 increases the product by 4.','(−4) × (−3) = 12','−4 × 1 = −4, −4 × 0 = 0, −4 × (−1) = 4.','Continue: 8, then 12.','pattern',-4,-3,'×'],
['Divide integers','div','7–8 · Core','Use multiplication facts to divide signed integers.','Division is the inverse of multiplication. Find the missing factor: a ÷ b = q means b × q = a, with b not zero. Same signs give a positive quotient, different signs give a negative quotient. Zero divided by a nonzero integer is zero; division by zero is undefined.','Fact families and equal groups','A loss of $18 is spread equally across 3 days. Each day has a change of −$6.','(−18) ÷ 3 = −6','Ask: 3 × what equals −18?','3 × (−6) = −18, so the quotient is −6.','facts',-18,3,'÷'],
['BEDMAS with integers','bedmas','7–9 · Extension','Apply brackets and the order of operations with signed numbers.','Evaluate brackets first, then exponents, then division and multiplication from left to right, then addition and subtraction from left to right. Multiplication and division have equal priority; addition and subtraction have equal priority.','Step-by-step substitution','Keep a negative factor in brackets to make its sign clear.','8 − 3 × (−2) = 14','Multiply first: 3 × (−2) = −6.','8 − (−6) = 8 + 6 = 14.','expression',8,3,'×'],
['Integers in real life','word','6–9 · Application','Translate real-world changes into signed expressions.','Choose a reference point, decide which direction is positive and label quantities. A final position is not the same as a distance travelled. Check whether the answer makes sense in context.','Temperature, elevation, bank balances','At −4°C, the temperature rises by 9°C, then drops by 3°C.','−4 + 9 − 3 = 2','First the temperature reaches 5°C. Then it drops three degrees.','The final temperature is 2°C.','context',-4,9,'+'],
['Integer powers','powers','8–9 · Enrichment','Distinguish a negative base from a negative sign outside a power.','A power repeats multiplication of the base. With a negative base, even exponents give positive products and odd exponents give negative products. Brackets matter: (−3)² = 9, but −3² = −9 because exponentiation occurs before the outside negative sign.','Repeated factors and patterns','Compare the base −2 in brackets with an outside negative sign.','(−2)³ = −8','Multiply (−2) × (−2) × (−2).','4 × (−2) = −8.','powers',-2,3,'×'],
['Integer mastery','missing','7–9 · Challenge','Use inverse operations, reasoning and error analysis to solve unfamiliar problems.','Work backwards to find missing integers. Check the operation and sign before calculating. Estimate the sign and size of a result, then substitute your answer to verify it.','Inverse operations and checking','Find x in −7 + x = −12.','−7 + x = −12','Add 7 to both sides: x = −12 + 7.','x = −5; check −7 + (−5) = −12.','line',-7,-5,'+']];
const blankState=()=>({done:{},stats:{},best:{},history:[],theme:'light',last:0});let state=blankState();try{const s=JSON.parse(localStorage.getItem('integerExplorerV1')||'null');if(s)state={...state,...s}}catch{};function save(){try{localStorage.setItem('integerExplorerV1',JSON.stringify(state))}catch{}updateSide()}let page='overview', lesson=clamp(Number(state.last)||0,0,lessons.length-1), lessonTab='learn', session=null, game=null, worksheet=null, timerID=null;const navItems=[['overview','⌂','Overview'],['lessons','▤','Lessons'],['explore','↔','Explore lab'],['practice','✎','Practice studio'],['quiz','◈','Assessments'],['games','◇','Mini-games'],['worksheets','▧','Worksheets'],['progress','▥','My progress'],['reference','?','Reference']];
function updateSide(){const n=Object.keys(state.done).length;$('sideCount').textContent=n+'/'+lessons.length;$('sideBar').style.width=(n/lessons.length*100)+'%'}function theme(){document.body.classList.toggle('dark',state.theme==='dark');$('themeBtn').textContent=state.theme==='dark'?'☀ Light':'☾ Dark'}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';theme();save()}function toggleProject(){document.body.classList.toggle('project');$('projectBtn').textContent=document.body.classList.contains('project')?'▣ Exit presentation':'▣ Present'}function go(p){if(session&&!session.finished&&!confirm('Leave this unfinished session?'))return;clearInterval(timerID);session=null;game=null;page=p;render();window.scrollTo(0,0)}function render(){ $('nav').innerHTML=navItems.map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span class="ico">${i}</span>${n}</button>`).join('');$('crumb').textContent=navItems.find(x=>x[0]===page)[2];updateSide();({overview,lessons:renderLesson,explore:renderExplore,practice:()=>settings(false),quiz:()=>settings(true),games:renderGames,worksheets:renderWorksheets,progress:renderProgress,reference:renderReference}[page])()}

function normalized(v){return String(v).trim().replace(/[−–—]/g,'-').replace(/\s+/g,'').toLowerCase()}function correct(q,v){if(v===null||String(v).trim()==='')return false;let a=normalized(q.answer),b=normalized(v);if(q.kind==='number')return /^[+-]?\d+$/.test(b)&&Number(b)===Number(a);if(q.kind==='order'){let list=String(v).trim().replace(/[−–—]/g,'-').split(/[,;\s]+/).filter(Boolean);return list.length===a.split(',').length&&list.every(x=>/^[+-]?\d+$/.test(x))&&list.map(Number).join(',')===a}return a===b}function optionsFor(q){if(q.options)return q.options;if(q.kind!=='number')return null;let a=Number(q.answer),s=new Set([a]);for(let n of [-a,a+1,a-1,a+3,a-3,0])if(s.size<4)s.add(n);while(s.size<4)s.add(a+rnd(-8,8));return shuffle([...s]).map(String)}

function topicChecks(prefix,selected=core){return `<div class="checkgroup">${allTopics.map(t=>`<label><input type="checkbox" name="${prefix}" value="${t}" ${selected.includes(t)?'checked':''}>${topics[t]}</label>`).join('')}</div>`}function chosen(prefix){return [...document.querySelectorAll(`input[name="${prefix}"]:checked`)].map(x=>x.value)}function setChecks(prefix,list){document.querySelectorAll(`input[name="${prefix}"]`).forEach(e=>e.checked=list.includes(e.value))}function levelOptions(){return ['Beginner · Grades 5–6','Intermediate · Grades 6–7','Advanced · Grades 7–8','Challenge · Grades 8–9'].map((x,i)=>`<option value="${i+1}" ${i===1?'selected':''}>${x}</option>`).join('')}function rangeOptions(){return [0,10,20,50,100,1000].map(n=>`<option value="${n}">${n?'±'+n:'Match difficulty'}</option>`).join('')}function countOptions(unlimited=false){return [5,10,15,20,25,...(unlimited?[0]:[])].map(n=>`<option value="${n}" ${n===10?'selected':''}>${n||'Unlimited'}</option>`).join('')}
function settings(quiz){$('app').innerHTML=`<h1>${quiz?'Assessments':'Practice studio'}</h1><p class="muted">${quiz?'Test your understanding. Answers and worked solutions appear after submission.':'Choose skills, get feedback and practise at your own pace.'}</p>${quiz?`<div class="grid"><div class="card"><h3>Diagnostic assessment</h3><p>Sample foundational and core skills to find your next step.</p><button onclick="specialQuiz('diagnostic')">Start 15 questions</button></div><div class="card"><h3>Daily challenge</h3><p>Ten mixed questions for today's date.</p><button onclick="specialQuiz('daily')">Start challenge</button></div><div class="card"><h3>Mastery test</h3><p>25 mixed questions including enrichment.</p><button onclick="specialQuiz('mastery')">Start mastery test</button></div></div>`:''}<div class="card"><h2>${quiz?'Custom quiz':'Configure practice'}</h2><div class="row"><button onclick="setChecks('skills',foundation)">Foundations</button><button onclick="setChecks('skills',core)">Four operations</button><button onclick="setChecks('skills',allTopics)">Select all</button><button onclick="setChecks('skills',[])">Clear</button></div><div class="visual">${topicChecks('skills')}</div><div class="controls"><div class="control"><label for="level">Difficulty</label><select id="level">${levelOptions()}</select></div><div class="control"><label for="count">Questions</label><select id="count">${countOptions(!quiz)}</select></div><div class="control"><label for="range">Number range*</label><select id="range">${rangeOptions()}</select></div><div class="control"><label for="format">Answer format</label><select id="format"><option value="mixed">Mixed</option><option value="typed">Typed where possible</option><option value="choice">Multiple choice where possible</option></select></div></div><small>* Multiplication, division and powers use smaller factors appropriate to the difficulty. Results can exceed the selected range.</small><div class="controls">${!quiz?`<div class="co function dateSeed(){let d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}function specialQuiz(k){let cfg={ts:k==='diagnostic'?[...foundation,...core,'multi','word']:k==='daily'?[...core,'word','compare','bedmas']:allTopics,n:k==='diagnostic'?15:k==='daily'?10:25,level:k==='diagnostic'?1:k==='daily'?2:3,quiz:true,assist:'none',feedback:'end',format:'mixed',label:k==='diagnostic'?'Diagnostic':k==='daily'?'Daily challenge':'Mastery test'};if(k==='daily'){let old=Math.random,s=dateSeed();Math.random=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296};try{cfg.questions=buildQuestions(cfg.ts,cfg.n,cfg.level)}finally{Math.random=old}}startSession(cfg)}
function startSession(cfg){clearInterval(timerID);session={...cfg,qs:cfg.questions||buildQuestions(cfg.ts,cfg.n||10,cfg.level,cfg.range),i:0,answers:[],sel:null,submitted:false,showHint:false,finished:false,start:Date.now(),streak:0,down:0,seen:new Set(),calcValue:'',model:false};session.qs.forEach(q=>session.seen.add(q.prompt));if(cfg.timed)timerID=setInterval(()=>{if($('clock'))$('clock').textContent=elapsed()},1000);renderQuestion();window.scrollTo(0,0)}function elapsed(){let sec=Math.floor((Date.now()-session.start)/1000);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function questionChoice(q,s){if(q.options)return q.options;if(s.format==='choice'||s.format==='mixed'&&s.i%3===1)return optionsFor(q);return null}function hintVisual(q){let m=q.prompt.match(/^\(?([−-]?\d+)\)?\s*([+−])\s*\(?([−-]?\d+)\)?$/);if(m){let a=Number(m[1].replace('−','-')),b=Number(m[3].replace('−','-'));if(Math.abs(a)<=100&&Math.abs(b)<=100)return lineSVG([{n:a,label:'start'}],a,a)}return `<div class="callout">${esc(q.hint)}</div>`}

function docxBlob(w,key){let xml=s=>esc(s),p=(s,{bold=false,size=22,after=110,keep=false,page=false}={})=>`<w:p><w:pPr>${keep?'<w:keepNext/>':''}${page?'<w:pageBreakBefore/>':''}<w:keepLines/><w:spacing w:after="${after}"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>${bold?'<w:b/>':''}<w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${xml(s)}</w:t></w:r></w:p>`;let body=p(w.title+(key?' — Answer key':''),{bold:true,size:36,after:160,keep:true})+p(key?'Worked solutions':'Name: ____________________________     Date: _______________', {after:240,keep:true});w.qs.forEach((q,i)=>{body+=p(`${i+1}. ${worksheetPrompt(q)}`,{bold:true,after:90,keep:true});if(key)body+=p(`Answer: ${fmt(q.answer)}. ${q.explain}`,{size:21,after:180});else for(let j=0;j<w.space;j++)body+=p('',{size:22,after:j===w.space-1?200:70,keep:j<w.space-1})});let declaration='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';return zipStore({'[Content_Types].xml':declaration+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>','_rels/.rels':declaration+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>','word/document.xml':declaration+`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="900" w:right="900" w:bottom="900" w:left="900"/></w:sectPr></w:body></w:document>`})}

function renderProgress(){let h=state.history,n=Object.keys(state.done).length;$('app').innerHTML=`<h1>My progress</h1><div class="grid"><div class="card"><div class="num">${n}/${lessons.length}</div><small>Lessons mastered</small></div><div class="card"><div class="num">${h.length}</div><small>Recent completed sessions</small></div><div class="card"><div class="num">${Object.values(state.stats).reduce((a,v)=>a+v.n,0)}</div><small>Questions attempted</small></div></div><div class="two"><div class="card"><h2>Skill mastery</h2>${allTopics.map(t=>{let v=state.stats[t],p=v?Math.round(v.c/v.n*100):0;return `<div class="progressrow"><span>${topics[t]}</span><div class="bar"><span style="width:${p}%"></span></div><span>${v?p+'%':'—'}</span></div>`}).join('')}</div><div class="stack"><div class="card"><h2>Personal bests</h2>${Object.entries(state.best).map(([k,v])=>`<div class="row spread"><span>${esc(k.startsWith('game:')?games.find(g=>g[0]===k.slice(5))?.[2]||k:k)}</span><b>${v}${k.startsWith('game:')?' pts':'%'}</b></div>`).join('')||'<p class="muted">Finish a session or game to set a personal best.</p>'}</div><div class="card"><h2>Recent sessions</h2>${h.slice(0,12).map(x=>`<div class="row spread"><span>${esc(x.label)}<br><small>${esc(x.date)} · ${x.good}/${x.total}</small></span><b>${x.score}%</b></div>`).join('')||'<p class="muted">No sessions yet.</p>'}</div></div></div><div class="card"><h3>Manage progress</h3><p>Progress is saved in this browser. Clearing browser storage or using a different device starts a new record.</p><button onclick="resetProgress()">Reset progress</button></div>`}function resetProgress(){if(confirm('Reset all lesson progress, scores and personal bests?')){let t=state.theme;state=blankState();state.theme=t;lesson=0;save();renderProgress()}}
function renderReference(){$('app').innerHTML=`<h1>Integer reference</h1><div class="grid">${[['Integers & opposites','Positive integers are greater than zero; negative integers are less than zero. Zero is neither. Opposites sum to zero.','−6 + 6 = 0'],['Absolute value & comparison','Absolute value is distance from zero. Compare values from left to right on a number line.','|−8| = 8; −8 < −3'],['Addition','Same signs: add magnitudes and keep the sign. Different signs: subtract magnitudes and use the sign of the larger magnitude. Equal magnitudes give zero.','−7 + 3 = −4'],['Subtraction','Add the opposite of the second integer. Only change the sign of the quantity being subtracted.','−5 − (−8) = 3'],['Multiplication','Multiply magnitudes. Same nonzero signs give positive; different signs give negative. Any factor of zero gives zero.','(−3) × (−4) = 12'],['Division','Find the missing factor. Same nonzero signs give positive; different signs give negative. Never divide by zero.','−24 ÷ 6 = −4'],['BEDMAS','Brackets, exponents, division/multiplication left to right, addition/subtraction left to right.','8 − 3 × (−2) = 14'],['Integer powers','A negative base in brackets gives a positive result for even exponents and a negative result for odd exponents.','(−3)² = 9; −3² = −9']].map(([t,d,e])=>`<div class="card"><h3>${t}</h3><p>${esc(d)}</p><div class="example math">${esc(e)}</div></div>`).join('')}</div><div class="card"><h2>Learning progression</h2><p>Grades 5–6: introductory signed-number concepts and visual models. Grades 6–8: operations, reasoning and application. Grades 8–9: review, BEDMAS and integer-power enrichment. This is a flexible learning pathway rather than a strict grade-by-grade curriculum map.</p><p>Curriculum reference: <a href="https://www.alberta.ca/curriculum-mathematics" target="_blank" rel="noopener">Alberta mathematics curriculum</a>. The Grades 7–9 renewed curriculum is in optional piloting for 2026/27; the pathway also supports the established integer and rational-number outcomes.</p></div>`}
theme();render();
