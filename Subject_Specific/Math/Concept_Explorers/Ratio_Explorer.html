const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){let t=a%b;a=b;b=t;}return a||1};
function F(n,d=1){if(!Number.isFinite(n)||!Number.isFinite(d)||d===0)throw Error('Invalid fraction');if(d<0){n=-n;d=-d;}let g=gcd(n,d);return {n:n/g,d:d/g}}
const fadd=(a,b)=>F(a.n*b.d+b.n*a.d,a.d*b.d),fsub=(a,b)=>F(a.n*b.d-b.n*a.d,a.d*b.d),fmul=(a,b)=>F(a.n*b.n,a.d*b.d),fdiv=(a,b)=>F(a.n*b.d,a.d*b.n),feq=(a,b)=>a.n===b.n&&a.d===b.d;
const fmt=f=>f.d===1?String(f.n):`${f.n}/${f.d}`;
const fracHTML=f=>f.d===1?`<span>${f.n}</span>`:`<span class="fraction" aria-label="${f.n} over ${f.d}"><span class="num">${f.n}</span><span class="den">${f.d}</span></span>`;
function parseF(t){t=String(t||'').trim().replace(/\u2212/g,'-').replace(/,/g,'');if(!t)return null;let mixed=t.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mixed){let whole=+mixed[1],a=+mixed[2],b=+mixed[3];if(!b)return null;return F((whole<0?-1:1)*(Math.abs(whole)*b+a),b)}let m=t.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);if(m){if(+m[2]===0)return null;return F(+m[1],+m[2])}if(!/^-?\d+(?:\.\d+)?$/.test(t))return null;let sign=t[0]==='-'?-1:1;let raw=t.replace('-','');let ps=raw.split('.'),den=10**(ps[1]?ps[1].length:0);if(!Number.isSafeInteger(den)||!Number.isSafeInteger(Number(ps.join(''))))return null;return F(sign*Number(ps.join('')),den)}
function parseRatio(s){let parts=String(s).trim().toLowerCase().replace(/\s+to\s+/g,':').split(':');if(parts.length<2||parts.length>3)return null;let vals=parts.map(v=>parseF(v));if(vals.some(x=>!x))return null;return vals}

function makeQuestions(count,topics,diff){let result=[],seen=new Set();let order=[];while(order.length<count)order.push(...shuffle(topics));order=order.slice(0,count);for(let t of order){let q;for(let i=0;i<140;i++){let next=newQuestion(t,diff);if(!seen.has(next.signature)){q=next;break}}if(!q)q=newQuestion(t,diff);seen.add(q.signature);result.push(q)}return result}

  const bits=wanted.split(':').map(Number);let cand=[];if(bits.length===2){let [a,b]=bits;cand=[`${b}:${a}`,`${a+1}:${b}`,`${a}:${b+1}`,`${Math.max(1,a-1)}:${b}`,`${a}:${Math.max(1,b-1)}`,`${a*2}:${b}`,`${a}:${b*2}`,`${a+2}:${b}`,`${a}:${b+2}`,`${a+3}:${b}`,`${a}:${b+3}`];}else{let [a,b,c]=bits;cand=[`${b}:${a}:${c}`,`${a}:${b+1}:${c}`,`${a}:${b}:${c+1}`,`${a+1}:${b}:${c}`,`${a}:${c}:${b}`,`${a*2}:${b}:${c}`]}

 <div class="grid three" style="margin-top:17px"><div class="card metric"><span>Lessons completed</span><strong>${store.completed.length} <small style="font-size:14px;font-weight:600">/ ${LESSONS.length}</small></strong><div class="meter"><span style="width:${100*store.completed.length/LESSONS.length}%"></span></div></div><div class="card metric"><span>Practice questions answered</span><strong>${prac}</strong><span>Feedback after every answer</span></div><div class="card metric"><span>Best quiz score</span><strong>${best===null?'—':best+'%'}</strong><span>${store.quizRuns.length} completed ${store.quizRuns.length===1?'quiz':'quizzes'}</span></div></div>
 <div class="section-title"><h2>Choose how you learn</h2></div><div class="grid three"><div class="card quick-card"><div class="quick-icon">${ic('learn')}</div><h3>Guided lessons</h3><p>Begin with what a ratio is, then build towards proportional reasoning.</p><button class="link" data-action="view" data-value="learn">Browse lessons →</button></div><div class="card quick-card"><div class="quick-icon" style="color:#0c9c88;background:#e7f8f3">${ic('explore')}</div><h3>Interactive models</h3><p>Build ratios, scale quantities, and see the patterns for yourself.</p><button class="link" data-action="view" data-value="explore">Open activities →</button></div><div class="card quick-card"><div class="quick-icon" style="color:#8060da;background:#f0ecff">${ic('quiz')}</div><h3>Test your knowledge</h3><p>Choose topics, difficulty, and length. See solutions at the end.</p><button class="link" data-action="view" data-value="quiz">Set up a quiz →</button></div></div>
 <div class="section-title"><h2>Your learning path</h2><span class="pill neutral">${LESSONS.length} short lessons</span></div><div class="card pad">${LESSONS.map((l,i)=>`<div class="path-item"><div class="stepbubble ${store.completed.includes(i)?'done':''}">${store.completed.includes(i)?ic('check'):i+1}</div><div class="path-content"><h3>${esc(l.title)}</h3><p>${esc(l.subtitle)}</p></div><button class="btn secondary smallbtn" data-action="open-lesson" data-index="${i}">${store.completed.includes(i)?'Review':'Open'}</button></div>`).join('')}</div>`}
function renderLearn(){let l=currentLesson(),step=ui.step,isCheck=step>=l.steps.length,done=store.completed.includes(ui.lesson);return `${header('Guided lessons','Begin with the basics, then work toward the five proportional-reasoning outcomes.',`<span class="pill ${done?'ok':'neutral'}">${done?'Lesson completed':`Lesson ${ui.lesson+1} of ${LESSONS.length}`}</span>`)}
 <div class="lesson-tabs">${LESSONS.map((t,i)=>`<button class="lesson-tab ${i===ui.lesson?'active':''} ${store.completed.includes(i)?'done':''}" data-action="open-lesson" data-index="${i}">${i+1}. ${esc(i===0?'The basics':t.title)}</button>`).join('')}</div>
 <div class="lesson-shell"><div class="card lesson-primary"><div class="lesson-stepinfo"><span class="eyebrow">${isCheck?'Check your understanding':`Step ${step+1} of ${l.steps.length}`}</span><div class="dots">${Array.from({length:l.steps.length+1},(_,i)=>`<i class="${step===i?'active':step>i?'past':''}"></i>`).join('')}</div></div>
 ${!isCheck?`<h2>${esc(l.steps[step].title)}</h2><div class="prose">${l.steps[step].body}</div><div class="example-box"><h3>Worked example</h3><div class="mathline">${l.steps[step].example}</div></div>`:`<h2>Try it yourself</h2><p class="prose">Complete this short check before marking the lesson as finished.</p><div class="question-title" style="margin-top:23px">${esc(l.check.prompt)}</div><div class="answer-area"><label for="lessonInput">Your answer ${l.check.type.includes('ratio')?'(e.g. 2:3)':'(number, fraction, or decimal)'}</label><input class="input" id="lessonInput" autocomplete="off" inputmode="text" placeholder="Type your answer" value="${esc(ui.lessonAnswer)}" ${ui.lessonFeedback?.correct?'disabled':''}></div>${ui.lessonFeedback?`<div class="feedback ${ui.lessonFeedback.correct?'':'error'}"><b>${ui.lessonFeedback.correct?'Great work!':'Not quite — try again.'}</b><p>${ui.lessonFeedback.correct?esc(l.check.solution):'Check the order and your calculations. You can try as many times as you need.'}</p></div>`:''}`}
 <div class="lesson-actions"><button class="btn secondary" data-action="lesson-prev" ${step===0?'disabled':''}>${ic('back')} Previous</button><div class="row-flex">${isCheck?`<button class="btn ${ui.lessonFeedback?.correct?'teal':''}" data-action="lesson-check" ${ui.lessonFeedback?.correct?'disabled':''}>${ic('check')} Check answer</button>${ui.lessonFeedback?.correct?`<button class="btn teal" data-action="lesson-complete">${ic('arrow')} ${ui.lesson===LESSONS.length-1?'Finish learning path':'Complete & continue'}</button>`:''}`:`<button class="btn" data-action="lesson-next">${step===l.steps.length-1?'Try a question':'Next step'} ${ic('arrow')}</button>`}</div></div></div>
 <aside class="card lesson-side"><div class="eyebrow" style="margin-bottom:11px">Learning objective</div><h3>${esc(l.title)}</h3><p style="margin-top:7px">${esc(l.objective)}</p><div class="meter" style="margin-top:19px"><span style="width:${100*(step+1)/(l.steps.length+1)}%"></span></div><div class="small muted" style="margin-top:7px">${Math.min(step+1,l.steps.length+1)} of ${l.steps.length+1} sections</div>${lessonVisual((l.steps[Math.min(step,l.steps.length-1)]||{}).visual)}<div class="callout blue">Tip: Say each comparison aloud. For example, “4 dogs for every 8 cats” makes the order easier to remember.</div></aside></div>`}
function renderExplore(){let tabs=[['builder','Ratio builder'],['triple','Three-part builder'],['scale','Scale machine'],['table','Ratio table & graph'],['mixer','Real-life lab'],['check','Equivalent ratio check']];return `${header('Explore ratios','Change the numbers and watch how proportional relationships behave. No score, no pressure.')}
 <div class="tab-row">${tabs.map(([id,label])=>`<button class="tab ${ui.explore===id?'active':''}" data-action="explore-tab" data-value="${id}">${label}</button>`).join('')}</div>${ui.explore==='builder'?exploreBuilder():ui.explore==='triple'?exploreTriple():ui.explore==='scale'?exploreScale():ui.explore==='table'?exploreTable():ui.explore==='mixer'?exploreMixer():exploreCheck()}`}
function exploreBuilder(){let {a,b}=ui.builder;let g=gcd(a,b);return `<div class="grid grid-explore grid"><div class="card builder-panel"><h2>Build a ratio</h2><p class="muted small" style="margin-top:6px">Add or remove objects. Then see the ratio in different forms.</p><div class="builder-row" style="margin-top:22px"><div><span class="color-dot" style="background:#4e7de3"></span><strong>Blue circles</strong></div><div class="counter"><button data-action="builder-adjust" data-name="a" data-delta="-1" aria-label="Remove blue circle">−</button><strong>${a}</strong><button data-action="builder-adjust" data-name="a" data-delta="1" aria-label="Add blue circle">+</button></div></div><div class="builder-row"><div><span class="color-dot" style="background:#18aa96"></span><strong>Green squares</strong></div><div class="counter"><button data-action="builder-adjust" data-name="b" data-delta="-1" aria-label="Remove green square">−</button><strong>${b}</strong><button data-action="builder-adjust" data-name="b" data-delta="1" aria-label="Add green square">+</button></div></div><div class="visual"><div class="object-row">${Array.from({length:a},()=>'<span style="color:#4e7de3;font-size:30px;line-height:1">●</span>').join('')}</div><div class="object-row">${Array.from({length:b},()=>'<span style="color:#18aa96;font-size:29px;line-height:1">■</span>').join('')}</div><div class="small muted">${a} circles · ${b} squares · ${a+b} total</div></div><button class="btn secondary smallbtn" data-action="builder-reset">${ic('reset')} Reset objects</button></div>
 <div class="card pad"><div class="eyebrow">Your ratios</div><div class="ratio-pair" style="justify-content:flex-start;margin-top:16px"><span style="color:#4e7de3">${a}</span><span class="colon">:</span><span style="color:#18aa96">${b}</span></div><p class="small muted">Circles to squares</p><div class="example-box"><h3>In simplest form</h3><div class="mathline">${a/g} : ${b/g}</div><div class="small muted">Divide both terms by ${g}.</div></div><div style="margin-top:18px" class="vstack"><div class="row-flex" style="justify-content:space-between"><span class="small muted">Squares to circles</span><b>${b/g}:${a/g}</b></div><div class="row-flex" style="justify-content:space-between"><span class="small muted">Circles to total</span><b>${simpleRatio(a,a+b)}</b></div><div class="row-flex" style="justify-content:space-between"><span class="small muted">Squares to total</span><b>${simpleRatio(b,a+b)}</b></div></div><div class="callout blue" style="margin-top:23px"><b>Notice the order:</b> circles to squares and squares to circles are different comparisons.</div></div></div>`}
function exploreTriple(){let {a,b,c}=ui.triple,f=ui.tripleFactor,total=a+b+c,g=gcd(gcd(a,b),c);let entries=[['a','Blue circles',a,'#4579de','●'],['b','Green triangles',b,'#17a892','▲'],['c','Yellow squares',c,'#daa22e','■']];return `<div class="grid grid-explore grid"><div class="card builder-panel"><div class="eyebrow">Three quantities at once</div><h2 style="margin-top:6px">Build a three-part ratio</h2><p class="small muted" style="margin-top:7px">Add or remove each group. Notice how the parts, total, and simplified ratio change.</p>${entries.map(([key,label,count,color])=>`<div class="builder-row" style="margin-top:19px"><div><span class="color-dot" style="background:${color}"></span><strong>${label}</strong></div><div class="counter"><button data-action="triple-adjust" data-name="${key}" data-delta="-1" aria-label="Remove ${label}">−</button><strong>${count}</strong><button data-action="triple-adjust" data-name="${key}" data-delta="1" aria-label="Add ${label}">+</button></div></div>`).join('')}<div class="visual" style="min-height:155px"><div class="vstack" style="gap:10px;width:100%">${entries.map(([key,label,count,color,shape])=>`<div class="object-row" aria-label="${count} ${label}">${Array.from({length:count},()=>`<span style="color:${color};font-size:23px;line-height:1.1" aria-hidden="true">${shape}</span>`).join('')}</div>`).join('')}</div><div class="small muted">${a} circles · ${b} triangles · ${c} squares</div></div><div class="row-flex" style="justify-content:space-between"><label class="fieldlabel" style="margin:0" for="tripleFactor">Scale all three by <b>× ${f}</b></label><button class="btn secondary smallbtn" data-action="triple-reset">${ic('reset')} Reset</button></div><input id="tripleFactor" class="range" type="range" min="1" max="6" step="1" value="${f}" data-change="tripleFactor" style="margin-top:14px"><div class="range-endpoints"><span>× 1</span><span>× 6</span></div></div><div class="card pad"><div class="eyebrow">Three-part relationship</div><div class="triple-ratio" style="margin:15px 0">${a}<span>:</span>${b}<span>:</span>${c}</div><div class="example-box"><h3>Equivalent ratio (× ${f})</h3><div class="mathline">${a*f} : ${b*f} : ${c*f}</div><p class="small muted">Every term is multiplied by ${f}.</p></div><div class="example-box"><h3>Simplest form</h3><div class="mathline">${a/g} : ${b/g} : ${c/g}</div><p class="small muted">Divide all three terms by ${g}.</p></div><div class="vstack" style="margin-top:17px"><div class="row-flex" style="justify-content:space-between"><span class="small muted">Total number of objects</span><b>${total}</b></div><div class="row-flex" style="justify-content:space-between"><span class="small muted">Circles to all objects</span><b>${simpleRatio(a,total)}</b></div><div class="row-flex" style="justify-content:space-between"><span class="small muted">Triangles to all objects</span><b>${simpleRatio(b,total)}</b></div><div class="row-flex" style="justify-content:space-between"><span class="small muted">Squares to all objects</span><b>${simpleRatio(c,total)}</b></div></div><div class="callout blue" style="margin-top:18px"><b>Important:</b> A three-part ratio compares three groups. A part-to-total ratio compares one group with all ${total} objects. These are different comparisons.</div></div></div>`}
function exploreScale(){let s=ui.scale,a=3,b=5;return `<div class="grid grid-explore grid"><div class="card bigpad"><div class="eyebrow">Explore equivalent ratios</div><h2 style="margin-top:8px">Scale both quantities</h2><p class="muted small" style="margin:8px 0 22px">Start with 3 blue circles for every 5 green squares. Change the scale factor.</p><label class="fieldlabel" for="scaleRange">Scale factor: <strong style="font-size:20px;color:var(--blue)">× ${s}</strong></label><input id="scaleRange" class="range" type="range" min="1" max="8" step="1" value="${s}" data-change="scale"><div class="range-endpoints"><span>× 1</span><span>× 8</span></div><div class="visual" style="margin-top:21px"><div class="ratio-pair">${a} : ${b} <span style="font-size:20px;color:#8b9bb2">→</span> <span style="color:var(--blue)">${a*s}</span> : <span style="color:var(--teal)">${b*s}</span></div><div class="small muted">3 × ${s} = ${3*s} &nbsp; | &nbsp; 5 × ${s} = ${5*s}</div></div><div class="callout">All the ratios created here are equivalent: they always represent 3 blue for every 5 green.</div></div><div class="card bigpad"><h3>The scale factor and k are different</h3><p class="muted small" style="margin-top:9px">The scale factor tells you how you enlarged the ratio. k tells you how the second quantity compares with the first.</p><div class="example-box"><h3>Scale factor</h3><div class="mathline">× ${s}</div><div class="small muted">Changes as you move the slider</div></div><div class="example-box"><h3>Constant of proportionality</h3><div class="mathline">k = ${fracHTML(F(5,3))}</div><div class="small muted">Green ÷ blue = ${5*s} ÷ ${3*s} = 5/3</div></div></div></div>`}
function renderLineGraph(k){let value=k.n/k.d,largest=Math.max(4,value*6),w=390,h=260,l=48,b=218,usableW=315,usableH=177;let pts=Array.from({length:7},(_,i)=>({x:l+usableW*i/6,y:b-usableH*(value*i/largest)}));const lines=[0,1,2,3,4].map(i=>`<line x1="${l}" x2="${l+usableW}" y1="${b-usableH*i/4}" y2="${b-usableH*i/4}" stroke="#e7edf6"/>`).join('');return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Graph of y equals ${fmt(k)} times x, a line through the origin"><rect width="${w}" height="${h}" fill="#fff" rx="12"/>${lines}<line x1="${l}" x2="${l}" y1="30" y2="${b}" stroke="#8292aa" stroke-width="1.5"/><line x1="${l}" x2="${l+usableW+5}" y1="${b}" y2="${b}" stroke="#8292aa" stroke-width="1.5"/>${pts.map((p,i)=>`<text x="${p.x}" y="${b+18}" text-anchor="middle" font-size="11" fill="#718198">${i}</text>`).join('')}<text x="15" y="27" font-size="12" fill="#728198">y</text><text x="${l+usableW+13}" y="${b+4}" font-size="12" fill="#728198">x</text><polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="#376ee6" stroke-width="3" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#fff" stroke="#376ee6" stroke-width="2.5"/>`).join('')}</svg>`}
function exploreTable(){let k=parseF(ui.tableK)||F(3,2),x=ui.tableX,y=fmul(k,F(x));return `<div class="grid grid-explore grid"><div class="card bigpad"><h2>Build a proportionality table</h2><p class="small muted" style="margin-top:7px">Choose a constant. See how every row follows the same rule.</p><div class="setting" style="margin-top:23px"><label for="kSelect">Constant of proportionality, k</label><select id="kSelect" class="input" data-change="tableK"><option value="1/2" ${ui.tableK==='1/2'?'selected':''}>1/2</option><option value="2/3" ${ui.tableK==='2/3'?'selected':''}>2/3</option><option value="3/2" ${ui.tableK==='3/2'?'selected':''}>1.5 (3/2)</option><option value="2" ${ui.tableK==='2'?'selected':''}>2</option><option value="3" ${ui.tableK==='3'?'selected':''}>3</option><option value="5/2" ${ui.tableK==='5/2'?'selected':''}>2.5 (5/2)</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>x</th><th>y = ${fmt(k)} × x</th><th>y ÷ x</th></tr></thead><tbody>${Array.from({length:6},(_,i)=>{let n=i+1,z=fmul(k,F(n));return `<tr><td>${n}</td><td>${fmt(z)}</td><td>${fmt(k)}</td></tr>`}).join('')}</tbody></table></div></div><div class="card bigpad"><h3>See the relationship</h3><div style="padding:4px 0 9px">${renderLineGraph(k)}</div><div class="callout blue"><b>Try another x value.</b><div class="row-flex" style="margin-top:9px"><label for="tableX" class="small">x =</label><input id="tableX" class="input short" type="number" min="0" max="100" value="${x}" data-change="tableX"><span class="small">→ y = <b>${fmt(y)}</b></span></div><div class="small" style="margin-top:8px">Rule: y = ${fmt(k)} × x</div></div></div></div>`}
function exploreMixer(){let recipe=ui.mixer==='recipe',s=ui.mixerFactor;return `<div class="grid grid-explore grid"><div class="card bigpad"><h2>Real-life ratio lab</h2><p class="small muted" style="margin-top:7px">Apply the same proportional thinking to everyday situations.</p><div class="choice-row" style="margin-top:20px"><button class="choice ${recipe?'active':''}" data-action="mixer-scenario" data-value="recipe">Recipe mixer</button><button class="choice ${!recipe?'active':''}" data-action="mixer-scenario" data-value="shop">Shopping</button></div><div class="setting" style="margin-top:23px"><label for="mixerRange">${recipe?'Number of recipe batches':'Number of packs'}: <b>${s}</b></label><input id="mixerRange" class="range" type="range" min="1" max="8" value="${s}" data-change="mixerFactor"><div class="range-endpoints"><span>1</span><span>8</span></div></div><div class="visual" style="min-height:210px">${recipe?`<div class="ratio-pair"><span style="color:var(--blue)">${2*s}</span> : <span style="color:var(--teal)">${3*s}</span></div><div class="small muted">${2*s} cups oats : ${3*s} cups milk</div>`:`<div class="ratio-pair"><span style="color:var(--blue)">${4*s}</span> <span style="color:#95a2b7;font-size:24px">for</span> <span style="color:var(--teal)">$${12*s}</span></div><div class="small muted">${4*s} notebooks cost $${12*s}</div>`}</div></div><div class="card bigpad"><h3>${recipe?'The recipe stays balanced':'The unit price stays the same'}</h3>${recipe?`<p class="small muted" style="margin:10px 0 19px">One recipe batch uses 2 cups oats and 3 cups milk. Every extra batch multiplies <b>both</b> quantities by the same factor.</p><div class="example-box"><h3>For ${s} batches</h3><div class="mathline">2 × ${s} = ${2*s} cups oats</div><div class="mathline">3 × ${s} = ${3*s} cups milk</div></div><div class="callout" style="margin-top:18px">If x = cups oats and y = cups milk, then k = y ÷ x = 3/2.</div>`:`<p class="small muted" style="margin:10px 0 19px">A pack has 4 notebooks and costs $12. Scaling the order changes the total, but not the price per notebook.</p><div class="example-box"><h3>For ${s} packs</h3><div class="mathline">4 × ${s} = ${4*s} notebooks</div><div class="mathline">$12 × ${s} = $${12*s}</div></div><div class="callout" style="margin-top:18px">The constant is $${12*s} ÷ ${4*s} = $3 per notebook.</div>`}</div></div>`}
function exploreCheck(){let {a,b,c,d}=ui.equiv,eq=a*d===b*c;return `<div class="grid grid-explore grid"><div class="card bigpad"><h2>Check equivalent ratios</h2><p class="small muted" style="margin-top:7px">Enter two ratios and check them by cross multiplication.</p><div class="grid two" style="margin-top:24px"><div><label class="fieldlabel" for="eqA">Ratio A — first term</label><input id="eqA" class="input" type="number" min="1" max="999" value="${a}" data-change="eq-a"></div><div><label class="fieldlabel" for="eqB">Ratio A — second term</label><input id="eqB" class="input" type="number" min="1" max="999" value="${b}" data-change="eq-b"></div><div><label class="fieldlabel" for="eqC">Ratio B — first term</label><input id="eqC" class="input" type="number" min="1" max="999" value="${c}" data-change="eq-c"></div><div><label class="fieldlabel" for="eqD">Ratio B — second term</label><input id="eqD" class="input" type="number" min="1" max="999" value="${d}" data-change="eq-d"></div></div><button class="btn" data-action="eq-check" style="margin-top:20px">Check these ratios ${ic('arrow')}</button></div><div class="card bigpad"><div class="eyebrow">Comparison</div><div class="ratio-pair" style="font-size:26px;margin:17px 0">${a}:${b}<span class="colon">?</span>${c}:${d}</div>${!ui.equivChecked?`<div class="callout blue">Cross multiplication checks whether two ratios have the same numerical value. Try the examples 3:8 and 6:16, or 5:7 and 6:8.</div>`:`<div class="example-box"><h3>Cross-products</h3><div class="mathline">${a} × ${d} = ${a*d}</div><div class="mathline">${b} × ${c} = ${b*c}</div></div><div class="feedback ${eq?'':'error'}"><b>${eq?'Yes — equivalent!':'No — not equivalent.'}</b><p>${eq?'Both cross-products are equal.':'The cross-products are different.'} You can also compare k: ${c}/${a} for the first terms, and ${d}/${b} for the second terms, to see whether the same scale factor works.</p></div>`}</div></div>`}
function formatChoices(opts,chosen,disabled=false){return `<div class="answers" role="group" aria-label="Answer choices">${opts.map((o,i)=>`<button class="answer-option ${chosen===o.value?'chosen':''}" type="button" data-action="choose-option" data-value="${esc(o.value)}" ${disabled?'disabled':''} aria-pressed="${chosen===o.value?'true':'false'}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.label)}</span></button>`).join('')}</div>`}
function practiceMode(p){return p.mode==='mixed'?(p.index%2===1?'mc':'typed'):p.mode}
function renderPractice(){let p=ui.practice;if(!p){return `${header('Practise your skills','Work through as many questions as you like. Every answer gets immediate feedback and a worked explanation.')}

ight:850">${p.answered}</div><small>Attempted</small></div><div class="center" style="padding:12px;background:#f0faf6;border-radius:12px"><div style="font-size:28px;font-weight:850;color:var(--teal)">${p.correct}</div><small>Correct</small></div></div><div class="callout blue">Work at your own pace. Practice questions are unlimited, and explanations are always available after answering.</div></div></div>`}

ength}</b></div><div class="row-flex" style="justify-content:space-between"><span class="muted">Feedback</span><b>After finishing</b></div></div><div class="callout blue" style="margin-top:26px">You can go back to change any quiz answer before finishing. Your completed quiz will include a score and an explanation for every question.</div></div></div>`}
function renderQuiz(){let quiz=ui.quiz;if(!quiz)return quizForm();if(quiz.done)return renderQuizResults();let i=quiz.index,q=quiz.questions[i],mode=quiz.modes[i];return `${header('Quiz in progress','Answers will be marked only when you finish the entire quiz.',`<button class="btn secondary smallbtn" data-action="quiz-exit">End quiz</button>`)}<div class="card question-card" style="max-width:850px"><div class="row-flex" style="justify-content:space-between"><span class="question-caption">Question ${i+1} of ${quiz.questions.length}</span><span class="pill neutral">${esc(qTopic(q.topic).name)}</span></div><div class="quiz-progress">${quiz.questions.map((x,n)=>`<span class="${n===i?'active':quiz.answers[n]?'done':''}"></span>`).join('')}</div><div class="question-title">${esc(q.prompt)}</div>${q.sub?`<p class="small muted" style="margin-top:9px">${esc(q.sub)}</p>`:''}${q.visual||''}<div class="answer-area"><label>${mode==='mc'?'Choose one answer':'Type your answer'}</label>${mode==='mc'?formatChoices(quiz.options[i],quiz.answers[i]):`<input id="quizAnswer" class="input" autocomplete="off" spellcheck="false" inputmode="text" placeholder="Number, fraction, or ratio (e.g. 2:3:4)" value="${esc(quiz.answers[i])}">`}</div><div class="row-flex" style="margin-top:30px;justify-content:space-between"><button class="btn secondary" data-action="quiz-prev" ${i===0?'disabled':''}>${ic('back')} Previous</button>${i===quiz.questions.length-1?`<button class="btn teal" data-action="quiz-finish">Finish and see results ${ic('check')}</button>`:`<button class="btn" data-action="quiz-next">Next question ${ic('arrow')}</button>`}</div></div><div class="small muted" style="margin-top:16px">${quiz.answers.filter(x=>x).length} of ${quiz.questions.length} questions answered. You may leave a question blank and return to it.</div>`}
function renderQuizResults(){let quiz=ui.quiz,score=quizScore(),total=quiz.questions.length,pct=Math.round(score/total*100);let byTopic={};quiz.questions.forEach((q,i)=>{let o=byTopic[q.topic]||{total:0,correct:0};o.total++;if(answerIsCorrect(q.answerType,q.answer,quiz.answers[i]))o.correct++ ;byTopic[q.topic]=o});return `${header('Quiz results','Review every question, learn from the explanations, or try another quiz.',`<button class="btn secondary smallbtn" data-action="quiz-again">Create another quiz</button>`)}
 <div class="grid sidebargrid grid"><div class="card bigpad center"><div class="eyebrow">Your final score</div><div class="result-number" style="margin-top:10px">${pct}%</div><h2>${score} out of ${total} correct</h2><p class="muted" style="margin:11px auto;max-width:360px">${pct>=90?'Excellent understanding of these ratio skills!':pct>=70?'Good progress! Review the questions you missed to build confidence.':pct>=50?'You are building your skills. Use the worked examples below to practise.':'Keep learning — each explanation shows a way to improve.'}</p><div class="row-flex" style="justify-content:center;margin-top:20px"><button class="btn" data-action="quiz-again">Try another quiz ${ic('arrow')}</button><button class="btn secondary" data-action="view" data-value="practice">Practice topics</button></div></div><div class="card pad"><h3>Results by topic</h3><div style="margin-top:15px">${Object.entries(byTopic).map(([topic,r])=>`<div class="progress-row"><strong>${esc(qTopic(topic).name)}</strong><div class="meter"><span style="width:${100*r.correct/r.total}%"></span></div><small>${r.correct}/${r.total}</small></div>`).join('')}</div><p class="small muted" style="margin-top:15px">Your scores are saved on this device.</p></div></div><div class="section-title"><h2>Question-by-question review</h2><span class="pill neutral">All answers revealed</span></div><div class="card pad">${quiz.questions.map((q,i)=>{let yes=answerIsCorrect(q.answerType,q.answer,quiz.answers[i]);return `<details class="review-item" ${!yes?'open':''}><summary><span class="tagstatus ${yes?'good':''}">${yes?'✓':'×'}</span><span style="flex:1">${i+1}. ${esc(q.prompt)}</span><span class="pill ${yes?'ok':'warn'}">${yes?'Correct':'Review'}</span></summary><div class="review-detail"><p><b>Your answer:</b> ${esc(quiz.answers[i]||'Not answered')}</p><p><b>Correct answer:</b> ${esc(answerDisplay(q))}</p><p><b>How to solve:</b> ${esc(q.solution)}</p></div></details>`}).join('')}</div>`}
function renderProgress(){let practiceTotal=Object.values(store.practice).reduce((n,r)=>n+(r.answered||0),0),quiz=store.quizRuns,best=quiz.length?Math.max(...quiz.map(r=>Math.round(r.correct/r.total*100))):null;return `${header('My progress','See what you have completed and which topics deserve another look.',`<button class="btn secondary smallbtn" data-action="reset-progress">${ic('reset')} Reset saved progress</button>`)}<div class="grid three"><div class="card metric"><span>Lessons complete</span><strong>${store.completed.length} / ${LESSONS.length}</strong><div class="meter"><span style="width:${100*store.completed.length/LESSONS.length}%"></span></div></div><div class="card metric"><span>Practice questions</span><strong>${practiceTotal}</strong><span>Across all topics</span></div><div class="card metric"><span>Best quiz result</span><strong>${best===null?'—':best+'%'}</strong><span>${quiz.length} quiz ${quiz.length===1?'result':'results'} saved</span></div></div>

let calcDrag=null;
function clampCalcPosition(){if(!store.calculatorPos)return;let panel=document.querySelector('.calc-panel');if(!panel)return;let maxX=Math.max(0,innerWidth-panel.offsetWidth-5),maxY=Math.max(0,innerHeight-panel.offsetHeight-5);store.calculatorPos={x:Math.min(maxX,Math.max(5,store.calculatorPos.x)),y:Math.min(maxY,Math.max(5,store.calculatorPos.y))};panel.style.left=store.calculatorPos.x+'px';panel.style.top=store.calculatorPos.y+'px';panel.style.right='auto';panel.style.bottom='auto'}
function startCalcDrag(e){let handle=e.target.closest('.calc-handle');if(!handle||e.target.closest('button')||e.button!==0&&e.pointerType==='mouse')return;let panel=handle.closest('.calc-panel');let rect=panel.getBoundingClientRect();store.calculatorPos={x:rect.left,y:rect.top};calcDrag={pointer:e.pointerId,dx:e.clientX-rect.left,dy:e.clientY-rect.top};handle.setPointerCapture(e.pointerId);e.preventDefault()}
function moveCalcDrag(e){if(!calcDrag||e.pointerId!==calcDrag.pointer)return;let panel=document.querySelector('.calc-panel');if(!panel)return;store.calculatorPos={x:e.clientX-calcDrag.dx,y:e.clientY-calcDrag.dy};clampCalcPosition()}
function endCalcDrag(e){if(!calcDrag||e.pointerId!==calcDrag.pointer)return;calcDrag=null;clampCalcPosition();save()}
function renderCalculator(){let root=document.getElementById('calculatorRoot');root.innerHTML=store.calculatorEnabled&&ui.calcOpen?`<section class="calc-panel" role="region" aria-label="On-screen calculator"><div class="calc-handle" tabindex="0" role="group" aria-label="Drag calculator to move. Use arrow keys when focused."><div><b style="font-size:13px">Calculator</b><small> · Drag to move</small></div><div class="row-flex" style="gap:5px"><button type="button" class="btn secondary smallbtn" data-action="calc-reset" title="Reset position" aria-label="Reset calculator position" style="padding:6px 8px;min-height:29px">${ic('reset')}</button><button type="button" class="btn secondary smallbtn" data-action="calc-close" style="padding:6px 8px;min-height:29px">Close ×</button></div></div><div class="calc-screen"><label for="calcInput" class="sr-only">Calculator expression</label><input id="calcInput" aria-label="Calculator expression" value="${esc(ui.calcText)}" inputmode="decimal" placeholder="0"></div><div class="calc-grid">${['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+'].map(label=>`<button type="button" data-action="calc-key" data-value="${esc(label)}" class="${label==='='?'equals':'+−×÷'.includes(label)?'operator':''}">${label}</button>`).join('')}</div></section>`:store.calculatorEnabled?`<button class="btn" style="position:fixed;bottom:19px;right:20px;z-index:10;box-shadow:0 10px 22px #27458322" data-action="calc-open">${ic('calculator')} Calculator</button>`:'';clampCalcPosition()}
function renderHelp(){document.getElementById('modalRoot').innerHTML=!ui.help?'':`<div class="modaloverlay" id="helpOverlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="row-flex" style="justify-content:space-between"><h2 id="helpTitle">How to use Ratio Explorer</h2><button class="btn secondary smallbtn" data-action="help-close">Close ×</button></div><ul><li><b>Lessons:</b> Start with ratios and work through the explanations. Finish each lesson with a quick question.</li><li><b>Explore:</b> Change quantities, scale ratios, use ratio tables, and check equivalent ratios.</li><li><b>Practice:</b> Receive the answer and a worked explanation immediately after answering.</li><li><b>Quiz yourself:</b> Choose 5, 10, 15, or 20 questions. All answers stay hidden until you finish.</li><li><b>Calculator:</b> Use the top toggle, then drag the calculator by its title bar. On touch screens, move it with your finger. Reset restores its initial position.</li><li><b>Saving:</b> Completed lessons, practice totals, and quiz results are saved on this device.</li></ul><div class="callout blue">For typed answers, use <b>2:3</b> or <b>2:3:4</b> for ratios and <b>3/4</b> or <b>0.75</b> for fractions. You can also enter <b>1 1/2</b> for a mixed number.</div><button class="btn w-full" data-action="help-close">Got it ${ic('check')}</button></div></div>`}
function render(){renderNav();let html=ui.view==='home'?renderHome():ui.view==='learn'?renderLearn():ui.view==='explore'?renderExplore():ui.view==='practice'?renderPractice():ui.view==='quiz'?renderQuiz():renderProgress();document.getElementById('page').innerHTML=html;renderCalculator();renderHelp()}
function gradePractice(){let p=ui.practice;if(!p||p.feedback)return;let mode=practiceMode(p);if(mode==='typed'){p.answer=document.getElementById('practiceAnswer')?.value.trim()||'';if(!p.answer){document.getElementById('practiceAnswer')?.focus();return}}else if(!p.chosen)return;let val=mode==='mc'?p.chosen:p.answer;let correct=answerIsCorrect(p.q.answerType,p.q.answer,val);p.feedback={correct};p.answered++;if(correct)p.correct++;let r=store.practice[p.q.topic]||(store.practice[p.q.topic]={answered:0,correct:0});r.answered++;if(correct)r.correct++;save();render()}
function cacheQuizInput(){let q=ui.quiz;if(!q||q.done)return;if(q.modes[q.index]==='typed'){let el=document.getElementById('quizAnswer');if(el)q.answers[q.index]=el.value.trim()}}
function handleClick(e){let btn=e.target.closest('[data-action]');if(!btn)return;let act=btn.dataset.action,val=btn.dataset.value;switch(act){
 case 'view':goView(val);break;
 case 'open-lesson':ui.lesson=Math.max(0,Math.min(LESSONS.length-1,+btn.dataset.index));ui.step=0;ui.lessonFeedback=null;ui.lessonAnswer='';goView('learn');break;
 case 'lesson-next':ui.step=Math.min(currentLesson().steps.length,ui.step+1);ui.lessonFeedback=null;ui.lessonAnswer='';render();break;
 case 'lesson-prev':ui.step=Math.max(0,ui.step-1);ui.lessonFeedback=null;ui.lessonAnswer='';render();break;
 case 'lesson-check':{
  let el=document.getElementById('lessonInput');let raw=el?.value||'';ui.lessonAnswer=raw;let check=currentLesson().check;ui.lessonFeedback={correct:answerIsCorrect(check.type,check.answer,raw)};render();break;
 }

 case 'explore-tab':ui.explore=val;render();break;
 case 'builder-adjust':{let name=btn.dataset.name;ui.builder[name]=Math.max(1,Math.min(12,ui.builder[name]+ +btn.dataset.delta));render();break}
 case 'builder-reset':ui.builder={a:4,b:8};render();break;
 case 'triple-adjust':{let name=btn.dataset.name;ui.triple[name]=Math.max(1,Math.min(12,ui.triple[name]+ +btn.dataset.delta));render();break}
 case 'triple-reset':ui.triple={a:4,b:9,c:6};ui.tripleFactor=2;render();break;
 case 'mixer-scenario':ui.mixer=val;render();break;
 case 'eq-check':ui.equivChecked=true;render();break;
 case 'practice-diff':ui.practiceDiff=val;render();break;
 case 'practice-mode':ui.practiceMode=val;render();break;

 case 'quiz-diff':ui.quizConfig.difficulty=val;render();break;

 case 'quiz-exit':if(window.confirm('End this quiz? Unfinished answers will not be saved.')){ui.quiz=null;render()}break;

  break;
 }
 case 'reset-progress':if(window.confirm('Clear all saved lesson completions, practice totals, and quiz records from this device?')){store.completed=[];store.practice={};store.quizRuns=[];save();render()}break;
 case 'calc-toggle':store.calculatorEnabled=!store.calculatorEnabled;ui.calcOpen=store.calculatorEnabled;save();renderNav();renderCalculator();break;

function handleChange(e){const t=e.target,v=t.value,d=t.dataset.change;if(!d)return;
 switch(d){
 case 'practiceTopic':ui.practiceTopic=v;render();break;
 case 'quiz-topic':{const xs=new Set(ui.quizConfig.topics);if(t.checked)xs.add(v);else xs.delete(v);ui.quizConfig.topics=TOPICS.map(t=>t.id).filter(id=>xs.has(id));render();break;}
 case 'scale':ui.scale=+v;render();break;
 case 'tripleFactor':ui.tripleFactor=+v;render();break;
 case 'tableK':ui.tableK=v;render();break;
 case 'tableX':ui.tableX=Math.max(0,Math.min(100,Math.round(Number(v)||0)));render();break;
 case 'mixerFactor':ui.mixerFactor=+v;render();break;
 case 'eq-a':case 'eq-b':case 'eq-c':case 'eq-d':{let name=d.slice(3);ui.equiv[name]=Math.max(1,Math.min(999,Math.round(+v||1)));ui.equivChecked=false;render();break}
 default:break;
 }}
function calcEvaluate(source){let expr=String(source).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');if(!expr||expr.length>120)throw Error('Invalid expression');let tokens=expr.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/]/g)||[];if(tokens.join('')!==expr)throw Error('Invalid expression');let i=0;
 function factor(){let t=tokens[i++];if(t==='+'||t==='-'){let num=factor();return t==='-'?-num:num;}if(t==='('){let n=expression();if(tokens[i++]!==')')throw Error('Parentheses do not match');return n;}if(t==null||!/^\d*\.?\d+$/.test(t))throw Error('Invalid number');return Number(t)}
 function term(){let n=factor();while(tokens[i]==='*'||tokens[i]==='/'){let op=tokens[i++],v=factor();if(op==='/'&&v===0)throw Error('Cannot divide by zero');n=op==='*'?n*v:n/v}return n}
 function expression(){let n=term();while(tokens[i]==='+'||tokens[i]==='-'){let op=tokens[i++],v=term();n=op==='+'?n+v:n-v}return n}
 let result=expression();if(i!==tokens.length||!Number.isFinite(result))throw Error('Invalid calculation');return String(Number(result.toPrecision(11)))}
function calculatorKey(v){if(v==='C')ui.calcText='';else if(v==='⌫')ui.calcText=ui.calcText.slice(0,-1);else if(v==='='){try{ui.calcText=calcEvaluate(ui.calcText)}catch(e){ui.calcText='Error'}}else{if(ui.calcText==='Error')ui.calcText='';if(ui.calcText.length<100)ui.calcText+=v}renderCalculator()}
document.addEventListener('click',handleClick);
document.getElementById('calculatorRoot').addEventListener('pointerdown',startCalcDrag);
document.getElementById('calculatorRoot').addEventListener('pointermove',moveCalcDrag);
document.getElementById('calculatorRoot').addEventListener('pointerup',endCalcDrag);
document.getElementById('calculatorRoot').addEventListener('pointercancel',endCalcDrag);
window.addEventListener('resize',()=>{if(ui.calcOpen&&store.calculatorPos){clampCalcPosition();save()}});
document.addEventListener('change',handleChange);
document.addEventListener('input',e=>{if(e.target.id==='calcInput')ui.calcText=e.target.value;if(e.target.id==='quizAnswer'&&ui.quiz&&ui.quiz.modes[ui.quiz.index]==='typed')ui.quiz.answers[ui.quiz.index]=e.target.value;if(e.target.id==='lessonInput'){ui.lessonAnswer=e.target.value}if(e.target.id==='practiceAnswer'&&ui.practice)ui.practice.answer=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.classList?.contains('calc-handle')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let panel=document.querySelector('.calc-panel'),rect=panel.getBoundingClientRect(),d=e.shiftKey?30:12;store.calculatorPos={x:rect.left+(e.key==='ArrowRight'?d:e.key==='ArrowLeft'?-d:0),y:rect.top+(e.key==='ArrowDown'?d:e.key==='ArrowUp'?-d:0)};clampCalcPosition();save();return;}if(e.key==='Escape'&&ui.help){ui.help=false;renderHelp()}if(e.key!=='Enter')return;
 if(e.target.id==='lessonInput'){e.preventDefault();document.querySelector('[data-action="lesson-check"]')?.click()}
 if(e.target.id==='practiceAnswer'){e.preventDefault();gradePractice()}
 if(e.target.id==='quizAnswer'){e.preventDefault();document.querySelector(`[data-action="${ui.quiz?.index===ui.quiz?.questions.length-1?'quiz-finish':'quiz-next'}"]`)?.click()}
 if(e.target.id==='calcInput'){e.preventDefault();try{ui.calcText=calcEvaluate(e.target.value)}catch(err){ui.calcText='Error'}renderCalculator()}
});
document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.id==='helpOverlay'){ui.help=false;renderHelp()}});
render();
</script>
