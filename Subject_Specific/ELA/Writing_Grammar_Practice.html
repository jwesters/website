const CONTENT={
speech:[['A noun names a person, place, thing, or idea. A verb tells what someone or something does or is.','The joyful rabbit <b>jumps</b>. “rabbit” is a noun; “jumps” is a verb.'],['An adjective describes a noun. An adverb often describes how, when, or where an action happens.','The <b>quiet</b> singer sings <b>softly</b>. “quiet” is an adjective; “softly” is an adverb.'],['A pronoun can replace a noun. The job a word does depends on how it is used.','<b>They</b> brought <b>their</b> books. “They” is a pronoun.']],
punct:[['Use a period for a statement, a question mark for a question, and an exclamation mark for strong feeling.','Are you ready<b>?</b>'],['Use commas to separate items in a list. A comma can also follow an introductory phrase.','We packed pencils<b>,</b> paper<b>,</b> and books.'],['Apostrophes show contractions or possession. Quotation marks show direct speech.','“I <b>can’t</b> find <b>Sam’s</b> hat,” she said.']],

confused:[['“There” refers to a place, “their” shows possession, and “they’re” means “they are.”','<b>They’re</b> bringing <b>their</b> lunches over <b>there</b>.'],['“Your” shows possession; “you’re” means “you are.” “Its” shows possession; “it’s” means “it is.”','<b>You’re</b> holding <b>your</b> notebook. The cat cleaned <b>its</b> paws.'],['“To” can show direction, “too” means also or excessively, and “two” is a number.','The <b>two</b> friends went <b>to</b> the park <b>too</b>.']],
agreement:[['A singular subject usually takes a singular present-tense verb.','The dog <b>runs</b> across the field.'],['Plural subjects generally take plural present-tense verbs.','The dogs <b>run</b> across the field.'],['Find the true subject, even when extra words separate it from the verb.','The box of markers <b>is</b> on the table.']],
structure:[['A complete statement usually needs a subject and a verb and expresses a complete thought.','<b>The birds flew south.</b>'],['Combine related ideas with a suitable joining word or punctuation.','The rain stopped, <b>so</b> we went outside.'],['Vary sentence openings and lengths, but always make the meaning clear.','<b>After lunch,</b> we explored the trail.']],

const EDITING_CORRECTIONS=[
['we visited the museum yesterday.','We visited the museum yesterday.','Capitalize the first word of a sentence.'],
['The children was excited.','The children were excited.','Use a plural verb with children.'],
['I have three pencil.','I have three pencils.','Use a plural noun after three.'],
['monday is our library day.','Monday is our library day.','Capitalize days of the week.'],
['Where is my notebook.','Where is my notebook?','A question needs a question mark.'],
['The bird fly above the lake.','The bird flies above the lake.','Use flies with a singular bird.'],
['Our class visited calgary.','Our class visited Calgary.','Capitalize the name of a city.'],
['Did you finish you homework?','Did you finish your homework?','Your shows possession.'],
['The puppy chased it tail.','The puppy chased its tail.','Its shows possession.'],
['She walked too the store.','She walked to the store.','To indicates direction.'],
['Their are five apples.','There are five apples.','There indicates existence.'],
['Your going to enjoy this story.','You’re going to enjoy this story.','You’re means you are.'],
['I recieved a letter.','I received a letter.','The word is spelled received.'],
['The team have one captain.','The team has one captain.','Here team is a singular collective noun.'],
['we read a poem in class.','We read a poem in class.','Capitalize the sentence beginning.'],
['Those tree are tall.','Those trees are tall.','Those refers to more than one tree.'],
['The foxes runs across the field.','The foxes run across the field.','Foxes is plural and takes run.'],
['My favourite subject is science','My favourite subject is science.','Finish a statement with a period.'],
['i would like to volunteer.','I would like to volunteer.','The pronoun I must be capitalized.'],
['The scientist measure the water.','The scientist measures the water.','A singular present-tense subject takes measures.'],
['There books are on the desk.','Their books are on the desk.','Their shows ownership.'],
['I brought too notebooks.','I brought two notebooks.','Two is the number 2.'],
['Its very cold this morning.','It’s very cold this morning.','It’s means it is.'],
['The library is open on fridays.','The library is open on Fridays.','Capitalize the day Friday.'],
['We have four chair.','We have four chairs.','The plural is chairs.'],
['the train arrived early.','The train arrived early.','Start the sentence with a capital letter.'],
['My brother enjoy music.','My brother enjoys music.','A singular subject takes enjoys.'],
['What a wonderfull performance!','What a wonderful performance!','Wonderful has one final l.'],
['The students was reading.','The students were reading.','Students is plural and takes were.'],
['The teacher gave us an assignement.','The teacher gave us an assignment.','Assignment is spelled with an n before ment.'],
['Please put your bag over their.','Please put your bag over there.','There refers to a place.'],
['Me and Sam went outside.','Sam and I went outside.','Use I for a subject and normally put the other person first.'],
['We looked at the beautifull painting.','We looked at the beautiful painting.','Beautiful ends in ful, not full.'],
['Did the bus arrive on time.','Did the bus arrive on time?','Questions end with a question mark.'],
['The boxes is heavy.','The boxes are heavy.','Boxes is plural, so use are.'],
['She has two younger brother.','She has two younger brothers.','Two requires a plural noun.'],
['the river flows into the lake.','The river flows into the lake.','Capitalize the first letter of the sentence.'],
['We will meat at noon.','We will meet at noon.','Meet is the verb meaning come together.'],
['He didnt understand the question.','He didn’t understand the question.','The contraction didn’t needs an apostrophe.'],
['This is the most easiest problem.','This is the easiest problem.','Do not use most with a superlative ending in -est.'],
['We walked passed the school.','We walked past the school.','Past indicates a location or time; passed is the past tense of pass.'],
['I have less pencils than you.','I have fewer pencils than you.','Fewer is standard for countable objects.'],
['The players has arrived.','The players have arrived.','Players is plural and takes have.'],
['The sky was a dark, color.','The sky was a dark colour.','Remove the unnecessary comma and spell colour correctly.'],
['The team practised in the gym','The team practised in the gym.','Complete the statement with a period.'],
['She spoke very quiet.','She spoke very quietly.','Quietly is the adverb that modifies spoke.'],
['The dog bark loud.','The dog barked loudly.','Use past-tense barked and the adverb loudly.'],
['Our group finaly completed the project.','Our group finally completed the project.','Finally has two l letters before y.'],
['The childrens books are here.','The children’s books are here.','Children is already plural; add apostrophe + s for possession.'],
['The students should of listened.','The students should have listened.','Use should have, not should of.']

/* Grade-appropriate challenge bank. All text is original and usable offline. */
(function(){
function add(area,skill,grade,kind,prompt,answer,wrong,explain,extra={}){
  let key=skillKey(area,skill),bank=QUESTION_BANK[key];
  let id=`${area}-${skill}-g${grade}-${String(bank.filter(q=>q.grade===grade&&q.advanced).length+1).padStart(3,'0')}`;
  bank.push({id,grade,type:kind,advanced:true,prompt,answer,wrong:wrong||[],explain,difficulty:grade===9?(bank.length%3===0?4:5):grade===7?(bank.length%3===0?3:4):2+(bank.length%4===0?1:0),...extra});
}
function ed(area,skill,grade,rows,focus='Proofread this sentence and rewrite it correctly. It may already be correct.'){
  rows.trim().split('\n').filter(Boolean).forEach(line=>{let [source,answer,explain]=line.split('§').map(s=>s.trim());
    if(!source||!answer||!explain)throw Error('Bad edit row '+area+' '+line);
    add(area,skill,grade,'edit',focus,answer,[],explain,{source,caseSensitive:/caps/.test(area)});
  });
}
function mc(area,skill,grade,rows){
  rows.trim().split('\n').filter(Boolean).forEach(line=>{let [prompt,answer,wrong,explain]=line.split('§').map(s=>s.trim());
    if(!prompt||!answer||!wrong||!explain)throw Error('Bad choice row '+area+' '+line);
    add(area,skill,grade,'choice',prompt,answer,wrong.split('¦').map(x=>x.trim()),explain);
  });
}
function cl(area,skill,grade,rows){
  rows.trim().split('\n').filter(Boolean).forEach(line=>{let [prompt,answer,explain]=line.split('§').map(s=>s.trim());
    if(!prompt||!answer||!explain)throw Error('Bad typed row '+area+' '+line);
    add(area,skill,grade,'typed',prompt,answer,[],explain,{caseSensitive:area==='caps'});
  });
}

function answerMatches(q,response){

 if(q.type==='match')return q.pairs.every((pair,i)=>q.right[state.matches[i]]===pair.value)&&new Set(Object.values(state.matches)).size===q.pairs.length;

 const cmp=t=>q.caseSensitive?prep(t):norm(t);
 if(q.type==='blanks'){
   const submitted=Array.isArray(response)?response:String(response??'').split(/\s*,\s*/);
   return submitted.length===q.parts.length&&q.parts.every((expected,i)=>cmp(expected)===cmp(submitted[i]));

function scheduleBankQuestions(area,skill,grade,level,n,usedSession,mode='practice'){
 const all=QUESTION_BANK[skillKey(area,skill)].filter(q=>q.grade<=grade);
 if(!all.length)throw Error('No questions for '+area+' '+skill);
 const p=active(),key=skillKey(area,skill);
 if(!p.questionHistory)p.questionHistory={};
 if(!p.questionHistory[key])p.questionHistory[key]=[];
 const history=p.questionHistory[key];
 // Grade is the difficulty floor. Mastery determines challenge within that band,
 // never whether an older student receives a Grade 3 worksheet instead.
 const bands=grade>=9?[9,7]:grade>=7?[7,5]:grade>=6?[6,5,3]:grade>=5?[5,3]:[3];
 const isOldGrade=grade<=4;
 const candidatesByBand=new Map(bands.map(b=>[b,shuffle(all.filter(q=>q.grade===b))]));
 const used=usedSession||new Set(),result=[];
 const formatPlan=shuffle(['typed','edit','order','tiles','choice','typed','edit','tiles','choice','match','mark','typed','choice','edit','tiles','compose','typed','choice','tiles','edit']);
 let choiceCount=0;
 for(let i=0;i<n;i++){
   // Draw from age-appropriate grade material first. Old foundational questions
   // are only a fallback when the suitable grade bank is exhausted.
   // Alternate age-appropriate bands to sustain challenge even after the
   // student has already seen every item once. Revisit the oldest in-band
   // questions before dropping down to elementary material.
   const desired=(grade===6?[6,5]:bands)[i%(grade===6?2:bands.length)];
   let band=[desired,...bands.filter(b=>b!==desired)].find(b=>(candidatesByBand.get(b)||[]).some(q=>!used.has(q.id)));
   if(band===undefined)break;
   const bucket=(candidatesByBand.get(band)||[]).filter(q=>!used.has(q.id));
   // Prioritize unseen questions, then least recently encountered questions.
   const unseen=bucket.filter(q=>!history.includes(q.id));
   let selectable=unseen.length?unseen:bucket.sort((x,y)=>history.indexOf(x.id)-history.indexOf(y.id));
   const preferred= formatPlan[i%formatPlan.length];
   let selected=selectable[0];
   if(selectable.length>1){
      const target=clamp(level+(grade>=9?0:grade>=7?.5:0),1,5);
      const candidates=shuffle(selectable);
      const weighed=candidates.map(q=>({q,w:1/(.5+Math.abs((q.difficulty||Math.max(1,Math.ceil(q.answer.length/32)))-target))}));
      let roll=Math.random()*weighed.reduce((a,x)=>a+x.w,0);
      for(const e of weighed){roll-=e.w;if(roll<=0){selected=e.q;break}}
   }
   let q;
   if(selected.advanced){
      let format=selected.type;
      if(selected.type==='choice'){
         let eligibleOrder=selected.answer.trim().split(/\s+/).length>=7;
         const production=level>=3 || grade>=8;
         const wantsTyped=((preferred==='typed'&&production)||(choiceCount>=Math.ceil(n*.5) && selected.answer.length<=55));
         const wantsOrder=eligibleOrder&&((production&&(preferred==='tiles'||preferred==='order'))||(choiceCount>=Math.ceil(n*.5)));
         if(wantsTyped && selected.answer.length<=55)format='typed';
         else if(wantsOrder)format='tiles';
      }
      q=interactiveFromBank(selected,grade,area,skill,format);
   }else{
      const options=skillFormats(selected,area,skill,mode);
      let fmt=options.includes(preferred)?preferred:options.find(f=>f!=='choice'&&(f!=='compose'||mode!=='quiz'))||'choice';
      if(mode==='quiz'&&fmt==='compose')fmt='choice';
      q=interactiveFromBank(selected,grade,area,skill,fmt);
   }
   q.gradeBand=selected.grade;
   result.push(q);used.add(selected.id);history.push(selected.id);
   if(q.type==='choice')choiceCount++;
   candidatesByBand.set(band,candidatesByBand.get(band).filter(z=>z.id!==selected.id));
 }
 if(result.length<n)throw Error('Question bank exhausted: '+area+' / '+skill+' ('+grade+')');
 // Interleave bands instead of putting all higher grade items first.
 let mixed=[];const pools=bands.map(g=>shuffle(result.filter(q=>q.gradeBand===g)));
 while(mixed.length<result.length){for(let p of pools){if(p.length)mixed.push(p.shift())}}
 p.questionHistory[key]=history.slice(-Math.max(all.length,50)*3);
 return mixed;
}
function startQuizFromArea(){let s=$('#quizSkill').value;state.quizSize=+$('#quizLength').value;startSession(state.area,s==='all'?null:+s,'quiz',state.quizSize)}
function startSession(area,skill,mode,n){
 let p=active();if(!p){openProfiles();return}
 let total=n||(mode==='guided'?5:10),skills=skill===null?[0,1,2]:[skill];
 let perSkill=skills.map((sk,j)=>Math.floor(total/skills.length)+(j<total%skills.length?1:0));
 let questionBuckets=skills.map((sk,j)=>scheduleBankQuestions(area,sk,p.grade,info(area,sk).level,perSkill[j],new Set(),mode));
 let indices=skills.map(()=>0),questions=[];
 for(let i=0;i<total;i++){
   let j=i%skills.length,s=skills[j],q=questionBuckets[j][indices[j]++];
   if(!q)throw Error('Question pool exhausted for '+area+' / '+s);
   q.skill=s;questions.push(q);
 }
 persist();
 state.session={area,skill,mode,questions,index:0,responses:[],started:Date.now()};

 p.skills[key]=record;p.attempted++;p.correct+=+r.correct;p.xp+=r.correct?10:2;
 }}let graded=s.responses.filter(r=>!r.unscored),correct=graded.filter(r=>r.correct).length;

}
function resultsPage(){let s=state.session,p=active(),graded=s.responses.filter(r=>!r.unscored),c=graded.filter(r=>r.correct).length,w=s.responses.length-graded.length,pct=graded.length?Math.round(c/graded.length*100):null;
 return `<div class="practice"><div class="card" style="text-align:center"><div style="font-size:45px;margin-bottom:8px">${pct===null?'📝':pct>=80?'🏆':pct>=60?'🌟':'📘'}</div><div class="eyebrow">SESSION COMPLETE</div><h1 style="margin:9px 0;font-size:34px">${graded.length?`${c} / ${graded.length} correct`:'Self-review activity'}</h1>${w?`<p class="muted">${w} writing or revision ${w===1?'task':'tasks'} completed (not automatically graded).</p>`:''}<p class="muted">${pct===null?'Compare your revisions with the model examples and discuss alternatives with your teacher.':pct>=80?'Great progress! Keep growing your skills.':pct>=60?'Review the explanations below and keep practising.':'Review the explanations and try the lesson again.'}</p>${graded.length?progressBar(pct):''}<div class="actions" style="justify-content:center"><button class="btn outline" onclick="navigate('area','${s.area}')">Back to skills</button><button class="btn" onclick="startSession('${s.area}',${s.skill===null?'null':s.skill},'${s.mode}',${s.questions.length})">Try new questions</button></div></div><div class="card" style="margin-top:16px"><h2 style="margin-top:0">Answer review</h2>${s.responses.map((r,i)=>`<div class="result-item"><div class="between"><b>${i+1}. ${areaById(s.area).skills[r.question.skill]}</b><span class="tag" style="background:${r.unscored?'#f2f1ff':r.correct?'#e6f8ee':'#fff0ee'}">${r.unscored?'Self-review':r.correct?'✓ Correct':'Review'}</span></div><p>${r.question.type==='compose'?esc(r.question.task):r.question.prompt}</p><p class="small"><b>Your response:</b> ${esc(r.answer)}${r.unscored?(r.question.reviewOnly?`<br><b>Example revision:</b> ${esc(r.question.answer)}`:''):r.correct?'':`<br><b>Correct response:</b> ${esc(r.question.answer)}`}</p><p class="muted small">${esc(r.unscored?(r.question.reviewOnly?'More than one revision may be valid. '+r.question.explain:'Review your writing for clear ideas, specific details, and correct conventions.'):r.question.explain)}</p></div>`).join('')}</div></div>`;
}
function confirmExit(){if(confirm('Leave this activity? Unfinished questions will not be saved to your results.'))navigate('area',state.session.area)}
function studioPage(){let p=active();return `${header('Writing Studio','Plan, draft, revise, and save your own writing.',`<button class="btn small" onclick="newDraft()">+ New writing project</button>`)}<div class="card" style="margin-bottom:17px"><div class="between"><div><h3 style="margin:0 0 6px">Build your writing skills</h3><p class="muted small" style="margin:0">Short guided tasks prepare you for original writing.</p></div><button class="btn secondary small" onclick="navigate('area','writing')">Writing lessons →</button></div></div>${p.drafts.length?`<div class="grid">${p.drafts.slice().sort((a,b)=>b.updated-a.updated).map(d=>`<div class="card stack"><div class="between"><span class="tag">${esc(d.genre)} · Grade ${d.grade}</span><span class="tiny muted">${new Date(d.updated).toLocaleDateString()}</span></div><h3 style="margin:0">${esc(d.title||'Untitled draft')}</h3><div class="muted small" style="flex:1">${esc(d.body||'No writing yet').slice(0,125)}${d.body?.length>125?'…':''}</div><div class="between"><span class="tiny muted">${countWords(d.body)} words</span><button class="btn secondary small" onclick="openDraft('${d.id}')">Open draft →</button></div></div>`).join('')}</div>`:`<div class="card empty"><div style="font-size:46px">📝</div><h3>Your writing starts here</h3><p>Choose a writing style and a prompt. You can always come back to revise your draft.</p><button class="btn" onclick="newDraft()">Start your first project</button></div>`}<p class="footer-note">Writing drafts are stored locally on this device. Export important work as text files and back up profiles regularly.</p>`}
const CHECKS={narrative:['My story has a clear setting and characters.','The beginning introduces a situation or problem.','Events follow an understandable sequence.','I used specific details and varied sentences.','The ending connects to the story.'],opinion:['My opening clearly states my opinion or claim.','I gave at least two relevant reasons.','I explained or supported each reason with examples or evidence.','I considered the reader and used clear transitions.','My ending reinforces my main idea.'],informational:['My opening introduces the topic accurately.','I grouped related facts in logical paragraphs.','I explained ideas in clear, precise language.','I used transitions and checked factual claims.','My ending summarizes the main points.'],descriptive:['My writing focuses on a clear person, place, or object.','I included specific sensory details.','I chose precise nouns, verbs, and adjectives.','My details are arranged in a clear order.','My final sentences leave a strong impression.']};

const ADVANCED_CHECKS={
 narrative:['The central conflict develops through plausible choices and consequences.','Scenes include purposeful dialogue, imagery, or characterization.','I manage pacing, point of view, and transitions deliberately.','The ending resolves or deepens the central tension without contradicting earlier details.','I revised for sentence variety, precision, and consistent tone.'],
 opinion:['My thesis is focused, arguable, and appropriately qualified.','Each reason includes relevant support rather than unsupported certainty.','I address a plausible counterargument fairly and explain my response.','My transitions show the logic connecting claims and evidence.','My conclusion synthesizes the argument instead of simply repeating it.'],
 informational:['My explanation distinguishes facts, interpretations, and assumptions.','I organize ideas by meaningful relationships rather than a list of points.','Examples are specific, accurate, and clearly explained.','Where relevant, I acknowledge limits, perspectives, or uncertainty.','My technical vocabulary, syntax, and tone suit my audience.'],
 descriptive:['Details create a purposeful atmosphere rather than an adjective list.','I maintain an intentional point of view and consistent tone.','My word choices and imagery avoid clichés and vague expressions.','I vary sentence structure to control pace or emphasis.','The description communicates an implied idea or impression.']
};
function countWords(s){return (String(s||'').trim().match(/\b[\p{L}\p{N}]+(?:[’'-][\p{L}\p{N}]+)*/gu)||[]).length}
function newDraft(){state.modal='newdraft';render()}
function createDraft(){let p=active(),genre=$('#newGenre').value,title=$('#newTitle').value.trim(),prompt=$('#newPrompt').value;let d={id:'d'+Date.now()+'_'+rnd(9999),title:title||'My '+genre+' writing',genre,prompt,grade:p.grade,plan:['','',''],body:'',checks:[],created:Date.now(),updated:Date.now()};p.drafts.push(d);persist();state.modal=null;openDraft(d.id)}
function openDraft(id){state.draftKey=id;state.page='draft';state.modal=null;render();window.scrollTo(0,0)}
function currentDraft(){return active()?.drafts.find(d=>d.id===state.draftKey)}
function draftPage(){let d=currentDraft();if(!d)return studioPage();let questions=d.genre==='narrative'?['Who is involved? Where and when?','What problem or event happens?','How is the problem resolved?']:d.genre==='opinion'?['What is your main claim?','What reasons and evidence support it?','What should the reader conclude?']:d.genre==='informational'?['What is the main topic?','What facts or examples will you explain?','How will you organize and conclude?']:['What are you describing?','Which sensory details matter most?','What impression should remain?'];let checks=d.grade>=7?ADVANCED_CHECKS[d.genre]:CHECKS[d.genre];return `<div class="crumb"><button onclick="navigate('studio')">Writing Studio</button> › ${esc(d.title)}</div><div class="between" style="margin-bottom:16px"><div><div class="eyebrow">${d.genre.toUpperCase()} WRITING · GRADE ${d.grade}</div><h1 style="margin:4px 0 0;font-size:27px">${esc(d.title)}</h1></div><div class="row no-print"><button class="btn outline small" onclick="exportDraft()">Export .txt</button><button class="btn outline small" onclick="printDraft()">Print</button><button class="btn danger small" onclick="deleteDraft()">Delete</button></div></div><div class="split"><div class="stack"><div class="card"><div class="eyebrow">WRITING PROMPT</div><p style="line-height:1.7;margin:10px 0">${esc(d.prompt)}</p><div class="notice">${d.grade<=4?'Try writing a beginning, a middle, and an ending. Write complete sentences and add useful details.':d.grade<=6?'Develop an organized response with focused paragraphs, supporting details, and clear transitions.':'Build a focused, well-organized response with credible support, thoughtful transitions, and deliberate word choice.'}</div></div><div class="card"><div class="between"><h2 style="font-size:18px;margin:0">Plan your writing</h2><span class="tag">Step 1</span></div>${questions.map((q,i)=>`<label style="display:block;margin-top:14px"><div class="small" style="font-weight:750;margin-bottom:7px">${q}</div><textarea class="textarea" rows="2" data-plan="${i}" oninput="saveDraftField(this)" placeholder="Write your ideas here...">${esc(d.plan[i]||'')}</textarea></label>`).join('')}</div><div class="card"><div class="between"><h2 style="font-size:18px;margin:0">Your draft</h2><span class="tag">Step 2</span></div><p class="small muted">Write freely, then return to improve it. Changes save automatically.</p><textarea id="draftBody" class="editor" oninput="saveDraftField(this)" placeholder="Start writing here...">${esc(d.body)}</textarea><div class="between" style="margin-top:10px"><span class="small muted" id="draftCount">${countWords(d.body)} words · ${d.body.trim()?d.body.trim().split(/\n\s*\n/).length:0} paragraphs</span><span class="small muted" id="saveMessage">Saved on this device</span></div></div></div><aside class="stack"><div class="card"><div class="between"><h3 style="margin:0">Revision checklist</h3><span class="tag">Step 3</span></div><p class="muted small">Check each item when you've reviewed it.</p>${checks.map((c,i)=>`<label class="checkline"><input type="checkbox" ${d.checks.includes(i)?'checked':''} onchange="toggleDraftCheck(${i},this.checked)"><span>${c}</span></label>`).join('')}</div><div class="card"><h3 style="margin:0 0 12px">Writing tools</h3><button class="btn secondary" style="width:100%" onclick="runWritingReview()">Check basic mechanics</button><p class="muted tiny">These are simple checks, not an AI writing score. They may miss errors or flag intentional style choices.</p><div id="writingHints"></div></div><div class="card"><h3 style="margin:0 0 12px">Self-reflection</h3><p class="muted small">Reread your draft. What is one sentence you're proud of? What could be more specific or clearer?</p><button class="btn outline small" onclick="navigate('area','editing')">Practise revision skills →</button></div></aside></div><div class="printonly"><h2>${esc(d.title)}</h2><p>${esc(d.prompt)}</p><p style="white-space:pre-wrap">${esc(d.body)}</p></div>`}
function saveDraftField(el){let d=currentDraft();if(!d)return;if(el.id==='draftBody'){d.body=el.value;let count=$('#draftCount');if(count)count.textContent=`${countWords(d.body)} words · ${d.body.trim()?d.body.trim().split(/\n\s*\n/).length:0} paragraphs`;}else d.plan[+el.dataset.plan]=el.value;d.updated=Date.now();persist();let status=$('#saveMessage');if(status)status.textContent='Saved locally ✓'}
function toggleDraftCheck(i,yes){let d=currentDraft();d.checks=d.checks.filter(x=>x!==i);if(yes)d.checks.push(i);d.updated=Date.now();persist()}
function runWritingReview(){let d=currentDraft(),b=d.body||'',sentences=b.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean),notes=[];if(countWords(b)<35)notes.push('Consider adding more detail if your assignment calls for a developed response.');if(/\b(\w+)\s+\1\b/gi.test(b))notes.push('A word appears twice in a row. Check whether that was intentional.');if(/[!?.,]{3,}/.test(b))notes.push('Check repeated punctuation marks.');if(/ {2,}/.test(b))notes.push('Look for extra spaces between words.');if(sentences.some(s=>s.length>260))notes.push('At least one sentence is very long. Read it aloud to check clarity.');if(b.trim()&&!/[.!?]["”']?\s*$/.test(b.trim()))notes.push('The final sentence may need ending punctuation.');if(b.trim()&&/^[a-z]/.test(b.trim()))notes.push('Check capitalization at the beginning of your draft.');if(d.genre==='opinion'&&!/\b(because|since|therefore|for example|for instance)\b/i.test(b))notes.push('Consider connecting your argument to specific reasons or examples.');if(!notes.length)notes.push('No basic mechanical issues were detected. This is not a full grammar or quality assessment.');$('#writingHints').innerHTML=`<div class="notice" style="margin-top:12px"><b>Writing review</b><ul style="padding-left:18px;margin:8px 0 0">${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`}
function exportDraft(){let d=currentDraft();downloadText(`${d.title}\nGenre: ${d.genre}\nPrompt: ${d.prompt}\n\nPLANNING\n${d.plan.join('\n\n')}\n\nDRAFT\n${d.body}`,slug(d.title)+'.txt','text/plain;charset=utf-8')}
function printDraft(){let d=currentDraft();let w=window.open('','_blank');if(!w){toast('Please allow pop-ups to print this draft.');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(d.title)}</title><style>body{font-family:Arial;max-width:750px;margin:40px auto;line-height:1.8}pre{font:inherit;white-space:pre-wrap}</style></head><body><h1>${esc(d.title)}</h1><p><b>Prompt:</b> ${esc(d.prompt)}</p><hr><pre>${esc(d.body)}</pre></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
function deleteDraft(){if(!confirm('Delete this writing draft? This cannot be undone.'))return;active().drafts=active().drafts.filter(d=>d.id!==state.draftKey);persist();navigate('studio');toast('Draft deleted')}
function progressPage(){let p=active();let avg=Math.round(AREAS.reduce((s,a)=>s+areaMastery(a.id),0)/AREAS.length);return `${header('Progress & achievements','Your learning record is saved locally on this device.',`<button class="btn outline small" onclick="openSettings()">Manage data</button>`)}<div class="grid four"><div class="card stat"><div class="eyebrow">Questions attempted</div><strong>${p.attempted}</strong><p>All-time activity</p></div><div class="card stat"><div class="eyebrow">Questions correct</div><strong>${p.correct}</strong><p>${p.attempted?Math.round(100*p.correct/p.attempted):0}% accuracy</p></div><div class="card stat"><div class="eyebrow">Mastery</div><strong>${avg}%</strong><p>Average across all skills</p></div><div class="card stat"><div class="eyebrow">Practice points</div><strong>${p.xp}</strong><p>For effort and progress</p></div></div>${header('Mastery by learning area','Mastery grows as you answer questions correctly.') }<div class="grid two">${AREAS.map(a=>`<div class="card"><div class="between" style="margin-bottom:9px"><b>${a.icon} ${a.name}</b><span class="tag">${areaMastery(a.id)}%</span></div>${progressBar(areaMastery(a.id))}<div class="small muted" style="margin-top:8px">${a.skills.map((s,i)=>`${s}: ${info(a.id,i).mastery}%`).join(' · ')}</div></div>`).join('')}</div>${header('Recent sessions','Your latest completed practice activities and quizzes.') }<div class="card">${p.history.length?p.history.slice(0,20).map(h=>`<div class="result-item between"><div><b>${areaById(h.area)?.name||h.area}</b><div class="muted small">${new Date(h.date).toLocaleString()} · ${h.mode}</div></div><span class="tag">${h.correct}/${h.total} correct</span></div>`).join(''):'<div class="empty">No completed sessions yet. Try a lesson or practise a skill!</div>'}</div><p class="footer-note">Mastery is an in-app practice indicator, not a standardized assessment. Progress is stored in this browser and can be lost if site data is cleared.</p>`}
function downloadText(text,filename,mime){let blob=new Blob([text],{type:mime||'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function slug(s){return String(s||'writing').replace(/[^a-z0-9- ]/gi,'').trim().replace(/\s+/g,'_').slice(0,45)||'writing'}
function exportBackup(){downloadText(JSON.stringify({format:'writing-grammar-practice',version:2,exported:new Date().toISOString(),data:db},null,2),'Writing_Grammar_Practice_Backup.json','application/json;charset=utf-8');toast('Backup downloaded')}
function exportReport(){let rows=[['Student','Grade','Area','Skill','Attempts','Correct','Mastery','Level']];for(let p of db.profiles)for(let a of AREAS)for(let i=0;i<3;i++){let d=p.skills[skillKey(a.id,i)]||{};rows.push([p.name,p.grade,a.name,a.skills[i],d.attempts||0,d.correct||0,d.mastery||0,d.level||1])}downloadText(rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'Writing_Grammar_Progress_Report.csv','text/csv;charset=utf-8')}
function importBackup(input){let f=input.files?.[0];if(!f)return;f.text().then(text=>{let raw=JSON.parse(text);if(raw.format!=='writing-grammar-practice'||!Array.isArray(raw.data?.profiles))throw Error('Not a compatible backup');if(!confirm('Replace all local profiles with the profiles in this backup? Export your current data first if needed.'))return;db=raw.data;db.profiles=db.profiles.filter(p=>p&&typeof p.name==='string'&&p.skills&&Array.isArray(p.drafts));if(!db.profiles.some(p=>p.id===db.active))db.active=db.profiles[0]?.id||null;persist();state.modal=null;navigate('home');toast('Backup imported')}).catch(e=>toast('Import failed: '+e.message))}
function openProfiles(){state.modal='profiles';render()}
function openSettings(){state.modal='settings';render()}
function chooseProfile(id){db.active=id;persist();state.modal=null;navigate('home')}
function addProfile(){let name=$('#profileName')?.value.trim();let grade=+$('#profileGrade')?.value;if(!name){toast('Enter a student name.');return}if(!GRADES.includes(grade)){toast('Choose a grade from 3–9.');return}newProfile(name,grade);state.modal=null;navigate('home');toast('Profile created')}
function removeProfile(id){let p=db.profiles.find(x=>x.id===id);if(!p||!confirm(`Delete ${p.name}'s profile and all their saved work? This cannot be undone.`))return;db.profiles=db.profiles.filter(x=>x.id!==id);if(db.active===id)db.active=db.profiles[0]?.id||null;persist();state.modal=db.profiles.length?'profiles':'welcome';render()}
function changeGrade(){let p=active(),val=+$('#newGrade').value;if(!GRADES.includes(val))return;p.grade=val;persist();state.modal=null;navigate('home');toast('Grade updated. Existing progress retained.')}
function modal(){if(!state.modal)return '';let p=active();let html='';if(state.modal==='welcome'||state.modal==='profiles'){html=`<h2>${state.modal==='welcome'?'Create your learner profile':'Choose a learner'}</h2><p>Each student keeps their own progress and writing drafts on this device.</p>${db.profiles.length?`<div class="stack" style="margin-bottom:20px">${db.profiles.map(x=>`<div class="between" style="border:1px solid var(--line);border-radius:12px;padding:9px"><button class="btn secondary small" style="flex:1;justify-content:start" onclick="chooseProfile('${x.id}')">${esc(x.name)} · Grade ${x.grade}</button><button class="btn danger small" title="Delete profile" onclick="removeProfile('${x.id}')">✕</button></div>`).join('')}</div>`:''}<label class="small"><b>New student name</b><input id="profileName" class="input" maxlength="32" placeholder="First name or nickname" style="margin:6px 0 14px"></label><label class="small"><b>Grade</b><select id="profileGrade" class="select" style="margin-top:6px">${GRADES.map(g=>`<option value="${g}" ${g===5?'selected':''}>Grade ${g}</option>`).join('')}</select></label><div class="actions">${state.modal==='profiles'?'<button class="btn outline" onclick="closeModal()">Cancel</button>':''}<button class="btn" onclick="addProfile()">Create profile</button></div>`}
if(state.modal==='newdraft'){html=`<h2>New writing project</h2><p>Choose a writing style and prompt to begin planning.</p><label class="small"><b>Writing style</b><select id="newGenre" class="select" onchange="refreshPromptOptions()" style="margin:6px 0 14px"><option value="narrative">Narrative / story</option><option value="opinion">Opinion / argument</option><option value="informational">Informational / explanatory</option><option value="descriptive">Descriptive</option></select></label><label class="small"><b>Writing prompt</b><select id="newPrompt" class="select" style="margin:6px 0 14px">${writingPromptsFor('narrative',active().grade).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="small"><b>Project title (optional)</b><input id="newTitle" maxlength="80" class="input" placeholder="My new writing project" style="margin-top:6px"></label><div class="actions"><button class="btn outline" onclick="closeModal()">Cancel</button><button class="btn" onclick="createDraft()">Create draft →</button></div>`}
if(state.modal==='settings'){html=`<h2>Profiles & saved data</h2><p>Back up student work before clearing the browser, using a different computer, or reinstalling software.</p><div class="stack"><button class="btn secondary" onclick="exportBackup()">⬇ Export all profiles and drafts (.json)</button><button class="btn outline" onclick="exportReport()">⬇ Export teacher progress report (.csv)</button><label class="btn outline" style="cursor:pointer">⬆ Import a saved backup (.json)<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><label class="small"><b>Current student's grade</b><select id="newGrade" class="select" style="margin:8px 0">${GRADES.map(g=>`<option value="${g}" ${p.grade===g?'selected':''}>Grade ${g}</option>`).join('')}</select></label><div class="actions"><button class="btn outline" onclick="closeModal()">Close</button><button class="btn" onclick="changeGrade()">Save grade</button></div><p class="tiny muted">This application has no online account system or cloud synchronization. Data in one browser cannot be viewed automatically on another device.</p>`}
return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${state.modal==='newdraft'?'Create a writing draft':'Profile settings'}">${html}</div></div>`}
function refreshPromptOptions(){let v=$('#newGenre').value;$('#newPrompt').innerHTML=writingPromptsFor(v,active().grade).map(x=>`<option>${esc(x)}</option>`).join('')}
function closeModal(){if(state.modal==='welcome'&&!active())return;state.modal=null;render()}
function render(){let p=active();if(!p&&state.modal!=='welcome'&&state.modal!=='profiles')state.modal='welcome';let body=!p?`<div class="card empty" style="max-width:550px;margin:7vh auto"><div style="font-size:55px">✍️</div><h1>Welcome to Writing &amp; Grammar Practice</h1><p>36 skill pathways, interactive practice, and a personal writing studio for Grades 3–9.</p><button class="btn" onclick="state.modal='welcome';render()">Get started →</button></div>`:state.page==='home'?dashboard():state.page==='areas'?areasPage():state.page==='area'?areaPage():state.page==='lesson'?lessonPage():state.page==='session'&&state.session?sessionPage():state.page==='results'&&state.session?resultsPage():state.page==='studio'?studioPage():state.page==='draft'?draftPage():state.page==='progress'?progressPage():dashboard();$('#app').innerHTML=nav()+`<main class="main">${body}</main>`+modal()}
render();
</script></body></html>
