<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" role="img" aria-label="Application Cards">
  <rect width="800" height="445" rx="24" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#24313A">APPLICATION CARDS</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#667985">Transfer a concept beyond the example just taught</text>

  <g transform="rotate(-7 315 235)">
    <rect x="165" y="145" width="300" height="175" rx="18" fill="#F6F2FB" stroke="#7566A8" stroke-width="3"/>
    <text x="315" y="202" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#7566A8">WHAT DID WE LEARN?</text>
    <line x1="205" y1="232" x2="425" y2="232" stroke="#BCC8CD" stroke-width="3"/>
    <line x1="205" y1="258" x2="405" y2="258" stroke="#BCC8CD" stroke-width="3"/>
  </g>

  <g transform="rotate(7 485 235)">
    <rect x="335" y="145" width="300" height="175" rx="18" fill="#FBF3EC" stroke="#D6844B" stroke-width="3"/>
    <text x="485" y="202" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#D6844B">WHERE COULD IT APPLY?</text>
    <line x1="375" y1="232" x2="595" y2="232" stroke="#BCC8CD" stroke-width="3"/>
    <line x1="375" y1="258" x2="575" y2="258" stroke="#BCC8CD" stroke-width="3"/>
  </g>

  <g>
    <rect x="250" y="170" width="300" height="175" rx="18" fill="#EDF6F7" stroke="#2A7F8E" stroke-width="4"/>
    <text x="400" y="225" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#2A7F8E">USE IT IN A NEW SITUATION</text>
    <text x="400" y="253" text-anchor="middle" font-family="Arial" font-size="12" fill="#667985">Explain how the idea transfers.</text>
    <line x1="295" y1="287" x2="505" y2="287" stroke="#AFC0C6" stroke-width="3"/>
    <line x1="315" y1="312" x2="485" y2="312" stroke="#AFC0C6" stroke-width="3"/>
  </g>
</svg>
