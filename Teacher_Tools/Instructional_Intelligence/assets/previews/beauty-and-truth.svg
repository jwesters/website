<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 445" role="img" aria-labelledby="title desc">
<title id="title">Beauty and Truth Venn diagram</title><desc id="desc">Two visibly overlapping circles labeled Beauty and Truth with a distinct lavender intersection labeled Reveal and Conceal.</desc>
<rect width="800" height="445" rx="24" fill="#ffffff"/>
<defs><clipPath id="leftCircle"><circle cx="335" cy="220" r="140"/></clipPath></defs>
<circle cx="335" cy="220" r="140" fill="#EFF7F8" stroke="#2A7F8E" stroke-width="3"/>
<circle cx="465" cy="220" r="140" fill="#FBF4EE" stroke="#D6844B" stroke-width="3"/>
<circle cx="465" cy="220" r="140" fill="#E9E4F5" clip-path="url(#leftCircle)"/>
<!-- redraw outlines so both boundaries remain visible -->
<circle cx="335" cy="220" r="140" fill="none" stroke="#2A7F8E" stroke-width="3"/>
<circle cx="465" cy="220" r="140" fill="none" stroke="#D6844B" stroke-width="3"/>
<text x="265" y="125" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#2A7F8E" text-anchor="middle">BEAUTY</text>
<text x="535" y="125" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#D6844B" text-anchor="middle">TRUTH</text>
<text x="400" y="208" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#7566A8" text-anchor="middle">REVEAL?</text>
<text x="400" y="238" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#7566A8" text-anchor="middle">CONCEAL?</text>
</svg>