<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clickable AAC Word Board</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #5b6472;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      width: min(100%, 1000px);
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      padding: 14px;
    }
    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(20px, 3vw, 30px);
      margin: 0;
      line-height: 1.1;
    }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button.control {
      font-size: 15px;
      border: 1px solid #cfd6e0;
      border-radius: 10px;
      padding: 9px 11px;
      background: white;
    }
    button.control { cursor: pointer; }
    button.control:hover { border-color: var(--accent); }
    .spoken {
      min-height: 42px;
      border: 1px solid #d7dde6;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 700;
      display: flex;
      align-items: center;
      color: #111827;
      background: #f9fafb;
    }
    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 861px;
      margin: 0 auto;
      border: 2px solid #111;
      overflow: hidden;
      background: #fff;
      touch-action: manipulation;
    }
    .board-wrap img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .tile {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      margin: 0;
      border-radius: 8px;
    }
    .tile:focus-visible {
      outline: 4px solid rgba(37,99,235,.95);
      outline-offset: -5px;
    }
    .tile.active {
      box-shadow: inset 0 0 0 5px rgba(37,99,235,.75), 0 0 0 9999px rgba(255,255,255,.05);
      background: rgba(37,99,235,.08);
    }
    .note {
      margin: 10px 2px 0;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      body { padding: 8px; align-items: flex-start; }
      main { padding: 10px; border-radius: 14px; }
      .topbar { gap: 8px; }
      .controls { width: 100%; }
      select, button.control { flex: 1; min-width: 120px; }
      .spoken { min-height: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>Clickable AAC Word Board</h1>
      <div class="controls">
        <select id="voiceSelect" aria-label="Voice selection"><option value="">Default voice</option></select>
        <button class="control" id="replayBtn" type="button">Replay</button>
        <button class="control" id="clearBtn" type="button">Clear</button>
      </div>
    </div>
    <div class="spoken" id="spoken">Click a word to hear it.</div>
    <div class="board-wrap" id="board" aria-label="AAC board. Click a word to hear it spoken.">

<script>
(function() {
  const synth = window.speechSynthesis;
  const spoken = document.getElementById('spoken');
  const voiceSelect = document.getElementById('voiceSelect');
  const replayBtn = document.getElementById('replayBtn');
  const clearBtn = document.getElementById('clearBtn');
  const tiles = Array.from(document.querySelectorAll('.tile'));
  let lastWord = '';
  let voices = [];

  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices();
    const current = voiceSelect.value;
    voiceSelect.innerHTML = '<option value="">Default voice</option>';
    voices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = `${voice.name} (${voice.lang})`;
      voiceSelect.appendChild(option);
    });
    voiceSelect.value = current;
  }

  function speak(word) {
    lastWord = word;
    spoken.textContent = word;
    tiles.forEach(t => t.classList.toggle('active', t.dataset.word === word));
    window.setTimeout(() => tiles.forEach(t => t.classList.remove('active')), 450);

    if (!synth) {
      spoken.textContent = word + ' — speech is not supported in this browser.';
      return;
    }
    synth.cancel();
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.rate = 0.88;
    utterance.pitch = 1;
    utterance.volume = 1;
    const selectedIndex = voiceSelect.value;
    if (selectedIndex !== '' && voices[Number(selectedIndex)]) {
      utterance.voice = voices[Number(selectedIndex)];
    }
    synth.speak(utterance);
  }

  tiles.forEach(tile => {
    tile.addEventListener('click', () => speak(tile.dataset.word));
  });

  replayBtn.addEventListener('click', () => {
    if (lastWord) speak(lastWord);
  });

  clearBtn.addEventListener('click', () => {
    if (synth) synth.cancel();
    lastWord = '';
    spoken.textContent = 'Click a word to hear it.';
    tiles.forEach(t => t.classList.remove('active'));
  });

  if (synth) {
    loadVoices();
    synth.onvoiceschanged = loadVoices;
  } else {
    voiceSelect.disabled = true;
  }
})();
</script>
