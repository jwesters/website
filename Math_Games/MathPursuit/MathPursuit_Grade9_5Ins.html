const THEME_KEY='math-pursuit-theme';const COLORS=['#ff7680','#7cdaff','#ffe17b','#c9a2ff','#9df4b3'];const KEY='math-pursuit-grade9-v1';let s=null,sound=true,actx=null;

// Display simple numeric fractions vertically, without changing the raw answer format used for marking.
function mathHTML(value){return esc(value).replace(/(^|[^\w/])(-?\d+)\/(\d+)(?![\w/])/g,(_whole,prefix,num,den)=>`${prefix}<span class="math-frac" role="math" aria-label="${num} over ${den}"><span class="num">${num}</span><span class="den">${den}</span></span>`)}

function table(m,b){let v=R(-2,0);return '<table style="border-collapse:collapse;background:white;color:#172b40;margin:10px 0"><tr><th style="padding:7px 18px;border:1px solid #789">x</th><th style="padding:7px 18px;border:1px solid #789">y</th></tr>'+[v,v+1,v+2,v+3].map(x=>`<tr><td style="padding:6px 18px;border:1px solid #789">${x}</td><td style="padding:6px 18px;border:1px solid #789">${m*x+b}</td></tr>`).join('')+'</table>'}
function q(prompt,value,steps,visual='',mode='auto',accept=null){return{prompt,value:String(value),steps,visual,mode,accept}}
// Grade 9 question generators: five Ins from the source app. Randomized values on each draw.
// Keep raw answer strings for grading and convert numeric fractions only when displayed.
function signedTerm(n){return n<0?'− '+(-n):'+ '+n}
function fractionQ(prompt,n,d,steps){let g=gcd(n,d),nn=n/g,dd=d/g;if(dd<0){nn=-nn;dd=-dd}return q(prompt,frac(n,d),steps,'','auto',{n:nn,d:dd})}
function choiceQ(prompt,answer,options,steps,visual=''){return {...q(prompt,answer,steps,visual),type:'mc',opts:shuffle([...new Set([answer,...options,'Cannot be determined','None of these'])].slice(0,4))}}
function generate(cat){let a,b,c,d,k,n,den,ans,visual;switch(cat){
case 0:{k=R(0,9);
 if(k===0){a=R(2,12);b=R(2,9);c=R(1,14);return q(`Evaluate ${a} + ${b} × ${c}.`,a+b*c,[`BEDMAS: multiply before adding.`,`Multiply ${b} × ${c} = ${b*c}.`,`Add ${a} + ${b*c} = ${a+b*c}.`])}
 if(k===1){a=R(3,16);b=R(2,10);c=R(2,8);return q(`Evaluate (${a} + ${b}) × ${c}.`,(a+b)*c,[`Brackets come first: ${a} + ${b} = ${a+b}.`,`Then multiply ${a+b} × ${c} = ${(a+b)*c}.`])}
 if(k===2){a=R(2,7);b=R(2,3);c=R(2,9);return q(`Evaluate ${a}${b===2?'²':'³'} − ${c}.`,a**b-c,[`Evaluate the exponent first: ${a}${b===2?'²':'³'} = ${a**b}.`,`Subtract ${c}: ${a**b} − ${c} = ${a**b-c}.`])}
 if(k===3){a=R(2,9);b=R(2,10);c=R(2,8);return q(`Evaluate ${a*b} ÷ ${a} + ${c} × 2.`,b+c*2,[`Multiplication and division are handled before addition, from left to right.`,`${a*b} ÷ ${a} = ${b}; ${c} × 2 = ${c*2}.`,`Add ${b} + ${c*2} = ${b+c*2}.`])}
 if(k===4){a=R(2,12);b=R(2,9);return q(`A number is tripled, then ${b} is added. The original number is ${a}. What is the result?`,3*a+b,[`Tripled means multiply by 3.`,`Calculate 3 × ${a} + ${b} = ${3*a+b}.`])}
 if(k===5)return choiceQ('Which operation is indicated by the word “quotient”?','Division',['Multiplication','Subtraction','Addition'],['A quotient is the result of division.']);
 if(k===6)return choiceQ('Which operation is indicated by “the difference between” two numbers?','Subtraction',['Addition','Division','Multiplication'],['Difference refers to subtraction.']);
 if(k===7)return choiceQ('In BEDMAS, what do you calculate first in 6 + (8 − 3) × 2?','8 − 3',['6 + 8','3 × 2','6 + 5'],['Calculate the expression inside brackets first: 8 − 3 = 5.']);
 if(k===8){a=R(2,8);b=R(2,8);return choiceQ(`Which expression means “${a} more than the product of ${b} and 4”?`,`${b} × 4 + ${a}`,[`${a} × ${b} + 4`,`${a} + ${b} + 4`,`${b} × (${a} + 4)`],[`Product means multiply: ${b} × 4.`,`More than means add ${a}.`])}
 a=R(2,7);b=R(2,6);c=R(2,7);return q(`Evaluate ${a} × (${b} + ${c}) − ${a}².`,a*(b+c)-a*a,[`Evaluate brackets: ${b} + ${c} = ${b+c}.`,`Calculate the exponent: ${a}² = ${a*a}.`,`Multiply, then subtract: ${a*(b+c)} − ${a*a} = ${a*(b+c)-a*a}.`])}
case 1:{k=R(0,7);a=R(1,9);b=R(a+1,12);c=R(1,9);d=R(c+1,12);if(R(0,1))a=-a;if(R(0,1))c=-c;
 if(k===0||k===1){let minus=k===1;n=a*d+(minus?-c*b:c*b);den=b*d;return fractionQ(`Calculate ${a}/${b} ${minus?'−':'+'} ${c}/${d}. Give a simplified answer.`,n,den,[`Find a common denominator: ${b} × ${d} = ${den}.`,`Rewrite: ${a*d}/${den} ${minus?'−':'+'} ${c*b}/${den}.`,`Combine numerators: ${n}/${den}.`,`Reduce to ${frac(n,den)}.`])}
 if(k===2||k===3){n=a*c;den=b*d;return fractionQ(`Multiply ${a}/${b} × ${c}/${d}. Simplify.`,n,den,[`Multiply numerators: ${a} × ${c} = ${n}.`,`Multiply denominators: ${b} × ${d} = ${den}.`,`Reduce ${n}/${den} to ${frac(n,den)}.`])}
 if(k===4||k===5){n=a*d;den=b*c;return fractionQ(`Divide ${a}/${b} ÷ ${c}/${d}. Simplify.`,n,den,[`Keep the first fraction and multiply by the reciprocal of the second.`,`(${a}/${b}) × (${d}/${c}) = ${n}/${den}.`,`Reduce to ${frac(n,den)}.`])}
 if(k===6){let m=R(2,6),p=R(2,8),z=R(2,9),sign=R(0,1)?-1:1;return fractionQ(`Reduce ${sign*m*p}/${m*z} to lowest terms.`,sign*p,z,[`Both terms have a common factor of ${m}.`,`Divide numerator and denominator by ${m}.`,`The simplified result is ${frac(sign*p,z)}.`])}
 n=a*d-c*b;den=b*d;return fractionQ(`Find the difference between ${a}/${b} and ${c}/${d} (first minus second).`,n,den,[`Use denominator ${den}.`,`Subtract numerators: ${a*d} − (${c*b}) = ${n}.`,`Simplify ${n}/${den} to ${frac(n,den)}.`])}
case 2:{k=R(0,10);a=R(2,12);b=R(2,10);c=R(2,9);
 if(k===0)return q(`Find the area of a rectangle measuring ${a} cm by ${b} cm.`,a*b,[`A = length × width.`,`A = ${a} × ${b} = ${a*b} cm².`]);
 if(k===1)return q(`Find the area of a triangle with base ${a} cm and perpendicular height ${b} cm.`,a*b/2,[`A = base × height ÷ 2.`,`A = ${a} × ${b} ÷ 2 = ${fmt(a*b/2)} cm².`]);
 if(k===2)return q(`Find the area of a parallelogram with base ${a} cm and perpendicular height ${b} cm.`,a*b,[`A = base × perpendicular height.`,`A = ${a} × ${b} = ${a*b} cm².`]);
 if(k===3)return q(`Find the area of a trapezoid with parallel bases ${a} cm and ${b} cm and perpendicular height ${c} cm.`,(a+b)*c/2,[`A = (b₁ + b₂) × h ÷ 2.`,`A = (${a} + ${b}) × ${c} ÷ 2 = ${fmt((a+b)*c/2)} cm².`]);

function fractionVisual(prompt){
 let pairs=[...prompt.matchAll(/(-?\d+)\/(\d+)/g)].slice(0,2);
 if(!pairs.length)return '';
 let strips=pairs.map((m)=>{let n=Number(m[1]),d=Number(m[2]);if(d>16||d<=0)return '';
 let bits=Array.from({length:d},(_,i)=>`<span class="strip-cell ${i<Math.min(Math.abs(n),d)?'filled':''}"></span>`).join('');
 return `<div class="strip"><div class="strip-label">${mathHTML(m[0])}</div><div class="strip-track" style="grid-template-columns:repeat(${d},1fr)">${bits}</div></div>`;
 }).join('');
 let note=pairs.some(m=>Math.abs(Number(m[1]))>Number(m[2]))?'Shading shows up to one whole; improper fractions may extend beyond the strip.':pairs.some(m=>Number(m[1])<0)?'Shading shows the magnitude; a minus sign indicates a negative value.':'Each strip represents one whole.';

}
function numberLine(values){

 const X=v=>42+(v-lo)/(hi-lo)*286;
 let ticks='';for(let i=0;i<=4;i++){let v=lo+(hi-lo)*i;ticks+=`<path d="M${X(v)} 66v12" stroke="#3a5b7d" stroke-width="1.5"/><text x="${X(v)}" y="94" fill="#213b54" font-size="11" text-anchor="middle">${fmt(v)}</text>`}
 let pts=values.map((v,i)=>`<circle cx="${X(v)}" cy="70" r="6" fill="${['#da515d','#2378ba','#269b72','#b68320'][i%4]}" stroke="white" stroke-width="1.5"/><text x="${X(v)}" y="${i%2?48:38}" fill="#173552" font-size="13" font-weight="700" text-anchor="middle">${fmt(v)}</text>`).join('');

}
function expressionVisual(prompt){let expression=prompt.match(/(?:Evaluate |first in )(.*?)(?:\.|\?|$)/i)?.[1];if(!expression)return visualCard('Order of operations',`<div class="math-tiles"><div class="math-tile accent">B</div><div class="math-tile">E</div><div class="math-tile">D</div><div class="math-tile">M</div><div class="math-tile">A</div><div class="math-tile">S</div></div>`,'Brackets · Exponents · Division/Multiplication · Addition/Subtraction');

function relationVisual(prompt){let m=prompt.match(/y\s*=\s*(-?\d+)x\s*([+−-])\s*(\d+)/);if(m){let a=Number(m[1]),b=Number(m[3])*(m[2]==='+'?1:-1);return visualCard('Equation · graph',graph(a,b),'Use the line, coordinates, and y-intercept to reason about the rule.');}

function enrichVisual(obj,cat){if(obj.visual){if(!obj.visual.includes('math-visual'))obj.visual=visualCard('Read the visual',obj.visual);return obj;}

}

function optionize(obj){if(obj.type==='mc')return obj;
 if(obj.mode==='relation'){let {m,b}=obj.accept,opts=[obj.value,`y=${m+1}x${b<0?b:'+'+b}`,`y=${-m}x${b<0?b:'+'+b}`,`y=${m}x${b+1<0?b+1:'+'+(b+1)}`];return {...obj,type:'mc',opts:shuffle([...new Set(opts)])}}
 if(obj.accept&&obj.accept.pi)return obj;
 if(obj.accept&&obj.accept.d){let n=obj.accept.n,d=obj.accept.d;let opts=[obj.value,frac(n+1,d),frac(n-1,d),frac(n,d+1),frac(-n,d)];return {...obj,type:'mc',opts:shuffle([...new Set(opts)].slice(0,4))}}

 let opts=[correct,fmt(n+1),fmt(n-1),fmt(n+(n===0?3:Math.max(2,Math.abs(n)/2)))];opts=[...new Set(opts)];while(opts.length<4)opts.push(fmt(n+opts.length+2));return {...obj,type:'mc',opts:shuffle(opts.slice(0,4))}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function freshQ(cat){let obj=enrichVisual(generate(cat),cat);if(obj.type==='mc')return obj;if(Math.random()<.5){let o=optionize(obj);if(o.type==='mc'&&o.opts?.length===4)return o}return {...obj,type:'short'}}
function norm(v){return String(v).toLowerCase().replace(/[,\s]/g,'').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/\*/g,'').replace(/\+/g,'+').trim()}
function numericInput(v){let raw=String(v).trim().replace(/[−–]/g,'-');let mixed=/^([+-]?\d+)\s+(\d+)\/(\d+)$/.exec(raw);if(mixed){let whole=Number(mixed[1]),num=Number(mixed[2]),den=Number(mixed[3]);return den?whole+Math.sign(whole||1)*num/den:NaN}let f=/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/.exec(raw);if(f){let den=Number(f[2]);return den?Number(f[1])/den:NaN}let x=Number(raw);return raw&&Number.isFinite(x)?x:NaN}
function valid(q,v){if(!String(v).trim())return false;
 if(q.accept?.pi){let t=norm(v);return t===norm(q.value)||Math.abs(numericInput(v)-q.accept.pi*Math.PI)<.02}
 if(q.accept?.m!==undefined){return norm(v)===norm(q.value)||norm(v)===norm(`y=${q.accept.m}x${q.accept.b<0?q.accept.b:'+'+q.accept.b}`)}
 if(q.accept?.d){let n=numericInput(v);return Number.isFinite(n)&&Math.abs(n-q.accept.n/q.accept.d)<1e-8}
 let a=numericInput(v),b=numericInput(q.value);return Number.isFinite(a)&&Number.isFinite(b)?Math.abs(a-b)<1e-7:norm(v)===norm(q.value)}
// Circular board: 30 ring spaces, five wedges every six spaces; five radial spokes, two inner spaces each, centre.
const N=30,WEDGES=[0,6,12,18,24];const nodes=[];for(let i=0;i<N;i++)nodes.push({id:'r'+i,kind:WEDGES.includes(i)?'wedge':'ring',cat:Math.floor(i/6),angle:-Math.PI/2+i*2*Math.PI/N,r:290});for(let k=0;k<5;k++)for(let depth=1;depth<=2;depth++)nodes.push({id:'s'+k+'-'+depth,kind:'spoke',cat:k,angle:-Math.PI/2+k*2*Math.PI/5,r:290-depth*84});nodes.push({id:'hub',kind:'hub',r:0,cat:-1});const byid=Object.fromEntries(nodes.map(n=>[n.id,n]));function xy(n){return{x:350+(n.r||0)*Math.cos(n.angle||0),y:350+(n.r||0)*Math.sin(n.angle||0)}}

function canWin(){return s.players[s.turn].wedges.every(Boolean)}
function getReachable(start,steps){let result=new Set();function walk(id,previous,left){if(left===0){result.add(id);return}for(let next of neighbors(id)){if(next!==previous)walk(next,id,left-1)}}walk(start,null,steps);return [...result]}
function themeColor(name){return getComputedStyle(document.body).getPropertyValue(name).trim()||getComputedStyle(document.documentElement).getPropertyValue(name).trim()}
function drawBoard(){let svg=$('board');let content=`<defs><radialGradient id="inner"><stop stop-color="${themeColor('--board-light')}"/><stop offset="1" stop-color="${themeColor('--board-core')}"/></radialGradient></defs><circle cx="350" cy="350" r="334" fill="url(#inner)" stroke="${themeColor('--board-outline')}" stroke-width="4"/>`;for(let i=0;i<N;i++){let a=byid['r'+i],b=byid['r'+((i+1)%N)],p=xy(a),z=xy(b);content+=`<line x1="${p.x}" y1="${p.y}" x2="${z.x}" y2="${z.y}" stroke="${themeColor('--board-route')}" stroke-width="28"/>`}for(let k=0;k<5;k++){let p=xy(byid['r'+k*6]);content+=`<line x1="350" y1="350" x2="${p.x}" y2="${p.y}" stroke="#56718f" stroke-width="34"/>`}let reachable=s&&s.phase==='choose'?s.reachable:[];for(let n of nodes){let p=xy(n),active=reachable.includes(n.id),fill=n.kind==='hub'?'#ffe4a1':CATS[n.cat].color,size=n.kind==='wedge'?22:n.kind==='hub'?38:13;content+=`<g class="space" data-id="${n.id}"><circle cx="${p.x}" cy="${p.y}" r="${size+3}" fill="${active?'#fff7b9':'#0b1c30'}"/><circle cx="${p.x}" cy="${p.y}" r="${size}" fill="${fill}" stroke="${active?'#fff':'#152238'}" stroke-width="${active?4:2}" opacity="${active?1:n.kind==='wedge'?1:.88}"/>${n.kind==='wedge'?`<text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="17" font-weight="900" fill="#102031">★</text>`:''}${n.kind==='hub'?`<text x="350" y="356" text-anchor="middle" font-size="15" font-weight="900" fill="#182333">FINAL</text>`:''}${active?`<circle cx="${p.x}" cy="${p.y}" r="${size+8}" fill="none" stroke="#fff6a5" stroke-width="2" stroke-dasharray="4 3"/>`:''}</g>`}if(s)for(let i=0;i<s.players.length;i++){let pl=s.players[i],p=xy(byid[pl.pos]),same=s.players.filter(v=>v.pos===pl.pos),idx=same.indexOf(pl),angle=idx*2*Math.PI/same.length,off=same.length===1?0:13;content+=`<g class="token"><circle cx="${p.x+Math.cos(angle)*off}" cy="${p.y+Math.sin(angle)*off}" r="9" fill="${COLORS[i]}" stroke="#fff" stroke-width="2.3"/><text x="${p.x+Math.cos(angle)*off}" y="${p.y+Math.sin(angle)*off+3.5}" text-anchor="middle" font-size="10" font-weight="900" fill="#172235">${i+1}</text></g>`}svg.innerHTML=content}
function renderPlayers(){ $('players').innerHTML=s.players.map((p,i)=>`<div class="player ${i===s.turn?'active':''}"><div class="pname"><span style="color:${COLORS[i]}">●</span> ${esc(p.name)}</div><div class="small">${p.wedges.filter(Boolean).length}/5 wedges ${p.pos==='hub'?'· Hub':''}</div><div class="wedges">${p.wedges.map((v,k)=>`<div class="wedge ${v?'earned':''}" title="${esc(CATS[k].name)}" style="background:${CATS[k].color}"></div>`).join('')}</div></div>`).join('')}
function render(){if(!s)return;$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('legend').innerHTML=CATS.map(c=>`<div><span style="background:${c.color}"></span>${esc(c.name)}</div>`).join('');renderPlayers();drawBoard();let p=s.players[s.turn];$('status').textContent=s.phase==='won'?`${p.name} wins!`:`${p.name}'s turn`;let c='';if(s.phase==='roll'){c=`<button class="primary" id="roll">🎲 Roll die</button>`}else if(s.phase==='choose'){c=`<div class="actions"><span class="dice">${s.die}</span><button id="reroute">Show available spaces</button></div>`}else if(s.phase==='question'){c=`<span class="pill">${esc(CATS[s.qcat]?.name||'Final Challenge')}</span>`}else if(s.phase==='result'){c=`<span class="pill">${s.correct?'Correct':'Incorrect'}</span>`}else if(s.phase==='won'){c=`<button class="primary" id="again">New game</button>`}$('turnControls').innerHTML=c;if($('roll'))$('roll').onclick=roll;if($('again'))$('again').onclick=newGame;if($('reroute'))$('reroute').onclick=()=>drawBoard();renderQuestion()}
function renderQuestion(){let box=$('qPanel');if(s.phase==='roll'||s.phase==='choose'){box.innerHTML='';box.classList.add('hidden');return}box.classList.remove('hidden');if(s.phase==='won'){box.innerHTML=`<h2>🏆 ${esc(s.players[s.turn].name)} wins!</h2><p>All five categories mastered and final question answered correctly.</p><button id="winNew" class="primary">Play again</button>`;$('winNew').onclick=newGame;return}let q=s.question,cat=s.qcat<0?'Final Challenge':CATS[s.qcat].name;let html=`<span class="pill">${esc(cat)}</span><h2>${s.qcat<0?'The final question':'Math challenge'}</h2><div class="prompt">${mathHTML(q.prompt)}</div>${q.visual||''}`;if(s.phase==='question'){if(q.type==='mc')html+=`<div class="choices">${q.opts.map((x,i)=>`<label><input type="radio" name="choice" value="${esc(x)}"><span><b>${'ABCD'[i]})</b> ${mathHTML(x)}</span></label>`).join('')}</div>`;else html+=`<input id="response" class="answer" aria-label="Your answer" autocomplete="off" placeholder="Enter your answer (e.g. 3/4, 12, 25pi)"><p class="small">For fractions, type a/b or a mixed number. For exact circle answers, use pi.</p>`;html+=`<div class="actions" style="margin-top:13px"><button class="primary" id="submit">Check answer</button></div><div class="small" id="error" role="alert" style="margin-top:8px"></div>`}else{html+=`<div class="feedback ${s.correct?'good':'bad'}"><strong>${s.correct?'✓ Correct!':'✗ Not quite.'}</strong><div>Your answer: <b>${mathHTML(s.response)}</b></div><div>Correct answer: <b>${mathHTML(q.value)}</b></div><ol>${q.steps.map(x=>`<li>${mathHTML(x)}</li>`).join('')}</ol></div><div class="override"><b>Teacher override</b><p class="small">Use this for equivalent responses or a marking correction. This changes the awarded turn/wedge.</p><div class="actions"><button id="markRight" ${s.correct?'disabled':''}>Mark correct ✓</button><button id="markWrong" ${!s.correct?'disabled':''}>Mark incorrect ✗</button></div></div><div class="actions" style="margin-top:14px"><button class="primary" id="continue">${s.correct?'Continue / extra turn →':'Next player →'}</button></div>`}box.innerHTML=html;if($('submit'))$('submit').onclick=submit;if($('response'))$('response').onkeydown=e=>{if(e.key==='Enter')submit()};if($('markRight'))$('markRight').onclick=()=>override(true);if($('markWrong'))$('markWrong').onclick=()=>override(false);if($('continue'))$('continue').onclick=continueGame}
function roll(){if(s.phase!=='roll')return;s.die=R(1,6);s.reachable=getReachable(s.players[s.turn].pos,s.die);s.phase='choose';beep();save();render()}
$('board').addEventListener('click',e=>{let n=e.target.closest('[data-id]');if(!n||!s||s.phase!=='choose'||!s.reachable.includes(n.dataset.id))return;let id=n.dataset.id,p=s.players[s.turn];p.pos=id;if(id==='hub'&&p.wedges.every(Boolean)){s.qcat=-1;s.final=true}else{s.qcat=byid[id].cat;s.final=false}if(id==='hub'&&!s.final){ // Centre is a passageway before completion; choose a random category.
s.qcat=R(0,4)}s.question=freshQ(s.qcat<0?R(0,4):s.qcat);s.phase='question';s.response='';save();beep();render()});
function submit(){if(s.phase!=='question')return;let q=s.question,v=q.type==='mc'?document.querySelector('input[name="choice"]:checked')?.value:$('response')?.value;if(!v||!String(v).trim()){$('error').textContent='Please select or enter an answer before submitting.';return}s.response=String(v).trim();s.correct=valid(q,v);s.phase='result';beep(s.correct);save();render()}
function override(value){if(s.phase!=='result')return;s.correct=value;beep(value);save();render()}
function continueGame(){if(s.phase!=='result')return;let p=s.players[s.turn];if(s.correct){if(s.final){s.phase='won';save();beep();render();return}let node=byid[p.pos];if(node.kind==='wedge')p.wedges[node.cat]=true;s.phase='roll'}else{s.turn=(s.turn+1)%s.players.length;s.phase='roll'}s.question=null;s.final=false;s.reachable=[];save();render()}
function createEntries(){let n=+$('count').value;$('entries').innerHTML=Array.from({length:n},(_,i)=>`<div class="player-entry"><span class="dot" style="background:${COLORS[i]}"></span><input maxlength="22" id="name${i}" aria-label="Player ${i+1} name" placeholder="Player ${i+1}" value="Player ${i+1}"></div>`).join('')}
function start(){let n=+$('count').value;s={players:Array.from({length:n},(_,i)=>({name:$('name'+i).value.trim()||'Player '+(i+1),pos:'hub',wedges:[false,false,false,false,false]})),turn:0,phase:'roll',die:null,reachable:[],question:null,qcat:0,response:'',correct:false,final:false,calculator:$('calculator').value};save();render()}
function showDialog(html){$('modal').innerHTML=html;$('modalBack').classList.remove('hidden');$('modal').querySelector('button')?.focus()}
function closeDialog(){$('modalBack').classList.add('hidden');$('modal').innerHTML=''}
function showRules(){showDialog(`<h2>How to play</h2><p>Everyone plays on the same device. There are no computer players, and there is no question timer.</p><div class="modal-rule"><strong>1 · Roll and move</strong>Roll the die, then click a highlighted destination. Move exactly the number rolled, without immediately reversing direction. At a junction, choose your route.</div><div class="modal-rule"><strong>2 · Answer a math question</strong>Questions match the colour of the space. Answer multiple-choice or typed questions. A correct answer gives you another turn; a wrong answer passes play to the next player.</div><div class="modal-rule rule-visual"><span class="rule-star">★</span><span><strong>3 · Collect wedges</strong>Land on one of the five large coloured star spaces and answer correctly to earn its wedge. Get all five colours.</span></div><div class="modal-rule"><strong>4 · Win at the centre</strong>Return to the central hub after collecting all five wedges and correctly answer a final math question to win.</div><p><strong>Calculator:</strong> ${s?(s.calculator==='yes'?'Allowed':'Not allowed'):'Selected when starting a game'} · <strong>Timer:</strong> None</p><p class="small">The teacher can override an automatic marking decision after each answer. Your game is saved automatically in this browser. Use the theme and sound buttons in the header.</p><div class="modal-actions"><button class="primary" id="closeRules">Close help</button></div>`);$('closeRules').onclick=closeDialog}
function askConfirm(message,onYes){showDialog(`<h2>Start a new game?</h2><p>${esc(message)}</p><p class="small">Your existing saved game will be replaced. This cannot be undone.</p><div class="modal-actions"><button id="cancelNew">Cancel</button><button id="confirmNew" class="danger">Start new game</button></div>`);$('cancelNew').onclick=closeDialog;$('confirmNew').onclick=()=>{closeDialog();onYes()}}
function openSetup(){s=null;$('game').classList.add('hidden');$('setup').classList.remove('hidden');createEntries();resumePrompt()}
function newGame(){if(s||localStorage.getItem(KEY)){askConfirm('Replace your current saved game and return to the setup screen?',()=>{localStorage.removeItem(KEY);openSetup()})}else openSetup()}
function resumePrompt(){let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}$('resumeArea').innerHTML=old?.players?.length?'<hr style="border-color:#52667c;margin:23px 0"><p>There is a saved game on this device.</p><button class="primary" id="resume">Resume saved game</button>':'';if($('resume'))$('resume').onclick=()=>{s=old;render()}}
function applyTheme(theme){document.body.dataset.theme=theme;$('themeBtn').textContent=theme==='light'?'🌙 Dark mode':'☀️ Light mode';localStorage.setItem(THEME_KEY,theme);if(s)drawBoard()}
$('themeBtn').onclick=()=>applyTheme(document.body.dataset.theme==='light'?'dark':'light');
applyTheme(localStorage.getItem(THEME_KEY)==='light'?'light':'dark');
$('count').onchange=createEntries;$('startBtn').onclick=()=>{if(localStorage.getItem(KEY)){askConfirm('Replace the saved game with a new one?',start)}else start()};$('newBtn').onclick=newGame;$('helpBtn').onclick=showRules;$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 Sound on':'🔇 Sound off';if(sound)beep()};createEntries();resumePrompt();
</script></body></html>
