<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Math Crossword</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --cell: 42px;
    --bg: #f6f7fb;
    --ink: #111827;
    --accent: #4f46e5;
    --soft: #eef2ff;
    --eq: #ecfeff;
    --given: #fff7ed;
    --muted: #6b7280;
    --bad: #ef4444;
    --ok: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #fff;
    box-shadow: 0 1px 8px rgba(0,0,0,.08);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .controls, .seedbar, .status {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  button, select, input[type="text"] {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: var(--ink);
    font: inherit;
  }
  button { cursor: pointer; font-weight: 750; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ghost { border-color: #111827; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .seedbar input { width: 150px; }
  .page {
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 18px 14px 24px;
  }
  h1 {
    text-align: center;
    font-size: 24px;
    margin: 0 0 8px;
  }
  .rule {
    text-align: center;
    font-weight: 800;
    margin-bottom: 16px;
  }
  .board-wrap {
    display: grid;
    place-items: center;
    gap: 12px;
  }
  .crossword {
    display: grid;
    background: #111;
    border: 3px solid #111;
    max-width: 100%;
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    background: #fff;
    border: 1px solid #111;
    display: grid;
    place-items: center;
    position: relative;
    font-weight: 900;
    font-size: calc(var(--cell) * .39);
    line-height: 1;
    overflow: hidden;
  }
  .block { background: #111; }
  .op { background: var(--soft); }
  .eq { background: var(--eq); }
  .given { background: var(--given); }
  .cell input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    text-align: center;
    font-size: calc(var(--cell) * .38);
    font-weight: 900;
    background: transparent;
    color: #111827;
    padding: 0;
  }
  .cell:focus-within { box-shadow: inset 0 0 0 3px #c7d2fe; }
  .given-badge {
    position: absolute;
    top: 3px;
    left: 4px;
    font-size: 10px;
    color: #6b7280;
    font-weight: 900;
  }
  .wrong { background: #fee2e2 !important; box-shadow: inset 0 0 0 3px var(--bad) !important; }
  .digits {
    display: flex;
    gap: 7px;
    justify-content: center;
    flex-wrap: wrap;
    width: min(920px, 100%);
  }
  .digit {
    min-width: 36px;
    height: 36px;
    padding: 0 8px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: #fff;
    border: 2px solid #111827;
    font-weight: 900;
  }
  .digit.used {
    background: #e5e7eb;
    color: #9ca3af;
    text-decoration: line-through;
    border-color: #9ca3af;
  }
  .banner {
    width: min(900px, 96vw);
    margin: 0 auto 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fff;
    border: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    font-weight: 850;
  }
  .banner.ok { border-color: var(--ok); background: #ecfdf5; color: #065f46; }
  .banner.bad { border-color: var(--bad); background: #fef2f2; color: #7f1d1d; }
  .banner.note { border-color: #111827; background: #fff; color: #111827; }
  .small { font-weight: 700; opacity: .92; }
  #answerPanel { display: none; margin-top: 26px; }
  #answerPanel h2 { text-align: center; margin: 0 0 14px; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 0 8px; }
  #printArea { display: none; }

  @media (max-width: 640px) {
    header { justify-content: center; }
    .status { justify-content: center; width: 100%; }
    h1 { font-size: 21px; }
    .page { padding-left: 8px; padding-right: 8px; }
  }

  @media print {
    body { background: #fff; }
    body > :not(#printArea) { display: none !important; }
    #printArea { display: block !important; padding: 20px; }
    .print-title { text-align: center; font-size: 22px; font-weight: 900; margin-bottom: 8px; }
    .print-rule { text-align: center; font-size: 14px; font-weight: 800; margin-bottom: 16px; }
    .print-meta { text-align: center; font-size: 12px; color: #555; margin-top: 12px; }
    .crossword { margin: 0 auto; }
  }
</style>
</head>
<body>
<header>
  <div class="controls">
    <select id="mode" title="Difficulty">
      <option value="easy">Easy: 1–9</option>
      <option value="hard">Hard: 1–15</option>
    </select>
    <button class="primary" id="newBtn">New Puzzle</button>
    <button id="showBtn">Show Solution</button>
    <button class="ghost" id="printBtn">Print Puzzle</button>
    <button class="ghost" id="pdfBtn">Save PDF</button>
  </div>
  <div class="seedbar">
    <strong>Seed</strong>
    <input id="seedInput" type="text" placeholder="e.g. abc123" maxlength="40" />
    <button id="loadSeedBtn">Load</button>
    <button id="copyLinkBtn">Copy Link</button>
  </div>
  <div class="status">
    <div>Time: <strong id="timer">00:00</strong></div>
    <div>Current: <strong id="seedLabel"></strong></div>
  </div>
</header>

<main class="page">
  <div id="bannerWrap" style="display:none;"></div>
  <h1>Math Crossword</h1>
  <div class="rule" id="ruleText">Use each number exactly once.</div>
  <div class="board-wrap">
    <div id="board" class="crossword" aria-label="Math crossword puzzle"></div>
    <div class="digits" id="digits" aria-label="Available numbers"></div>
  </div>

  <section id="answerPanel">
    <h2>Answer Key</h2>
    <div class="board-wrap">
      <div id="answerBoard" class="crossword"></div>
    </div>
  </section>
  <div class="footer">Connected Math Crossword — every open cell belongs to one clean equation.</div>
</main>

<div id="printArea"></div>

<script>
(() => {
'use strict';

const TOKENS = ['N','O','N','E','N'];
const OPS = ['+','-','×','÷'];
const EASY_TEMPLATES = [
  [
    'N O N E N',
    'O # O # #',
    'N O N E N',
    'E # E # #',
    'N O N E N'
  ],
  [
    'N O N E N # # # #',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    '# # # # N O N E N',
    '# # # # # # # # O',
    '# # # # # # # # N',
    '# # # # # # # # E',
    '# # # # # # # # N'
  ],
  [
    'N # # # #',
    'O # # # #',
    'N # # # #',
    'E # # # #',
    'N O N E N',
    '# # # # O',
    '# # # # N',
    '# # # # E',
    '# # # # N'
  ],
  [
    'N O N E N # # # #',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    'N O N E N # # # #',
    'O # # # # # # # #',
    'N # # # # # # # #',
    'E # # # # # # # #',
    'N # # # # # # # #'
  ]
];

const HARD_TEMPLATES = [
  [
    'N O N E N # # # # # # # #',
    '# # # # O # # # # # # # #',
    '# # # # N # # # # # # # #',
    '# # # # E # # # # # # # #',
    '# # # # N O N E N # # # #',
    '# # # # # # # # O # # # #',
    '# # # # # # # # N # # # #',
    '# # # # # # # # E # # # #',
    '# # # # # # # # N O N E N',
    '# # # # # # # # # # # # O',
    '# # # # # # # # # # # # N',
    '# # # # # # # # # # # # E',
    '# # # # # # # # N O N E N'
  ],
  [
    'N O N E N # # # #',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    '# # # # N O N E N',
    '# # # # # # # # O',
    '# # # # # # # # N',
    '# # # # # # # # E',
    '# # # # N O N E N',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    'N O N E N # # # #'
  ],
  [
    'N O N E N # # # #',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    'N O N E N # # # #',
    'O # # # # # # # #',
    'N # # # # # # # #',
    'E # # # # # # # #',
    'N O N E N # # # #',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    '# # # # N O N E N'
  ],
  [
    'N O N E N # # # #',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    '# # # # N O N E N',
    '# # # # # # # # O',
    '# # # # # # # # N',
    '# # # # # # # # E',
    '# # # # N O N E N',
    '# # # # O # # # #',
    '# # # # N # # # #',
    '# # # # E # # # #',
    '# # # # N O N E N'
  ],
  [
    'N O N E N # # # N O N E N # # # #',
    '# # # # O # # # O # # # O # # # #',
    '# # # # N # # # N # # # N # # # #',
    '# # # # E # # # E # # # E # # # #',
    '# # # # N O N E N # # # N O N E N'
  ]
];

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str){
  let h = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function randomSeed(){ return Math.random().toString(36).slice(2,10); }
function shuffleInPlace(arr, rng){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(rng() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function parseGrid(lines){ return lines.map(row => row.trim().split(/\s+/)); }
function gridToLines(grid){ return grid.map(row => row.join(' ')); }

function validEquation(a, op, b, c){
  if(op === '+') return a + b === c;
  if(op === '-') return a - b === c;
  if(op === '×') return a * b === c;
  if(op === '÷') return b !== 0 && a % b === 0 && a / b === c;
  return false;
}

function validateAndParseTemplate(lines, maxNum){
  const grid = parseGrid(lines);
  const H = grid.length;
  const W = grid[0].length;
  if(!grid.every(row => row.length === W)) return null;

  const equations = [];
  const numberCells = [];
  const whiteCells = new Set();
  for(let r=0;r<H;r++){
    for(let c=0;c<W;c++){
      const t = grid[r][c];
      if(!['N','O','E','#'].includes(t)) return null;
      if(t !== '#') whiteCells.add(`${r},${c}`);
      if(t === 'N') numberCells.push([r,c]);
    }
  }
  if(numberCells.length !== maxNum) return null;

  function readRunRow(r, start){
    const run = [];
    let c = start;
    while(c < W && grid[r][c] !== '#') { run.push(grid[r][c]); c++; }
    return run;
  }
  function readRunCol(c, start){
    const run = [];
    let r = start;
    while(r < H && grid[r][c] !== '#') { run.push(grid[r][c]); r++; }
    return run;
  }
  function sameTokens(run){ return run.length === 5 && run.every((v,i) => v === TOKENS[i]); }

  for(let r=0;r<H;r++){
    let c = 0;
    while(c < W){
      if(grid[r][c] === '#') { c++; continue; }
      const start = c;
      const run = readRunRow(r,start);
      if(run.length > 1){
        if(!sameTokens(run)) return null;
        equations.push({ dir:'H', cells:[[r,start],[r,start+2],[r,start+4]], opCell:[r,start+1] });
      }
      c = start + run.length;
    }
  }
  for(let c=0;c<W;c++){
    let r = 0;
    while(r < H){
      if(grid[r][c] === '#') { r++; continue; }
      const start = r;
      const run = readRunCol(c,start);
      if(run.length > 1){
        if(!sameTokens(run)) return null;
        equations.push({ dir:'V', cells:[[start,c],[start+2,c],[start+4,c]], opCell:[start+1,c] });
      }
      r = start + run.length;
    }
  }

  const covered = new Set();
  for(const eq of equations){
    const [a,b,c] = eq.cells;
    covered.add(`${a[0]},${a[1]}`);
    covered.add(`${b[0]},${b[1]}`);
    covered.add(`${c[0]},${c[1]}`);
    covered.add(`${eq.opCell[0]},${eq.opCell[1]}`);
    if(eq.dir === 'H') covered.add(`${eq.opCell[0]},${eq.opCell[1]+2}`);
    else covered.add(`${eq.opCell[0]+2},${eq.opCell[1]}`);
  }
  for(const key of whiteCells){ if(!covered.has(key)) return null; }

  const first = [...whiteCells][0];
  const seen = new Set([first]);
  const stack = [first.split(',').map(Number)];
  while(stack.length){
    const [r,c] = stack.pop();
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr = r + dr, nc = c + dc, key = `${nr},${nc}`;
      if(whiteCells.has(key) && !seen.has(key)){
        seen.add(key);
        stack.push([nr,nc]);
      }
    }
  }
  if(seen.size !== whiteCells.size) return null;

  return { grid, H, W, equations, numberCells };
}

const tripleCache = new Map();
function getTriples(maxNum){
  if(tripleCache.has(maxNum)) return tripleCache.get(maxNum);
  const triples = [];
  for(let a=1;a<=maxNum;a++){
    for(let b=1;b<=maxNum;b++){
      for(let c=1;c<=maxNum;c++){
        if(new Set([a,b,c]).size < 3) continue;
        for(const op of OPS){
          if(validEquation(a,op,b,c)) triples.push([a,op,b,c]);
        }
      }
    }
  }
  tripleCache.set(maxNum, triples);
  return triples;
}

function solveTemplate(parsed, maxNum, seedText){
  const rng = mulberry32(hashSeed(seedText));
  const numberKeyToIndex = new Map();
  parsed.numberCells.forEach((p,i) => numberKeyToIndex.set(`${p[0]},${p[1]}`, i));
  const equations = parsed.equations.map(eq => ({
    vars: eq.cells.map(([r,c]) => numberKeyToIndex.get(`${r},${c}`)),
    opCell: eq.opCell,
    dir: eq.dir
  }));
  const baseTriples = getTriples(maxNum);
  const pools = equations.map(() => shuffleInPlace(baseTriples.slice(), rng));
  const assigned = new Array(parsed.numberCells.length).fill(0);
  const used = new Set();
  const solvedOps = new Array(equations.length).fill(null);
  const done = new Set();
  let nodesVisited = 0;
  const nodeLimit = maxNum === 15 ? 120000 : 40000;

  function compatibleCount(eqIndex){
    const vars = equations[eqIndex].vars;
    let count = 0;
    for(const [a,op,b,c] of pools[eqIndex]){
      const vals = [a,b,c];
      let ok = true;
      for(let i=0;i<3;i++){
        const v = vars[i], val = vals[i];
        if(assigned[v]) { if(assigned[v] !== val) { ok = false; break; } }
        else if(used.has(val)) { ok = false; break; }
      }
      if(ok) count++;
      if(count > 80) break;
    }
    return count;
  }

  function backtrack(){
    if(++nodesVisited > nodeLimit) return false;
    if(done.size === equations.length){
      return assigned.every(Boolean) && used.size === maxNum;
    }
    const choices = [];
    for(let i=0;i<equations.length;i++){
      if(!done.has(i)) choices.push([compatibleCount(i), rng(), i]);
    }
    choices.sort((x,y) => x[0] - y[0] || x[1] - y[1]);
    if(!choices.length || choices[0][0] === 0) return false;
    const eqIndex = choices[0][2];
    const vars = equations[eqIndex].vars;
    done.add(eqIndex);

    for(const [a,op,b,c] of pools[eqIndex]){
      const vals = [a,b,c];
      let ok = true;
      const newly = [];
      for(let i=0;i<3;i++){
        const v = vars[i], val = vals[i];
        if(assigned[v]) { if(assigned[v] !== val) { ok = false; break; } }
        else if(used.has(val)) { ok = false; break; }
        else newly.push([v,val]);
      }
      if(!ok) continue;
      for(const [v,val] of newly){ assigned[v] = val; used.add(val); }
      solvedOps[eqIndex] = op;
      if(backtrack()) return true;
      solvedOps[eqIndex] = null;
      for(const [v,val] of newly.reverse()){ assigned[v] = 0; used.delete(val); }
    }
    done.delete(eqIndex);
    return false;
  }

  if(!backtrack()) return null;

  const values = Array.from({length: parsed.H}, () => Array(parsed.W).fill(null));
  for(let i=0;i<parsed.numberCells.length;i++){
    const [r,c] = parsed.numberCells[i];
    values[r][c] = assigned[i];
  }
  for(let i=0;i<equations.length;i++){
    const [r,c] = equations[i].opCell;
    values[r][c] = solvedOps[i];
  }
  for(let r=0;r<parsed.H;r++) for(let c=0;c<parsed.W;c++) if(parsed.grid[r][c] === 'E') values[r][c] = '=';
  return { grid: parsed.grid, values, equations: parsed.equations, numberCells: parsed.numberCells, maxNum };
}

function chooseGivens(puzzle, seedText, mode){
  const rng = mulberry32(hashSeed(seedText + '|givens'));
  const cells = puzzle.numberCells.slice();
  shuffleInPlace(cells, rng);
  const want = mode === 'hard' ? 2 : 3;
  const givens = new Map();
  for(let i=0;i<Math.min(want,cells.length);i++){
    const [r,c] = cells[i];
    givens.set(`${r},${c}`, puzzle.values[r][c]);
  }
  return givens;
}

function makePuzzle(seed, mode){
  const maxNum = mode === 'hard' ? 15 : 9;
  const rawTemplates = mode === 'hard' ? HARD_TEMPLATES : EASY_TEMPLATES;
  const parsedTemplates = rawTemplates
    .map(t => validateAndParseTemplate(t, maxNum))
    .filter(Boolean);
  if(!parsedTemplates.length) throw new Error('No valid templates are available.');

  const rng = mulberry32(hashSeed(seed + '|' + mode + '|template-order'));
  const order = parsedTemplates.map((_,i)=>i);
  shuffleInPlace(order, rng);

  for(const templateIndex of order){
    const parsed = parsedTemplates[templateIndex];
    const solved = solveTemplate(parsed, maxNum, `${seed}|${mode}|template:${templateIndex}`);
    if(solved){
      solved.templateIndex = templateIndex;
      solved.mode = mode;
      solved.seed = seed;
      return { puzzle: solved, givens: chooseGivens(solved, `${seed}|${mode}|${templateIndex}`, mode) };
    }
  }

  // Safety fallback: try stable seeds against every validated template instead of failing in front of the student.
  const fallbackSeeds = ['fallback-one','fallback-two','fallback-three','fallback-four'];
  for(const fs of fallbackSeeds){
    for(let i=0;i<parsedTemplates.length;i++){
      const solved = solveTemplate(parsedTemplates[i], maxNum, `${fs}|${mode}|${i}`);
      if(solved){
        solved.templateIndex = i;
        solved.mode = mode;
        solved.seed = seed;
        return { puzzle: solved, givens: chooseGivens(solved, `${seed}|${mode}|${i}`, mode) };
      }
    }
  }
  throw new Error('Puzzle generation failed after all fallbacks.');
}

let timerInt = null;
let startTime = 0;
let solved = false;
let currentPuzzle = null;
let currentGivens = new Map();
let currentSeed = '';

const els = {
  mode: document.getElementById('mode'),
  newBtn: document.getElementById('newBtn'),
  showBtn: document.getElementById('showBtn'),
  printBtn: document.getElementById('printBtn'),
  pdfBtn: document.getElementById('pdfBtn'),
  seedInput: document.getElementById('seedInput'),
  loadSeedBtn: document.getElementById('loadSeedBtn'),
  copyLinkBtn: document.getElementById('copyLinkBtn'),
  timer: document.getElementById('timer'),
  seedLabel: document.getElementById('seedLabel'),
  board: document.getElementById('board'),
  answerBoard: document.getElementById('answerBoard'),
  answerPanel: document.getElementById('answerPanel'),
  digits: document.getElementById('digits'),
  ruleText: document.getElementById('ruleText'),
  bannerWrap: document.getElementById('bannerWrap'),
  printArea: document.getElementById('printArea')
};

function startTimer(){
  stopTimer(false);
  solved = false;
  startTime = Date.now();
  els.timer.textContent = '00:00';
  timerInt = setInterval(() => {
    const total = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(total / 60);
    const s = String(total % 60).padStart(2,'0');
    els.timer.textContent = `${String(m).padStart(2,'0')}:${s}`;
  }, 500);
}
function stopTimer(markSolved = true){
  if(timerInt){ clearInterval(timerInt); timerInt = null; }
  if(markSolved) solved = true;
}

function updateCellSize(puzzle){
  const rows = puzzle.grid.length;
  const cols = puzzle.grid[0].length;
  const widthRoom = Math.max(300, Math.min(window.innerWidth - 28, 980));
  const heightRoom = Math.max(280, window.innerHeight - 245);
  let cell = Math.floor(Math.min(46, widthRoom / cols, heightRoom / rows));
  cell = Math.max(26, cell);
  document.documentElement.style.setProperty('--cell', `${cell}px`);
}

function renderBoard(container, puzzle, options = {}){
  const { interactive=false, givens=new Map(), answer=false, blank=false } = options;
  const grid = puzzle.grid;
  const values = puzzle.values;
  const H = grid.length, W = grid[0].length;
  container.style.gridTemplateColumns = `repeat(${W}, var(--cell))`;
  container.innerHTML = '';

  for(let r=0;r<H;r++){
    for(let c=0;c<W;c++){
      const t = grid[r][c];
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(t === '#'){
        cell.classList.add('block');
      } else if(t === 'O'){
        cell.classList.add('op');
        cell.textContent = values[r][c];
      } else if(t === 'E'){
        cell.classList.add('eq');
        cell.textContent = '=';
      } else if(t === 'N'){
        const key = `${r},${c}`;
        const isGiven = givens.has(key);
        if(interactive){
          const inp = document.createElement('input');
          inp.inputMode = 'numeric';
          inp.autocomplete = 'off';
          inp.maxLength = puzzle.maxNum >= 10 ? 2 : 1;
          inp.dataset.r = r;
          inp.dataset.c = c;
          inp.setAttribute('aria-label', `Number at row ${r+1}, column ${c+1}`);
          inp.addEventListener('input', onInput);
          inp.addEventListener('keydown', onKeyNav);
          if(isGiven){
            inp.value = String(givens.get(key));
            inp.disabled = true;
            cell.classList.add('given');
            const badge = document.createElement('div');
            badge.className = 'given-badge';
            badge.textContent = 'G';
            cell.appendChild(badge);
          }
          cell.appendChild(inp);
        } else {
          if(answer){
            cell.textContent = values[r][c];
          } else if(isGiven && !blank){
            cell.textContent = givens.get(key);
            cell.classList.add('given');
            const badge = document.createElement('div');
            badge.className = 'given-badge';
            badge.textContent = 'G';
            cell.appendChild(badge);
          } else if(isGiven && blank){
            cell.textContent = givens.get(key);
            cell.classList.add('given');
          }
        }
      }
      container.appendChild(cell);
    }
  }
}

function renderDigits(){
  els.digits.innerHTML = '';
  if(!currentPuzzle) return;
  const used = new Set();
  els.board.querySelectorAll('input').forEach(inp => {
    const n = Number(inp.value);
    if(Number.isInteger(n) && n >= 1 && n <= currentPuzzle.maxNum) used.add(n);
  });
  for(let n=1;n<=currentPuzzle.maxNum;n++){
    const d = document.createElement('div');
    d.className = 'digit';
    d.textContent = n;
    if(used.has(n)) d.classList.add('used');
    els.digits.appendChild(d);
  }
}
function clearWrong(){ els.board.querySelectorAll('.cell').forEach(c => c.classList.remove('wrong')); }
function banner(kind, text, sub=''){
  els.bannerWrap.style.display = 'block';
  els.bannerWrap.innerHTML = `<div class="banner ${kind}"><div>${text}</div>${sub ? `<span class="small">${sub}</span>` : ''}</div>`;
}
function clearBanner(){ els.bannerWrap.style.display = 'none'; els.bannerWrap.innerHTML = ''; }

function readUserValues(){
  const user = Array.from({length: currentPuzzle.grid.length}, () => Array(currentPuzzle.grid[0].length).fill(null));
  const inputs = [...els.board.querySelectorAll('input')];
  for(const inp of inputs){
    const r = Number(inp.dataset.r), c = Number(inp.dataset.c);
    const n = Number(inp.value);
    if(Number.isInteger(n)) user[r][c] = n;
  }
  return { user, inputs };
}

function checkCompletion(){
  if(!currentPuzzle || solved) return;
  clearWrong();
  const { user, inputs } = readUserValues();
  const maxNum = currentPuzzle.maxNum;
  const filled = inputs.every(inp => inp.value !== '' && Number(inp.value) >= 1 && Number(inp.value) <= maxNum);
  if(!filled){ clearBanner(); return; }

  const nums = inputs.map(inp => Number(inp.value));
  const unique = new Set(nums);
  const allNumbersOnce = unique.size === maxNum && nums.length === maxNum && [...unique].every(n => n >= 1 && n <= maxNum);
  const wrongCells = new Set();
  if(!allNumbersOnce){
    const counts = new Map();
    for(const inp of inputs){
      const n = Number(inp.value);
      counts.set(n, (counts.get(n) || 0) + 1);
    }
    for(const inp of inputs){
      const n = Number(inp.value);
      if(n < 1 || n > maxNum || counts.get(n) > 1) wrongCells.add(`${inp.dataset.r},${inp.dataset.c}`);
    }
  }

  for(const eq of currentPuzzle.equations){
    const [[ar,ac],[br,bc],[cr,cc]] = eq.cells;
    const [or,oc] = eq.opCell;
    const a = user[ar][ac], b = user[br][bc], c = user[cr][cc];
    const op = currentPuzzle.values[or][oc];
    if(!validEquation(a,op,b,c)){
      wrongCells.add(`${ar},${ac}`);
      wrongCells.add(`${br},${bc}`);
      wrongCells.add(`${cr},${cc}`);
    }
  }

  if(wrongCells.size === 0){
    banner('ok', '✅ Correct!', 'Timer stopped.');
    stopTimer(true);
  } else {
    banner('bad', '❌ Not quite.', allNumbersOnce ? 'Highlighted cells are part of an incorrect equation.' : `Use every number from 1–${maxNum} exactly once.`);
    els.board.querySelectorAll('input').forEach(inp => {
      if(wrongCells.has(`${inp.dataset.r},${inp.dataset.c}`)) inp.parentElement.classList.add('wrong');
    });
  }
}

function onInput(e){
  const inp = e.target;
  let v = inp.value.replace(/[^0-9]/g, '');
  if(v.length > inp.maxLength) v = v.slice(0, inp.maxLength);
  if(v !== ''){
    const n = Number(v);
    if(n < 1 || (n > currentPuzzle.maxNum && (currentPuzzle.maxNum < 10 || v.length >= 2))) {
      v = '';
    }
  }
  inp.value = v;
  renderDigits();
  checkCompletion();
}

function onKeyNav(e){
  if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const dr = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
  const dc = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  const r = Number(e.target.dataset.r), c = Number(e.target.dataset.c);
  const map = new Map();
  els.board.querySelectorAll('input:not(:disabled)').forEach(i => map.set(`${i.dataset.r},${i.dataset.c}`, i));
  let rr = r + dr, cc = c + dc;
  for(let step=0;step<80;step++){
    const found = map.get(`${rr},${cc}`);
    if(found){ found.focus(); return; }
    rr += dr; cc += dc;
  }
}

function setPuzzle(seed, mode){
  els.newBtn.disabled = true;
  els.newBtn.textContent = 'Generating...';
  try {
    const { puzzle, givens } = makePuzzle(seed, mode);
    currentPuzzle = puzzle;
    currentGivens = givens;
    currentSeed = seed;
    updateCellSize(puzzle);
    els.seedLabel.textContent = seed;
    els.seedInput.value = seed;
    els.ruleText.textContent = `Use each number from 1–${puzzle.maxNum} exactly once.`;
    clearBanner();
    clearWrong();
    renderBoard(els.board, puzzle, { interactive:true, givens });
    renderBoard(els.answerBoard, puzzle, { answer:true });
    els.answerPanel.style.display = 'none';
    els.showBtn.textContent = 'Show Solution';
    renderDigits();
    updatePrintArea();
    const url = new URL(window.location.href);
    url.searchParams.set('seed', seed);
    url.searchParams.set('mode', mode);
    history.replaceState(null, '', url.toString());
    startTimer();
  } catch(err){
    console.error(err);
    banner('bad', 'Puzzle generation failed.', 'Please try New Puzzle.');
  } finally {
    els.newBtn.disabled = false;
    els.newBtn.textContent = 'New Puzzle';
  }
}

function newPuzzle(preferredSeed){
  const seed = (preferredSeed && preferredSeed.trim()) || randomSeed();
  setPuzzle(seed, els.mode.value);
}

function copyLink(){
  const url = new URL(window.location.href);
  url.searchParams.set('seed', currentSeed);
  url.searchParams.set('mode', els.mode.value);
  if(navigator.clipboard){
    navigator.clipboard.writeText(url.toString()).then(() => {
      banner('note', '🔗 Link copied!', url.toString());
      setTimeout(clearBanner, 1700);
    }).catch(() => banner('note', 'Copy this link:', url.toString()));
  } else {
    banner('note', 'Copy this link:', url.toString());
  }
}

function updatePrintArea(){
  if(!currentPuzzle) return;
  els.printArea.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'print-title';
  title.textContent = 'Math Crossword';
  const rule = document.createElement('div');
  rule.className = 'print-rule';
  rule.textContent = `Use each number from 1–${currentPuzzle.maxNum} exactly once.`;
  const board = document.createElement('div');
  board.className = 'crossword';
  renderBoard(board, currentPuzzle, { givens: currentGivens, blank: true });
  const meta = document.createElement('div');
  meta.className = 'print-meta';
  meta.textContent = `Seed: ${currentSeed} • Mode: ${currentPuzzle.mode}`;
  els.printArea.append(title, rule, board, meta);
}

function drawBoardToCanvas(puzzle, givens, answer, title){
  const rows = puzzle.grid.length;
  const cols = puzzle.grid[0].length;
  const pageW = 1275, pageH = 1650;
  const canvas = document.createElement('canvas');
  canvas.width = pageW;
  canvas.height = pageH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,pageW,pageH);
  ctx.fillStyle = '#111827';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = '700 42px Arial, sans-serif';
  ctx.fillText(title, pageW/2, 70);
  ctx.font = '700 24px Arial, sans-serif';
  ctx.fillText(`Use each number from 1–${puzzle.maxNum} exactly once.`, pageW/2, 128);
  ctx.font = '18px Arial, sans-serif';
  ctx.fillText(`Seed: ${currentSeed} • Mode: ${puzzle.mode}`, pageW/2, 166);

  const maxBoardW = pageW - 180;
  const maxBoardH = pageH - 310;
  const cell = Math.floor(Math.min(76, maxBoardW / cols, maxBoardH / rows));
  const boardW = cols * cell;
  const boardH = rows * cell;
  const x0 = Math.floor((pageW - boardW) / 2);
  const y0 = 230;
  ctx.fillStyle = '#111';
  ctx.fillRect(x0 - 4, y0 - 4, boardW + 8, boardH + 8);

  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const x = x0 + c*cell, y = y0 + r*cell;
      const token = puzzle.grid[r][c];
      if(token === '#') ctx.fillStyle = '#111';
      else if(token === 'O') ctx.fillStyle = '#eef2ff';
      else if(token === 'E') ctx.fillStyle = '#ecfeff';
      else if(givens.has(`${r},${c}`) && !answer) ctx.fillStyle = '#fff7ed';
      else ctx.fillStyle = '#fff';
      ctx.fillRect(x,y,cell,cell);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.strokeRect(x,y,cell,cell);
      if(token !== '#'){
        let text = '';
        if(token === 'O' || token === 'E') text = puzzle.values[r][c];
        else if(answer) text = puzzle.values[r][c];
        else if(givens.has(`${r},${c}`)) text = givens.get(`${r},${c}`);
        if(text !== ''){
          ctx.fillStyle = '#111827';
          ctx.font = `900 ${Math.floor(cell*.38)}px Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(text), x + cell/2, y + cell/2 + 1);
        }
        if(token === 'N' && givens.has(`${r},${c}`) && !answer){
          ctx.fillStyle = '#6b7280';
          ctx.font = `700 ${Math.max(11, Math.floor(cell*.18))}px Arial, sans-serif`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText('G', x + 5, y + 5);
        }
      }
    }
  }
  return { jpegBytes: dataURLToBytes(canvas.toDataURL('image/jpeg', .92)), w: pageW, h: pageH };
}
function dataURLToBytes(dataURL){
  const b64 = dataURL.split(',')[1];
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function buildPDF(pages){
  const chunks = [];
  let length = 0;
  const offsets = [];
  const pushBytes = u8 => { chunks.push(u8); length += u8.length; };
  const pushStr = s => pushBytes(strBytes(s));
  const mark = n => { offsets[n] = length; };
  pushStr('%PDF-1.3\n%\xE2\xE3\xCF\xD3\n');
  mark(1); pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  const kids = pages.map((_,i) => `${5 + i*3} 0 R`).join(' ');
  mark(2); pushStr(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>\nendobj\n`);
  pages.forEach((page,i) => {
    const imgObj = 3 + i*3, contObj = 4 + i*3, pageObj = 5 + i*3;
    mark(imgObj);
    pushStr(`${imgObj} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${page.w} /Height ${page.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${page.jpegBytes.length} >>\nstream\n`);
    pushBytes(page.jpegBytes);
    pushStr('\nendstream\nendobj\n');
    const content = `q ${page.w} 0 0 ${page.h} 0 0 cm /Im0 Do Q\n`;
    mark(contObj); pushStr(`${contObj} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
    mark(pageObj); pushStr(`${pageObj} 0 obj\n<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 ${imgObj} 0 R >> >> /MediaBox [0 0 ${page.w} ${page.h}] /Contents ${contObj} 0 R >>\nendobj\n`);
  });
  const maxObj = 2 + pages.length*3;
  const xref = length;
  pushStr(`xref\n0 ${maxObj+1}\n0000000000 65535 f \n`);
  for(let n=1;n<=maxObj;n++) pushStr(`${String(offsets[n] || 0).padStart(10,'0')} 00000 n \n`);
  pushStr(`trailer\n<< /Size ${maxObj+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks, { type:'application/pdf' });
}
function exportPDF(){
  if(!currentPuzzle) return;
  const blankPage = drawBoardToCanvas(currentPuzzle, currentGivens, false, 'Math Crossword');
  const answerPage = drawBoardToCanvas(currentPuzzle, currentGivens, true, 'Answer Key');
  const blob = buildPDF([blankPage, answerPage]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `math-crossword-${currentPuzzle.mode}-${currentSeed}.pdf`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

els.newBtn.addEventListener('click', () => newPuzzle());
els.loadSeedBtn.addEventListener('click', () => {
  const seed = els.seedInput.value.trim();
  if(seed) setPuzzle(seed, els.mode.value);
});
els.seedInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const seed = els.seedInput.value.trim();
    if(seed) setPuzzle(seed, els.mode.value);
  }
});
els.mode.addEventListener('change', () => setPuzzle((els.seedInput.value || currentSeed || randomSeed()).trim(), els.mode.value));
els.copyLinkBtn.addEventListener('click', copyLink);
els.printBtn.addEventListener('click', () => { updatePrintArea(); window.print(); });
els.pdfBtn.addEventListener('click', exportPDF);
els.showBtn.addEventListener('click', () => {
  const show = els.answerPanel.style.display === 'none' || !els.answerPanel.style.display;
  els.answerPanel.style.display = show ? 'block' : 'none';
  els.showBtn.textContent = show ? 'Hide Solution' : 'Show Solution';
  if(show) els.answerPanel.scrollIntoView({ behavior:'smooth', block:'start' });
});
window.addEventListener('resize', () => { if(currentPuzzle) { updateCellSize(currentPuzzle); updatePrintArea(); } });

(function init(){
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode');
  if(mode === 'easy' || mode === 'hard') els.mode.value = mode;
  const seed = params.get('seed') || randomSeed();
  setPuzzle(seed, els.mode.value);
})();

})();
</script>
